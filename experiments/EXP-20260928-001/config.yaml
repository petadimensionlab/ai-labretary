# EXP-20260928-001 — 陽性対照の確立をやり直す（事前登録。plan.md を先に読むこと）
#
# 設計の要点
#  - 判定の単位を「1 遺伝子」から「遺伝子セット」に変える（plan.md §5, §6）。
#    EXP-20260927-004 で分かったこと: 主指標は「遺伝子ごとの平均移動方向と固定軸の内積」でほぼ決まり
#    （r^2 = 0.81〜0.85）、その方向は seed 間で cos 0.985 とほぼ固定されている。したがって
#    単一遺伝子の検出下限 2.73 標準偏差は細胞数でも seed 数でも下がらない。
#    セット平均にすると下限は K=24 で 0.32 標準偏差まで下がる（analysis/power_001.py）。
#  - 主対象 LTBR / RELB / NFKB2、参考対象 CDKN1A、盲検の TP53 / SPP1 / LCN2、
#    目標ラベルを定義する CCL19 / CCL21 / CXCL13 は**回さない**。
#    evaluate_001.py が読み込み直後に除外し、1 行でも残っていれば停止する。
#  - マーカーセットは EXP-20260927-004 で摂動済みの 106 遺伝子を除いて選んだ（独立性）。
#  - 出発点・目標・対照の状態から MYOF / cycMYOF を除いた（重心どうしの細胞の重なりを断つ）。
#  - seed は 41 / 42 / 43（既出の 0〜5, 11〜13, 21〜23, 31〜33 と重ならない）。
experiment_id: EXP-20260928-001
hypothesis_id: null                 # 仮説の検定ではない。測り方と陽性対照の確立

model:                              # EXP-20260927-003 / 004 と同一（比較可能性のため変えない）
  version: V2
  directory: models/Geneformer/Geneformer-V2-316M
  type: Pretrained
  num_classes: 0
  emb_layer: -1

data:
  input_h5ad: experiments/EXP-20260927-002/work/input.h5ad      # 読み取りのみ。data/raw は触らない
  # EXP-20260927-004 のデータ部分を cp -c で複製し、cache-*.arrow を削除したうえで、
  # **MYOF / cycMYOF の細胞の状態ラベルを `MYOF_<元の状態>` に付け替えたもの**（plan.md §3）。
  # 付け替えの理由: run_isp.py の start_matrix() は状態ラベルだけで摂動する細胞を選ぶので、
  # 付け替えないと出発点 5,748 細胞のうち 1,132（19.7%）が筋線維芽細胞になり、
  # 重心の側だけ MYOF を除いても、摂動する細胞の側に混ざったままになる。
  # 行の順序と input_ids は一切変えていない（state_rows の行番号はそのまま有効）。
  tokenized_dataset: experiments/EXP-20260928-001/work/tokenized.dataset
  cell_type_col: subclass_l2
  state_key: fib_tls_state
  custom_attr_name_dict: {fib_tls_state: fib_tls_state, donor_id: donor_id, subclass_l2: subclass_l2,
                          disease: disease, region: region, TLS_group: TLS_group,
                          n_genes: n_genes, n_counts: n_counts}
  filter_data: null
  max_ncells: null

states:
  start_state: FIB_neg_TLShigh
  goal_state: FIB_org
  alt_states: [FIB_neg_TLSlow]

state_embs:
  max_cells_per_state: 800
  max_cells_per_donor: 60
  rows_file: experiments/EXP-20260928-001/work/state_rows-seed{seed}.json   # MYOF を除き深さマッチした行番号

cell_selection:
