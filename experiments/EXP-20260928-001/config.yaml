capture:
  embeddings: true                  # 元・摂動後の CLS 埋め込みを保存（軸ごとの接近度を後から計算する）
  classifier_logits: false

extra_centroids:
  output: experiments/EXP-20260928-001/work/extra_centroids-seed{seed}.npz
  sets:
    MYOF_neg:                       # 第 2 の軸: 筋線維芽細胞の重心
                                    # 状態ラベルを付け替えたので、3 状態との細胞の重なりは定義上 0 になる
      states: [MYOF_FIB_neg_TLShigh, MYOF_FIB_neg_TLSlow]
      subclass_l2: [MYOF, cycMYOF]  # 冗長だが二重の安全確認として残す
      depth_match_to: FIB_neg_TLShigh
      max_cells: 800
      max_cells_per_donor: 60
    FIB_org_unmatched:              # 感度分析: 深さマッチをしない目標重心（判定に使わない）
      states: [FIB_org]             # 付け替え後の FIB_org は MYOF を含まない
      depth_match_to: null
      max_cells: 800
      max_cells_per_donor: 60

analysis:                           # plan.md §6 の事前登録（結果を見る前に確定）
  primary_metric: A12               # (軸 − 他の 3 重心の平均) / 移動量。軸を入れ替えて 3 本作る
  primary_unit: gene_set            # **判定の単位はセット**（EXP-20260927-004 からの最大の変更）
  pos_definition: index_in_input_ids
  primary_test: set_mean_vs_random_control_sets
  pos_matched_permutation:          # 遺伝子ごとの D_raw の作り方（EXP-20260927-003/004 と同じ実装）
    bias_model: quadratic_lp_ll
    distance: max_abs_log2
    tolerance_log2: 0.5
    min_cover_frac: 0.8
    min_eligible_null_genes: 20
    statistic: D_raw
  criteria:
    require_all_seeds: true         # 3 seed すべて
    K_set: 24                       # マーカーセットの大きさ
    n_permutation: 200000           # 無作為な対照セットの引き直し回数（閾値の決定）
    set_percentile: 0.99            # セット平均 z が、無作為な対照セットの 99 パーセンタイルを超えること
    set_abs_min: 0.245              # 併せて満たす絶対値。EXP-20260927-004 の対照 84 個で K=24 のとき
                                    # 偶然合格率 5% になる値（結果を見る前に別データから固定）
    n_chance_draw: 200000           # 偶然合格率の実測に使う引き直し回数
    max_chance_rate: 0.02           # 偶然合格率の実測がこれ以下であること
    neutral_range: [0.05, 0.95]     # 恒常発現遺伝子・中立対照パネルのセットが入るべき分位
    neutral_min_seeds: 2
    n_sham_sets: 3                  # 偽マーカーセット（位置・長さ・細胞数をそろえた対照のセット）
    null_draw_seed: 20260928
    # --- 指標の健全性（EXP-20260927-004 と同一の閾値。変えない）
    M1_tail_frac_max: 0.20
    M1_min_n: 60
    M2_abs_rho_max: 0.25
    M2_min_seeds: 2
    M3_range: [0.10, 0.90]
    M3_min_seeds: 2
    M3_panel_min_genes: 5
    M4_abs_rho_uniform_max: 0.40
    M4_abs_rho_placebo_max: 0.50
  descriptive_only:                 # 記録するが合否には入れない
    - single_gene_2p5sd             # 単一遺伝子で 2.5 標準偏差を超えるマーカーの数と、対照での偶然合格率
    - half_split                     # 目標マーカーセットの「上位 12」と「無作為 12」を分けた結果
    - bias_vs_effect                # 目標への偏りと効果量の順位相関（用量反応の検査）
    - reference_myof                # ACTA2 / TAGLN（EXP-20260927-004 との比較）
    - donor_level
    - goal_unmatched_sensitivity

# run_isp.py が必須とするセクション（validate() と run_stats()）。
# 本実験の判定は analysis/evaluate_001.py が埋め込みから直接計算するので、ここの出力は判定に使わない。
stats:
  mode: goal_state_shift
  fdr_threshold: 0.05

robustness:
  seeds: [41, 42, 43]
  subsample_frac: 1.0
  emb_layers: [-1]

output:
  results_dir: results
  experiment_dir: experiments/EXP-20260928-001

compute:
  device: mps                       # 実行はリモート計算機（GB10）。isp_remote.sh が cuda で上書きする
  dtype: bf16                       # PI 標準（2026-09-26）。コサインは fp32
  cache_model: true
  sec_per_cell_gene: 0.125          # GB10 実測（EXP-20260926-005 run O）
  sec_fixed_per_gene_run: 3.18      # EXP-20260927-001 の回帰
  sec_per_1e5_tokens: 4.49
  n_gene_runs: 468                  # 156 遺伝子 × 3 seed
  n_cell_gene: 93600
  n_tokens: 1.84e8
  gpu_hours_estimate: 6.0           # plan.md §8。上限 24 時間に対し余裕あり → G2 不要
