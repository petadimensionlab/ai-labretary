decision:
  pi_decisions_20261011:
    A6 取得済み: data/raw/kidney_tls/A6_UUO_Reck2025.h5ad（CELLxGENE 版。SOURCES.md に sha256 8d9cca13…・取得 2026-09-25）。今回の実行対象にしない（plan.md
      §5.6 前受け設計のみ）
    G1 採択: HYP-20261011-01 を採択（ゲート G1、PI 2026-10-11。hypotheses/tracker.md の Status=accepted 済み。本計画は書き換えない）
    §9.3 の数え上げ: 辞書・A1 var の欠け 0 個、検出率の中央値 0.1475 ≥ 0.06。検出率 0.06 未満は 6 個（CHMP2A・DCXR・FGL2・HSPB6・SOD3・TNFRSF12A。記述のみ）
    仮説 §3.3 の訂正: A1 の保存済み 626 に退化の陽性対照 30 個のうち 10 個（活性化 PC71 重なり 7 個＋対照プール A1 重なり 3 個）が既に含まれる。新規摂動は 30
      個のまま回し、既存 10 個は機械一致の確認に使う（plan.md §2.3・§3c）
    着手前チェック: 4 回すべて判定保留・不合格条件 0 件（plan.md §5.5）
    退化30 と A1 標準化プールの重なり: 3 個（CTSH・PFDN5・CYS1）。z は 0 のほうへ引かれる（既知の限界。plan.md §11）
  主判定 P-1（A1・確認）:
    偽セット: A1 の対照プール 549 個から復元ありで引く（evaluate_005.set_null と同じ）
    効果量の目安（併記。判定に使わない）:
      4.5/√K:
        活性化71: 0.53
        退化30: 0.82
      6.63/√K:
        活性化71: 0.79
        退化30: 1.21
    対象: 活性化の陽性対照 71 個と退化の陽性対照 30 個のセット平均 z_diff
    感度分析: 重なり 7 個を除いた版（71−7＝64、30−7＝23）を必ず併記（R-13）
    最小検出可能効果量: analysis/power_014.py で規則そのものをシミュレート → work/power_014.json。同時（(i)∧(ii)∧(iii)）の MDE ≈ 0.66
      z（ρ=実測 0.964。ρ 0〜0.9 で 0.63〜0.71）
    条件 (i): 活性化 71 のセット平均 z_diff が正 かつ 偽セット 1,000 組（71 個）の 99 パーセンタイル超（3 群すべて）
    条件 (ii): 退化 30 のセット平均 z_diff が負 かつ 偽セット 1,000 組（30 個）の 1 パーセンタイル未満（3 群すべて）
    条件 (iii): (活性化 71 − 退化 30) のセット平均の差が、大きさ 71 と 30 を独立に復元ありで引いた無作為 2 セットの差の 99 パーセンタイル超（3 群すべて）
  乱数の鍵:
    P-1 (iii) の無作為 2 セット: 20261019
    P-1 活性化の偽セット: 20261017
    P-1 退化の偽セット: 20261018
    P-2 候補の偽セット: 20261020
    P-3 候補の偽セット: 20261021
    偽セットの較正: 20261022
  副次 P-2（A2・探索）:
    条件 (a): 候補 8 個のセット平均 z_diff が、偽セット 1,000 組（8 個）の 99 パーセンタイル以内（3 群すべて）＝0 と区別できない
    条件 (b): かつ、活性化の陽性対照 71 個のセット平均（z_diff）より小さい（3 群すべて）
  副次 P-3（A2・探索）:
    条件: 候補 8 個の共通の向き（u_common）のセット平均が、偽セット 1,000 組（8 個）の 99 パーセンタイル超（3 群すべて）
  単位: 群（提供者で分けた互いに重ならない 3 群。seed 81/82/83 は群の名前）
  反証条件（R-1〜R-14。**上から順に当て、最初に当たったものを採用する**。plan.md §4 の表）:
    R-1: 活性化の陽性対照のセット平均 z_diff が 3 群すべてで負 → 判定不能
    R-10: 差の向きでも共通の向きでも候補 8 が基準を超えない → 判定不能
    R-11: 差の向きでも共通の向きでも候補 8 が基準を超える → 判定不能。測り方の問題として PI に報告
    R-12: A1 の対照プール 549 で、z_diff と発現細胞数または入力の長さの中央値の Spearman の絶対値が 0.20 超 → 判定不能
    R-13: 重なり 7 個を除いた版で §4（6.1 の結論）が変わる → 両方の版を併記し、判定は PI に諮る
    R-14: 上のどれにも当たらない → 保留。事実だけを報告し、規則を後から作らない
    R-2: 退化の陽性対照のセット平均 z_diff が 3 群すべてで正 → 判定不能
    R-3: (i) も (ii) も成り立たない（どちらも偽セットの範囲内）→ 差の向きは 2 本を分離できない（支持されない）
    R-4: 2 つの陽性対照が同じ向きに分離する（両方 z_diff の 3 群平均が > 0、または両方 < 0）→ 支持されない
    R-5: (i)(ii) は成り立つが (iii) が成り立たない → 判定不能
    R-6: (i)(ii) の一方だけが成り立ち、他方は 0 と区別できない → その向きのみ判定不能。方法全体の成否は言わない
    R-7: 候補 8 の z_diff が 0 と区別できず（偽セット内）かつ共通の向きで基準超 → P-2・P-3 予想どおり。段階 2 の合格は共通成分
    R-8: 候補 8 の z_diff が正で偽セット超、かつ 3 群すべてで活性化 PC71 の z_diff セット平均以上 → 活性化した間質に固有の可能性（探索）
    R-9: 候補 8 の z_diff が負で偽セット 1 パーセンタイル未満 → 予想外。事実だけ報告（保留）
  指標の定義:
    共通の向き: u_common = (u_ada + u_deg) / ‖u_ada + u_deg‖
    向き 1（活性化した間質）: u_ada = unit(aStr) − unit(start_state)。正規化して使う
    向き 2（退化した状態）: u_deg = unit(dFIB) − unit(start_state)。正規化して使う
    層別補正: evaluate_009.gene_stats_stratified（発現の有無で層別した二次式。lp・ll）。実装を変えない
    差の向き: u_diff = (u_ada − u_deg) / ‖u_ada − u_deg‖
    標準化: '群ごとに、そのデータの対照プール（A2: 510 / A1: 549）の D_raw の平均と標準偏差で標準得点 z にする'
    移動量 0 の扱い: 外す前の表で 2 本（u_diff と u_common）とも射影を計算し、外す細胞 ID を後で除く（向きごとに表を作らない。guardrails 2026-10-11）
    細胞ごとの値: m = (d · u) / ‖d‖。d = pert − orig（保存済み埋め込み）。分母は移動量の大きさ
  数値型と機体:
    A1（確認）: 保存済み bf16（GB10/CUDA）626 個＋新規 bf16（GB10/CUDA）30 個。標準化プール 549 も同じ bf16
    A2（探索）: 保存済み fp32 の埋め込みを読み、CPU/fp32 で再射影。A2 の値どうしだけで閉じる
    直接の比較禁止: A2 の値と A1 の値を同じ尺度で比べない（CLAUDE.md §6.1）。判定は各データ内で閉じる
  評価順（固定）:
    1: A チェック（config 一致・材料 sha256・遺伝子集合・盲検 0 件・値 にNaN なし・再現確認）→ 不合格なら止める
    2: A2 の再現確認（u_ada・u_deg の候補 8 セット平均が既存値と 1e-3 以内）
    3: A2 の P-2・P-3 → R-7〜R-11
    4: A1 の再現確認（626 個の z_ada が gene_seed_009 と 1e-3 以内）
    5: A1 の P-1 (i)(ii)(iii) → R-1〜R-6（最初に当たったもの）
    6: A1 の R-12（交絡）→ R-13（重なり感度）
    7: どれにも当たらない → R-14（保留）
