  anchor_gene: null
  emb_mode: cls                     # V2 は cls 必須（guardrails 2026-09-25）
  forward_batch_size: 8
  nproc: 1                          # GPU を使うプロセスで datasets の fork を避ける（guardrails 2026-09-26）

blocked_genes:                      # 盲検中。摂動しない。evaluate_003.py が読み込み直後に除外して停止条件にする
