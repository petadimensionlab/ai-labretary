# EXP-20260927-001 — 過剰発現型の摂動で「移動距離（元の位置）」をそろえた null 比較（事前登録, plan.md §6）
# EXP-20260926-005 run O と同じモデル・状態・細胞選抜規則・固定遺伝子（陽性 6 / 方向対照 2 / 恒常発現 3 / 中立パネル 7）。
# 違うのは (1) seed（11/12/13, 過去の実験の 0〜5 と重ならない）、(2) null 遺伝子プール 54（固定 18 遺伝子それぞれに発現頻度・元の位置・
# 入力の長さをそろえた 3 遺伝子, work/null_pool.json）、(3) 発現をそろえた比較遺伝子群 30（陽性 6 × 5, work/comparators.csv）、
# (4) 1 遺伝子あたり 100 細胞、(5) 主検定（analysis.primary_test）。遺伝子の選定は ISP の結果を使わない（analysis/select_genes.py）。
experiment_id: EXP-20260927-001
hypothesis_id: HYP-20260927-01      # 方法仮説（proposed, G1 は PI）

model:
  version: V2
  directory: experiments/EXP-20260926-003/models/ft-main/final   # 追加学習済み 2 クラス分類器（読み取りのみ, EXP-005 と同一）
  type: CellClassifier
  num_classes: 2                    # 0 = aPT_CKD, 1 = PT_healthy
  emb_layer: -1

data:
  input_h5ad: experiments/EXP-20260927-001/work/input.h5ad        # → EXP-001 の input.h5ad（symlink, 読み取りのみ）
  tokenized_dataset: experiments/EXP-20260927-001/work/tokenized.dataset  # データ部分の APFS clone（cp -c）。sha256 ba3a14c0…（EXP-001/003/005 と一致, work/SHA256SUMS-preregistered.txt）
  cell_type_col: author_cell_type
  state_key: isp_state
  custom_attr_name_dict: {isp_state: isp_state, donor_id: donor_id, TLS_group: TLS_group,
                          author_cell_type: author_cell_type, disease: disease}
  filter_data: null
  max_ncells: null

states:                             # EXP-005 と同一
  start_state: aPT_CKD_TLShigh
  goal_state: PT_healthy
  alt_states: [aPT_CKD_TLSlow]

cell_selection:
  max_cells_per_gene: 100           # EXP-005 は 200。null プールを 60 遺伝子に広げるため半分にする（plan.md §8）
  max_cells_per_donor: 12           # 200/25 と同じ比率（≈ 1/8）。14 donor × 12 = 168 ≥ 100
  min_cells_per_gene: 80
  donor_key: donor_id

state_embs:                         # goal 重心は追加学習に使っていない健常 9 donor（EXP-005 と同一）
  max_cells_per_state: 500
  max_cells_per_donor: 60
  include_donors:
