capture:
  embeddings: true
  classifier_logits: false          # ΔP は飽和＋bf16 量子化で情報量ほぼゼロ（guardrails, EXP-005 §5）→ 取らない

stats:
  mode: goal_state_shift
  fdr_threshold: 0.05

analysis:                           # plan.md §6 の事前登録（結果を見る前に確定）。判定は主検定のみで行う
  base_metric: m_raw                # 細胞ごとの補正前の目標状態への接近度 shift_goal（run_isp.py の cells.csv）
  pos_definition: index_in_input_ids   # 摂動遺伝子の input_ids 内の位置（先頭 <cls> を含む番号）= 過剰発現で最上位へ動かす距離
  primary_test: pos_matched_permutation   # 移動距離をそろえた並べ替え検定（plan.md §6.1）
  pos_matched_permutation:          # 遺伝子ラベルの並べ替え。偏り補正 → 移動距離・長さの分布が重なる null 遺伝子の中での順位
    bias_model: quadratic_lp_ll     # f = null 細胞（対象遺伝子を除く同じ seed）で y ~ 1 + lp + ll + lp² + ll² + lp·ll（lp = log2(1+pos), ll = log2 len）
    distance: max_abs_log2          # d(i,j) = max(|lp_i − lp_j|, |ll_i − ll_j|)
    tolerance_log2: 0.5             # 対象の細胞 i に d ≤ 0.5 の細胞を持つかで「重なり」を判定
    min_cover_frac: 0.8             # 対象の細胞の 80% 以上が重なる null 遺伝子だけを並べ替えの相手にする
    min_eligible_null_genes: 20     # 相手が 20 未満の対象遺伝子×seed は「判定不能（NaN）」。C3 では範囲外と数える
    statistic: D_raw                # 遺伝子平均 mean_i [y_i − f(lp_i, ll_i)]。q = 相手のうち D_raw が小さい割合
  cell_residual:                    # 提供者単位の副指標・半分割再現性で使う細胞ごとの補正値
    match_k: 50                     # r_i = y_i − （null 細胞のうち d が最も近い 50 個の y の平均）。対象が null 自身ならその遺伝子を除く
  secondary_test: within_bin_percentile   # 区間内パーセンタイル検定（副, 判定に使わない）
  within_bin_percentile:
    length_bins: 5                  # null 細胞の長さ 5 分位
    pos_bins: 10                    # 各長さ区間の中で null 細胞の log2(1+pos) 10 分位 → 50 区間
  criteria:
    q_hi: 0.90                      # 分位 ≥ 0.90 を「上位 10%」
    min_seeds: 2                    # 3 seed 中 2 以上
    C1_min_genes: 2                 # 判定基準 陽性対照の分離: 6 中 2 以上（遺伝子ごとの条件は C1 ∧ C2 ∧ C9）
    C2_min_wins: 7                  # 恒常発現遺伝子との差: 補正後の差 D が HK を 9 組（3 HK × 3 seed）中 7 以上で上回る
    C9_min_beaten: 4                # 比較遺伝子群との差: 同じ seed で D が自分の比較遺伝子 5 つのうち 4 以上を上回る
    C9_min_seeds: 2                 #   … を 3 seed 中 2 以上
    C3_range: [0.10, 0.90]          # 恒常発現遺伝子の中立性: 3 遺伝子とも 3 seed 中 2 以上で範囲内（NaN は範囲外と数える）
    C3_panel_min_genes: 5           # 中立対照パネルの中立性: 7 中 5 以上が 3 seed 中 2 以上で範囲内
    C8a_tail_frac_max: 0.20         # 較正: null 遺伝子自身を対象にしたとき（自分を除いたプール）分位 ≥ 0.90 の割合と < 0.10 の割合がともに ≤ 0.20（3 seed 合算, 期待 0.10）
    C8b_abs_rho_max: 0.25           # 交絡の除去: null 遺伝子の D と遺伝子ごとの log2(1+pos) 中央値・相対位置中央値の |Spearman ρ| ≤ 0.25
    C8b_min_seeds: 2                #   … を 3 seed 中 2 以上（pos・相対位置の両方）
    C6_marker_pct_max: 0.80         # 参考（示唆のみ）: 合格遺伝子に ddet_pct ≤ 0.80 のものがある（EXP-005 work/gene_annotation.json の値）
    C7_reverse_max: 0.50            # 参考: 方向対照（VCAM1・HAVCR1）の分位 ≤ 0.50 が 3 seed 中 2 以上
  donor_level:                      # 副指標（判定規則は変えない。plan.md §6.5）
    min_cells_per_donor: 3          # 細胞 3 未満の提供者はその遺伝子×seed で除く
    sign_consistency: true          # 提供者ごとの r の平均（3 seed 平均）> 0 の提供者の割合。null 遺伝子の同じ割合の分布での分位
    wilcoxon_one_sided: true        # 提供者を単位とした符号順位検定（片側, 参考）
    mixed_model: true               # r ~ 1 + (1 | 提供者) + seed 固定効果（遺伝子ごと, statsmodels MixedLM, REML）。切片・提供者分散・級内相関
    lodo: true                      # 提供者を 1 人ずつ除いて主検定をやり直し、遺伝子ごとの合否が変わる提供者の数（C1 合格遺伝子のみ）
  split_half:                       # 固定した 102 遺伝子（と固定 18 遺伝子の部分集合）で、提供者 14 人を 7/7 に分ける
    n_splits: 20
    rng_seed: 0
    genes: all_102_fixed            # 陽性 6・方向対照 2・HK 3・パネル 7・比較 30・null 54（ISP の前に固定）
    report: [spearman_mean, spearman_range, spearman_brown, n_genes, n_donors_per_half, n_splits]
    reference_min: 0.7              # 参考ライン（判定に使わない）
  continuity_a2: true               # 参考: EXP-005 と同じ a2（長さ補正した接近度）と null 分位も出す（判定に使わない）

robustness:
  seeds: [11, 12, 13]               # 過去の実験（0〜5）と重ならない新しい seed
  subsample_frac: 1.0
  emb_layers: [-1]

output:
  results_dir: results

compute:
  device: mps                       # 実行はリモート計算機 2 号（spark-c083）。isp_remote.sh が cuda で上書き（device.json に記録）
  dtype: bf16                       # PI 標準。forward bf16 / コサインは fp32（apply_dtype）
  cache_model: true
  sec_per_cell_gene: 0.125          # GB10 実測（EXP-005 run O: 22,800 cell×gene を 0.84 h, 1 遺伝子 200 細胞あたり約 25 s）
  sec_fixed_per_gene_run: 3.18      # EXP-005 の遺伝子×seed ごと時間の回帰: 3.18 s + 4.49 s / 10 万トークン（n=112, r=0.53）
  sec_per_1e5_tokens: 4.49
  gpu_hours_estimate: 1.4           # ISP 1.19 h（306 遺伝子×seed, 7.41e7 トークン）+ 重心・起動・転送 ≈ 0.2 h（plan.md §8）
