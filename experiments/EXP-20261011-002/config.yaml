    config_sha256: 82894c58cf17da6e5c55e1fa3b038b16d33c22d01350ea72c4eb8978da68dba7   # EXP-20261004-001 config（前回と同じ）
    states: {start: FIB_MFIB, goal_ada: aStr, goal_deg: dFIB}
    pool_n: 549
    existing_n: 626
    new_n: 30
    repro_csv: experiments/EXP-20261011-001/results/gene_rank_014.csv   # 再現確認の参照（公開済み）
    repro_tol: 0.001
