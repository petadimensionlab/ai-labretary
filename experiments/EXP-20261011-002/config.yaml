# EXP-20261011-002 — HYP-20261011-01（差の向き。方法の再確認）。
# EXP-20261011-001 の不成立（R-6 退化側が 1% に届かず・R-12 発現細胞数との交絡）への再設計。
# PI 指示 2026-10-11「退化側の移動を強く出す設計 → 交絡補正」。
#
# 構成:
#   - 新しい摂動は回さない。A1（EXP-20261004-001 の 626 ＋ EXP-20261011-001 の 30）と
#     A2（EXP-20261007-001 の 587）の保存済み埋め込みを再射影し、再評価する（GPU 0 時間）
#   - [1] 退化側: 主の陽性対照 = 退化 23（重なり 7 を除く特異的マーカー。JUND・CTSH は残す）。
#     感度 = 退化 30・退化 21。測る向きは差の向き u_diff のまま
#   - [2] 交絡補正: 主 = 発現細胞数・入力の長さ・元の位置をそろえたマッチ偽セット（交絡込みの帰無分布）。
#     副次 = 残差化（z_diff を log2(n_exp) と log2(ll_med) で seed ごとに回帰）
#   - 補正の健全性（R-12a マッチングの中心 / R-12b 閾値の安定性 / R-12c 交差検証残差の交絡）を
#     判定基準に含める（主判定の合否にかかわらず不合格なら判定不能）
#   - A6 は今回の実行対象にしない（plan.md §5.6。PI 判断項目 (a)(b)(c) は開いたまま）
#
# 事前登録: plan.md §4 と同じ値が decision: に書いてあり、evaluate_015.py が照合する。
# 主判定の値・補正後の値・マッチ偽セットの閾値はまだ 1 つも計算していない。
experiment_id: EXP-20261011-002
hypothesis_id: HYP-20261011-01
kind: difference_direction_corrected_reanalysis
note: >-
  保存済み埋め込みの再評価のみ（GPU 0 時間）。主判定 P-1' は A1（確認）で、
  (i) 活性化 71 が正かつマッチ偽セット 99% 点超 / (ii) 退化 23（特異的マーカー）が負かつ
  マッチ偽セット 1% 点未満 / (iii) 間隔がマッチした無作為 2 セットの差の 99% 点超。
  マッチ偽セットは発現細胞数・入力の長さ・元の位置を陽性セットにそろえる（evaluate_005.sham_sets と
  同じ近傍距離。交絡を帰無分布に織り込む）。副次 = 残差化版（無作為偽セット）。
  補正の健全性 R-12a/b/c が不合格なら判定不能。A2 は探索（候補 8 のマッチ補正版。記述）。

# ---------------------------------------------------------------- モデル（評価では使わない。記録のみ）
model:
  version: V2
  directory: models/Geneformer/Geneformer-V2-316M
  type: Pretrained
  num_classes: 0
  emb_layer: -1

# ---------------------------------------------------------------- 入力（どれも読み取りのみ）
data:
  a1_results: experiments/EXP-20261004-001/results        # 既存 626
  a1_new_results: experiments/EXP-20261011-001/results    # 既存 30（前回の新規摂動）
  a1_tokenized: experiments/EXP-20261011-001/work/tokenized-a1.dataset   # 複製（sha256 照合済み）
  a2_results: experiments/EXP-20261007-001/results        # 既存 587
  a2_tokenized: experiments/EXP-20261011-001/work/tokenized-a2.dataset   # 複製（sha256 照合済み）
  a1_cells_csv: experiments/EXP-20261004-001/results/cells.csv
  a1_new_cells_csv: experiments/EXP-20261011-001/results/cells.csv
  a2_cells_csv: experiments/EXP-20261007-001/results/cells.csv

# ---------------------------------------------------------------- 評価（evaluate_015.py）の入力
