        - ENSG00000069329           # VPS35    （RELB, d_c=0.67）
        - ENSG00000104823           # ECH1     （NFKB2, d_c=0.63）
        - ENSG00000213465           # ARL2     （NFKB2, d_c=0.74）
        - ENSG00000156261           # CCT8     （NFKB2, d_c=0.96）
        - ENSG00000235750           # KIAA0040 （NFKB2, d_c=0.98）
        - ENSG00000170500           # LONRF2   （NFKB2, d_c=0.99）
        - ENSG00000128683           # GAD1     （CDKN1A, d_c=0.44, 参考）
        - ENSG00000152092           # ASTN1    （CDKN1A, d_c=0.52, 参考）
        - ENSG00000115165           # CYTIP    （CDKN1A, d_c=0.52, 参考）
        - ENSG00000160678           # S100A1   （CDKN1A, d_c=0.61, 参考）
        - ENSG00000171659           # GPR34    （CDKN1A, d_c=0.62, 参考）

capture:
  embeddings: true                  # 元・摂動後の CLS 埋め込みを保存（MYOF 重心など追加の重心への接近度を後から計算する）
  classifier_logits: false          # 事前学習モデルなので分類ヘッドはない

extra_centroids:                    # analysis/extra_centroids.py が作る追加の重心（摂動の再計算は不要）
  output: experiments/EXP-20260927-003/work/extra_centroids-seed{seed}.npz
  sets:
    MYOF_neg:                       # 状態の対照: 3 遺伝子陰性の筋線維芽細胞（MYOF + cycMYOF）1,640 細胞 / 深さマッチ後
      subclass_l2: [MYOF, cycMYOF]
      states: [FIB_neg_TLShigh, FIB_neg_TLSlow]
      depth_match_to: FIB_neg_TLShigh
      max_cells: 800
      max_cells_per_donor: 60
    FIB_org_unmatched:              # 感度分析: 深さマッチをしない goal 重心（参考）
      states: [FIB_org]
      depth_match_to: null
      max_cells: 800
      max_cells_per_donor: 60

stats:
  mode: goal_state_shift
  fdr_threshold: 0.05

analysis:                           # plan.md §6 の事前登録（結果を見る前に確定）
  base_metric: shift_goal           # 深さをそろえた goal 重心への接近度（run_isp の cells.csv）。正 = goal へ近づく
  pos_definition: index_in_input_ids
  primary_test: pos_matched_permutation      # EXP-20260927-001 §6.1 と同じ実装
  pos_matched_permutation:
    bias_model: quadratic_lp_ll     # null 細胞（対象を除く同じ seed）で y ~ 1 + lp + ll + lp² + ll² + lp·ll
    distance: max_abs_log2          # d(i,j) = max(|lp_i − lp_j|, |ll_i − ll_j|)
    tolerance_log2: 0.5
    min_cover_frac: 0.8
    min_eligible_null_genes: 20     # 下回る遺伝子×seed は判定不能（NaN）
    statistic: D_raw
  cell_residual:
    match_k: 50
  secondary_test: within_bin_percentile      # 副検定（判定に使わない）
  within_bin_percentile:
    length_bins: 5
    pos_bins: 10
  state_control:                    # 状態の対照（線維化方向へ動いただけでないことの確認）
    metric: shift_myof              # cos(摂動後, MYOF 重心) − cos(元, MYOF 重心)（capture の埋め込みから計算）
    centroid: MYOF_neg
  criteria:
    q_hi: 0.90
    min_seeds: 2                    # 3 seed 中 2 以上
    require_positive_sign: true     # 合格には D_raw > 0 かつ 補正前の平均 shift_goal > 0 を要求（guardrails 2026-09-26）
    C1_min_genes: 2                 # 主対象 3 中 2 以上が (a)(b)(c)(d) をすべて満たせば「支持」
    C2_min_wins: 7                  # (b) 恒常発現遺伝子との差: 9 組（3 遺伝子 × 3 seed）中 7 以上
    C9_min_beaten: 4                # (c) 比較遺伝子群との差: 自分の比較遺伝子 5 つのうち 4 以上
    C9_min_seeds: 2
    C10_min_seeds: 2                # (d) 状態の特異性: D_raw(goal) > D_raw(MYOF) が 3 seed 中 2 以上
    C3_range: [0.10, 0.90]          # 恒常発現遺伝子の中立性（NaN は範囲外と数える）
    C3_panel_min_genes: 5           # 中立対照パネル 7 中 5 以上
    C8a_tail_frac_max: 0.20         # 較正: null 遺伝子自身の q が上位 10% / 下位 10% になる割合
    C8a_min_n: 60
    C8b_abs_rho_max: 0.25           # 交絡の除去: null の D_raw と 元の位置・相対位置・入力の長さ の |Spearman ρ|
    C8b_min_seeds: 2
    C11_positive_control: [ENSG00000107796, ENSG00000149591]   # ACTA2 / TAGLN
    C11_min_genes: 1                # どちらか 1 つが MYOF 重心への接近で q ≥ 0.90 かつ D > 0 を 3 seed 中 2 以上
  donor_level:
    min_cells_per_donor: 3
    sign_consistency: true
    wilcoxon_one_sided: true
    mixed_model: true
    lodo: true
  split_half:
    n_splits: 20
    rng_seed: 0
    reference_min: 0.7              # 参考ライン（判定に使わない）

robustness:
  seeds: [21, 22, 23]               # 既出（0〜5, 11〜13）と重ならない
  subsample_frac: 1.0
  emb_layers: [-1]

output:
  results_dir: results
  experiment_dir: experiments/EXP-20260927-003

compute:
  device: mps                       # 実行はリモート計算機 2 号（spark-c083）。isp_remote.sh が cuda で上書きする
  dtype: bf16                       # PI 標準（2026-09-26）。コサインは fp32（apply_dtype）
  cache_model: true
  sec_per_cell_gene: 0.125          # GB10 実測（EXP-20260926-005 run O）。Mac の MPS は 0.68〜0.75 s
  sec_fixed_per_gene_run: 3.18      # EXP-20260927-001 の回帰: 3.18 s + 4.49 s / 10 万トークン
  sec_per_1e5_tokens: 4.49
  gpu_hours_estimate: 1.3           # plan.md §8（リモート GB10）。Mac の MPS なら約 5.5 h
