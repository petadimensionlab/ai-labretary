embedding:
  device: cuda                       # GB10/CUDA。既存と同じ機体（fp32 なので機体を選ばない。CLAUDE.md §6.1）
  dtype: fp32                        # 判定の基準（セントロイド・軸・分離）を作るので fp32。tf32 は閉じる
  emb_mode: cls
  emb_label: [row_id]                # EmbExtractor の出力。ID で結合する（ガードレール 2026-09-27）
  forward_batch_size: 100
  nproc: 1
  max_ncells: null                   # 全 46,957 核を 1 回エンコード

decision:
  偶然の水準: 片側 1% に較正。偽セット（対照プールから復元あり 1,000 組）の合格率を記録（判定に使わない）
  乱数の鍵:
    偽セット 1,000 組: 20261112
    対照プールの頻度マッチ: 20261011
  主判定 P-1（状態の分離。2 系統）:
    2 系統すべてで: 提供者単位分割（GroupKFold 5 分割）の AUC 平均 ≥ 0.70、かつ総 UMI 数と検出された遺伝子数の 2 変数だけでの分離 AUC ≤ 0.60
  主判定 P-2（2 本の軸は異なる向き）:
    (a) 検出された遺伝子数の分布をそろえたセントロイドから作る u_ada と u_deg のなす角の sin ≥ 0.31（角 ≥ 18 度）を提供者 3 群すべてで
    (b) u_ada・u_deg のそれぞれと d_depth（検出された遺伝子数の大きい 5 分位と小さい 5 分位のセントロイドを結ぶ向き）の余弦の絶対値 ≤ 0.60
    (c) 検出された遺伝子数の分布をそろえないセントロイドから作る軸との角度差 ≤ 30 度（そろえても軸が安定）
  副次 P-3（前回の退化側の不成立が A6 でどう見えるか。記述）:
    管状系の軸が (i) 分離（P-1 の管状系）と (ii) 異なる向き（P-2）を満たすかどうかを 2 値で報告
  副次 P-4（候補と陽性対照の位置。**相関・記述**。摂動の確認ではない）:
    発現と埋め込みの位置の相関（検出された遺伝子数の分布をそろえた後、総 UMI 数と検出された遺伝子数で残差化した後）。詳細は plan.md §4.4
  反証条件: plan.md §4.5 の表。上から順に当て、最初に当たったものを採用

compute:
  gpu_hours_estimate: 1.13           # 実測の埋め込みスループット 11.5 細胞/秒（A2 fp32）で 46,957 核
  needs_G2_approval: false           # 技術判定（run_isp.py の条件には当たらない）
  needs_G2_approval_conservative: true   # PI 回答 2026-10-11: 総核数 46,957 > 1 万の保守側解釈を採用し G2 対象とする
  approved_by: "PI 2026-10-11（G2 保守側・埋め込み ≈1.13 h 承認）"