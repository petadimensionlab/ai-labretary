# EXP-20261011-003 — A6（尿管閉塞腎, Reck ら 2025）の埋め込みのみの実験。
# 全パラメータはここに書く。plan.md §4 の判定規則と一致させる（評価コードが照合する）。
# **摂動・過剰発現はしない。** 埋め込みを 1 回取り、状態の分離・2 本の軸のなす角・
# 候補と陽性対照の位置（向き）を独立データで実測する。
experiment_id: EXP-20261011-003
hypothesis_id: HYP-20261011-01   # 方法の仮説。G3=判定不能(2026-10-11)。本実験は PI 決定 2026-10-11 の A6 確認
kind: embedding_only

model:
  version: V2
  directory: models/Geneformer/Geneformer-V2-316M
  type: Pretrained
  num_classes: 0
  emb_layer: -1

data:
  input_h5ad: data/raw/kidney_tls/A6_UUO_Reck2025.h5ad   # 読み取り専用
  tokenized_dataset: experiments/EXP-20261011-003/work/tokenized.dataset
  state_key: celltype_l2
  cell_type_col: celltype_l2
  custom_attr_name_dict:
    celltype_l2: celltype_l2
    celltype_l1: celltype_l1
    disease: disease
    donor_id: donor_id
    n_umi: n_umi
    n_genes: n_genes
    assay: assay
  filter_data: null
  max_ncells: null

