    start: {labels: [Fibroblast]}
    goal: {labels: [Myofibroblast]}
    positive_control_set: activation_71
  tubular:                           # 管状系（退化・老化の軸 = u_deg 相当）
    start: {labels: [PT S1, PT S2, PT S3]}
    goal: {labels: [PT Injured, PT Inflammatory]}
    positive_control_set: positive_tubular_a6   # A6 用に組み直した固定リスト（PI 回答 2026-10-11, §5.1）。
                                                # Lake30（positive_degenerate）は管状系では検出が弱く使わない

