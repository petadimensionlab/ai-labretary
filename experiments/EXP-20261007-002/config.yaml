  ensembl: [ENSG00000141510, ENSG00000124762, ENSG00000111321, ENSG00000118785, ENSG00000148346]

# ---------------------------------------------------------------------------
metric:
  score: fraction_of_list_genes_detected
  detection_rule: raw_count_gt_zero     # 生カウント > 0 を検出とする。発現量の大きさは使わない
  denominator: 122                      # 細胞ごとに変えない（A1 も同じ 122。分母を固定）
  standardization: reference_only_within_interval   # PI 判断 2026-10-11（案 B）
  # 区間の中の参照（FIB）だけの細胞から平均 m と不偏標準偏差 sd（分母 n−1）を出す。
  # **参照＋退化の全体でそろえても Cohen's d と p は同じ値になる**（正の定数倍と平行移動で不変）。
  sd_denominator: unbiased_n_minus_1

# ---------------------------------------------------------------------------
decision:                # **plan.md §4 と同一の値。評価コードが照合する**
  S-1 主判定:
    比較: 退化（dFIB）> 参照（FIB）
    test: welch_t_two_sample_one_sided
    effect_size: cohens_d_pooled
    effect_size_threshold: 0.5
    p_threshold: 0.05
    p_sided: one_sided
    min_detectable_effect_d: 0.38     # 仮説 §4.1 から引用（n=81 対 93、片側 α=0.05、検出力 80%）
    power_at_d_0_5: 0.95              # 仮説 §4.1 から引用
  S-2 特異性:
    条件: SenMayo の効果量 > 無作為 122 遺伝子 1,000 組の効果量の 99 パーセンタイル
    n_random_sets: 1000
    percentile: 99
    percentile_method: linear_numpy_default   # 昇順 990 番目と 991 番目（1 始まり）の平均
    effect_size: cohens_d_pooled
    frequency_matching:
      strata: deciles_of_senmayo_frequency   # SenMayo 122 個の freq の 10 分位点で層を切る
      freq_definition: fraction_of_interval_cells_with_raw_count_gt_zero
      freq_cells: interval_reference_plus_degenerate
      draw_without_replacement: true
      shortage_rule: nearest_stratum_with_surplus   # 不足分は頻度中央値が最も近い余っている層から補い、記録する
      pool_excludes: [blocked_genes, senmayo_122, freq_zero_in_interval]
      pool_geneformer_dict_required: true
    random_key: 20261012
  S-3 深さ依存:
    d_matched: interval_1000_2000
    d_unmatched: all_reference_and_degenerate
    ratio_threshold: 0.3333333333     # d_matched < (1/3) * d_unmatched なら T-4
  S-4 副次（A1。判定に使わない）:
    interval: interval_500_1100
    report: [cohens_d, one_sided_p]
    random_key_descriptive: 20261013
  T-1: {condition: effect_below_0.5, key: T1_effect_below_0.5}
  T-2: {condition: direction_reversed_d_less_than_0, key: T2_direction_reversed}
  T-3: {condition: senmayo_d_le_99th_percentile, key: T3_not_specific}
  T-4: {condition: d_matched_lt_third_of_d_unmatched, key: T4_depth_explains}
  T-5: {condition: usable_gene_count_lt_25, key: T5_indicator_not_viable}
  T-6: {condition: cells_lt_30_in_either_state, key: T6_too_few_cells}
  evaluation_order: [T5, T6, T2, T1, T3, T4]   # 複数当たったときは先を採る
  LODO:
    unit: donor
    scope: interval_reference_and_degenerate
    changes_decision: false           # 記録のみ
  circularity:
    # 結果を見る前に遺伝子記号の一致だけで数える
    sets: [senmayo_122, candidate_genes, positive_control_genes, blocked_genes]
    known_overlap:
      senmayo_122_vs_candidate: 0
      senmayo_122_vs_positive_control_A2: 9   # BEX3, CD9, CTSB, IGFBP2, IGFBP3, IGFBP5, IGFBP7, IL32, MIF
      candidate_vs_positive_control_A2: 1     # CA12
      blocked_vs_senmayo_122: 0

# ---------------------------------------------------------------------------
compute:
  device: cpu                 # GPU を使わない
  dtype: fp32                 # 得点は小数の比較。float32
  gpu_hours_estimate: 0
  needs_G2_approval: false    # plan.md §9。PI に確認する
  stats_dtype: float64        # 検定・標準偏差の計算は倍精度で行う（合否には影響しない）
  random_seed_S2: 20261012
  random_seed_S2_A1: 20261013

output:
  experiment_dir: experiments/EXP-20261007-002
  results_dir: experiments/EXP-20261007-002/results
  criteria_json: results/criteria_012.json
  scores_csv: results/scores_012.csv
  work_dir: experiments/EXP-20261007-002/work

# 摂動を使わないので着手前チェック（axis_feasibility）は適用外。実行しない（plan.md §5.5）。
