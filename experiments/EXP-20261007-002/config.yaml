# EXP-20261007-002 — 手で作った事前登録の設定。実行スクリプトはこの値を読み、判定値をハードコードしない。
# plan.md §4 の判定規則をそのまま写したもの。**plan.md と同じ値でなければ評価コードは止まる。**
experiment_id: EXP-20261007-002
hypothesis_id: HYP-20261007-02
kind: no_perturbation_senescence_score_test
stage: 1
note: >
  HYP-20261007-02 の段階 1。摂動を使わない。A2（KPMP 単一細胞 RNA-seq, Lake ら 2023, PMID 37468583）で、
  著者ラベル dFIB（退化した線維芽細胞）の SenMayo 得点が、著者ラベル FIB（参照）より高いかを検定する。
  得点は「リストの 122 遺伝子のうち検出された割合」。検出遺伝子数（nFeature_RNA）の区間 1,000〜2,000 でそろえる。
  GPU を使わない。ゲート G2 は不要（plan.md §9）。段階 2 は本ファイルに含めない。

# ---------------------------------------------------------------------------
data:
  A2:
    role: 判定に使う（主）
    input_h5ad: data/raw/kidney_tls/A2_KPMP_v1.5_scRNA_Lake2023.h5ad  # 読み取り専用
    modality: 単一細胞 RNA-seq
    counts_location: raw.X        # **生カウント**（X は正規化値）。整数様であることを検査する
    state_col: author_cell_type   # 著者の実ラベル（obs）
    reference_labels: [FIB]       # 参照状態
    degenerate_labels: [dFIB]     # 比較対象（退化した状態）
    donor_col: donor_id
    depth_col: nFeature_RNA       # 検出遺伝子数
    interval: {min: 1000, max: 2000, inclusive: true}   # **結果を見て動かさない**
    expected_cells_in_interval: {reference: 81, degenerate: 93}  # 仮説 §2.2 の実測。実行時に再確認し、違えば記録
    min_cells_per_state: 30       # T-6: これを割ったら着手しない
    sensitivity_interval: {min: 800, max: 2500, inclusive: true}  # 記述のみ（§6.2）
  A1:
    role: 副次（S-4）。判定に使わない
    input_h5ad: data/raw/kidney_tls/A1_KPMP_v1.5_snRNA_Lake2023.h5ad  # 読み取り専用
    modality: 単一核 RNA-seq
    counts_location: raw.X
    state_col: subclass.l2        # 著者の実ラベル（obs）
    reference_labels: [FIB, M-FIB]
    degenerate_labels: [dFIB]
    donor_col: donor_id
    depth_col: nFeature_RNA
    interval: {min: 500, max: 1100, inclusive: true}
    expected_cells_in_interval: {reference: 3619, degenerate: 337}  # 仮説 §2.2 の実測。実行時に再確認
    sensitivity_interval: {min: 600, max: 1200, inclusive: true}   # 記述のみ（§6.2）

# ---------------------------------------------------------------------------
genes:
  # SenMayo（Saul ら 2022, Nat Commun 13:4827, PMID 35974106）補足データ 1 human シートの取得物
  senmayo_file: outputs/literature/2026-10-11-senescence-and-degenerated-lists/senmayo_125.csv
  senmayo_gene_column: gene_symbol
  senmayo_in_A2_column: in_A2_var
  exclude_blind_from_list: [SPP1]         # 盲検中のため機械的に除外（PI 判断 2026-10-11）
  exclude_not_in_A2: [CCL1, CCL3L1]       # A2 の var に無い（PI 判断 2026-10-11）
  expected_gene_count: 122                # 主の指標に使う個数（T-5 の 25 個未満には当たらない）
  min_gene_count_T5: 25
