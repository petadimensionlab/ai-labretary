  comparator: null                # 比較遺伝子群は使わない（EXP-003 で弱い相手だった。validation.md §6.1）

capture:
  embeddings: true                  # 元・摂動後の CLS 埋め込みを保存（追加の重心への接近度を後から計算する）
  classifier_logits: false

extra_centroids:
  output: experiments/EXP-20260927-004/work/extra_centroids-seed{seed}.npz
  sets:
    MYOF_neg:                       # 状態の対照: 3 遺伝子陰性の筋線維芽細胞
      subclass_l2: [MYOF, cycMYOF]
      states: [FIB_neg_TLShigh, FIB_neg_TLSlow]
      depth_match_to: FIB_neg_TLShigh
      max_cells: 800
      max_cells_per_donor: 60
    FIB_org_unmatched:              # 感度分析: 深さマッチをしない目標重心（判定に使わない）
      states: [FIB_org]
      depth_match_to: null
      max_cells: 800
      max_cells_per_donor: 60

analysis:                           # plan.md §6 の事前登録（結果を見る前に確定）
  primary_metric: A12               # (目標 − (出発点・対照の状態・筋線維芽細胞の平均)) / 移動量 ‖Δ‖
  secondary_metric: A11             # 同じ差を移動量で割らない形（感度分析。判定に使わない）
  pos_definition: index_in_input_ids
  primary_test: pos_matched_permutation
  pos_matched_permutation:
    bias_model: quadratic_lp_ll     # y ~ 1 + lp + ll + lp² + ll² + lp·ll
    distance: max_abs_log2
    tolerance_log2: 0.5
    min_cover_frac: 0.8
    min_eligible_null_genes: 20     # 下回る遺伝子×seed は判定不能（NaN）。不合格とは数えない
    statistic: D_raw
  criteria:
    # --- M5: 目標の軸での陽性対照（本実験の主判定。plan.md §6.4）
    q_hi: 0.90
    min_sd_units: 2.5               # D_raw ≥ 2.5 × 対照遺伝子群の標準偏差
    require_all_seeds: true         # 3 seed すべて
    M5_min_genes: 1                 # 候補 10 のうち 1 つ以上
    # --- M1: 較正
    M1_tail_frac_max: 0.20
    M1_min_n: 60
    # --- M2: 交絡の除去
    M2_abs_rho_max: 0.25
    M2_min_seeds: 2
    # --- M3: 恒常発現遺伝子・中立対照パネルの中立性（GAPDH は残す。plan.md §5.3）
    M3_range: [0.10, 0.90]
    M3_min_seeds: 2
    M3_panel_min_genes: 5
    # --- M4: 方向を測れていること（新設。plan.md §6.3）
    M4_abs_rho_uniform_max: 0.40
    M4_abs_rho_placebo_max: 0.50
  descriptive_only:                 # 記録するが合否には入れない
    - state_specificity             # D_raw(主指標) > D_raw(置き換え) / D_raw(筋線維芽細胞の鏡像)
    - displacement_norm             # 遺伝子ごとの移動量 ‖Δ‖（GAPDH の性質の確認）
    - donor_level
    - goal_unmatched_sensitivity

# run_isp.py が必須とするセクション（validate() と run_stats()）。
# 本実験の判定は analysis/evaluate_004.py が埋め込みから直接計算するので、
# ここの出力（stats/ 配下）は判定に一切使わない。EXP-20260927-003 と同じ値にして比較可能性を保つ。
# 2026-09-27 追記（結果を見る前。plan.md §12 の変更ログを参照）
stats:
  mode: goal_state_shift
  fdr_threshold: 0.05

robustness:
  seeds: [31, 32, 33]
  subsample_frac: 1.0
  emb_layers: [-1]

output:
  results_dir: results
  experiment_dir: experiments/EXP-20260927-004

compute:
  device: mps                       # 実行はリモート計算機 2 号（GB10）。isp_remote.sh が cuda で上書きする
                                    # （EXP-20260927-003 と同じ書き方。cuda と直書きすると Mac 側の検査で警告になる）
  dtype: bf16                       # PI 標準（2026-09-26）。コサインは fp32
  cache_model: true
  sec_per_cell_gene: 0.125          # GB10 実測（EXP-20260926-005 run O）
  sec_fixed_per_gene_run: 3.18      # EXP-20260927-001 の回帰
  sec_per_1e5_tokens: 4.49
  n_gene_runs: 318                  # 106 遺伝子 × 3 seed
  n_cell_gene: 63570
  n_tokens: 1.248e8
  gpu_hours_estimate: 4.0           # plan.md §8。上限 24 時間に対し余裕あり → G2 不要
