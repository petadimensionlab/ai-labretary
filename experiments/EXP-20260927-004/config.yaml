    - ENSG00000075624  # ACTB
    - ENSG00000111640  # GAPDH
    - ENSG00000196262  # PPIA
  fixed_role: housekeeping
  extra_fixed:
    - role: negctrl_panel          # 中立対照パネル 7（EXP-20260926-003/005・EXP-20260927-001 と同一）
      genes:
