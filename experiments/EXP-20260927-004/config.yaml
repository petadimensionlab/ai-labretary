# EXP-20260927-004 — 過剰発現型の指標の作り直しと、目標の軸での陽性対照の確立（事前登録。plan.md を先に読むこと）
#
# 設計の要点
#  - 本実験は仮説を検定しない。測り方そのものを検証する（plan.md §1）。
#  - 主対象 LTBR / RELB / NFKB2 と参考対象 CDKN1A、盲検の TP53 / SPP1 / LCN2 は**回さない**。
#    evaluate_004.py が読み込み直後に除外し、1 行でも残っていれば停止する。
#  - 目標ラベルを定義する CCL19 / CCL21 / CXCL13 も入れない（循環性。出発点では 0 なので成立もしない）。
#  - 主指標は「目標に特異的な成分 / 移動量」。単一重心への接近度は使わない（guardrails 2026-09-27）。
#  - seed は 31 / 32 / 33（既出の 0〜5, 11〜13, 21〜23 と重ならない）。
experiment_id: EXP-20260927-004
hypothesis_id: null                 # 仮説の検定ではない。HYP-20260925-02 の再検定は別の実験で設計する

model:                              # EXP-20260927-003 と同一（比較可能性のため変えない）
  version: V2
  directory: models/Geneformer/Geneformer-V2-316M
  type: Pretrained
  num_classes: 0
  emb_layer: -1

data:
  input_h5ad: experiments/EXP-20260927-002/work/input.h5ad      # 読み取りのみ。data/raw は触らない
  tokenized_dataset: experiments/EXP-20260927-004/work/tokenized.dataset
  cell_type_col: subclass_l2
  state_key: fib_tls_state
  custom_attr_name_dict: {fib_tls_state: fib_tls_state, donor_id: donor_id, subclass_l2: subclass_l2,
                          disease: disease, region: region, TLS_group: TLS_group,
                          n_genes: n_genes, n_counts: n_counts}
  filter_data: null
  max_ncells: null

states:                             # EXP-20260927-002 の定義を継承（ここで変えない）
  start_state: FIB_neg_TLShigh
  goal_state: FIB_org
  alt_states: [FIB_neg_TLSlow]

state_embs:
  max_cells_per_state: 800
  max_cells_per_donor: 60
  rows_file: experiments/EXP-20260927-004/work/state_rows-seed{seed}.json   # 深さマッチ後の行番号

cell_selection:
  donor_key: donor_id
  max_cells_per_gene: 200           # EXP-003 の 100 から倍増（seed 間の誤差を下げるため。plan.md §9）
  max_cells_per_donor: 20
  min_cells_per_gene: 120

perturbation:
  perturb_type: overexpress
  perturb_rank_shift: null
  controls_only: false
  # 目標の軸の陽性対照候補 10（work/genes_004.json の role=positive_goal と同一。plan.md §5.1）
  # run_isp.py の role は target になる。本実験で「判定する対象」はこの 10 個である
  genes_to_perturb:
    - ENSG00000162692  # VCAM1  文献層
    - ENSG00000090339  # ICAM1  文献層
    - ENSG00000107562  # CXCL12  文献層
    - ENSG00000104432  # IL7  文献層
    - ENSG00000102524  # TNFSF13B  文献層
    - ENSG00000096060  # FKBP5  データ層
    - ENSG00000059804  # SLC2A3  データ層
    - ENSG00000142871  # CCN1  データ層
    - ENSG00000185666  # SYN3  データ層
    - ENSG00000127954  # STEAP4  データ層
  combos: 0
  anchor_gene: null
  emb_mode: cls                     # V2 は cls 必須（guardrails 2026-09-25）
  forward_batch_size: 8
  nproc: 1                          # GPU 使用プロセスでは datasets の fork を避ける（guardrails 2026-09-26）

blocked_genes:                      # 摂動しない。evaluate_004.py が assert する
  - ENSG00000111321                 # LTBR   主対象
  - ENSG00000104856                 # RELB   主対象
  - ENSG00000077150                 # NFKB2  主対象
  - ENSG00000124762                 # CDKN1A 参考対象・盲検
  - ENSG00000141510                 # TP53   盲検（未解除）
  - ENSG00000118785                 # SPP1   盲検（未解除）
  - ENSG00000148346                 # LCN2   盲検（未解除）
  - ENSG00000172724                 # CCL19  目標ラベルを定義する遺伝子（循環性）
  - ENSG00000137077                 # CCL21  同上
  - ENSG00000156234                 # CXCL13 同上

controls:
  # 筋線維芽細胞の軸の陽性対照（パイプラインが動いていることの参照。判定には使わない）
  positive:
    - ENSG00000107796  # ACTA2
    - ENSG00000149591  # TAGLN
  # 恒常発現遺伝子（中立性の検査。GAPDH は残す。plan.md §5.3）
