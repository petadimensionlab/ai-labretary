      - ENSG00000145741  # BTF3  (SYN3 にマッチ, new)
      - ENSG00000014641  # MDH1  (STEAP4 にマッチ, new)
      - ENSG00000180817  # PPA1  (STEAP4 にマッチ, new)
      - ENSG00000100142  # POLR2F  (STEAP4 にマッチ, new)
      - ENSG00000093217  # XYLB  (IL7 にマッチ, augment)
      - ENSG00000266074  # BAHCC1  (IL7 にマッチ, augment)
      - ENSG00000198466  # ZNF587  (IL7 にマッチ, augment)
      - ENSG00000254685  # FPGT  (IL7 にマッチ, augment)
      - ENSG00000110925  # CSRNP2  (IL7 にマッチ, augment)
