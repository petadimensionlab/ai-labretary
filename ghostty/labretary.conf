# Labretary 用 Ghostty 設定（labretary-ghostty.sh が --config-file で読み込む）
# 通常の ~/.config/ghostty/config に追記してもよい

font-size = 13
window-padding-x = 8
window-padding-y = 6
window-inherit-working-directory = true
confirm-close-surface = false
shell-integration = detect
scrollback-limit = 20000000
unfocused-split-opacity = 0.85
# theme = Catppuccin Mocha        # 好みで

# 分割の keybind（--splits モードはこれを前提にしている）
keybind = super+d=new_split:right
keybind = super+shift+d=new_split:down
keybind = super+left_bracket=goto_split:previous
keybind = super+right_bracket=goto_split:next
keybind = super+shift+enter=toggle_split_zoom
keybind = super+ctrl+equal=equalize_splits
# Linux 向け（super を ctrl+shift に）
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+s=new_split:down
