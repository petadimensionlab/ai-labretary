t al., *Immunity* 2022. PMID 35231421, DOI 10.1016/j.immuni.2022.02.001。GEO **GSE175540**（Homo sapiens、24 samples、E-utilities で PMID 35231421 に紐付くことを確認）\n- ファイル: GSE175540_RAW.tar 1,122,877,440 byte。サンプルごとに `*_filtered_feature_bc_matrix.h5`（約 17〜40 MB）、`*_TLS_annotation.csv.gz`、画像、`tissue_positions_list`。別途 bulk RNA-seq TPM（10 MB）\n  - https://ftp.ncbi.nlm.nih.gov/geo/series/GSE175nnn/GSE175540/suppl/\n  - コード: https://github.com/maximemeylan/Meylan_et_al_2022\n- 論文記載: FFPE 12 + 凍結 12 の ccRCC 切片（GEO の件数 24 と一致）\n- 定義できる状態: **スポット単位の TLS / 非 TLS**、TLS+ / TLS− 腫瘍。Visium スポットは多細胞の混合なので Geneformer の単一細胞仮定に合わない → TLS シグネチャーの抽出と検証に使い、perturbation の主対象にはしない\n- Geneformer 準備度: 10x h5（生カウント、gene_ids 列に Ensembl ID があるのが通例。ファイル未開封のため未確認）\n- 優先度 B（TLS の「goal 状態」遺伝子セットを定義する根拠データとして重要）\n\n### B5. Yoshikawa 2023 JASN — 高齢マウス IRI 後の TLT 腎 snRNA\n- Yoshikawa T et al., *J Am Soc Nephrol* 2023, \"Tertiary Lymphoid Tissues Are Microenvironments with Intensive Interactions between Immune Cells and Proinflammatory Parenchymal Cells in Aged Kidneys.\" PMID 37548710, DOI 10.1681/ASN.0000000000000202（柳田研）\n- アクセッション: raw FASTQ DRA015783、Cell Ranger の raw/filtered 行列は **DDBJ GEA E-GEAD-595**（ディレクトリで確認: `E-GEAD-595.processed.zip` 907 MB, 2023-08-04）\n  - https://ddbj.nig.ac.jp/public/ddbj_database/gea/experiment/E-GEAD-000/E-GEAD-595/E-GEAD-595.processed.zip\n- デザイン（本文）: 12 か月齢の雄 C57BL/6J。片側 IRI 30 日後 3 匹（TLT+）、sham 1 匹。10x 3' v3/v3.1。sham 7,485 nuclei、IRI 統合 15,968 nuclei\n- 所見: TLT 内の炎症性線維芽細胞と TLT 外の線維化線維芽細胞を区別。NF-κB/IFN 活性化を伴う Vcam1+ 障害 PT が TLT 周囲に局在\n- 状態定義: aged-injured（TLT+）vs aged-sham。**若齢対照はない**。sham が n=1 のため統計は弱い\n- Geneformer: マウスなので、ヒトオルソログへの変換（1:1 対応のみ）またはマウス Geneformer が必要。ゲノムは mm10 と推定（本文の他解析の記載から。行列の gene ID は未確認）\n- 優先度 B（生物学的な関連は最も直接的。種の問題で B とした）\n\n### B6. Tabula Muris Senis — Kidney（加齢）\n- Tabula Muris Consortium, *Nature* 2020. PMID 32669714, DOI 10.1038/s41586-020-2496-1\n- droplet: b8c618e5-4b3d-4566-8a3f-7e40047f5c54, 21,647 cells, 10x 3' v2, 0.34 GB — https://datasets.cellxgene.cziscience.com/cfd31d35-ceb2-4990-b0b5-3434ecbb7967.h5ad\n- FACS/Smart-seq2: 524179b0-b406-4723-9c46-293ffa77ca81, 1,833 cells, 0.03 GB — https://datasets.cellxgene.cziscience.com/7769f88b-96e2-46e8-a2b2-2b7282804da7.h5ad\n- 年齢: 1 か月、3 か月、18 か月、20 か月以上。障害モデルなし（自然加齢による TLT の有無は不明）\n- 優先度 B（マウスの加齢軸の参照）\n\n### B7. Chen 2025 Nat Genet — マウス腎の生涯 multiome\n- Chen S et al., *Nat Genet* 2025. PMID 40259083, DOI 10.1038/s41588-025-02161-x。dataset 25818bf7-e2a7-41ec-8ff2-bc369c0ff4f5, 203,139 nuclei, 1.56 GB, 32 mice, 胎生〜21 か月, plasma cell/T/cDC — https://datasets.cellxgene.cziscience.com/29eec938-c857-4dc0-a3c1-db864bdea6dd.h5ad\n- 優先度 B（加齢・性差の軸）\n\n### B8. Wilson 2022 Nat Commun — DKD snRNA\n- Wilson PC, Muto Y et al., *Nat Commun* 2022. PMID 36068241, DOI 10.1038/s41467-022-32972-z。dataset e067e5ca-e53e-485f-aa8e-efd5435229c8, 39,176 nuclei（primary 20,215）, 403,168,674 byte — https://datasets.cellxgene.cziscience.com/473d2e1c-a579-4682-96aa-b5b166d7b23e.h5ad\n- T2DM vs normal。API 上は B/T の細胞型ラベルなし（13 種）→ 免疫細胞は少ないと推定\n- 優先度 B（CKD 上皮の老化軸の補助）\n\n### B9–B11. GEO（腎移植・マウス AKI）\n- **GSE145927**: Malone AF et al. 2020（PMID 32669324）、腎移植拒絶のドナー/レシピエント免疫キメリズム、17 samples、`GSE145927_RAW.tar` 247 MB ＋ metadata.csv.gz 2.1 MB。形式は CSV（カウント行列か正規化値かは未確認）。移植腎の TLO との関連を探るための候補\n- **GSE189536**: 腎移植拒絶の Physically Interacting Cells（PICseq）、PMID 37638864、32 samples、`matrix.mtx.gz` 322 MB（MTX 形式、生カウントの可能性が高いが未確認）\n- **GSE139107**: Kirita Y et al., *PNAS* 2020（PMID 32571916）、マウス IRI 時系列 snRNA（control, 4h, 12h, 2d, 14d, 6wk）、dge.txt.gz 6 ファイル計約 126 MB＋metadata。若齢マウスのみ。failed-repair PT（Vcam1+）の元の定義\n- 優先度 B\n\n### C1. Arazi 2019 Nat Immunol — ループス腎炎（AMP）\n- PMID 31209404, DOI 10.1038/s41590-019-0398-x。ImmPort SDY997、raw は **dbGaP phs001457.v1.p1（controlled）**（検索結果で確認。dbGaP ページは直接未確認）。HCA project 2d559a6e-7cd9-432f-9f6e-0e4df03b0888\n- age-associated B cell（ABC）シグネチャーの原典として重要。データは PI の承認と DAR 手続きなしには使用しない\n- 補足: Kondo M, Sato Y et al., *Kidney Int Rep* 2026（PMID 42707204）はループス腎炎の TLS が加齢・慢性障害と関連すると報告（組織学的研究で、scRNA データなし・未確認）\n\n### C2–C4. 進行 RCC（controlled または未確認）\n- **Bi K et al., Cancer Cell 2021**（PMID 33711272, DOI 10.1016/j.ccell.2021.02.015）: raw は dbGaP phs002065.v1.p1（controlled）。処理済みは Broad Single Cell Portal SCP1288（本文で確認。SCP はダウンロードに Google ログインが必要な場合がある。ライセンスは未確認）\n- **Braun DA et al., Cancer Cell 2021**（PMID 33711273, DOI 10.1016/j.ccell.2021.02.013）: 164,722 cells（抄録）。Europe PMC で全文を取得できず、**アクセッション未確認**\n- **Obradovic A et al., Cell 2021**（PMID 34019793）: 全文を取得できず、**アクセッション未確認**（GitHub Aleksobrad/single-cell-rcc-pipeline の存在のみ検索結果に出た）\n\n### C5–C7. 参照・小規模データ\n- Stewart BJ 2019 Science（PMID 31604275）成人正常腎 40,268 cells（9ea768a2, 0.19 GB）、Young MD 2018 Science（PMID 30093597）mature 40,268 cells（105c7dad, 0.23 GB）— 同一データの別掲載の可能性あり\n- McEvoy CM 2022 Nat Commun（PMID 36496458）生体ドナー腎 27,675 cells（0bae7ebf, 0.48 GB, 33〜65 歳, 19 donors）— 健常の年齢軸として有用\n- Muto 2021 Nat Commun（DOI 10.1038/s41467-021-22368-w）snRNA 19,985（9df60c57）、Tabula Sapiens Kidney 11,376 cells（2423ce2c, 0.45 GB, 61 歳 1 名）、HCA Michigan 正常腎 48,783（0b4a15a7, 0.66 GB）、mBDRC 97,125（60a29d0b, 1.41 GB, bioRxiv）\n- GEO（すべて E-utilities で存在を確認）:\n  - GSE121636（ccRCC 免疫 + PBMC, PMID 33504936, RAW 131 MB）\n  - GSE156632（ccRCC, PMID 35605062, 86 MB）\n  - GSE152938（RCC 多病型, PMID 34722263, 367 MB）\n  - GSE171306（両側性 RCC, PMID 34168986, 76 MB）\n  - GSE207493（ccRCC scRNA 1.4 GB ＋ scATAC 36 GB, PMID 36607615）\n  - GSE233236（汎癌 B 細胞統合。腎に限定されない, PMID 39047727, count.mtx 194 MB）\n  - GSE171314（IgA 腎症 5 samples, PMID 33936064, TXT 37 MB）\n  - GSE131685（正常腎 3 名, PMID 31896769, 85 MB）\n  - マウス加齢: GSE140010（若齢 3〜5 か月 vs 高齢 18 か月 IRI 間質, PMID 33951342, 11 MB。GEO 上 1 sample）、GSE262959（C57BL/6 加齢腎アトラス, BMC Nephrol 2024 PMID 38641839。suppl は `result.txt.gz` 5.1 MB のみで、生カウントかどうか不明）\n  - Sato Y 2022 JCI（CD153/CD30、PMID 34813503）の CD45+ scRNA は DDBJ DRA011230（FASTQ のみ。2,344 cells。再処理が必要）\n\n---\n\n## 2. ポジティブ/ネガティブコントロール用 遺伝子セット（文献）\n\n| セット | 遺伝子 | 用途 | 出典 |\n|---|---|---|---|\n| TLS 12-chemokine | CCL2, CCL3, CCL4, CCL5, CCL8, CCL18, CCL19, CCL21, CXCL9, CXCL10, CXCL11, CXCL13 | TLS 状態スコア／goal 定義 | Messina JL et al., Sci Rep 2012, PMID 23097687 |\n| TLS コア（リンパ組織形成） | CXCL13, CCL19, CCL21, LTB, LTA, CXCR5, CCR7, MS4A1, CD79A/B, CR2 (CD21), LAMP3 | TLS 誘導のポジコン（過剰発現/活性化） | Sautès-Fridman C et al., Nat Rev Cancer 2019, PMID 31092904；腎 TLT: Sato Y et al., JCI Insight 2016, PMID 27699223 |\n| 腎 TLT 線維芽細胞 | CXCL13, CCL19, NGFR (p75NTR), PDPN, ALDH1A2（レチノイン酸産生） | 高齢腎 TLT のストローマ状態 | Sato 2016（PMID 27699223）；Arai H et al., Immunol Rev 2021, PMID 33951198（遺伝子は総説・原著で要確認） |\n| 老化関連 T 細胞（SA-T） | TNFSF8 (CD153), TNFRSF8 (CD30), PDCD1 | TLT 拡大と老化をつなぐ軸（CD153/CD30 阻害で TLT が縮小） | Sato Y et al., J Clin Invest 2022, PMID 34813503 |\n| 加齢関連 B 細胞（ABC） | ITGAX (CD11c), TBX21 (T-bet), FCRL5, ZEB2 | LN・加齢 TLT の B 細胞状態 | Arazi A et al., Nat Immunol 2019, PMID 31209404（ITGAX/TBX21 以外は一般知見。原著の遺伝子リストは要確認） |\n| TLS 形質細胞（RCC） | IGHG1–4, IGHA1, JCHAIN, MZB1, XBP1, PRDM1 | TLS→形質細胞の分化軸 | Meylan M et al., Immunity 2022, PMID 35231421（原著の \"TLS signature\" の正確な遺伝子リストは Table で要確認） |\n| TLS 9 遺伝子（メラノーマ） | CD79B, CD1D, CCR6, LAT, SKAP1, CETP, EIF1AY, RBP5, PTGDS | 腎外の外部シグネチャーとして | Cabrita R et al., Nature 2020, PMID 31942071（遺伝子は記憶に基づく。原著で要照合） |\n| 細胞老化コア | CDKN1A (p21), CDKN2A (p16INK4a), TP53, LMNB1（低下）, GLB1 | 老化状態のポジコン | Gorgoulis V et al., Cell 2019, PMID 31675495 |\n| SASP | IL6, CXCL8, IL1A, IL1B, CCL2, SERPINE1, MMP1, MMP3, IGFBP3, IGFBP7, GDF15 | SASP スコア | Coppé JP et al., PLoS Biol 2008, PMID 19053174 |\n| SenMayo（125 遺伝子） | 原著 Supplementary の全リスト | 老化スコア（組織横断で検証済み） | Saul D et al., Nat Commun 2022, PMID 35974106 |\n| 腎の障害・修復不全 PT | HAVCR1, LCN2, VCAM1, CCL2, CDKN1A, SPP1 | 修復不全＝老化様上皮の start 状態 | Kirita Y et al., PNAS 2020, PMID 32571916；Lake 2023, PMID 37468583；Yoshikawa 2023, PMID 37548710 |\n| ネガティブコントロール | ハウスキーピング（ACTB, GAPDH, RPLP0, PPIA, TBP）＋ 発現量をマッチさせたランダム遺伝子（≥3 セット） | ヌル分布 | CLAUDE.md §6 の規定 |\n\n---\n\n## 3. 未確認事項・ギャップ\n\n1. **ヒトの単一細胞データに TLS+/TLS− のラベルが付いたものは見つからなかった。** ヒト腎で TLS を直接アノテーションしたデータは、Meylan 2022 の Visium（空間、RCC）だけ確認できた。単一細胞で TLS 状態を定義するには、(a) Visium の TLS スポットから遺伝子シグネチャーを作って sc データに移す、(b) 腫瘍/サンプル単位で CXCL13/CCL19/B 細胞比率から TLS-high/low を推定する、のどちらかが必要（いずれも推定であり、正解ラベルではない）。\n2. **腎疾患（非腫瘍）のヒト TLT scRNA** — IgAN・LN・移植腎で TLT をアノテーションした公開 scRNA は確認できなかった。AJP 2024 の論文（\"Single-Cell Analysis ... TLS ... Kidney Injury and CKD\"）は 403 エラーで本文を確認できず（公開データの再解析と推定）。\n3. CELLxGENE の h5ad の **obs 列名**（例: KPMP の condition/region/年齢区分、Li R の腫瘍領域）は開かないと分からず、未確認。`n_counts` は含まれないため計算が必要。Ensembl ID の版（CELLxGENE スキーマ 7 系の GENCODE）と Geneformer V2 のトークン辞書の対応率は未確認。\n4. CELLxGENE の CC BY 4.0 はポータルのポリシーに基づく記載で、データセット個別のライセンス表示は API から取得していない。\n5. Braun 2021・Obradovic 2021 のアクセッションは未確認。Bi 2021 SCP1288 のダウンロード条件は未確認。LN（Arazi）と RCC（Bi）の raw は controlled。\n6. GSE145927／GSE189536／GSE262959 は行列の形式（生カウントか）、細胞数、ラベルが未確認。\n7. マウスの TLT データ（E-GEAD-595, DRA011230）は小規模（n=1〜3）で、若齢対照がない。KPMP マウス v2.0（2〜20 か月、AKI）に「高齢×AKI」の組合せが含まれるかは未確認（年齢と疾患のクロス集計は h5ad を見ないと分からない）。\n8. KPMP v2.0 は査読前（bioRxiv 2025）。\n9. 空間データは今回、Li R 2022 と Meylan 2022 の Visium と Marshall 2022 Slide-seqV2（CELLxGENE 8e880741、正常腎と DKD マウス）だけ確認した。KPMP の空間データ（Visium/CODEX）は未調査。\n\n## 4. 推奨する次のアクション\n1. PI 承認後、A1〜A6（約 8.2 GB）を `data/raw/` にダウンロード（別途 PI の許可が必要）。まず A5（0.29 GB）で Geneformer のトークン化 smoke テストを行う\n2. B4（Meylan Visium, 1.1 GB）から TLS スポットのシグネチャーを抽出し、goal 状態の定義に使う\n3. KPMP v2.0 はサブサンプリング計画（例: 免疫＋PT で 1 万細胞/条件以下）を立て、G2 承認を得る\n4. マウス TLT（B5）はオルソログ変換の方針を決めてから使う\n"}, {"id": "outputs-literature-2026-09-25-tls-feasibility-feasibility-md", "label": "状態を作れるかの確認", "path": "outputs/literature/2026-09-25-tls-feasibility/feasibility.md", "kind": "md", "bytes": 13059, "body": "# 腎 TLS × 細胞老化 — Geneformer ISP の実現可能性評価（実データ）\n\n- 作成: 2026-09-26（hypothesis-builder / Labretary）。対象: `data/raw/kidney_tls/` の A1〜A6（**読み取り専用**。raw.X の整数カウントを h5py でチャンク読みし、元ファイルは変更していない）\n- スクリプト: `scripts/analysis/tls_feasibility.py`（サンプル単位・状態単位の集計）、`scripts/analysis/tls_feasibility_extra.py`（推定サブセット・仮説用の細胞数）\n- 出力 CSV（このディレクトリ）: `donor_<DS>.csv`, `states_<DS>.csv`, `assoc_summary.csv`, `special_cells.csv`, `donor_assoc_extra.csv`, `start_state_genes.csv`, `cxcl13_source.csv`, `tumour_cd8_cxcl13.csv`, `hyp_state_counts.csv`, `token_dict.csv`\n- **注意: ここで出てくる「TLS-high / TLS-low」はすべて推定ラベルです。** 組織学的な TLS の有無はどのデータにも付いていません（カタログ §3-1）\n\n---\n\n## 0. 結論（先に）\n\n1. **腎疾患（A1/A2/A6）では、サンプル単位の TLS スコア（推定）を定義でき、疾患・障害 PT 比率と関連した。** TLS スコアは B＋形質細胞比率と強く相関した（Spearman ρ = 0.75 / 0.80 / 0.81、n = 75 / 77 / 12 donor）。CKD・AKI は normal より高かった（A1: Kruskal p = 3.6×10⁻⁴、A2: p = 9.9×10⁻⁵、A6: 閉塞腎と正常の Mann-Whitney p = 0.0025）。\n2. **年齢との関連は弱く、疾患で交絡している。** A1 では疾患で調整した OLS の年齢係数 = +0.012 /年（p = 0.019）、normal だけに絞ると ρ = 0.66（n = 23、p = 6.8×10⁻⁴）。一方 A2（調整後 p = 0.22）と A6（p = 0.89）では再現しなかった。したがって「加齢で TLS が増える」は **示唆にとどまる**（A1 の 1 データセットのみ）。\n3. **障害 PT（aPT / PT Injured）の比率は TLS スコアと相関した**（A1 ρ = 0.54、n = 75、p < 10⁻⁵ / A2 ρ = 0.43、n = 74、p = 1×10⁻⁴ / A6 ρ = 0.84、n = 12、p = 6×10⁻⁴）。ただし疾患の交絡を除いていない。\n4. **ISP の state として使える細胞数が確保できるのは、aPT（A2: CKD 内で TLS-high 7,533 細胞 / 14 donor、TLS-low 4,002 / 8 donor）、CCL19/CCL21/CXCL13 陽性の線維芽細胞（A1: 777 細胞 / 65 donor、推定ラベル）、ccRCC の B 細胞→形質細胞（A3: 腫瘍＋境界部で活性化 B 1,498、IgG 形質細胞 283）である。**\n5. **老化関連 T 細胞（SA-T 様、TNFSF8⁺PDCD1⁺ T）と加齢関連 B 細胞（ABC 様、ITGAX⁺ かつ TBX21⁺ または FCRL5⁺ の B）は非腫瘍データにほとんどいない**（SA-T 様: A1 14、A2 68、A6 1 細胞 / ABC 様: A1 6、A2 23、A6 19 細胞）。→ **これらは ISP の state にはできない。** 摂動する遺伝子プログラムとしてのみ使う。\n6. **ccRCC では、CXCL13 のほとんどが CD8 T 細胞から出ている**（A3: CXCL13 カウントの 72.5% が CD8⁺T_RM-CXCL13 / A4: 74% が exhausted＋proliferating CD8 / A5: 75% が CD8 T）。→ 腫瘍の pseudo-bulk TLS スコアは、TLS より **CD8 T の疲弊状態を反映している可能性が高い**。腫瘍内の B＋形質細胞は少なく（リンパ球の 0.3〜4.5%）、CXCL13⁺ CD8 比率との相関は有意でなかった（A3: ρ = 0.31、n = 11 腫瘍 / 11 donor、p = 0.36）。\n7. **老化マーカーの検出率が低い。** CDKN2A（p16）は PT 系で 1% 未満（A1 aPT 0.3%、A2 aPT 0.6%）で、delete 摂動の対象にはできない。CDKN1A（p21）は A2 aPT で 7.8%（PT-S1/S2 は 3.8%）。SenMayo は検証済みの遺伝子リストが手元にないため**使っていない**（CDKN1A/CDKN2A と SASP 10 遺伝子で代用）。\n8. **Geneformer トークン辞書**: 解析した 76 遺伝子のうち、辞書にないのは IGHG1 と IGHA1 だけだった（Ig 定常領域は辞書に入っていない）。CXCL13, CCL19, CCL21, LTB, LTA, CXCR5, CCR7, MS4A1, CDKN1A, CDKN2A, VCAM1, HAVCR1, TNFSF8, PDCD1, ITGAX, TBX21, PRDM1, XBP1, LTBR, RELB, NFKB2, ハウスキーピング 5 遺伝子はすべて収載されていた。A4 は var が 15,934 遺伝子しかなく、CCL3/4/5/18、RPLP0、IGHG1 が欠けている。\n\n---\n\n## 1. 方法（要点）\n\n- **B / 形質細胞**: CELLxGENE の `cell_type`（A3 は著者の `broad_type`）で判定した。リンパ球 = T・NK・B・形質細胞・ILC・MAIT\n- **pseudo-bulk CPM**: サンプル内の対象遺伝子カウントの合計 ÷ 全カウントの合計 × 10⁶（raw.X から計算）\n- **TLS スコア（推定）**: CXCL13, CCL19, CCL21, LTB, LTA, CXCR5, CCR7, MS4A1 の log1p(CPM) をそれぞれ z 化し、その平均をとった。z 化の基準は腎組織サンプルだけ（A3 の血液・脂肪・副腎・転移・血栓、A4 の PBMC・リンパ節は基準から外した）。**細胞組成に強く依存する指標**である（CCR7/LTB は naive T にも多く、CXCL13 は腫瘍では CD8 T 由来）\n- **TLS 群**: 基準サンプルのうち 300 細胞以上のものを三分位に分けた（high / mid / low）。サンプル単位は、A1/A2/A6 が donor、A3 が donor × 部位、A4 が部位（author_sample、6 donor）、A5 が donor × 腫瘍/正常\n- **老化スコア**: 細胞ごとの log1p(CP10k) で、sen = mean(CDKN1A, CDKN2A)、SASP = 10 遺伝子（IL6, CXCL8, IL1A, IL1B, SERPINE1, MMP1, MMP3, IGFBP3, IGFBP7, GDF15; Coppé 2008 PMID 19053174）の平均\n- 統計: Spearman、Mann-Whitney、Kruskal、腫瘍 vs 正常の donor 内対応 Wilcoxon、OLS（TLS ~ 年齢 + 疾患）。多重比較の補正はしていない（探索的）\n\n## 2. サンプル単位の結果（`assoc_summary.csv`, `donor_*.csv`）\n\n| DS | 基準サンプル数（donor） | B+PL / 全細胞 中央値 [IQR] | TLS vs B+PL 比率 ρ | 疾患/部位との関連 | TLS vs 年齢 |\n|---|---|---|---|---|---|\n| A1 KPMP sn | 75 (75) | 0.19% [0.08–1.06] | 0.75 (p = 9×10⁻¹⁵) | normal −0.45 < CKD −0.12 < AKI 0.03（中央値, Kruskal p = 3.6×10⁻⁴） | ρ = 0.33 (p = 0.004)。疾患で調整した β = +0.012/年 (p = 0.019)。normal のみ ρ = 0.66 (n = 23) |\n| A2 KPMP sc | 77 (77) | 1.04% [0.17–2.52] | 0.80 (p = 4×10⁻¹⁸) | normal −0.66 < CKD 0.18 < AKI 0.45（p = 9.9×10⁻⁵） | ρ = 0.25 (p = 0.027)。調整後 p = 0.22。normal のみ ρ = 0.32 (n = 26, p = 0.11) |\n| A6 UUO sn | 12 (12) | 1.10% [0.38–4.33] | 0.81 (p = 0.0014) | 閉塞腎 0.46 vs 正常 −0.43（p = 0.0025） | 有意な関連なし（60〜84 歳のみ） |\n| A3 Li RCC | 25 (11) | 1.54% | 0.59 (p = 0.0017) | 腫瘍と正常の donor 内比較で 8/9 donor が腫瘍 > 正常（Wilcoxon p = 0.012）。独立群の比較では有意差なし | ρ = −0.58（donor 内の複数サンプルによる擬似反復があり、解釈しない） |\n| A4 Krishna | 24 (6) | 0.86% | 0.43 (p = 0.037) | 腫瘍と正常に差なし（p = 0.77） | n = 6 donor で評価不能 |\n| A5 Zhang | 12 (8) | 0.37% | 0.69 (p = 0.012) | 腫瘍と正常に差なし（p = 0.27）。対応あり 3/4 donor | n が小さい |\n\n**TLS 群と疾患のクロス表（交絡の大きさ）**\n- A2 TLS-high 26 donor: AKI 8、CKD 14、normal 4 / TLS-low 26 donor: AKI 1、CKD 8、normal 17\n- A1 TLS-high: AKI 8、CKD 14、normal 3 / TLS-low: AKI 2、CKD 8、normal 15\n- A6: TLS-high 4 donor はすべて閉塞腎、TLS-low 4 donor はすべて正常 → **A6 では TLS 群と疾患を分離できない**\n- → 仮説では **CKD donor の中だけで TLS-high と TLS-low を比べる**（A2 CKD: high 14 donor、low 8 donor）\n\n## 3. 細胞状態ごとの細胞数と老化スコア（`states_*.csv`, `special_cells.csv`, `hyp_state_counts.csv`）\n\n### 3.1 障害 PT（start 候補）と健常 PT（goal 候補）\n| DS | 状態 | 細胞数 | TLS-high / TLS-low | CDKN1A⁺ | CDKN2A⁺ | VCAM1⁺ | sen（平均 ± SD） | SASP（平均 ± SD） | 中央値遺伝子数 |\n|---|---|---|---|---|---|---|---|---|---|\n| A2 | aPT | 29,397 | 12,274 / 6,185 | 7.8% | 0.6% | 60.7% | 0.047 ± 0.176 | 0.283 | 1,660 |\n| A2 | dPT | 6,721 | 3,132 / 1,274 | 4.6% | 0.1% | 15.7% | 0.032 ± 0.162 | 0.092 | 926 |\n| A2 | PT-S1/S2 | 13,019 | 2,377 / 5,941 | 3.8% | 0.0% | 9.4% | 0.025 ± 0.134 | 0.085 | 988 |\n| A1 | aPT | 28,396 | 13,827 / 6,204 | 4.7% | 0.3% | 35.7% | 0.025 ± 0.123 | 0.184 | 2,524 |\n| A1 | PT-S1 | 13,126 | 4,732 / 5,546 | 1.6% | 0.1% | 8.7% | 0.011 ± 0.095 | 0.105 | 1,390 |\n| A6 | PT Injured | 2,019 | 1,180 / 128 | 2.2% | 0% | 29.6% | 0.020 ± 0.136 | 0.122 | 1,312 |\n| A6 | PT Inflammatory | 613 | 460 / 22 | 4.2% | 0% | 37.0% | 0.040 ± 0.192 | 0.179 | 1,341 |\n| A6 | PT S1 | 1,815 | 98 / 297 | 1.4% | 0% | 2.7% | 0.012 ± 0.102 | 0.070 | 1,263 |\n\n- **A2 CKD donor に限った場合**: aPT は TLS-high 7,533（14 donor）、TLS-low 4,002（8 donor）。健常 PT（PT-S1/S2＋S3、normal donor）は 6,149\n- A2 aPT の中で TLS-high と TLS-low の donor（22 対 22）の検出率を比べると、TLS-high で高かったのは SPP1（79% vs 45%, p < 0.001）、LCN2（9.6% vs 1.5%, p < 0.001）、HAVCR1（14% vs 7%, p = 0.007）、TP53（16% vs 12%, p = 0.022）、CXCL8（p = 0.004）だった。CDKN1A は差がなく（9.9% vs 11.7%, p = 0.43）、NFKB2 は TLS-high でむしろ低かった（12% vs 17%, p = 0.02）。IL7R・LTB・CCL19 の陽性率も TLS-high で高いが、周囲の免疫細胞からの ambient RNA の可能性がある（`start_state_genes.csv`）\n\n### 3.2 線維芽細胞\n- A1 の線維芽細胞系（FIB, aFIB, dFIB, M-FIB, dM-FIB, MYOF, cycMYOF）は 21,769 細胞。**CCL19, CCL21, CXCL13 のいずれかが 1 カウント以上**ある細胞（推定の「TLS オーガナイザー様」）は 777 細胞（65 donor）で、TLS-high 562 / mid 141 / low 69 だった。内訳は CCL19⁺ 252、CCL21⁺ 411\n- donor ごとのオーガナイザー様比率は TLS スコアと相関した（ρ = 0.59、n = 71、p < 10⁻⁶）。ただし TLS スコア自体に CCL19/CCL21/CXCL13 が含まれるため、**一部は循環的な相関**である\n- A2 では同じ条件の細胞が 123（30 donor）、A6 では 20、A3 では 11（A3 は CCL19 の検出が全細胞で 0）、A4 では 65。→ 線維芽細胞の仮説は **A1 でしか組めない**\n- 老化: A1 FIB の CDKN1A⁺ は 1.0%、aFIB は 2.9%。snRNA なので検出率が低い。ccRCC の線維芽細胞は高く、A4 の myofibroblast で CDKN1A⁺ 65%、SASP 0.63、A3 の Stress Fibro で 72%\n\n### 3.3 B 細胞・形質細胞・T 細胞\n| DS | 状態 | 細胞数 | TLS-high / TLS-low | 備考 |\n|---|---|---|---|---|\n| A2 | B | 3,261 | 2,392 / 105 | TLS-low 側が少ない（TLS スコアの定義上、当然そうなる） |\n| A2 | PL | 1,051 | 678 / 53 | FCRL5⁺ 65% |\n| A6 | Memory B | 3,356 | 3,076 / 14 | 3,315 が閉塞腎 |\n| A3 | 活性化 B（AREG＋RHOB） | 2,017（腫瘍＋境界 1,498） | 780 / 35（腫瘍＋境界） | CDKN1A⁺ 27〜31%（naive B は 2.5%） |\n| A3 | Plasma-IgG | 786（腫瘍＋境界 283） | — | 中央値遺伝子数 417。IGHG1 は辞書にない |\n| A3 | Plasma-IgA | 563（腫瘍＋境界 253） | — | |\n| A3 | CD8⁺T_RM-CXCL13 | 2,449（腫瘍 2,059） | — | CXCL13⁺ 99%、CDKN2A⁺ 21%、TNFSF8⁺ 18% |\n| A4 | CD8A⁺ Exhausted | 17,893 | — | CXCL13⁺ 51% |\n\n- SA-T 様・ABC 様の細胞数は §0-5 のとおり。ccRCC には SA-T 様が A3 で 4,646、A4 で 2,056 細胞あるが、腫瘍内の PDCD1 は疲弊マーカーでもあるため、**老化 T 細胞と同一視できない**\n\n## 4. 計算コストの見積もり方法\n- 下限: 1 forward の秒数 = 中央値遺伝子数 ÷ 7,200 tok/s（MPS bf16、batch 8、PI 周知の実測値）。1 細胞 × 1 遺伝子あたり元の入力と摂動後の 2 forward とした\n- 上限: EXP-20260925-001 の fp32 smoke（macrophage 50 細胞、1 遺伝子あたり約 40 秒）から、1 細胞 × 1 遺伝子 ≈ 0.8 秒\n- delete / inhibit は**その遺伝子を発現している細胞にしか効かない**（Geneformer は発現していない細胞を飛ばす）。発現率の低い遺伝子（CDKN1A 7.8% など）は、発現細胞を濃縮して抽出する必要がある\n- どの仮説でも、まず smoke（10 細胞 × 3 遺伝子）で bf16 の実測値を取ってから本実行する\n\n## 5. できないこと・限界\n- TLS 状態は推定。組織学（Meylan 2022 Visium, B4）による検証はまだ。TLS スコアは組成指標であり、TLS 構造（B 濾胞・HEV・FDC）の有無は判定できない\n- A1/A2 は `is_primary_data = False`（KPMP の別版と細胞が重複する）。KPMP v2.0 と混ぜてはいけない\n- A3/A4 は 10x 5'、A5 は 3' v2、A1/A6 は snRNA。Geneformer の事前学習の分布とずれている\n- donor 数: A6 12、A3 11、A4 6、A5 8。ccRCC で TLS-high と TLS-low を比べる統計的な検出力は低い\n- 多重比較は補正していない。これらの数値は**仮説を作るための探索的な記述**である\n"}, {"id": "outputs-literature-2026-09-26-negative-controls-md", "label": "陰性対照の候補", "path": "outputs/literature/2026-09-26-negative-controls.md", "kind": "md", "bytes": 28999, "body": "# 陰性対照（ネガティブコントロール）遺伝子の候補と事前登録用の選定規則\n\n- 作成: Labretary（literature-scout と解析を兼任）/ 2026-09-26\n- 対象: EXP-20260926-002（削除ドリフト補正指標 a2 の方法検証）の本番 run（option A）の前に事前登録する\n- PI 指示（2026-09-26）: HK（ACTB/GAPDH/PPIA）は合否判定に残す。そのうえで、リボソームタンパク質遺伝子など他の陰性対照候補を探して列挙し、妥当性を評価する。候補リストは事前に固定できるが、判定に使えるかどうかは試してみないと分からない\n- **循環を避けるための制約**: 候補の選定には ISP / perturbation の結果を一切使っていない。使ったのは文献と発現データだけである。解析スクリプトは ISP の出力を読まない。HK の ISP 上の振る舞い（EXP-002 plan §6.3）を参照するのは、§4 で HK の発現差を解釈する箇所だけで、選定には使っていない\n- 成果物:\n  - スクリプト: `scripts/analysis/negctrl_candidates.py`（CPU のみ、約 7 秒）\n  - 候補表: `outputs/literature/2026-09-26-negative-controls/candidates.csv`\n  - 推奨パネル: `panel.csv`\n  - 全遺伝子の統計: `genome_stats.csv`（辞書に収載され、start か goal で検出率 1% 以上の 12,510 遺伝子）\n  - 規則と要約: `rule.json`\n\n## 0. 結論（要約）\n1. **GAPDH・PPIA・ACTB は、いずれも start（aPT_CKD_TLShigh）と goal（PT_healthy）の間で発現が異なる**（donor pseudo-bulk、Welch 検定、start 13 donor vs goal 21 donor）。\n   - GAPDH は start で低い: log2FC −0.98、q < 0.001、検出率 0.80 vs 0.96。\n   - ACTB は start で高い: +0.78、q < 0.001。\n   - PPIA は start で高い: +0.35、q = 0.017。\n   - ただし、発現頻度が同じ遺伝子の期待値を差し引くと、PPIA の発現差は消える（+0.02、同等性 TOST p = 0.04）。残るのは Geneformer 入力内の順位のずれだけである（相対順位 −0.058）。\n   - **発現差の大きさ・向きは、ISP での HK の振る舞い（GAPDH/PPIA は null 上位、ACTB は null 内）を単純には説明しない**（§4）。\n2. **リボソームタンパク質（RP）遺伝子は、今回の系では陰性対照の本命にならない。**\n   - 発現頻度で補正した点推定は 0 に近いものが多い。しかし donor 間のばらつき（CV 0.23〜0.38）のため、±0.25 log2 の同等性を示せた RP 遺伝子はない（候補中の RP 17 遺伝子、TOST p ≥ 0.07）。\n   - 高頻度の非 RP 遺伝子と比べると、start で約 0.28 log2 高い。\n   - Geneformer の中央値スケーリングで、RP は入力の**末尾付近**（相対順位 0.66〜0.96）に置かれる。\n   - 以上から、合否判定ではなく**探索枠（2 遺伝子）**として回すことを提案する。\n3. **事前登録用の選定規則（R1〜R6）**を全遺伝子に適用した。条件を満たしたのは 4,210 適格遺伝子中 71 遺伝子。\n   - **文献由来の候補 57 遺伝子（7 カテゴリ: 現行 HK 3、古典 HK 13、Eisenberg の均一 11、腎 HK 10 など）は 1 つも規則を満たさなかった。**\n   - 推奨パネルはデータ駆動の 7 遺伝子: CERS4, TATDN1, IFT25, VAPA, PHPT1, ANAPC16, EEF1D（start 検出 18〜74%）。\n   - 探索枠は RP 2 遺伝子: RPS13, RPL32。\n4. 合否基準への組み込み（提案）:\n   - 現行の **C3-HK は PI の指示どおり維持**する。\n   - 新たに **C3-panel** を加える: パネル 7 遺伝子のうち **5 以上**が、null 分位 0.10〜0.90 に 3 seed 中 2 以上で入ること。\n   - 参考として誤判定率を試算した。理想的な陰性対照 3 遺伝子が「全部合格」する確率は 0.51〜0.72 しかない（§6.3）。\n\n## 1. 文献・データベース（PMID/DOI は NCBI E-utilities で照合済み）\n\n| 資料 | 「安定」の操作的定義 | 組織・データ | 本系への含意・注意 |\n|---|---|---|---|\n| Eisenberg E, Levanon EY. Human housekeeping genes, revisited. *Trends Genet* 2013;29:569–74. PMID 23810203, doi:10.1016/j.tig.2013.05.010（正誤表 2014 あり、内容は未確認） | 全組織で均一に発現する RefSeq 変異体を 1 つ以上持つ（Human BodyMap 2.0 RNA-seq）。3,804 遺伝子。うち 11 遺伝子が「特に均一」（C1orf43, CHMP2A, EMC7, GPI, PSMB2, PSMB4, RAB7A, REEP5, SNRPD3, VCP, VPS29） | bulk、正常 16 組織（腎を含むとされるが二次情報）。疾患・傷害はない | **GAPDH, ACTB, PPIA, RPLP0, B2M, HPRT1, TBP, YWHAZ はリストに入っていない**（ファイル https://www.tau.ac.il/~elieis/HKG/ で確認）。RPL/RPS は 26 遺伝子を含む |\n| Hounkpe BW et al. HRT Atlas v1.0. *Nucleic Acids Res* 2021;49:D947–55. PMID 32663312, doi:10.1093/nar/gkaa609 | 転写産物単位で次をすべて満たす: 全組織で RPKM > 1、log2 RPKM の SD < 1、最大 fold change < 2（52 の非疾患組織・細胞、11,281 サンプル）。2,176 遺伝子 | bulk（GTEx 系）。腎が含まれるかは未確認 | GAPDH, B2M, HPRT, アクチン類を「再現性を損なってきた古典的な参照遺伝子」と位置づけている。PBMC の例では EIF2S3 と SF3B1 が ACTB/B2M/GAPDH/PPIA より安定だった。組織ごとの選定を勧めている |\n| Lin Y et al. Evaluating stably expressed genes in single cells. *GigaScience* 2019;8:giz106. PMID 31531674, doi:10.1093/gigascience/giz106 | gamma-Gaussian 混合モデルによる安定性指数（ゼロの割合、混合比、分散、平均、細胞クラス間の F 統計量を合成）。scMerge::scSEGIndex で実装 | **単一細胞**。ヒト・マウスの初期胚と Mouse Cell Atlas。**ヒト腎・傷害データはない** | **GAPDH と ACTB は単一細胞で二峰性**を示し、scRNA-seq の HK として不適と述べている。RPL26, RPL36 など多くの RP は単峰性の SEG。HINT1 は bulk では HK だが SEG ではない。上位リストは本文に見つからず、未確認 |\n| Strauss P et al. Variable expression of eighteen common housekeeping genes in human non-cancerous kidney biopsies. *PLoS One* 2021;16:e0259373. PMID 34882702, doi:10.1371/journal.pone.0259373 | 対照と疾患の間で差次的発現がないこと（30 データセット、800 例超） | ヒト腎生検（bulk とマイクロダイセクション。高血圧性・糖尿病性腎症、FSGS、IgAN など CKD） | **全データで安定だったのは YWHAZ だけ**。GAPDH, ACTB, PPIA, TBP, B2M, RPS13, RPL13 は 2 データ以上で差次的発現を示した（平均 4.5 データ） |\n| Herath S et al. *PLoS One* 2020;15:e0233109. PMID 32437461, doi:10.1371/journal.pone.0233109 | 虚血・腎毒性モデルにおける参照遺伝子の安定性 | ラット腎 | PABPN1×ACTB の組み合わせが最も安定。**GAPDH と 18S が最も不安定**で、KIM-1 などの傷害遺伝子の定量を歪めた |\n| Muñoz JJ et al. *Sci Rep* 2021;11:19798. PMID 34611276, doi:10.1038/s41598-021-99366-x | qPCR 参照遺伝子の安定性 | Pkd1 欠損マウス腎（嚢胞性で、虚血ではない） | Ppia が最も安定、Gapdh が最も不安定 |\n| Guimaraes JC, Zavolan M. *Genome Biol* 2016;17:236. PMID 27884178, doi:10.1186/s13059-016-1104-z | — | 組織・がんの RP 発現 | ヒト RP の約 4 分の 1 が組織特異的な発現を示す |\n| Gupta V, Warner JR. *RNA* 2014;20:1004–13. PMID 24860015, doi:10.1261/rna.043653.113 | — | ヒト組織 | 偽遺伝子を補正すると、RP mRNA の 80〜90% は組織間の差が 3 倍未満。パラログは組織特異的 |\n| Deeke JM, Gagnon-Bartsch JA. *J Bioinform Comput Biol* 2020;18:2040004. PMID 32336251, doi:10.1142/S0219720020400041 | scRNA-seq の SEG | 単一細胞 | 細胞質リボソーム遺伝子は**総 RNA 量に対して**安定である。これはライブラリサイズ正規化で消える量と同じなので、「変化なし」の番兵としては弱い |\n| Lessard F et al. *Nat Cell Biol* 2018;20:789–99. PMID 29941930, doi:10.1038/s41556-018-0127-y（照合はタイトルのみ） | — | 細胞老化 | 老化でリボソーム生合成に異常が起きる。aPT（failed repair）は老化様の状態である |\n| Lan R et al. *JASN* 2016;27:3356–67. PMID 27000065, doi:10.1681/ASN.2015020177 / Kang HM et al. *Nat Med* 2015;21:37–46. PMID 25419705, doi:10.1038/nm.3762 | — | 虚血後の PT（マウス）/ 線維化腎（ヒト） | 傷害後の PT で解糖系へのシフト（Lan）、脂肪酸酸化の低下（Kang）。**GAPDH など解糖系遺伝子は、傷害 PT と健常 PT の比較では中立でない** |\n| Leong KG et al. *Int J Mol Sci* 2020;21:3667. PMID 32455976, doi:10.3390/ijms21103667 | — | マウス AKI | シクロフィリン A（PPIA）は DAMP として AKI の炎症を促進する。**PPIA は不活性な対照ではない** |\n| Lake BB et al. *Nature* 2023;619:585–94. PMID 37468583, doi:10.1038/s41586-023-05769-3 | — | 本データ（KPMP） | aPT は VCAM1/HAVCR1/DCDC2 陽性で、輸送体が低下している。degenerative 状態では SPP1/CST3/CLU/IGFBP7 と FOS/JUN が上昇する（除外リストの根拠） |\n\n- 文献から言えること: 「どの組織でも安定な遺伝子」は、傷害 PT と健常 PT の比較で安定であることを保証しない。scRNA-seq でも腎傷害でも、GAPDH は最も一貫して不適とされている。\n- 単一細胞の傷害 PT で安定性を検証した文献は見つからなかった。**候補の妥当性は本データで確かめるしかない**。\n\n## 2. 解析方法（`scripts/analysis/negctrl_candidates.py`）\n\n### 2.1 データ\n- `experiments/EXP-20260926-001/work/input.h5ad`（生カウント、`n_counts` = 行和を確認）\n- start 7,533 細胞（14 donor。20 細胞以上の donor は 13）、goal 6,149 細胞（22 donor、同 21）、alt 4,002 細胞（8 donor、同 7）\n- **start と goal に共通の donor はない**（状態と donor・疾患が完全に交絡している）\n\n### 2.2 計算した統計量（遺伝子ごと）\n- **検出率、CP10k 平均**（状態別）\n- **donor pseudo-bulk の log2(CPM+1)**: 20 細胞以上の donor だけを使う。これで次を計算した:\n  - donor 平均の差（log2FC、start vs goal と start vs alt）\n  - Welch 検定と BH 補正の q 値\n  - ±0.25 log2 の同等性 TOST\n  - donor 間 CV\n- **Geneformer 入力内の順位**: tokenizer と同じ手順で計算した（count / n_counts × 10⁴ / 遺伝子中央値 → 降順、先頭 4,094）。\n  - 相対順位 relrank: 0 が先頭、1 が末尾。発現している細胞での平均。\n  - 絶対順位、先頭 10 位以内に入る割合、tokenized 検出細胞数\n- **発現頻度での中心化（`_c`）**:\n  - null は start の発現細胞数でマッチさせて抽出する。そのため陰性対照も「同じ頻度の遺伝子と比べて」中立であればよい、と考えた。\n  - null 抽出プール（start で 300 細胞以上、除外リスト外）を検出細胞数で並べ、近い 201 遺伝子の移動中央値を期待値として差し引いた。\n  - 背景: start は UMI 中央値 3,405 vs 2,819 と深く、トークン数の中央値も 1,353 vs 1,020 と多い。そのため**生の log2FC は全体が正にずれる**（適格遺伝子の中央値 +0.60）。\n  - 期待値の例（start 検出細胞数 1,000 / 3,000 / 6,000）:\n    - log2FC: +0.79 / +0.55 / +0.33\n    - relrank 差: +0.024 / −0.087 / −0.130\n- Geneformer V2 の token 辞書（`token_dictionary_gc104M.pkl`）: 辞書に収載されている 18,040 遺伝子のみを対象にした。候補はすべて収載されている。\n\n## 3. 候補表（抜粋。全列は `candidates.csv`）\n\n- 列の定義\n  - det: tokenized 検出率\n  - FC: donor pseudo-bulk の log2FC（start − goal）。括弧内は頻度中心化後の値\n  - TOST: 中心化後の ±0.25 log2 同等性の p 値\n  - rr: 相対順位（start / goal）\n  - Δrr_c: 中心化後の相対順位差\n  - CV: start の donor 間 CV\n  - 規則: R1〜R6 のうち満たした数（6 = 全部）\n- n: start 13 donor、goal 21 donor\n\n| 区分 | 遺伝子 | det start / goal | FC（中心化） | q | TOST | Δdet_c | rr start / goal | Δrr_c | CV | 規則 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| HK（現行） | ACTB | 0.85 / 0.78 | +0.78（+0.45） | <0.001 | 0.97 | +0.08 | 0.89 / 0.97 | +0.056 | 0.21 | 3/6 |\n| HK（現行） | GAPDH | 0.80 / 0.96 | −0.98（−1.31） | <0.001 | 1.00 | −0.17 | 0.72 / 0.63 | +0.211 | 0.26 | 3/6 |\n| HK（現行） | PPIA | 0.85 / 0.84 | +0.35（+0.02） | 0.017 | 0.042 | +0.01 | 0.55 / 0.74 | −0.058 | 0.22 | 5/6（R4 のみ不合格） |\n| 古典 HK | B2M | 0.93 / 0.57 | +3.10（+2.74） | <0.001 | 1.00 | +0.36 | 0.90 / 1.00 | +0.032 | 0.25 | 4/6 |\n| 古典 HK | YWHAZ | 0.49 / 0.25 | +1.20（+0.97） | <0.001 | 1.00 | +0.17 | 0.72 / 0.85 | −0.029 | 0.17 | 4/6 |\n| 古典 HK | UBC | 0.71 / 0.63 | +0.25（−0.02） | 0.16 | 0.08 | +0.07 | 0.79 / 0.90 | +0.009 | 0.26 | 5/6 |\n| 古典 HK | POLR2A | 0.16 / 0.07 | +0.87（+0.06） | <0.001 | 0.09 | +0.01 | 0.50 / 0.49 | −0.001 | 0.11 | 5/6 |\n| 古典 HK | PGK1（解糖系） | 0.45 / 0.53 | −0.63（−0.87） | <0.001 | 1.00 | −0.17 | 0.62 / 0.63 | +0.087 | 0.17 | 3/6 |\n| Eisenberg 均一 | PSMB2 | 0.34 / 0.23 | +0.19（−0.20） | 0.23 | 0.37 | −0.01 | 0.53 / 0.60 | −0.013 | 0.25 | 5/6 |\n| Eisenberg 均一 | SNRPD3 | 0.36 / 0.27 | +0.09（−0.47） | 0.59 | 0.93 | −0.05 | 0.58 / 0.65 | +0.001 | 0.27 | 5/6 |\n| Eisenberg 均一 | GPI（解糖系） | 0.25 / 0.23 | −0.26（−0.93） | 0.017 | 1.00 | −0.09 | 0.58 / 0.58 | +0.021 | 0.14 | 3/6 |\n| 腎 HK（Strauss） | SLC4A1AP | 0.08 / 0.03 | +0.59（−0.35） | <0.001 | 0.80 | −0.01 | 0.30 / 0.30 | +0.004 | 0.13 | 4/6（R1: 585 細胞） |\n| 腎 HK（Strauss） | NOP10 | 0.46 / 0.48 | −0.04（−0.29） | 0.82 | 0.60 | −0.05 | 0.61 / 0.62 | −0.007 | 0.26 | 5/6 |\n| 傷害/HRT | PABPN1 | 0.41 / 0.19 | +2.06（+1.76） | <0.001 | 1.00 | +0.20 | 0.43 / 0.48 | −0.061 | 0.17 | 3/6 |\n| 傷害/HRT | EIF2S3（X 連鎖） | 0.39 / 0.34 | +0.62（+0.05） | <0.001 | 0.066 | 0.00 | 0.55 / 0.55 | −0.001 | 0.14 | 5/6 |\n| scSEG 例 | RPL26 | 0.91 / 0.92 | +0.40（+0.06） | 0.046 | 0.14 | −0.02 | 0.66 / 0.84 | −0.064 | 0.31 | 4/6 |\n| scSEG 例 | HINT1 | 0.81 / 0.84 | +0.09（−0.25） | 0.56 | 0.50 | −0.04 | 0.49 / 0.52 | −0.004 | 0.24 | 5/6 |\n| RP | RPLP0 | 0.76 / 0.72 | +0.57（+0.23） | 0.002 | 0.46 | +0.05 | 0.87 / 0.96 | +0.040 | 0.25 | 5/6 |\n| RP | RPL13A | 0.76 / 0.72 | +0.24（−0.10） | 0.072 | 0.11 | +0.06 | 0.96 / 0.98 | +0.114 | 0.23 | 4/6 |\n| RP | RPS13 | 0.88 / 0.91 | +0.40（+0.06） | 0.020 | 0.11 | −0.03 | 0.79 / 0.92 | +0.003 | 0.26 | 5/6 |\n| RP | RPL32 | 0.92 / 0.96 | +0.36（+0.01） | 0.046 | 0.07 | −0.03 | 0.79 / 0.92 | +0.002 | 0.28 | 5/6 |\n| RP | RPS6 | 0.90 / 0.90 | +0.33（−0.01） | 0.088 | 0.09 | 0.00 | 0.83 / 0.94 | +0.019 | 0.28 | 5/6 |\n| RP | RPS3 | 0.88 / 0.82 | +0.84（+0.50） | <0.001 | 0.90 | +0.07 | 0.84 / 0.97 | 0.000 | 0.33 | 3/6 |\n| 陽性対照 | VCAM1 | 0.62 / 0.06 | +5.26（+5.01） | <0.001 | 1.00 | +0.52 | 0.36 / 0.79 | −0.313 | 0.17 | — |\n| 陽性対照 | HAVCR1 | 0.09 / 0.00 | +4.25（+3.28） | <0.001 | 1.00 | +0.04 | 0.25 / 0.29 | −0.079 | 1.02 | — |\n\n- 「det start」は tokenized 検出細胞数 / 7,533。\n- 文献由来の事前候補は 7 カテゴリ・57 遺伝子（表は抜粋）。HPRT1・TBP・HMBS・TFRC・IPO8・SLC4A1AP・REL・PLA2G4A は start での発現細胞が 1,000 未満で R1 を満たさない。\n\n## 4. HK（ACTB/GAPDH/PPIA）の発現差は ISP での振る舞いを説明するか\n\n**結論: 3 遺伝子とも発現差はある。しかし発現差の大きさ・向きは、ISP での振る舞いと対応しない。**\n\n| | 発現差 | ISP（a2 補正後、EXP-002 phase 0） | 整合性 |\n|---|---|---|---|\n| GAPDH | 最も大きい。start で低い（中心化後 −1.31 log2、検出率 −0.17）。入力内の順位も start で後ろ（Δrr_c +0.21）。Lan 2016 の解糖系シフトとは向きが逆だが、Kang/Lan とも代謝の変化自体は支持する | null 上位 | 素朴な予想（goal で多い遺伝子を start から消すと goal から離れる）とは逆に、goal 側へ動く（80% の細胞）。**単純な発現模倣では説明できない** |\n| PPIA | 頻度中心化後の発現量は中立（+0.02、TOST p = 0.04）。入力内の順位は start で前寄り（Δrr_c −0.058、生の値で −0.19） | null 上位 | 「start で順位が高いものを消すと goal に近づく」とは整合する。ただし効果の大きさを説明するには弱い |\n| ACTB | start で高い（中心化後 +0.45） | null 内（0.23） | 発現差があっても null 内に収まっている |\n\n- 発現差のある遺伝子が ISP で null 外に出るとは限らない（ACTB）。逆に、発現量が中立に近くても null 外に出る（PPIA）。\n- したがって、「発現差の小ささ」で選んだパネルが ISP で null 内に入るかは**試してみないと分からない**（PI の指摘どおり）。\n- 発現データで選ぶ意義は、少なくとも「既知の状態差を持つ遺伝子を対照に入れる」という明白な欠陥を避けることにある。\n- 別の要因の候補として、入力内の位置（相対順位）がある。\n  - HK と RP は Geneformer の中央値スケーリングで**末尾付近**に置かれる（ACTB 0.89、RP 0.66〜0.96）。null 遺伝子は中位（約 0.5）、陽性対照は前寄り（0.25〜0.36）である。\n  - 削除位置が後ろほど、後続トークンのずれは小さい。これが raw 指標で HK が「ドリフトの小さい側 = null 上位」に来た一因である可能性がある（EXP-002 の a4 で扱った削除位置の交絡と同じ問題）。\n- **注意: 依頼文の「RPL/RPS は rank-value encoding の先頭付近」は、本系・V2 の中央値スケーリングでは当てはまらない。**\n  - 先頭付近にあるのは MT- 遺伝子（相対順位 0.07〜0.2）である。RP は後ろにある。\n  - 「高頻度の遺伝子ほど tokenized で先頭に来る」という前提で設計しないこと。\n\n## 5. リボソームタンパク質遺伝子の判定\n- **合否判定には使わず、探索枠にとどめる。**\n- 根拠:\n  1. 生の比較では、事前候補 14 RP 遺伝子のうち 8 つが start で有意に高い（q < 0.05、+0.4〜+0.8 log2）。頻度中心化後の点推定は多くが 0 に近い。しかし高頻度帯（start で 5,500 細胞以上）の遺伝子の 58% が RP なので、**期待値の一部は RP 自身で決まっている**（循環）。高頻度の非 RP 遺伝子と比べると、RP は start で +0.28 log2 高い（中央値 0.39 vs 0.11）。\n  2. donor 間 CV が 0.23〜0.38 と大きい。±0.25 log2 の同等性を donor 水準で示せた RP はない（候補中の RP 17 遺伝子、TOST p 0.07〜0.91）。\n  3. 生物学的にも、リボソーム生合成は老化・傷害で変化する（Lessard 2018）。組織特異的な RP も存在する（Guimaraes 2016）。\n  4. 入力内では末尾付近にあり、陽性対照や null と削除位置の分布が重ならない。\n  5. 総 RNA に対する安定性は、正規化後の番兵としては弱い（Deeke 2020）。\n- 一方で、試す価値はある。高頻度・末尾位置の遺伝子を削除したときの振る舞いは、HK の解釈（位置効果か、状態特異的な信号か）に直結する。\n  - そこで、RP 候補のうち TOST 以外の条件をすべて満たすものから、**RPS13 と RPL32**（中心化後 FC +0.06 / +0.01、Δrr_c +0.003 / +0.002）を探索枠として回すことを提案する。\n\n## 6. 事前登録用の選定規則とパネル\n\n### 6.1 規則（`RULE` / `rule.json`。値はスクリプトに固定）\n対象は Geneformer V2 辞書に収載された遺伝子。以下をすべて満たすものを「状態中立候補」とする。\n\n| # | 条件 | 閾値 | 適格 4,210 遺伝子中の合格数 |\n|---|---|---|---|\n| R1 | 抽出可能性 | start の tokenized 検出細胞 ≥ 1,000、かつ 25 細胞以上発現している start donor ≥ 8 | 4,210（適格の定義） |\n| R2 | 発現量が同等 | 中心化後 \\|log2FC start vs goal\\| < 0.25、中心化後 \\|log2FC start vs alt\\| < 0.50、同等性 TOST（Welch、±0.25）p < 0.05 | 79 |\n| R3 | 検出率が同等 | 中心化後 \\|Δ検出率 start − goal\\| < 0.05 | 2,097 |\n| R4 | 入力内の順位が同等 | 中心化後 \\|Δ相対順位 start − goal\\| < 0.03 | 2,312 |\n| R5 | donor 間で安定 | donor CV が start・goal とも、適格遺伝子の 75% 分位以下（0.314 / 0.431） | 2,588 |\n| R6 | 既知の関連遺伝子でない | 除外リストに含まれない（スクリプトの `EXCLUDE_SYMBOLS`/`EXCLUDE_PREFIX`） | 4,121 |\n| 全部 | | | **71**（中心化しない生の判定では 24） |\n\n- R6 の除外リストの内訳:\n  - 陽性対照・対象・参照遺伝子\n  - Lake 2023 の傷害・adaptive/degenerative マーカー\n  - TLS・免疫関連\n  - 解離ストレス（FOS/JUN など）\n  - 細胞周期\n  - metallothionein・熱ショック・酸化ストレス\n  - 性染色体特異遺伝子（XIST, RPS4Y1 など）\n  - MT-/HLA-/Ig/ヒストン\n- **パネルの決定手順（決定論的）**:\n  1. start の検出率で 3 帯に分ける: low < 0.4 ≤ mid < 0.7 ≤ high。\n  2. 各帯で最大 3 遺伝子を選ぶ。優先順位は、規則を満たす文献候補、次にデータ駆動の候補。\n  3. 各帯の中は neutrality_score（R2〜R4 の偏差を閾値で割った値の最大）が小さい順とする。\n  4. RP は各帯で 1 つまで。\n- 探索枠: RP 候補のうち、R2 の TOST 以外をすべて満たすものから neutrality_score 順に 2 遺伝子。\n\n### 6.2 推奨パネル（`panel.csv`）\n**文献候補で規則を満たしたものはなかった。**パネルはデータ駆動の 7 遺伝子で、high 帯は 1 遺伝子しか満たさなかった。\n\n| 枠 | 遺伝子 | Ensembl | det start / goal | CP10k start / goal | FC 生（中心化） | TOST | Δrr_c | rr start | CV start |\n|---|---|---|---|---|---|---|---|---|---|\n| low | CERS4 | ENSG00000090661 | 0.18 / 0.09 | 0.42 / 0.28 | +0.74（+0.02） | 0.036 | +0.001 | 0.43 | 0.16 |\n| low | TATDN1 | ENSG00000147687 | 0.25 / 0.13 | 0.62 / 0.42 | +0.70（+0.02） | 0.010 | +0.003 | 0.36 | 0.11 |\n| low | IFT25 | ENSG00000081870 | 0.27 / 0.17 | 0.70 / 0.55 | +0.54（+0.01） | 0.025 | 0.000 | 0.44 | 0.13 |\n| mid | VAPA | ENSG00000101558 | 0.42 / 0.31 | 1.37 / 1.19 | +0.34（+0.09） | 0.032 | 0.000 | 0.61 | 0.12 |\n| mid | PHPT1 | ENSG00000054148 | 0.62 / 0.61 | 3.52 / 3.45 | +0.11（−0.05） | 0.049 | +0.009 | 0.42 | 0.22 |\n| mid | ANAPC16 | ENSG00000166295 | 0.48 / 0.39 | 1.90 / 1.64 | +0.18（−0.05） | 0.041 | −0.002 | 0.54 | 0.19 |\n| high | EEF1D | ENSG00000104529 | 0.74 / 0.70 | 5.75 / 4.53 | +0.34（+0.01） | 0.025 | −0.007 | 0.73 | 0.21 |\n| 探索 | RPS13 | ENSG00000110700 | 0.88 / 0.91 | 16.7 / 12.0 | +0.40（+0.06） | 0.11 | +0.003 | 0.79 | 0.26 |\n| 探索 | RPL32 | ENSG00000144713 | 0.92 / 0.96 | 26.1 / 18.7 | +0.36（+0.01） | 0.07 | +0.002 | 0.79 | 0.28 |\n\n- パネルがカバーする範囲:\n  - start 検出率 0.18〜0.74。陽性対照は VCAM1 0.62、HAVCR1 0.09 で、null の抽出範囲は 300 細胞以上。\n  - 相対順位 0.36〜0.73。\n  - **HAVCR1 程度の低頻度（1,000 細胞未満）と、HK 程度の高頻度かつ末尾位置（相対順位 0.85 以上）は、パネルでカバーできていない**。後者は HK 3 遺伝子と探索枠 RP だけが担う。\n- 生物学的な注意（規則には入れていない）:\n  - IFT25 は一次繊毛の遺伝子で、繊毛長は腎傷害で変化するという報告がある。\n  - CERS4 はセラミド合成酵素で、脂質代謝に関わる。\n  - EEF1D は翻訳伸長因子で、機能的には RP に近い。\n  - 規則は機械的に適用し、後から手で入れ替えないこと（研究者の自由度を増やさないため）。\n\n### 6.3 合否基準への組み込み（提案、PI の判断事項）\n- **C3-HK（現行のまま、PI の指示どおり）**: ACTB・GAPDH・PPIA がすべて、null 分位 0.10〜0.90 に 3 seed 中 2 以上で入ること。\n- **C3-panel（新設）**: パネル 7 遺伝子のうち **5 以上**（≥ 71%）が、null 分位 0.10〜0.90 に 3 seed 中 2 以上で入ること。\n- **探索枠（RPS13, RPL32）**: 同じ分位を報告するが、合否には使わない。本番で null 内に安定して入れば、次の実験でパネルへの昇格を検討する。\n- **誤判定率の試算**（理想的な陰性対照、つまり null と交換可能な遺伝子で、1 seed あたり 0.10〜0.90 に入る確率を 0.8 とした場合）:\n  - 1 遺伝子が 3 seed 中 2 以上で合格する確率は 0.80〜0.90。下限は seed 間の完全相関、上限は独立を仮定した値。\n  - **C3-HK（3/3 必須）の合格確率は 0.51〜0.72**。完全な陰性対照でも 3〜5 割で不合格になる。\n  - C3-panel の ≥ 5/7 は 0.85〜0.97。≥ 6/7 だと 0.58〜0.84 に下がる。\n  - パネル遺伝子が GAPDH のように null 外へ出やすい場合、C3-panel の合格確率は低い（1 seed あたり 0.2 なら 0.005、0.5 なら 0.23）。\n  - 参考値として、C3-HK を「3 遺伝子中 2 以上」に緩めると 0.90〜0.97 になる。PI の判断材料として記す。\n- 指標の選定規則（EXP-002 plan §6.2: C1〜C3 をすべて満たす指標を採用）での扱い:\n  - 提案: C3 を「C3-HK **かつ** C3-panel」とする（HK を判定に残すという PI 指示に沿う）。\n  - C3-HK だけが不合格で C3-panel が合格した場合も、判定は不合格とする。そのうえで「HK に状態特異的な信号がある可能性」を別途報告する。\n  - PI の判断事項: C3-HK を「3/3 必須」のままにするか「2/3 以上」に緩めるか（上の誤判定率を参照）。本番データを見る前に決めること。\n\n### 6.4 実装・計算量の注意\n- `run_isp.py` の `negative_fixed` は 1 つの `fixed_role`（現在は housekeeping）しか持てない。パネルと探索枠を別の role で記録するには、config の拡張が必要になる。\n  - 例: `controls.negative_panel`、`controls.negative_exploratory`。\n  - 同時に、validate の C3-panel 実装も必要になる。\n  - `negative_fixed` に入れた遺伝子は、ランダム null の抽出から自動で除外される（run_isp.py L898–902）。パネルも同じ扱いにすること。\n- 追加する計算量: 9 遺伝子 × 200 細胞 × 3 seed = 5,400 細胞×遺伝子 × 0.684 s ≈ **1.0 h**。\n  - 本番（dry-run 3.28 h）と合わせて約 4.3 h になる → G2 の見積もりを更新する必要がある。\n\n## 7. 限界\n- **状態と donor・疾患が完全に交絡している**（start と goal に共通の donor はない）。発現の同等性は donor 間比較であり、バッチ差を含む。\n- 中心化は「null と同じ頻度の遺伝子に比べて中立」を意味するだけで、絶対的な不変性ではない。高頻度帯の期待値は、RP を中心とする少数の遺伝子で決まる。\n- TOST の検出力は donor 数（13 vs 21）で制限される。R2 に合格する遺伝子が少ない（79）のはこのためでもある。\n- 発現の中立性は、ISP での中立性を保証しない（§4 の ACTB/PPIA の例）。これは PI の指摘どおり、試してみないと分からない部分である。\n- scSEG の上位遺伝子リストは入手・確認できていない。候補には本文の例（RPL26, RPL36, HINT1）だけを入れた。\n- 規則の閾値（0.25 log2、0.05、0.03、75% 分位）は妥当な慣例値だが、根拠となる外部基準はない。\n  - 閾値は ISP の結果を見る前に固定した。\n  - 閾値を変えて合格遺伝子が変わっても、ISP の結果を見て変えてはならない。\n\n## 8. 未確認事項\n- Eisenberg 2014 の正誤表の内容（遺伝子数 3,804 → 3,506 の可能性。二次情報）\n- HRT Atlas の元データに腎が含まれるか\n- Lin 2019 scSEG の上位遺伝子リスト（補足資料または scMerge のパッケージデータ）\n- Lessard 2018 は PMID/DOI とタイトルの一致のみ確認（内容の詳細は未読）\n- IFT25・CERS4 の腎傷害での発現変化に関する直接の文献（未検索）\n"}, {"id": "data-raw-kidney_tls-SOURCES-md", "label": "データの取得元", "path": "data/raw/kidney_tls/SOURCES.md", "kind": "md", "bytes": 3771, "body": "# data/raw/kidney_tls — 取得元の記録\n\n- 取得日: 2026-09-25 / 取得スクリプト: `scripts/download_kidney_tls.sh` / ログ: `logs/download-kidney-tls-2026-09-25.log`\n- 選定根拠: `outputs/literature/2026-09-25-kidney-TLS-datasets.md` の優先度 A\n- 中身の確認結果: `outputs/literature/2026-09-25-kidney-TLS-inspect.json`（全ファイル: raw.X に整数カウント、var は Ensembl ID）\n- ライセンス: CELLxGENE Discover のデータ方針により CC BY 4.0（**データセットごとの表示は未確認**）。KPMP データは KPMP の利用規約に従い謝辞を記載すること\n- **読み取り専用**。Geneformer に入れる前に raw.X → X、n_counts の付与が必要（加工物は experiments/ 側に作る）\n\n## A1_KPMP_v1.5_snRNA_Lake2023\n- データ: KPMP Human Kidney Atlas v1.5 snRNA (CELLxGENE collection 0f528c8a-a25c-4840-8fa3-d156fa11086f)\n- 論文: Lake BB et al. Nature 2023. PMID 37468583, DOI 10.1038/s41586-023-05769-3\n- 内容: 304,989 × 35,439 / disease: CKD, AKI, normal / Age_binned, region\n- URL: https://datasets.cellxgene.cziscience.com/02d5db96-d67e-45f2-b556-b6bd99753665.h5ad\n- sha256: `e9380bbbb7f0704aea888e4b7ca84991929803cb7ab03450ae4e6921bb664581`\n\n## A2_KPMP_v1.5_scRNA_Lake2023\n- データ: KPMP Human Kidney Atlas v1.5 scRNA (同上)\n- 論文: Lake BB et al. Nature 2023. PMID 37468583\n- 内容: 225,177 × 30,635 / disease, sampletype (DKD/HCKD/AKI/LD/HRT), author_cell_type 54 種\n- URL: https://datasets.cellxgene.cziscience.com/08648660-9898-4644-a9a1-ff3a159a0041.h5ad\n- sha256: `417ba050dcc797d58c897169ca51ddfa840e6ceb67080041f63a993127256176`\n\n## A3_RCC_LiR2022\n- データ: RCC 腫瘍/腫瘍近傍/正常/血液 (CELLxGENE f7cecffa-00b4-4560-a29a-8ad626b8ee08)\n- 論文: Li R et al. Cancer Cell 2022. PMID 36423636, DOI 10.1016/j.ccell.2022.11.001\n- 内容: 270,855 × 19,322 / summaryDescription, region, disease\n- URL: https://datasets.cellxgene.cziscience.com/8784de63-bec2-49ae-b147-8f16108cecce.h5ad\n- sha256: `f121de13e43f86c64f30611ac83446bd5d7b586fbf6d7de286fa018ed64d9606`\n\n## A4_ccRCC_Krishna2021\n- データ: ccRCC 多領域 + PBMC + リンパ節 (CELLxGENE 3f50314f-bdc9-40c6-8e4a-b0901ebfbe4c)\n- 論文: Krishna C et al. Cancer Cell 2021. PMID 33861994, DOI 10.1016/j.ccell.2021.03.007\n- 内容: 167,283 × 15,934 / author_sample（領域）, donor_id（治療反応）\n- URL: https://datasets.cellxgene.cziscience.com/6602fa5a-d663-4fe0-8dc3-90191c3a013b.h5ad\n- sha256: `9f9fbadfd4113fec0c3772bb80f1e3bef8f49fa5e9553c520fc197b9fa614133`\n\n## A5a_ccRCC_Zhang2021\n- データ: ccRCC 腫瘍 (GEO GSE159115 の CELLxGENE 版)\n- 論文: Zhang Y et al. PNAS 2021. PMID 34099557\n- 内容: 20,509 × 32,088 / author_cell_type（Plasma, Bcell あり）\n- URL: https://datasets.cellxgene.cziscience.com/f77a9049-7cbe-477d-8d3f-b417bba03147.h5ad\n- sha256: `5c1f1e2c8bae4ce1808c6da017440eba4e7d98cb3e2f551c350211e0eb02fff2`\n\n## A5b_normal_Zhang2021\n- データ: 正常腎 (GSE159115 の CELLxGENE 版)\n- 論文: Zhang Y et al. PNAS 2021. PMID 34099557\n- 内容: 6,044 × 32,088 / author_cell_type 25 種\n- URL: https://datasets.cellxgene.cziscience.com/5f0b9675-aed8-4870-8ad8-7a3f38037486.h5ad\n- sha256: `3215543bd2dc490db5ef247d082632aaa12392cac536e6cad41dd7f991b33f49`\n\n## A6_UUO_Reck2025\n- データ: 尿管閉塞腎 snRNA (CELLxGENE 307ce143-7cc8-4813-99b1-3797834149c9)\n- 論文: Reck M, Baird DP et al. Nat Commun 2025. PMID 40399382, DOI 10.1038/s41467-025-59997-4\n- 内容: 46,957 × 29,702 / disease: obstructive nephropathy vs normal, celltype_l2 59 種（B/T 細胞あり）, 60〜84 歳\n- URL: https://datasets.cellxgene.cziscience.com/0fe5eee4-380d-4bd9-8735-ada5e03021d9.h5ad\n- sha256: `8d9cca1320a7952f4b2eaff07acc03494e840e46b6b333e1c3efaf395165b29d`\n"}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
document.getElementById('stamp').textContent = DATA.generated;
const nav = document.getElementById('nav'), docs = document.getElementById('docs');
function csvRows(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==''));
}
function renderCsv(text){
  const rows=csvRows(text); if(!rows.length) return '<p>（空）</p>';
  const head=rows[0], body=rows.slice(1);
  const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
  const isNum=s=>/^-?\d*\.?\d+(e-?\d+)?$/i.test(s.trim());
  return '<div class="tbl"><table><thead><tr>'+head.map(h=>'<th>'+esc(h)+'</th>').join('')+
    '</tr></thead><tbody>'+body.map(r=>'<tr>'+head.map((_,i)=>{
      const v=r[i]??''; return '<td'+(isNum(v)?' class="num"':'')+'>'+esc(v)+'</td>';
    }).join('')+'</tr>').join('')+'</tbody></table></div>';
}
let first=true;
for(const grp of DATA.sections){
  const g=document.createElement('div'); g.className='grp'; g.textContent=grp.section; nav.appendChild(g);
  const links=document.createElement('div'); links.className='links'; nav.appendChild(links);
  for(const d of grp.docs){
    const a=document.createElement('a'); a.href='#'+d.id; a.textContent=d.label; a.dataset.id=d.id;
    links.appendChild(a);
    const sec=document.createElement('section'); sec.className='doc'; sec.id=d.id;
    const kb=(d.bytes/1024).toFixed(1);
    let inner='';
    if(d.kind==='md') inner='<div class="body">'+marked.parse(d.body)+'</div>';
    else if(d.kind==='csv') inner=renderCsv(d.body);
    else inner='<div class="raw">'+d.body.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>';
    sec.innerHTML='<div class="meta"><span>'+d.path+'</span><span>'+kb+' KB</span></div>'+inner;
    for(const t of sec.querySelectorAll('.body table')){
      const w=document.createElement('div'); w.className='tbl';
      t.parentNode.insertBefore(w,t); w.appendChild(t);
    }
    docs.appendChild(sec);
    if(first){ show(d.id); first=false; }
  }
}
function show(id){
  for(const s of docs.children) s.classList.toggle('on', s.id===id);
  for(const a of nav.querySelectorAll('a')) a.classList.toggle('on', a.dataset.id===id);
  window.scrollTo({top:0});
}
nav.addEventListener('click', e=>{
  const a=e.target.closest('a'); if(!a) return;
  e.preventDefault(); show(a.dataset.id); history.replaceState(null,'','#'+a.dataset.id);
});
const h=location.hash.slice(1);
if(h && document.getElementById(h)) show(h);
</script>
