<script id="data" type="application/json">{"generated": "2026-09-27 01:02 生成 / 40 文書", "sections": [{"section": "通しの報告", "docs": [{"id": "outputs-reports-2026-09-26-腎臓リンパ組織と細胞老化-研究報告-md", "label": "研究報告（2026-09-26）", "path": "outputs/reports/2026-09-26-腎臓リンパ組織と細胞老化-研究報告.md", "kind": "md", "bytes": 19484, "body": "# 研究報告: 腎臓の三次リンパ組織と細胞老化 — 手法の土台づくりまでの記録\n\n- 状態: 確定\n- 承認: PetadimensionLab (PI), 2026-09-27 — 実験 004 は部分的に支持、実験 005 は判定不能\n- 期間: 2026-09-25 〜 2026-09-26\n- 作成: Labretary / 2026-09-26\n- 用語は [用語集](../../docs/用語集.md) に統一。各実験の原文は [閲覧ページ](https://claude.ai/artifact/8qytjWvp22YU5FC78eP5hi) で読めます\n\n## 要旨\n\n腎臓の三次リンパ組織が腎臓病で果たす役割を、細胞老化と結びつけて調べるため、公開データと Geneformer を使ったコンピュータ上の遺伝子摂動に取り組みました。2 日間で 5 つの実験を行い、**生物学的な結論はまだ出ていません**。代わりに、手法についての確度の高い結論が得られました。**いまの枠組みは、細胞の状態を動かす原因の遺伝子と、単なる目印の遺伝子や摂動の大きさとを区別できていません。** これは想定外の副産物ですが、ここを直さずに本命の仮説を検証しても、結果を信じられません。本報告はその判断の根拠をまとめたものです。\n\n## 1. 目的と狙い\n\n### 知りたいこと\n腎臓の中にできる三次リンパ組織が、慢性腎臓病や腎臓癌の進行にどう関わるのか。とくに、細胞老化を起こした細胞との相互作用が鍵ではないかという見立てがあります。\n\n### 具体的な問い\n損傷から回復しきれない近位尿細管（修復不全の近位尿細管）は、どの遺伝子に依存してその状態に留まっているのか。その遺伝子を取り除けば、健常な状態へ戻る方向に動くのか。動くとすれば、三次リンパ組織が多い腎臓とそうでない腎臓で違いがあるのか。\n\n### この 2 日で答えを出そうとしたこと・出なかったこと\n| | |\n|---|---|\n| 出せた | 使えるデータがあるか。計算環境が動くか。**判定の仕組みが信用できるか** |\n| 出せていない | 上の生物学的な問いそのもの |\n\n答えが出なかったのは計算資源の不足ではなく、**判定の仕組みが要求水準に達していなかった**ためです。\n\n## 2. 背景\n\n腎臓に三次リンパ組織ができることは、加齢した腎臓や損傷後の腎臓で報告されています（Sato ら 2016, PMID 27699223）。その周囲には損傷マーカーを出したまま回復しない尿細管が見られ、免疫細胞と尿細管の相互作用が想定されています（Yoshikawa ら 2023, PMID 37548710）。老化関連 T 細胞を抑えると三次リンパ組織が縮小するという報告もあり（Sato ら 2022, PMID 34813503）、細胞老化との接点が示唆されています。\n\n一方で、これらをヒトの単一細胞データで直接検証した研究は限られています。公開データを調べたところ、**三次リンパ組織の有無を細胞ごとに記録したヒトのデータは見つかりませんでした**。組織切片で確認したラベルがある公開データは、腎臓癌の空間データ 1 件のみでした。このため本研究では、遺伝子発現の組み合わせから三次リンパ組織の多さを**推定**して使っています。以降で「三次リンパ組織が多い提供者」と書くのは、すべてこの推定値です。\n\n## 3. アプローチ\n\n### 3.1 使ったデータ\n\n公開データ 7 件、約 104 万細胞、7.7 GB を取得しました。すべて CC BY 4.0 の公開データです（データセットごとのライセンス表示は未確認）。\n\n中心に使ったのは米国の腎臓精密医療プロジェクトによる腎臓アトラス（Lake ら 2023, PMID 37468583）で、慢性腎臓病・急性腎障害・健常の提供者を含みます。\n\n### 3.2 使ったモデルと計算環境\n\nGeneformer の 3.16 億パラメータ版を使いました。細胞を「発現量の高い順に並べた遺伝子の列」として表し、そこから細胞 1 個ごとの数値ベクトル（細胞埋め込み）を得るモデルです。遺伝子を 1 つ取り除いて再計算し、埋め込みが健常側へどれだけ動いたかを測ります。\n\n計算機は 3 台を使い分けました。\n\n| 計算機 | 用途 |\n|---|---|\n| 手元の Mac（M4 Pro） | 軽い解析、前処理、検証 |\n| リモート 1 号機（NVIDIA GB10） | 追加学習、重い摂動計算 |\n| リモート 2 号機（同型） | 並行して別の摂動計算 |\n\nApple 製 GPU でも Geneformer が動くことを最初に確認し、そのうえで重い計算はリモートに回す体制にしました。\n\n### 3.3 やったこと\n\n```\nデータ収集 → 仮説づくり → 実験 001（生物学の問い）\n                                ↓ 判定不能\n                          実験 002（指標の改良）\n                                ↓ 否定\n                          実験 003（モデルの改良）\n                                ↓ 部分的に前進\n                     実験 004・005（判定の仕組みの検証）\n```\n\n実験 001 で本命の問いに答えようとしましたが、判定できませんでした。以降の 4 つは、**なぜ判定できなかったのかを潰していく作業**です。本命の遺伝子は、判定の仕組みが信用できると確認できるまで見ない方針（盲検）にして、対照遺伝子だけで検証を進めました。\n\n### 3.4 判定の考え方\n\n毎回、**結果を見る前に**判定基準を計画書に書き込みました。基準は、効果があるはずの遺伝子（陽性対照）と、効果がないはずの遺伝子（対照遺伝子群・恒常発現遺伝子・中立対照）を比べる形です。\n\n| 基準 | 内容 |\n|---|---|\n| 陽性対照の分離 | 陽性対照が対照遺伝子群の上位 10% に入る |\n| 恒常発現遺伝子との差 | 陽性対照が恒常発現遺伝子を上回る（18 組中 15 組以上） |\n| 恒常発現遺伝子の中立性 | 恒常発現遺伝子が対照遺伝子群の中に収まる |\n| 中立対照パネルの中立性 | 中立対照 7 遺伝子のうち 5 つ以上が中立の範囲に収まる |\n| 再現性（参考） | 提供者を半分に分けたときの順位の一致が 0.7 以上 |\n\n## 4. 結果\n\n### 4.1 実験 001 — 本命の問い（判定不能）\n\n慢性腎臓病の修復不全の近位尿細管で、細胞老化に関わる 2 遺伝子とリンパ組織の受容体 1 つを削除しました。3 つとも、健常方向への動きは対照遺伝子群と区別できませんでした（基準を満たした試行は 0/3）。\n\nただし**この結果は「効果がない」ことを意味しません**。陽性対照（損傷マーカーとして確立した 2 遺伝子）も恒常発現遺伝子と区別できず、**判定の仕組み自体が働いていなかった**ためです。\n\n原因は、遺伝子を 1 つ削除すると、どの遺伝子でも細胞がすべての状態から一様に離れることでした。90 通りすべてでこれが起きていました。この一様な動きが、遺伝子ごとの違いより桁違いに大きく、信号を覆い隠していました。\n\n**PI の判定: 判定不能**\n\n### 4.2 実験 002 — 一様な削除効果を差し引く（否定）\n\n一様な動きを差し引く指標を 18 通り試しました。最も良かったのは、細胞の入力の長さごとに対照遺伝子の平均を差し引く方法（長さ補正した接近度）です。\n\n| | 結果 |\n|---|---|\n| 一様な動きの解消 | 対照遺伝子が健常から離れる割合が 100% → 32% |\n| 長さとの相関 | 解消（−0.06） |\n| 中立対照 7 遺伝子 | 7/7 が中立の範囲 |\n| **陽性対照の分離** | **不合格**（2 遺伝子の順位 0.67 と 0.78） |\n| **再現性** | **不合格**（0.32。細胞数を倍にしても改善せず） |\n\n判定基準が厳しすぎたのではないかを別途検証しました。陽性対照が通る水準まで閾値を緩めると、効果のない遺伝子でも 26% が偶然通ってしまい、判定の意味がなくなります。恒常発現遺伝子を使わない基準（陽性対照の分離・再現性）だけでも不合格なので、**基準の厳しさが原因ではない**と判断しました。\n\n**PI の判定: 否定**\n\n### 4.3 実験 003 — 追加学習したモデルを使う（主要な予測は否定、副次的な予測は支持）\n\n事前学習のままのモデルではなく、「修復不全か健常か」を見分けるよう追加学習させたモデルを使いました。学習はリモート GPU で 13 分でした。学習に使った提供者と、摂動に使う提供者は完全に分けています。\n\n| | 事前学習モデル | 追加学習済みモデル |\n|---|---|---|\n| 一様な動き（対照遺伝子が離れる割合） | 100% | **10〜15%** |\n| 恒常発現遺伝子の中立性 | 不合格 | **合格** |\n| 恒常発現遺伝子との差 | 10/18 | **16/18** |\n| 陽性対照の分離 | 不合格 | **不合格**（1 遺伝子は合格、もう 1 遺伝子が不合格） |\n\n**手法としては大きく前進しました。** 一様な動きと恒常発現遺伝子の偽陽性という 2 つの問題が、ほぼ解消しています。しかし陽性対照 2 つのうち 1 つが依然として分離せず、事前登録の規則により主要な予測は否定となりました。\n\n**PI の判定: 否定**（副次的な予測 2 つは支持）\n\n### 4.4 実験 004 — 合格した陽性対照は本物か\n\n追加学習済みモデルで唯一分離した陽性対照について、「分類器が目印として使っている遺伝子を消しただけではないか」を確かめました。\n\n**比較用の遺伝子**: 同じように損傷側で発現が上がるが、状態の原因とは考えられていない 10 遺伝子を、発現データだけを使って選び、同じ条件で摂動しました。\n\n- この陽性対照は、3 回すべてで 10 遺伝子すべてを上回りました（効果の大きさは次点の 2.4 倍）。目印を消しただけでは説明できません。\n- 一方で、**10 遺伝子のうち 3 つが陽性対照と同じ基準を満たしました**。偶然合格する確率 10% の 3 倍です。つまり**この判定基準は、原因の遺伝子に特異的ではありません**。\n\n**提供者単位の解析**: 細胞ごとではなく提供者ごとに集計しても判定は変わりませんでした。分離した陽性対照は 13 人全員で同じ向きに動き、もう一方は 5 人にとどまりました。提供者間のばらつきが、後者の不合格の一因です。提供者を 14 人から 29 人に増やしても、再現性は 0.46 から 0.60 程度で、基準の 0.7 には届きませんでした。\n\n**PI の判定: 部分的に支持**（比較遺伝子の予測は支持、再現性の改善は不成立）\n\n### 4.5 実験 005 — 陽性対照を選び直す\n\n文献で因果関係が報告されている遺伝子を陽性対照に選び直し、2 種類の摂動を行いました。\n\n**削除型（5 遺伝子）**: 5 つとも対照遺伝子群と区別できませんでした。ただし恒常発現遺伝子も中立対照も正しく中立に収まっており、一様な動きもないため、**これは信用できる否定的な結果**です。\n\n**過剰発現型（6 遺伝子）**: 3 つが基準を満たしましたが、同時に恒常発現遺伝子の 1 つも上位に来てしまい、事前登録の規則により判定不能としました。\n\nさらに重要な発見がありました。過剰発現の効果の大きさが、**その遺伝子がもともと細胞内で何位にあったか**と相関していました（相関 0.32〜0.71）。対照遺伝子は発現頻度をそろえて選んでいましたが、この「上げしろ」はそろえていませんでした。基準を満たした 3 遺伝子も、恒常発現遺伝子の不合格も、これで説明がつく可能性があります。\n\n**PI の判定: 判定不能**\n\n## 5. 考察\n\n### 最も確度の高い結論\n実験 004 と実験 005 を合わせると、一貫した像が見えます。**いまの枠組み（遺伝子を摂動して対照遺伝子群と比べる）は、状態を動かす原因の遺伝子を、単なる目印の遺伝子や摂動の大きさから区別できていません。** 根拠は 2 つです。\n\n1. 原因とは考えられていない遺伝子の 3/10 が、陽性対照と同じ基準を満たした\n2. 過剰発現では、効果の大きさが遺伝子の元の順位で説明できてしまう\n\nこの状態で本命の遺伝子を評価すれば、合格しても不合格しても解釈できません。盲検を続けた判断は妥当だったと考えます。\n\n### 追加学習は効いた\n一様な動きの解消は明確な前進でした。ただし副作用として、追加学習したモデルは分類に使う目印の遺伝子を強く重みづけている可能性があり、「分離した = 原因である」とは言えなくなりました。改善と新しい落とし穴が同時に生まれた形です。\n\n### 三次リンパ組織の比較は成立しなかった\n三次リンパ組織が多い提供者と少ない提供者の細胞は、モデルの埋め込み上ほとんど区別できませんでした（重心間の距離が、損傷と健常の距離の 12 分の 1）。推定したラベルの限界か、そもそもこの軸が埋め込みに表れないのか、現時点では分かりません。\n\n### 予想と違った点\n当初は計算量が最大の制約だと考えていましたが、実際の制約は**判定の設計**でした。GPU 時間の合計は 12 時間ほどで、リモート機を使えば十分に収まります。時間を使ったのは、結果を信じてよいかの検証です。\n\n## 6. 限界\n\n- コンピュータ上の摂動実験は、モデルが学習した発現の連動に基づく予測であり、因果関係を直接示すものではありません\n- 三次リンパ組織の多さはすべて推定値で、組織を見て判定したものではありません\n- 計算精度に半精度を使っています。効果が小さい場面では、この精度が判定の境界と同じ桁になります\n- 損傷側と健常側で提供者が完全に分かれており、状態の違いと提供者の違いを分離できません\n- 比較用遺伝子を「原因ではない」と判断した根拠は知識に基づくもので、系統的な文献調査ではありません\n- 本命の遺伝子は一度も評価していません\n\n## 7. 次のアクション\n\n### 手法の修正（本命の検証より先）\n1. 対照遺伝子を、発現頻度だけでなく**元の順位（上げしろ）でもそろえる**\n2. 判定基準に、対照遺伝子群との比較だけでなく**発現をそろえた比較遺伝子群との比較**を組み込む\n3. 提供者間のばらつきへの対処。提供者数を増やしても再現性が上がらなかったため、指標そのものの見直しが必要\n\n### そのあとに行うこと\n4. 手法が基準を満たしたら、盲検を解除して本命の 3 遺伝子を評価する\n5. 三次リンパ組織の状態を、空間データ由来のシグネチャーで定義し直す（Meylan ら 2022, PMID 35231421）\n\n### 実験室で行うこと\nコンピュータ上で支持が得られた場合に限り、ヒト近位尿細管細胞で損傷・老化様の状態を誘導し、候補遺伝子を抑えて損傷マーカーの変化を測る。**現時点では、実験室での検証を提案できる段階にありません。**\n\n## 8. このレポートで使った用語\n\n| 用語 | 意味 |\n|---|---|\n| 三次リンパ組織 | 炎症が続く臓器の中に後天的にできるリンパ組織様の構造 |\n| 近位尿細管 | 腎臓で原尿の再吸収を担う管の細胞 |\n| 修復不全の近位尿細管 | 損傷後に健常へ戻りきらない状態の近位尿細管。本研究の出発点 |\n| 細胞埋め込み | 細胞 1 個をモデルが数値ベクトルで表したもの |\n| コンピュータ上の遺伝子摂動 | モデルの中で遺伝子を消す・増やして、細胞の状態の動きを計算する模擬実験 |\n| 一様な削除効果 | どの遺伝子を消しても細胞がすべての状態から同じように離れる、遺伝子によらない見かけの動き |\n| 長さ補正した接近度 | 細胞の入力の長さ別に対照遺伝子の平均を差し引いた、本研究の主指標 |\n| 陽性対照 | 効果が出ると期待される既知の遺伝子。手法が働いているかの確認に使う |\n| 対照遺伝子群 | 効果がないはずの遺伝子を発現頻度をそろえて多数選んだもの。比較の土台 |\n| 恒常発現遺伝子 | どの細胞でも安定して働くとされる遺伝子 |\n| 中立対照パネル | 損傷側と健常側で発現差がないことを確認して選んだ 7 遺伝子 |\n| 追加学習済みモデル | 本研究のデータで「修復不全か健常か」を見分けるよう追加学習させた Geneformer |\n| 提供者 | 検体を提供した患者 1 人 |\n| 半分割再現性 | 提供者を 2 群に分けて別々に順位を出したときの一致度 |\n| 盲検 | 手法の妥当性が確認できるまで本命の遺伝子の結果を見ないこと |\n| 事前登録 | 結果を見る前に判定基準を文書に固定すること |\n\n## 補足: 実行の記録\n\n| 実験 | 計算 | 時間 | 結果 |\n|---|---|---|---|\n| 001 | 手元の Mac | 3 時間 56 分 | 完了 |\n| 002 予備 | 手元の Mac | 1 時間 6 分 | 完了 |\n| 002 本番 | 手元の Mac | 3 時間 56 分 | 完了 |\n| 003 追加学習 | リモート 1 号機 | 13 分 | 完了 |\n| 003 摂動（2 条件） | リモート 1 号機 | 1 時間 30 分 | 完了 |\n| 004 比較遺伝子 | リモート 1 号機 | 19 分 | 完了 |\n| 004 提供者拡張 | リモート 1 号機 | 1 時間 27 分 | 完了 |\n| 005 削除型・過剰発現型 | リモート 2 号機 | 1 時間 40 分 | 完了 |\n\n失敗して直した実行: 埋め込みの種別の設定誤りで停止（1 回）、実験フォルダの不足で起動直後に停止（1 回）、並列処理と GPU の組み合わせで停止（2 回）、精度設定が原因で結果が使えず再実行（1 回）。いずれも原因を特定し、再発防止のルールとして記録済みです。\n\n## 再現情報\n\n- 計画・設定・結果の原文: [閲覧ページ](https://claude.ai/artifact/8qytjWvp22YU5FC78eP5hi)（39 文書）\n- データの取得元と照合値: `data/raw/kidney_tls/SOURCES.md`\n- 解析コード: `scripts/geneformer/`, `scripts/analysis/`, `scripts/remote/`\n- 環境の記録: 各実験の `results*/env.json`（設定のハッシュ、パッケージ版、計算機）\n- 再発防止のルール: `.claude/memory/guardrails.md`\n- データ利用: 米国の腎臓精密医療プロジェクトの規約に従い、所定の謝辞を記載すること（文言は未確認）\n"}]}, {"section": "はじめに", "docs": [{"id": "docs-用語集-md", "label": "用語集", "path": "docs/用語集.md", "kind": "md", "bytes": 7305, "body": "# 用語集（プロジェクト共通）\n\n- 作成: Labretary / 2026-09-26（PI 指示「用語の統一、無意味な省略形をやめる」）\n- レポート・計画・検証文書は、この表の**左側の日本語**を使う。内部記号（`a2`, `C1`, `DL-med` など）を本文に出さない。\n- 新しい用語を使うときは、まずこの表に追加してから使う。\n\n## 1. データと細胞の状態\n\n| 使う言葉 | 意味 | 旧表記・内部名 |\n|---|---|---|\n| 腎臓アトラス（KPMP） | 米国の腎臓精密医療プロジェクトが公開したヒト腎臓の単一細胞データ。本研究の主データ（Lake ら 2023, PMID 37468583） | A2, KPMP scRNA |\n| 単一細胞 RNA-seq | 細胞 1 個ずつの遺伝子発現を測る手法 | scRNA-seq |\n| 提供者 | 検体を提供した患者・ドナー 1 人 | donor |\n| 近位尿細管 | 腎臓で原尿の再吸収を担う管の細胞 | PT |\n| 修復不全の近位尿細管 | 障害後に健常へ戻りきらない状態の近位尿細管。本研究の出発点の状態 | aPT, aPT_CKD |\n| 健常な近位尿細管 | 健常者由来の正常な近位尿細管。本研究の目標の状態 | PT_healthy |\n| 三次リンパ組織 | 炎症が続く臓器の中に後天的にできるリンパ組織様の構造 | TLS, TLT |\n| 三次リンパ組織スコア | 提供者ごとに、関連 8 遺伝子の発現から推定した三次リンパ組織の多さ。**組織を見て判定したものではなく推定値** | TLS score |\n| 三次リンパ組織が多い群／少ない群／中程度の群 | 上のスコアを 3 等分した提供者グループ | TLS-high / low / mid |\n| 出発点の状態・目標の状態・対照の状態 | 摂動で「どこから」「どこへ」動くかを測る基準。対照の状態は比較用の第 3 の状態 | start / goal / alt |\n\n## 2. モデルと計算\n\n| 使う言葉 | 意味 | 旧表記・内部名 |\n|---|---|---|\n| Geneformer | 大量の単一細胞データで学習した、遺伝子発現の基盤モデル。本研究では 3.16 億パラメータの第 2 版を使用 | V2-316M |\n| 事前学習モデル | 追加学習をしていない、配布されたままの Geneformer | Pretrained |\n| 追加学習済みモデル | 本研究のデータで「修復不全か健常か」を見分けるよう追加学習させた Geneformer | FT, fine-tuned, CellClassifier |\n| コンピュータ上の遺伝子摂動 | モデルの中で遺伝子を消す・増やすなどして、細胞の状態がどう動くかを計算する模擬実験 | in silico perturbation, ISP |\n| 削除型の摂動 | その遺伝子を入力から取り除く操作 | delete |\n| 過剰発現型の摂動 | その遺伝子の発現順位を引き上げる操作 | overexpress |\n| 細胞埋め込み | 細胞 1 個をモデルが数値ベクトルで表したもの。状態の近さはこのベクトルの角度で測る | CLS embedding |\n| 状態の重心 | ある状態の細胞群の埋め込みの平均。状態の代表点 | state centroid |\n| 目標状態への接近度 | 摂動によって、細胞が目標の状態の重心にどれだけ近づいたか | shift_goal |\n| 半精度計算 | 計算を bf16 という低い精度で行い高速化する方式。本研究では計算本体のみ半精度、状態の比較は通常精度 | bf16 |\n\n## 3. 指標と対照\n\n| 使う言葉 | 意味 | 旧表記・内部名 |\n|---|---|---|\n| 一様な削除効果 | どの遺伝子を消しても細胞がすべての状態から同じように離れてしまう、遺伝子によらない見かけの動き | deletion drift, 削除ドリフト |\n| 長さ補正した接近度 | 細胞の入力の長さ別に対照遺伝子の平均を差し引き、一様な削除効果を取り除いた主指標 | a2 |\n| 入力の長さ | 細胞 1 個をモデルに入れるときのトークン数。検出された遺伝子数にほぼ等しい | length, token 数 |\n| 陽性対照 | 効果が出ると期待される既知の遺伝子。手法が働いているかの確認に使う | positive control |\n| 対照遺伝子群 | 効果がないはずの遺伝子を、発現頻度をそろえて多数選んだもの。比較の土台 | null, negative random |\n| 恒常発現遺伝子 | どの細胞でも安定して働くとされる遺伝子（ACTB, GAPDH, PPIA） | HK, housekeeping |\n| 中立対照パネル | 出発点と目標で発現差がないことを発現データだけで確認して選んだ 7 遺伝子 | negctrl_panel |\n| 発現をそろえた比較遺伝子 | 陽性対照と同程度に修復不全側で発現が上がるが、原因とは考えられていない遺伝子 | DE マッチ, de_matched |\n| 対照遺伝子群の中での順位 | ある遺伝子の値が、対照遺伝子群の分布のどの位置にあるか（0〜1） | null 分位, null_pct |\n| 提供者単位の集計 | 細胞ごとではなく提供者ごとにまとめてから比較する方式 | donor-level, DL-med, DL-mean |\n| 半分割再現性 | 提供者を 2 群に分けて別々に順位を出し、両者がどれだけ一致するか（1 に近いほど安定） | split-half |\n| 提供者を 1 人ずつ除く検証 | 結論が特定の提供者に依存していないかの確認 | LODO, leave-one-donor-out |\n\n## 4. 判定基準（結果を見る前に決めたもの）\n\n本文では番号ではなく名前で呼ぶ。\n\n| 使う言葉 | 内容 | 内部名 |\n|---|---|---|\n| 判定基準: 陽性対照の分離 | 陽性対照が対照遺伝子群の上位 10% に入ること | C1 |\n| 判定基準: 恒常発現遺伝子との差 | 陽性対照が恒常発現遺伝子を上回ること（18 組中 15 組以上） | C2 |\n| 判定基準: 恒常発現遺伝子の中立性 | 恒常発現遺伝子が対照遺伝子群の中（上下 10% の内側）に収まること | C3 |\n| 判定基準: 中立対照パネルの中立性 | 中立対照パネル 7 遺伝子のうち 5 つ以上が中立の範囲に収まること | C3-panel |\n| 参考: 再現性 | 半分割再現性が 0.7 以上 | C4 |\n| 参考: 交絡のなさ | 入力の長さや発現頻度と相関しないこと | C5 |\n\n## 5. 進め方\n\n| 使う言葉 | 意味 |\n|---|---|\n| 仮説採択の関門（G1） | その仮説を実験対象にしてよいかの PI 判断 |\n| 計画承認の関門（G2） | 計算量の大きい実行を始めてよいかの PI 判断 |\n| 結論確定の関門（G3） | 結果の判定（支持・否定・判定不能）を確定する PI 判断 |\n| 支持された | 事前に決めた基準を満たした |\n| 否定された | 事前に決めた否定の条件に当てはまった |\n| 判定不能 | 対照が働かないなど、判定できる状態になかった |\n| 事前登録 | 結果を見る前に判定基準を文書に固定すること |\n| 盲検 | 手法の妥当性が確認できるまで、本命の遺伝子の結果を見ないこと |\n\n## 6. 計算機\n\n| 使う言葉 | 意味 |\n|---|---|\n| 手元の Mac | Mac mini（M4 Pro）。Apple 製 GPU（MPS）を使用 |\n| リモート計算機 1 号（spark-cf5b） | NVIDIA GB10 搭載機。Tailscale 経由で接続 |\n| リモート計算機 2 号（spark-c083） | 同型の NVIDIA GB10 搭載機 |\n"}, {"id": "hypotheses-tracker-md", "label": "仮説トラッカー", "path": "hypotheses/tracker.md", "kind": "md", "bytes": 5350, "body": "# 仮説トラッカー\n\n| ID | 仮説（短縮） | Status | EXP | 判定 | 更新日 | メモ |\n|----|--------------|--------|-----|------|--------|------|\n| [HYP-20260925-01](HYP-20260925-01.md) | CKD の TLS-high 腎で aPT の TP53/CDKN1A/LTBR を delete → 健常 PT へ（TLS-low より大きい） | inconclusive | [EXP-20260926-001](../experiments/EXP-20260926-001/plan.md) | 判定不能（G3, PI 2026-09-26）: 主要3遺伝子は両指標で支持されず。陽性対照が HK と区別できず検出力未確認 | 2026-09-26 | A2 KPMP sc。start 7,533 / goal 6,149 / alt 4,002 細胞。G1 承認 2026-09-26（PI）。phase 0 済（start vs goal AUC 1.00、start vs alt 0.63）。本番は fp32 で約 4.4 h → **G2 承認待ち** |\n| [HYP-20260925-02](HYP-20260925-02.md) | 腎線維芽細胞で LTBR/RELB/NFKB2・CDKN1A を overexpress → TLS オーガナイザー様（CCL19/CCL21/CXCL13⁺）へ | proposed | — | — | 2026-09-26 | A1 KPMP sn。goal 777 細胞（推定ラベル）。ISP 前に AUC ≥ 0.65 の事前チェックが条件 |\n| [HYP-20260925-03](HYP-20260925-03.md) | ccRCC 腫瘍内 B で ABC プログラム（TBX21/ITGAX/ZEB2）＋CDKN1A を activate → 腫瘍内形質細胞へ | proposed | — | — | 2026-09-26 | A3 Li 2022。start 1,833 / goal 536 細胞。TLS ラベルなし（Meylan 2022 の知見に依存） |\n| [HYP-20260925-04](HYP-20260925-04.md) | ccRCC 腫瘍内 CD8 で SA-T 軸（TNFSF8/TNFRSF8）＋CDKN2A を activate → CXCL13⁺ 常在型へ | proposed | — | — | 2026-09-26 | A3（再現は A4）。goal 2,059 細胞。前提（CXCL13⁺CD8 と B 浸潤の相関）は本データでは有意でない（ρ=0.31, p=0.36） |\n| [HYP-20260926-01](HYP-20260926-01.md) | （方法）削除ドリフトを差し引いた指標で陽性対照 VCAM1/HAVCR1 が null と HK の両方から分離し、HK は null 内に収まる | refuted | [EXP-20260926-002](../experiments/EXP-20260926-002/plan.md) | — | 2026-09-26 | PI 指示（削除による一様な効果を差し引く）で作成。**G1 未承認**。phase 0（対照のみ, 1 seed, G2 未満）まで実施 |\n| [HYP-20260926-02](HYP-20260926-02.md) | （方法）障害 PT 軸（aPT_CKD vs PT_healthy）で fine-tuning した CellClassifier の埋め込みでは削除ドリフトが減り、陽性対照が HK・陰性対照パネル・null から事前登録基準（a2 の C1〜C3, C3-panel）で分離する | refuted | [EXP-20260926-003](../experiments/EXP-20260926-003/plan.md) | — | 2026-09-26 | PI 指示（FT 済みモデルで ISP）で作成。**G1 未承認**。FT はリモート NVIDIA GPU、ISP は Mac。held-out donor で FT がベースラインに劣らないことが前提（ゲート）。EXP-002 案 A と同じ細胞・遺伝子で Pretrained と比較 |\n| [HYP-20260926-04](HYP-20260926-04.md) | （方法）文献で因果が確立した PT 障害ドライバー（delete 型 5）／保護・同一性因子（overexpress 型 6）を陽性対照にすると、FT-Geneformer の ISP（a2）が null から分離し、その分離は分類器マーカーの除去／付加では説明できない | inconclusive | [EXP-20260926-005](../experiments/EXP-20260926-005/plan.md) | run D（delete）: C1' 0/5 で**不合格**（系は正常: C3 合格・C3-panel 7/7・削除ドリフトなし）＝有効な否定的結果。run O（overexpress）: C1' 3/6 合格だが HK の GAPDH が 3 seed とも分位 0.95 で **C3 不合格 → 事前登録 §6.3 により判定不能**。探索的に、run O の a2 は摂動遺伝子の元の rank と強く相関（ρ 0.65/0.47/0.32、固定 18 遺伝子で 0.71）＝摂動サイズの交絡 | 2026-09-26 | PI 指示（2026-09-26「(b) 陽性対照の見直し」を含む「全て実行」）。**G3 未（PI の判断待ち）**。spark-c083 で 1.66 h（G2 不要）。次: overexpress を使うなら **rank マッチ null** が必須。ΔP は分類器の飽和＋bf16 量子化で情報量ほぼゼロ（guardrails 追記済み） |\n| [HYP-20260926-03](HYP-20260926-03.md) | （方法）VCAM1 の delete の効果は DE マッチ非ドライバー遺伝子の除去を上回り、donor 単位でも判定が再現する | partially_supported | [EXP-20260926-004](../experiments/EXP-20260926-004/plan.md) | (a) P-a 支持: VCAM1 は 3 seed とも DE 10 遺伝子すべてを上回る（ただし DE の 3/10 が C1 を満たす → C1 は駆動因子に非特異） / (c-1) P-c1 支持: donor 集約でも C1〜C3-panel の判定は不変 / (c-2) 判定は 29 donor でも再現（VCAM1 は null 分位 1.0、HAVCR1 不合格）だが **split-half 0.53（DL-med 0.50）で 0.7 未満 → P-c2 は部分的に棄却**（donor を 14→29 に倍増しても順位の再現性は基準未満） | 2026-09-26 | PI 指示「(a)(b)(c) 全て実行」。**G1 未承認**（記録は Labretary）。(a)+(c-2) の GPU 実測 1.70 h（上限 ~2 h 以内）。結果: `experiments/EXP-20260926-004/{de_matched,donor_level,expanded}` |\n\n- Status の定義は `templates/hypothesis.md` を参照。`accepted` にできるのは PI（G1 ゲート）のみ\n- 共通の限界: TLS+/TLS− の組織学的ラベルは **どのデータにもない**。TLS 状態はすべて発現・組成からの推定（`outputs/literature/2026-09-25-tls-feasibility/feasibility.md`）\n"}]}, {"section": "実験 001 — 修復不全の近位尿細管で老化軸と LTβR を削除", "docs": [{"id": "experiments-EXP-20260926-001-plan-md", "label": "計画", "path": "experiments/EXP-20260926-001/plan.md", "kind": "md", "bytes": 15791, "body": "# EXP-20260926-001 実験計画 — CKD TLS-high 腎の aPT で TP53/CDKN1A/LTBR を delete すると PT_healthy へ近づくか（TLS-low と比べる）\n\n- 仮説: [HYP-20260925-01](../../hypotheses/HYP-20260925-01.md)（G1 採択 2026-09-26, PI）\n- 作成: Labretary（experiment-planner）/ 2026-09-26\n- 状態: **計画のみ。本番 ISP は未実行。** phase 0（入力作成・dry-run・事前チェック・精度ペア・時間計測）まで実施済み（結果は `results-phase0/`）\n\n## 1. 問い\n1. ヒト CKD 腎の aPT のうち、推定 TLS-high の donor に属する細胞（start）で TP53 / CDKN1A / LTBR を delete すると、CLS 埋め込みは PT_healthy（goal）の重心へ近づくか。近づく量は、発現頻度をマッチさせたランダム遺伝子の null より大きいか（run 1: `tls_high`）\n2. 同じ摂動を TLS-low の donor の aPT（alt）を start にしたとき（run 2: `tls_low`）と比べ、シフトは 1.2 倍以上か（文脈依存性）\n\nin silico の結果であり、支持されても「Geneformer の埋め込み空間でそう示唆される」以上のことは言わない。\n\n## 2. データ\n| 項目 | 値 |\n|---|---|\n| データセット | A2 KPMP v1.5 scRNA（Lake 2023, `data/raw/kidney_tls/A2_KPMP_v1.5_scRNA_Lake2023.h5ad`, 読み取り専用。raw.X の整数カウントを使用） |\n| 前処理 | `scripts/geneformer/prepare_h5ad.py` → `work/input.h5ad`（17,684 細胞 × 30,635 遺伝子）→ tokenize（V2, 4,096 トークン）→ `work/tokenized.dataset` |\n| 細胞数（start / goal / alt） | **7,533（14 donor）/ 6,149（22 donor）/ 4,002（8 donor）** — 仮説の値と一致（`work/input.summary.json`） |\n| 状態ラベル列 | `isp_state`（**推定ラベル**。下表） |\n| フィルタ | author_cell_type ∈ {aPT, PT-S1/S2, PT-S3}、disease ∈ {CKD, normal}。CKD の TLS-mid donor の aPT と CKD の PT-S1/S2・S3 は除外 |\n| 分割（FT する場合） | FT なし（Pretrained） |\n\n**ラベルの由来（どれが推定か）**\n| ラベル | 定義 | 由来 |\n|---|---|---|\n| `author_cell_type`（aPT, PT-S1/S2, PT-S3） | 著者のアノテーション | Lake 2023（著者） |\n| `disease`（CKD / normal） | CELLxGENE メタデータ | データ提供者 |\n| `TLS_group`（high / mid / low） | donor 単位 pseudo-bulk の TLS 8 遺伝子スコアの三分位（基準 = 300 細胞以上の donor） | **推定**（`outputs/literature/2026-09-25-tls-feasibility/donor_A2.csv` の `TLS_group` 列をそのまま写した。再定義していない） |\n| `isp_state` | aPT_CKD_TLShigh = aPT ∧ CKD ∧ TLS high / aPT_CKD_TLSlow = aPT ∧ CKD ∧ TLS low / PT_healthy = (PT-S1/S2 ∨ PT-S3) ∧ normal（TLS 群は問わない。hyp_state_counts.csv と同じ 6,149 細胞） | **推定**（上の組み合わせ。組織学的な TLS ではない） |\n\n## 3. モデル\n- Geneformer-V2-316M（Pretrained）、`emb_mode: cls`（V2 必須）、emb_layer −1\n- device: mps（Apple M4 Pro 64 GB）、**dtype: bf16**（forward bf16 + コサイン fp32）。**PI 決定（2026-09-26「bf16 を標準に」）**。phase 0c では fp32 と Spearman 0.879（../Geneformer の基準 0.98 未達）、上位 5 一致 5/5・符号 10/10。順位の細部には bf16 由来の誤差（mean|Δ| = mean|shift| の 7%）が乗ることを限界としてレポートに明記する\n- `compute.cache_model: true`（遺伝子ごとのモデル再ロードをやめた。phase 0 で使用）\n- `perturbation.nproc: 1`（MPS 使用後の fork で datasets.map が落ちるため。guardrails 2026-09-26）\n\n## 4. Perturbation 設計\n- `perturb_type: delete`、1 遺伝子ずつ（`genes/<ENSG>/`）\n- 対象 5: TP53, CDKN1A, LTBR（新規予測）, SPP1, LCN2（データ駆動の参照）\n- **細胞の選び方（遺伝子ごと・seed ごと, `cell_selection`）**\n  - Geneformer の InSilicoPerturber は「start 状態 → 対象遺伝子が入力に含まれる細胞 → `max_ncells`（shuffle seed=42 固定）」の順に絞る。つまり発現細胞だけが残り、`max_ncells` は発現細胞での絞り込みの**後**にかかるが、**donor 上限はなく、seed で変わらない**（`in_silico_perturber.py` `apply_additional_filters`, `perturber_utils.downsample_and_sort`）\n  - そこで run_isp.py 側で、start 細胞のうち遺伝子が tokenized 入力に含まれる細胞から、**donor あたり ≤15、合計 ≤100** を seed ごとに抽出して小さな dataset を作り、perturber には `max_ncells=None` で渡す（`select_cells`）。30 細胞未満しか取れない遺伝子は実行せず記録\n  - 細胞の順は perturber と同じ `pu.downsample_and_sort` で並べて `*.cells.csv` に記録し、raw pickle（細胞ごとのコサイン変化）と対応付けて `genes/<ENSG>/cells.csv`（donor_id, shift_goal, shift_start, shift_alt）を保存。→ donor ブートストラップが可能\n  - 実測（TLS-high, seed 0）: 対象・対照 10 遺伝子すべてで 100 細胞 / 12〜14 donor を確保（入力に含まれる細胞数: TP53 1,058, CDKN1A 533, LTBR 1,594, SPP1 5,713, LCN2 449, VCAM1 4,674, HAVCR1 659）\n- **状態重心（`state_embs`）**: seed ごとに状態あたり ≤500 細胞・donor あたり ≤60 で抽出（seed 0: 500 / 500 / 405）\n- run 1 `tls_high`: start = aPT_CKD_TLShigh, goal = PT_healthy, alt = [aPT_CKD_TLSlow]\n- run 2 `tls_low`: start = aPT_CKD_TLSlow, goal = PT_healthy, alt = [aPT_CKD_TLShigh]（同じ遺伝子・同じ手順）\n- 実行: `run_isp.py --config experiments/EXP-20260926-001/config.yaml --run tls_high`（次に `--run tls_low`）\n\n## 5. コントロール\n- ポジティブ: VCAM1, HAVCR1（delete で aPT → 健常側、既知の再確認）\n- ネガティブ（null）: **発現頻度マッチのランダム 20 遺伝子を seed ごとに抽出**（`controls.negative_sampler: freq_matched`）。候補 = start 細胞のうち 300 細胞以上で入力に含まれる遺伝子（9,530 個）から対象・陽性・HK を除く。対象 5 遺伝子を順に参照し、発現細胞数の比が 1/1.5〜1.5 倍の候補から各 4 個（seed 0 の発現細胞数: 353〜6,478）\n- ハウスキーピング: ACTB, GAPDH, PPIA（role = `housekeeping`。非特異的なシフトの参照で、null には入れない）\n- 状態のコントロール: alt 方向・start 方向のシフトも細胞ごとに記録（「別の aPT 状態へ動いただけ」でないかの確認）\n\n## 6. 評価指標と判定基準（事前登録。仮説からそのまま転記）\n- 指標: goal_state_shift = PT_healthy 重心へのコサイン類似度の増加の細胞平均（`shift_goal_mean`, stats の `Shift_to_goal_end` と一致を確認済み）\n- **主要**: TP53, CDKN1A, LTBR のそれぞれで、shift が同 seed のランダム 20 遺伝子の null の上位 5% に入り（経験的 p）、対象 5 遺伝子で BH-FDR < 0.05。3 seed のうち 2 以上で成立\n- **文脈依存性（run 2）**: shift(TLS-high) / shift(TLS-low) ≥ 1.2 かつ donor 単位ブートストラップ 95% CI が 1 を含まない\n- **参照**: SPP1 / LCN2 は VCAM1 / HAVCR1 と同程度（null の上位 10% 以内）\n- **反証**: TP53, CDKN1A, LTBR が 3 seed すべてで null の 80 パーセンタイル以下、または向きが逆 → 主要予測は棄却。比の CI が 1 を含む → 文脈依存性は棄却\n- **inconclusive**: 陽性対照（VCAM1, HAVCR1）が null の上位 10% に入らない → パイプライン・状態定義を見直す\n- 計算: `validate_isp.py --exp experiments/EXP-20260926-001 --results results/tls_high --config experiments/EXP-20260926-001/config.yaml --alt-results results/tls_low`（seed ごとの経験的 p・null 内分位・BH、seed 一致数、陽性対照、比と donor ブートストラップ CI（2,000 回, 同一細胞は seed 間で平均してから donor を run ごとに復元抽出））\n\n**⚠ G2 前に PI の判断が必要な点（設計上の問題。基準は変更していない）**\n1. **経験的 p の下限**: null が 20 遺伝子だと p の最小値は 1/21 = 0.048。対象 5 遺伝子で BH をかけると、**5 遺伝子すべてが null の最大値を超えた場合にしか FDR < 0.05 にならない**（1 遺伝子だけなら q ≥ 0.24）。選択肢: (a) null を ≥100 遺伝子に増やす（run 1 で +8,000 細胞×遺伝子/seed... 計 +24,000、+4.1 h）、(b) null の正規近似 p を FDR に使う（validate_isp.py は `p_norm`/`fdr_norm` も出力済み）、(c) FDR をやめ「上位 5% ＋ 2/3 seed」だけにする。推奨は (b)＋上位 5% を併記（追加コストなし）\n2. **非特異的な削除ドリフト**: phase 0c（陽性対照・HK・ランダム 10 遺伝子）では、**全遺伝子の delete が goal・start・alt の 3 重心すべてへのコサインを同程度下げた**（shift_goal −1.0×10⁻⁴〜−4.6×10⁻⁴, 1 seed, n = 100 細胞/遺伝子）。VCAM1（−1.1×10⁻⁴）・HAVCR1（−1.4×10⁻⁴）は HK・ランダムと区別できなかった。このままでは陽性対照が上位 10% に入らず **inconclusive** になる可能性が高い。副次指標として「特異的シフト」= shift_goal − shift_start（または − shift_alt）を**本番前に**事前登録するか判断してほしい（cells.csv に必要な列はすべて保存される。主要基準は変えない）\n\n## 7. 頑健性チェック\n- 3 seed（seed ごとに遺伝子ごとの細胞抽出・ランダム 20 遺伝子・重心の細胞が変わる）。run 間 Spearman（validate_isp.py 既存）\n- 発現頻度と shift の相関（交絡チェック, 既存）\n- donor 数: TLS-low は 8 donor のみ → run 2 は 1 遺伝子あたり最大 8×15 = 120 細胞、LCN2（TLS-low CKD aPT で 87 細胞）は 100 に届かない\n- 精度: bf16 vs fp32 の matched pair（§8, phase 0c）\n\n## 8. 計算量見積もり（phase 0 の実測, MPS）\n**phase 0 の結果（`results-phase0/`）**\n| 項目 | 結果 |\n|---|---|\n| a. 入力作成 + dry-run | 17,684 細胞（5 秒）、dry-run OK（`logs/EXP-20260926-001-phase0-{prepare,dryrun}.log`） |\n| b. 事前チェック（CLS, LR, 5-fold） | start vs goal: donor 分割 **AUC 1.00 ± 0.00**（層化 1.00）→ 0.8 以上で ISP 可。start vs alt: donor 分割 **AUC 0.627 ± 0.206**（fold 0.34〜0.83, 層化 0.899 ± 0.025）→ 0.6 以上で run 2 可だが境界的（n = 500 / 500 / 405 細胞、14 / 22 / 8 donor。`results-phase0/precheck/precheck.json`） |\n| c. bf16 vs fp32（10 遺伝子 × 100 細胞, 1 seed, 重心 200 細胞/状態） | **Spearman 0.879（基準 0.98 未達）**、上位 5 一致 5/5、符号一致 10/10（中央値超でも 5/5）、mean|Δ| 1.23×10⁻⁵ / mean|shift| 1.77×10⁻⁴ = 7.0%。細胞単位では Spearman 0.677（n = 1,000）。速度差は 1.33 倍 → PI 決定により **本番は bf16**（`results-phase0/precision_bf16_vs_fp32.json`） |\n| d. 時間（モデルロード除く） | 1 細胞×1 遺伝子あたり **fp32 0.822 s / bf16 0.616 s**（モデル再ロードは cache_model で 0 s）。状態重心は 0.244 s/細胞（fp32） |\n\n**本番の見積もり**\n| run | 遺伝子 | 1 遺伝子あたり細胞（実測の抽出数） | seed | 細胞×遺伝子 | ISP | 重心 | 計 |\n|---|---|---|---|---|---|---|---|\n| 1 `tls_high` | 30（対象 5 + 陽性 2 + HK 3 + ランダム 20） | 100（全遺伝子で 100 / 12〜14 donor） | 3 | 9,000 | 2.05 h | 0.29 h | **2.34 h** |\n| 2 `tls_low` | 30 | 平均 88（TP53 89, CDKN1A 69, LTBR 100, SPP1 100, LCN2 48, VCAM1 100, HAVCR1 62, HK 100, ランダム平均 92。donor は 6〜8） | 3 | 約 7,900 | 1.81 h | 0.29 h | **2.09 h** |\n| 合計 | | | | 約 16,900 | | | **約 4.4 h（fp32 換算）→ bf16 で約 3.3 h（MPS）** |\n\n- 摂動対象の細胞は延べ 16,900 細胞×遺伝子（ユニーク細胞は run 1 で最大 7,533、run 2 で 4,002 → **どちらも 1 万細胞未満**）\n- bf16（PI 決定）で約 3.3 h（0.616/0.822 s で換算。dry-run の見積もり 5.1 h（fp32）との差は未確認）。いずれにせよ 2 h 超のため **G2 必須**\n- 精度の補強策: 主要な結論（対象 5 遺伝子が null 上位 5% に入るか）について、境界付近（null 分位 90〜99%）の遺伝子のみ fp32 で再計算して判定が変わらないことを確認する（追加 ~0.3 h）\n- 重心の抽出は run 1 と run 2 で同じ細胞（同一 seed）なので、実装上は再利用できれば −0.29 h\n\n**G2 判定**: **必要**。基準のうち「GPU 2 時間超」に該当する（実測ベース 4.4 h、run 1 単独でも 2.34 h）。1 万細胞超・全遺伝子スクリーニングには該当しない。`run_isp.py --dry-run` の判定も `needs_G2_approval: true`\n\n## 9. 想定される失敗と対策\n| 失敗 | 対策 |\n|---|---|\n| 陽性対照が上位 10% に入らない（削除ドリフトが支配的, §6-2） | inconclusive として報告。事前登録した副次指標（採用された場合）を併記。状態定義・emb_layer の見直しは別実験 |\n| TLS-high と TLS-low の分離が donor 依存（AUC 0.63、fold 0.34〜0.83） | run 2 の比は donor ブートストラップ CI を主に見る。CI が広ければ「判定不能」と書く（棄却とは区別） |\n| 発現細胞が足りない遺伝子（run 2 の LCN2 は TLS-low で 87 細胞、`min_cells_per_gene: 30` 未満なら skip） | 実際の n を summary.csv / cells.csv に記録し、n の異なる遺伝子を同列に比較しない |\n| null 20 遺伝子では FDR が原理的に出ない（§6-1） | G2 で方針を確定してから本番を回す |\n| MPS で 2 ジョブ同時実行 | run 1 → run 2 を逐次実行する。夜間キューに入れる場合も直列 |\n| 途中で落ちた場合 | 遺伝子ディレクトリ単位で再開できる（stats と cells.csv が揃った遺伝子は skip） |\n| ambient RNA（IL7R/LTB/CCL19 の aPT 陽性） | 今回の対象遺伝子には含めていない。解釈時に言及 |\n\n## 10. 承認\n- G1（仮説採択）: 済（2026-09-26, PI）\n- G2（計画承認）: 済（2026-09-26, PI）\n\n### G2 で確定した事項（2026-09-26、本番データを見る前に登録）\n1. **精度**: bf16（forward bf16 + コサイン fp32）。PI 決定。phase 0c で fp32 と Spearman 0.879（基準 0.98 未達）→ 限界として明記し、判定境界付近（null 分位 90〜99%）の遺伝子は fp32 で再計算して判定が変わらないか確認する\n2. **FDR**: null 20 遺伝子の正規近似 p（`p_norm`）に BH（対象 5 遺伝子）をかける。経験的分位（null 上位 5%）も併記する（§6-1 の選択肢 b）\n3. **指標**: `shift_goal` に加えて **`shift_goal_minus_start`（細胞ごとに goal 方向シフト − start 方向シフト）を主要指標として追加**（§6-2）。\n   - 経緯: phase 0c で、全遺伝子の delete が goal/start/alt の 3 重心へ同程度の負シフトを示し、陽性対照 VCAM1/HAVCR1 が HK・ランダムと区別できなかった（削除ドリフト）。差分はこの一様成分を差し引く。phase 0（本番とは別の抽出・1 seed・10 遺伝子）を見て追加したことをレポートに明記する\n   - 判定規則は §6 と同じ（null 上位 5%・FDR < 0.05・3 seed 中 2 以上・陽性対照は上位 10%）を両指標に適用し、両指標で結論が分かれた場合はその旨を報告する\n4. 実行: run 1（tls_high）→ run 2（tls_low）を逐次。見積もり約 3.3〜3.9 h（bf16, MPS）\n\nApproved-by: PetadimensionLab (PI), 2026-09-26 — G2 承認（上記 1〜4 を含む）\n"}, {"id": "experiments-EXP-20260926-001-validation-md", "label": "検証", "path": "experiments/EXP-20260926-001/validation.md", "kind": "md", "bytes": 7946, "body": "# EXP-20260926-001 検証（validation）\n\n- 仮説: HYP-20260925-01（CKD の TLS-high 腎で aPT の TP53/CDKN1A/LTBR を delete → 健常 PT へ近づき、TLS-low より効果が大きい）\n- 作成: Labretary（validator 解析: `validation-analysis/`、指標: `results/*/validation_metrics.json`）/ 2026-09-26\n- 実行条件: Geneformer V2-316M、MPS、bf16（forward bf16 + コサイン fp32, PI 決定）、3 seed × 100 細胞/遺伝子（donor ≤ 15）、run 1（tls_high）1 h 55 min、run 2（tls_low）1 h 39 min\n- すべて in silico の予測であり、生物学的事実ではない\n\n## 1. 結論\n\n**主要予測（TP53 / CDKN1A / LTBR の delete で aPT_CKD_TLShigh が PT_healthy へ近づく）は、事前登録した 2 指標のどちらでも支持されなかった。** 3 遺伝子とも、判定条件（null 上位 5% かつ FDR_norm < 0.05）を満たした seed は 0/3（FDR_norm の最小 0.23）。\n\n| 指標 | 事前登録規則の機械的な適用 | 陽性対照 | Labretary の評価 |\n|---|---|---|---|\n| shift_goal | **inconclusive**（HAVCR1 が上位 10% に 1/3 seed。fp32 再計算では VCAM1 も 1/3 に下がり 2 つとも不合格） | 不合格 | inconclusive |\n| shift_goal_minus_start | **refuted**（陽性対照 2/2 合格、主要 3 遺伝子は棄却条件に該当） | 合格（3/3） | **inconclusive 寄り**（下記） |\n\n差分指標で陽性対照が「合格」したが、ハウスキーピング遺伝子 GAPDH・PPIA も同じ指標で 3/3 seed とも null 上位 10%（分位 1.00）に入った。陽性対照の合格は特異的な信号を示さず、パイプラインが「goal へ近づく遺伝子」を検出できることの確認になっていない。したがって、規則上は refuted だが、**「主要遺伝子に効果がない」と積極的に言えるだけの検出力が示されていない**。総合評価は「支持されない（判定不能寄り）」とし、確定は G3 で PI が判断する。\n\n**文脈依存性（TLS-high > TLS-low）**: 符号を確認する修正後の判定で、どの遺伝子も基準を満たさなかった。LTBR の比 1.96（95% CI 1.02–4.27）は分子・分母ともに負（−3.25×10⁻⁴ / −1.65×10⁻⁴）で、仮説と逆向き（TLS-high の方が健常から大きく離れる）。他は CI に 1 を含むか極端に広い。plan §9 に従い「判定不能」。\n\n## 2. 根拠\n\n### 2.1 主要遺伝子と陽性対照（run 1: tls_high, 3 seed）\n| 遺伝子 | 役割 | shift_goal 平均 ± SD | null 分位（seed 0/1/2） | FDR_norm | shift_goal_minus_start 平均 ± SD | null 分位 | FDR_norm |\n|---|---|---|---|---|---|---|---|\n| TP53 | 対象 | −2.45×10⁻⁴ ± 3.3×10⁻⁵ | 0.55 / 0.45 / 0.35 | 0.48–0.58 | −2.65×10⁻⁵ ± 1.3×10⁻⁵ | 0.85 / 0.85 / 0.60 | 0.39–0.46 |\n| CDKN1A | 対象 | −2.07×10⁻⁴ ± 4.1×10⁻⁵ | 0.55 / 0.50 / 0.95 | 0.23–0.49 | −3.98×10⁻⁵ ± 9.7×10⁻⁶ | 0.50 / 0.30 / 0.80 | 0.46–0.56 |\n| LTBR | 対象 | −3.09×10⁻⁴ ± 1.0×10⁻⁴ | 0.10 / 0.50 / 0.35 | 0.48–0.90 | −4.71×10⁻⁵ ± 1.0×10⁻⁵ | 0.45 / 0.30 / 0.60 | 0.46–0.59 |\n| VCAM1 | 陽性 | −1.47×10⁻⁴ ± 4.2×10⁻⁵ | 0.95 / 0.65 / 1.00 | — | −9.9×10⁻⁶ ± 6.3×10⁻⁶ | 0.95 / 0.90 / 0.95 | — |\n| HAVCR1 | 陽性 | −1.05×10⁻⁴ ± 8.0×10⁻⁵ | 0.85 / 0.80 / 1.00 | — | +1.13×10⁻⁵ ± 5.7×10⁻⁶ | 0.95 / 1.00 / 0.95 | — |\n| GAPDH | HK（陰性） | — | 0.90 / 1.00 / 1.00 | — | — | 1.00 / 1.00 / 1.00 | — |\n| PPIA | HK（陰性） | — | 0.85 / 1.00 / 1.00 | — | — | 1.00 / 1.00 / 1.00 | — |\n\nn = 100 細胞/遺伝子/seed、null = 発現頻度マッチのランダム 20 遺伝子（seed ごと）。FDR は対象 5 遺伝子内の BH（p_norm）。\n\n### 2.2 fp32 再計算（事前登録, run 1 の境界 10 組, 32.5 min）\n- 主要予測の判定は不変\n- 変化: shift_goal の VCAM1 が合格 → 不合格、差分指標の SPP1（参照）が 1/3 → 3/3\n- bf16 と fp32 の差: shift_goal で mean|Δ| 1.7×10⁻⁵（|shift| の約 15%）、差分指標で 8.2×10⁻⁶（約 59%）。HAVCR1 seed 0 は差分指標の符号が反転（`results-recheck-fp32/fp32_vs_bf16.csv`, `figures/fp32_recheck.png`）\n- 限界: fp32 の値は bf16 で計算した null と比較している\n\n## 3. チェックリスト\n| 項目 | 判定 | 詳細 |\n|---|---|---|\n| 陽性対照（shift_goal） | Fail | HAVCR1 1/3、fp32 で VCAM1 も 1/3 |\n| 陽性対照（差分指標） | Pass（非特異的） | 2/2 が 3/3 seed。ただし HK も同等以上 |\n| 陰性対照（HK） | **Fail** | GAPDH/PPIA が両指標で null 上位 10% に 2〜3/3 seed |\n| seed 間の頑健性（run 1） | Fail | shift_goal の seed 間 Spearman 最小 0.673（約 10 遺伝子のみ比較）。差分指標では 0.89–0.94 |\n| 交絡: 細胞の長さ | **Fail** | 遺伝子単位で長さと shift の Spearman −0.5〜−0.6、細胞内中央値 −0.29。長さ補正の探索解析でも主要 3 遺伝子は上位に入らない |\n| 交絡: 発現頻度 | run 1 Pass / run 2 Fail | Spearman 0.20 / 0.32 |\n| donor 依存性（LODO） | 結論は不変 | 主要予測が成立する seed は最大 0 のまま。CDKN1A の分位棄却のみ donor の抜き方に依存 |\n| 精度（bf16） | 注意 | 差分指標では閾値との差（~1×10⁻⁵）が bf16 誤差と同じ桁 |\n| 再現性 | Pass | config hash が env.json・results・現行 config で一致（実行後の編集なし）。git 管理外のため git_commit は空 |\n\n## 4. 限界\n1. **削除ドリフト**: run 1 の 90/90 の遺伝子×seed が goal・start・alt の 3 重心すべてから離れた（`figures/deletion_drift.png`）。1 遺伝子の delete が埋め込みを一様に動かす成分が支配的で、「null の上位」は「goal へ近づく」ではなく「ドリフトが小さい」ことを意味しうる（guardrails 追記済み）\n2. **TLS 対比の弱さ**: TLS-high と TLS-low の重心の距離（1 − cos = 0.0006）は start–goal（0.0073）の約 1/12、細胞ごとの start シフトと alt シフトの相関は 0.998。事前チェック AUC 0.627 ± 0.206 と合わせ、この状態定義では 2 群の対比にほとんど意味がない\n3. TLS-high / TLS-low は pseudo-bulk の組成から推定したラベルで、組織学的な TLS ではない\n4. 差分指標は phase 0 の結果を見てから追加した（本番データを見る前に G2 で登録）\n5. run 2 の CDKN1A（69 細胞・7 donor）、HAVCR1（62・7）、LCN2（48・6）は n が異なり、同列比較できない\n6. 精度は PI 決定により bf16（phase 0 で fp32 と Spearman 0.879、基準 0.98 未達）\n7. 多重比較は対象 5 遺伝子内のみ補正\n\n## 5. 次のアクション\n- **示唆されること**: この設計（CKD aPT、1 遺伝子 delete、CLS 埋め込み、推定 TLS 群）では、p53–p21 軸と LTβR の削除が健常 PT 方向への特異的な移動を生むという予測は支持されなかった。**示されたわけではないこと**: これらの遺伝子が生物学的に無関係であること\n1. 方法の改善（次の実験の前提）: 細胞長をマッチさせた null、HK を陰性対照の合否判定に含める、差分指標は null を含めて fp32 で再計算する\n2. 削除ドリフトの扱い: ドリフト成分（全遺伝子の平均シフト）を差し引いた指標、または emb_layer（中間層）や `cls_and_gene` での感度分析\n3. TLS の対比: 分離がはっきりした状態定義（例: 空間データ Meylan 2022 由来の TLS シグネチャー、または B/形質細胞の近接情報）で別実験として組み直す\n4. 仮説の扱い: G3 で PI が判定（refuted / inconclusive）。判定後に `hypotheses/tracker.md` を更新（Learning Protocol トリガー 5）\n"}, {"id": "experiments-EXP-20260926-001-report-md", "label": "レポート", "path": "experiments/EXP-20260926-001/report.md", "kind": "md", "bytes": 12962, "body": "# 実験レポート: EXP-20260926-001 — CKD 腎の修復不全型近位尿細管（aPT）における p53–p21 軸・LTβR 削除の in silico perturbation\n\n- Status: final\n- 仮説: [HYP-20260925-01](../../hypotheses/HYP-20260925-01.md) / 検証判定: **判定不能（inconclusive）**（テンプレートの Strong/Moderate/Weak/Refuted のいずれにも当てはめない）\n- G3 承認: PetadimensionLab (PI), 2026-09-26 — inconclusive\n- 作成: Labretary / 2026-09-26\n\n## 要旨（5 行以内）\nヒト CKD 腎（KPMP scRNA）の aPT で TP53・CDKN1A・LTBR を Geneformer 上で delete しても、健常 PT 方向への移動は事前登録した 2 指標のいずれでも支持されなかった（判定条件を満たした seed は 3 遺伝子とも 0/3）。ただし陽性対照がハウスキーピング遺伝子と区別できず、パイプラインの検出力が示されなかったため、結論は「判定不能」とした。主な原因は、どの遺伝子を削除しても埋め込みが全状態から一様に離れる「削除ドリフト」である。TLS-high と TLS-low の対比も、状態の分離が弱く意味をなさなかった。次の実験では削除ドリフトを差し引いた指標を開発する。\n\n## 1. 背景と仮説\n腎の三次リンパ組織（TLS/TLT）は加齢・障害腎で形成され、修復不全の尿細管と相互作用すると報告されている（Sato 2016, PMID 27699223; Yoshikawa 2023, PMID 37548710）。本実験は、細胞老化（p53–p21 軸）と TLS 由来シグナル（LTα1β2 の受容体 LTβR）が修復不全型 PT（aPT）の状態維持に関わるという仮説を in silico で検証した。\n\n仮説: CKD 腎の aPT において TP53・CDKN1A・LTBR を delete すると、細胞状態が aPT_CKD_TLShigh から PT_healthy へ近づき、その効果は TLS-low の CKD 腎の aPT より大きい（新規予測）。\n\n## 2. 方法\n### 2.1 データ\n- A2 KPMP v1.5 scRNA（Lake BB et al., *Nature* 2023, PMID 37468583, DOI 10.1038/s41586-023-05769-3）。CELLxGENE から取得（`data/raw/kidney_tls/SOURCES.md`）。CELLxGENE の方針により CC BY 4.0（データセット個別の表示は未確認）。KPMP の利用規約に従い謝辞を記載する\n- raw.X の整数カウントを使用し、`prepare_h5ad.py` で 17,684 細胞 × 30,635 遺伝子の入力を作成\n- 状態（**TLS 群は推定ラベル**。donor 単位 pseudo-bulk の TLS 8 遺伝子スコアの三分位。組織学的な TLS ではない）\n\n| 状態 | 定義 | 細胞数 / donor 数 |\n|---|---|---|\n| start: aPT_CKD_TLShigh | aPT ∧ CKD ∧ TLS high | 7,533 / 14 |\n| goal: PT_healthy | (PT-S1/S2 ∨ PT-S3) ∧ normal | 6,149 / 22 |\n| alt: aPT_CKD_TLSlow | aPT ∧ CKD ∧ TLS low | 4,002 / 8 |\n\n### 2.2 モデルと perturbation 設定（config.yaml の要点）\n- Geneformer V2-316M（Pretrained）、`emb_mode: cls`、最終層、Apple M4 Pro の MPS\n- 精度: bf16（forward は bf16、コサイン比較は fp32）。**PI 決定**。phase 0 の bf16 と fp32 の比較では Spearman 0.879 で、../Geneformer の基準 0.98 に届いていない\n- `perturb_type: delete`、1 遺伝子ずつ。遺伝子ごと・seed ごとに、その遺伝子を発現している start 細胞から donor あたり ≤ 15、計 ≤ 100 細胞を抽出\n- run 1: start = TLS-high（alt = TLS-low）、run 2: start = TLS-low（文脈依存性の比較用）。seed 0/1/2\n- 対象 5 遺伝子: TP53, CDKN1A, LTBR（新規予測）、SPP1, LCN2（参照）\n\n### 2.3 コントロールと統計\n- 陽性対照: VCAM1（Kirita 2020, PMID 32571916）、HAVCR1（Lake 2023）\n- 陰性対照: 発現頻度をマッチさせたランダム 20 遺伝子（seed ごと）、ハウスキーピング ACTB, GAPDH, PPIA\n- 指標（事前登録）: `shift_goal`（goal 重心へのコサイン類似度の増加）と `shift_goal_minus_start`（goal 方向 − start 方向。phase 0 を見て追加したが、本番データを見る前の G2 で登録）\n- 判定: null 上位 5% かつ FDR < 0.05（null の正規近似 p に対象 5 遺伝子内で BH）を 3 seed 中 2 以上で満たせば支持。陽性対照は null 上位 10% に 3 seed 中 2 以上。文脈依存性は shift(TLS-high) / shift(TLS-low) ≥ 1.2 かつ donor ブートストラップ 95% CI の下限 > 1（両 shift が正であることを必須とする）\n\n## 3. 結果\n### 3.1 コントロールの挙動\n- 陽性対照: `shift_goal` では HAVCR1 が上位 10% に 1/3 seed のみ（fp32 再計算では VCAM1 も 1/3）→ 不合格。`shift_goal_minus_start` では VCAM1・HAVCR1 とも 3/3 seed で合格\n- **ハウスキーピング遺伝子も同じように上位に入った**: GAPDH・PPIA は `shift_goal_minus_start` で 3/3 seed とも null 分位 1.00、`shift_goal` でも 2〜3/3 seed で上位 10%。陽性対照の合格は特異的な信号を示していない\n- 削除ドリフト: run 1 の遺伝子 × seed 90/90 が goal・start・alt の 3 重心すべてから離れた（`figures/deletion_drift.png`）\n\n### 3.2 主要結果（図表）\nrun 1（tls_high）、各遺伝子 100 細胞 × 3 seed。平均 ± SD は seed 間。\n\n| 遺伝子 | shift_goal 平均 ± SD | null 分位（seed 0/1/2） | shift_goal_minus_start 平均 ± SD | null 分位 | 判定条件を満たした seed |\n|---|---|---|---|---|---|\n| TP53 | −2.45×10⁻⁴ ± 3.3×10⁻⁵ | 0.55 / 0.45 / 0.35 | −2.65×10⁻⁵ ± 1.3×10⁻⁵ | 0.85 / 0.85 / 0.60 | 0/3（両指標） |\n| CDKN1A | −2.07×10⁻⁴ ± 4.1×10⁻⁵ | 0.55 / 0.50 / 0.95 | −3.98×10⁻⁵ ± 9.7×10⁻⁶ | 0.50 / 0.30 / 0.80 | 0/3（両指標） |\n| LTBR | −3.09×10⁻⁴ ± 1.0×10⁻⁴ | 0.10 / 0.50 / 0.35 | −4.71×10⁻⁵ ± 1.0×10⁻⁵ | 0.45 / 0.30 / 0.60 | 0/3（両指標） |\n\n- FDR（p_norm, BH）の最小は 0.23（CDKN1A, shift_goal, seed 2）\n- 事前登録規則の機械的な適用: `shift_goal` は陽性対照不合格のため inconclusive、`shift_goal_minus_start` は refuted。ただし後者の陽性対照の合格はハウスキーピング遺伝子と区別できないため、総合判定は inconclusive（G3）\n- 文脈依存性: 基準を満たした遺伝子なし。LTBR の比 1.96（95% CI 1.02–4.27）は分子・分母ともに負（−3.25×10⁻⁴ / −1.65×10⁻⁴）で、TLS-high の aPT の方が健常から大きく離れることを意味し、仮説と逆向き\n- 図: `figures/null_vs_genes_tls_high.png`, `figures/null_vs_genes_tls_low.png`, `figures/fp32_recheck.png`\n\n### 3.3 頑健性\n- seed 間の Spearman（run 1, shift_goal）: 0.745 / 0.718 / 0.673（最小 0.673 < 0.7）。差分指標では 0.89–0.94。run 2 は最小 0.736\n- donor を 1 人ずつ除いた解析: 主要予測が成立する seed は最大 0 のままで結論は変わらない。CDKN1A の分位による棄却のみ donor の抜き方に依存\n- fp32 再計算（事前登録、run 1 の境界にある 10 組、32.5 分）: 主要予測の判定は変わらなかった。変化は `shift_goal` の VCAM1（合格 → 不合格）と差分指標の SPP1（1/3 → 3/3）。bf16 と fp32 の差は `shift_goal` で mean|Δ| 1.7×10⁻⁵（|shift| の約 15%）、差分指標で 8.2×10⁻⁶（約 59%）、HAVCR1 seed 0 で差分指標の符号が反転\n\n## 4. 検証（validation.md の要約）\n| 項目 | 判定 |\n|---|---|\n| 陽性対照（shift_goal / 差分指標） | Fail / Pass（非特異的） |\n| 陰性対照（HK が null 内に収まるか） | Fail |\n| seed 間の頑健性（run 1） | Fail（最小 0.673） |\n| 交絡: 細胞の長さ | Fail（遺伝子単位の Spearman −0.5〜−0.6） |\n| 交絡: 発現頻度 | run 1 Pass（0.20）/ run 2 Fail（0.32） |\n| donor 依存性 | 結論は不変 |\n| 再現性 | Pass（config hash 一致、実行後の編集なし） |\n\n詳細は [validation.md](validation.md)。\n\n## 5. 考察\n- この設計では、p53–p21 軸と LTβR の削除が aPT を健常 PT 方向へ特異的に動かすという予測は**支持されなかった**。ただし、陽性対照がハウスキーピング遺伝子と区別できなかったため、「これらの遺伝子に効果がない」ことが**示されたわけではない**\n- 主因は削除ドリフトと考えられる。1 遺伝子の delete は入力トークン列を変え、CLS 埋め込みを全状態から一様に遠ざける。この一様成分が遺伝子特異的な方向の変化（|shift| ~10⁻⁵）より大きく、null との比較が「goal に近づくか」ではなく「ドリフトが小さいか」を測ってしまう。細胞の長さ（トークン数）と shift の相関もこの解釈と整合する\n- TLS-high と TLS-low の重心間距離（1 − cos = 0.0006）は start–goal（0.0073）の約 1/12 で、細胞ごとの start 方向と alt 方向のシフトの相関は 0.998。事前チェックの AUC 0.627 ± 0.206 と合わせ、推定 TLS 群による aPT の対比は埋め込み上ほとんど区別できない。文脈依存性の検証には、分離がはっきりした状態定義が必要と示唆される\n\n## 6. 限界\n- in silico perturbation はモデルが学習した発現共変動に基づく予測であり、因果関係を直接示すものではない\n- TLS 群は pseudo-bulk の組成から推定したラベルで、組織学的な TLS ではない\n- 精度は PI 決定により bf16。差分指標では判定閾値との差（~1×10⁻⁵）が bf16 の誤差と同じ桁。fp32 再計算は境界の遺伝子のみで、null は bf16 のまま比較した\n- 差分指標は phase 0 の結果を見てから追加した（本番データを見る前に G2 で登録）\n- run 2 の CDKN1A（69 細胞・7 donor）、HAVCR1（62・7）、LCN2（48・6）は細胞数が異なり、同列比較できない\n- 多重比較は対象 5 遺伝子内のみで補正。seed 間の頑健性の比較は約 10 遺伝子に限られる\n- 仮説設計からの逸脱: dtype を bf16 に固定（PI 決定）、`nproc` を 8 → 1（MPS 使用後の fork で停止するため）、FDR を経験的 p ではなく正規近似 p で計算（null 20 遺伝子では経験的 p の下限が 0.048 のため、G2 で決定）\n\n## 7. 次のアクション（in silico / wet）\n- **in silico（PI が指定した次の実験, EXP-20260926-002）**: 削除による一様な効果を差し引いた指標を開発する。既存の細胞ごとのシフトによる補正（null 平均の差し引き、細胞長ごとの標準化など）と、摂動前後の埋め込みベクトルから共通のドリフト方向を除いて goal 方向に射影する方法を、コントロールだけで評価して選ぶ（主要遺伝子は指標を決めるまで見ない）。結果はまだない\n- in silico（その後）: 細胞長をマッチさせた null、HK を陰性対照の合否判定に含める、TLS 状態を空間データ（Meylan 2022, PMID 35231421）由来のシグネチャーで定義し直す\n- wet（in silico で支持が得られた場合に検討）: ヒト近位尿細管細胞で修復不全・老化様の状態を誘導し、TP53/CDKN1A/LTBR の siRNA で HAVCR1・VCAM1・SA-β-gal の変化を見る（HYP-20260925-01 §「支持された場合の次の一手」）\n\n## 補足: 全 run の一覧（失敗 run を含む）\n| run | 内容 | 結果 |\n|---|---|---|\n| phase 0 a | 入力作成・dry-run | 成功 |\n| phase 0 b | 事前チェック（CLS 埋め込みの AUC） | 成功: start vs goal 1.00 ± 0.00、start vs alt 0.627 ± 0.206 |\n| phase 0 c（初回） | bf16 精度ペア（nproc 8） | **失敗**: 1 遺伝子目で datasets.map の子プロセスが停止（guardrails に記録。ログは残っていない） |\n| phase 0 c | bf16 と fp32 の精度ペア（nproc 1） | 成功: Spearman 0.879 |\n| 本番（初回） | run 1 | **失敗**: 実験ディレクトリに `logs/` がなく起動直後に停止（計算は行われていない） |\n| 本番 run 1 | tls_high, 3 seed | 成功（1 h 55 min） |\n| 本番 run 2 | tls_low, 3 seed | 成功（1 h 39 min） |\n| fp32 再計算 | run 1 の境界 10 組 | 成功（32.5 min） |\n\n## 再現情報\n- config: `config.yaml`（sha256: c5e72b5ff4e4e89b4e609e40518d775a9595810be5e82cc48990dcd6f7a58863。env.json・results・現行 config で一致）\n- env: `results/env.json`（2026-09-26 01:53:39 記録。macOS 27.0 arm64、Apple M4 Pro、Python 3.12.13、torch 2.14.0、transformers 4.46.3、datasets 4.0.0、geneformer 0.1.0）\n- git commit: なし（プロジェクトは git 管理外）\n- 解析コード: `scripts/geneformer/prepare_h5ad.py`, `scripts/geneformer/run_isp.py`, `scripts/analysis/validate_isp.py`, `validation-analysis/*.py`\n\nKPMP 謝辞: KPMP 所定の謝辞文を掲載すること（**文言は KPMP の利用規約で要確認。本レポートでは未確認**）。\n"}]}, {"section": "実験 002 — 一様な削除効果を差し引く指標の開発", "docs": [{"id": "experiments-EXP-20260926-002-plan-md", "label": "計画", "path": "experiments/EXP-20260926-002/plan.md", "kind": "md", "bytes": 21537, "body": "# EXP-20260926-002 実験計画 — 削除ドリフトを差し引いた摂動指標の開発と検証（方法検証実験）\n\n- 仮説: [HYP-20260926-01](../../hypotheses/HYP-20260926-01.md)（方法仮説, **Status: proposed。G1 未承認**。PI が採択するまで本番 run は行わない）\n- 起点: EXP-20260926-001（HYP-20260925-01, G3 inconclusive）。PI 指示（2026-09-26）「次の実験は、まず、削除による一様な効果を差し引いた指標にしてください」\n- 作成: Labretary（experiment-planner / phase 0 は simulation-engineer）/ 2026-09-26\n- 状態: **計画のみ**。phase 0 まで実施済み: (1) EXP-001 の cells.csv の再解析（GPU なし）、(2) ベクトル取り出しの小規模 run（対照のみ, seed 0, 34 min, G2 未満）\n\n## 1. 問い\n1. 1 遺伝子 delete で、すべての遺伝子が goal・start・alt の全重心から離れる「削除ドリフト」を差し引くと、陽性対照（VCAM1, HAVCR1）がランダム null とハウスキーピング遺伝子（HK: ACTB, GAPDH, PPIA）の両方から分離する指標は作れるか\n2. その指標は細胞長・発現頻度の交絡が小さく、seed や細胞の抽出に対して安定か\n3. コサイン変化だけ（EXP-001 の保存物）で足りるか、摂動変位ベクトル（e_pert − e_orig）が必要か\n\n方法の検証であり、生物学的な仮説の検証ではない。主要対象（TP53/CDKN1A/LTBR）の再評価は、指標が決まり PI が承認した後に行う（§4.3）。\n\n## 2. データ\n| 項目 | 値 |\n|---|---|\n| データセット | A2 KPMP v1.5 scRNA（Lake 2023）。EXP-20260926-001 と同じ入力（`work/input.h5ad` → EXP-001 への symlink、読み取りのみ） |\n| tokenized | `work/tokenized.dataset` = EXP-001 の tokenized の複製（データ部分のみ APFS clone。sha256 `ba3a14c0…` 一致）。EXP-001 のディレクトリには書き込まない（datasets が cache-*.arrow を dataset ディレクトリに書くため、他実験の dataset を直接指さない） |\n| 細胞数（start / goal / alt） | 7,533（14 donor）/ 6,149（22 donor）/ 4,002（8 donor） |\n| 状態ラベル列 | `isp_state`（**推定ラベル**: aPT_CKD_TLShigh / PT_healthy / aPT_CKD_TLSlow。EXP-001 plan §2） |\n| フィルタ | EXP-001 と同じ |\n| 分割（FT する場合） | FT なし |\n\n## 3. モデル\n- Geneformer-V2-316M（Pretrained）、`emb_mode: cls`、emb_layer −1\n- device: mps（M4 Pro）、**dtype: bf16**（PI 標準）。forward bf16、コサインは fp32（`apply_dtype`）、取り出したベクトルは fp32 で保存し解析は float64\n- `compute.cache_model: true`、`perturbation.nproc: 1`（guardrails）\n\n## 4. Perturbation 設計\n### 4.1 phase 0（実施済み, `phase0/config-vector-phase0.yaml`）\n- delete、対照のみ 25 遺伝子（陽性 2 + HK 3 + EXP-001 run 1 seed 0 の null 20 遺伝子をそのまま `negative_sampler.method: explicit` で指定）、seed 0、100 細胞/遺伝子（donor ≤ 15）\n- 細胞の抽出は EXP-001 と同じ規則・同じ seed → **2,500/2,500 行で cell_uid が一致し、shift_goal は EXP-001 と完全一致（最大差 0.0）**\n- `capture.embeddings: true`（新機能, §11）で元/摂動後の CLS 埋め込みと状態重心を保存\n\n### 4.2 本番（計画, `config.yaml`。G1・G2 承認待ち）\n- **対照のみの確認 run**: 陽性 2 + HK 3 + 発現頻度マッチ null 20（頻度の参照は EXP-001 の対象 5 遺伝子。`ref_genes` は回さず null からも除く）\n- **200 細胞/遺伝子（donor ≤ 25）**、**新しい seed 3, 4, 5**（EXP-001・phase 0 と独立）、tls_high のみ、capture on\n- 目的: §6.4 で事前登録した指標（主: a2）を独立なデータで確認し、合否を確定する\n\n### 4.3 主要対象の再評価（本番の合格後、PI 承認を得てから）\n- a2 はコサインだけで計算できるので、まず **EXP-001 の cells.csv（3 seed × 2 run）に a2 を適用**（GPU 0 h）。判定規則は EXP-001 §6 と同じ（null 上位 5%・FDR_norm < 0.05・3 seed 中 2）を a2 に置き換えて適用\n- 次に、200 細胞/遺伝子・seed 3–5 で対象 5 遺伝子を追加（本番の null と同じ run 構成に `genes_to_perturb` を足して再開。対照は再計算されない）: 5 × 200 × 3 = 3,000 細胞×遺伝子 → 約 0.6 h\n- 本番で a2 が不合格なら主要対象の再評価は行わない（HYP-20260926-01 の反証条件）\n\n## 5. コントロール\n- ポジティブ: VCAM1、HAVCR1（EXP-001 と同じ。根拠は HYP-20260925-01）\n- ネガティブ: 発現頻度マッチのランダム null 20 遺伝子（seed ごと）\n- ハウスキーピング: ACTB, GAPDH, PPIA — **今回は合否判定（C2, C3）に含める**（EXP-001 の教訓）\n- 状態の対照: goal・start・alt 方向のシフトをすべて記録\n\n## 6. 評価指標と判定基準（事前登録）\n\n> §6.0〜6.2 は **指標を計算する前に記入**した（2026-09-26 午前, 再解析スクリプト実行前）。以降の結果で基準は変更していない。\n\n### 6.0 盲検化\n- 指標の選定は **対照遺伝子だけ**（陽性 VCAM1/HAVCR1、HK GAPDH/PPIA/ACTB、発現頻度マッチのランダム null）で行う。主要対象 TP53/CDKN1A/LTBR と参照 SPP1/LCN2 の行は、解析スクリプトで読み込み直後に除外し（`assert` で確認）、新しい指標の値は計算していない。phase 0 の run でも主要対象・参照は回していない（`controls_only: true`）\n- 部分的な盲検であること: EXP-20260926-001 の `shift_goal` と `shift_goal_minus_start`（本計画の raw と d）については、主要対象の結果を Labretary も PI も既に見ている。新しい候補指標（a〜c, V 系）については主要対象の値を計算していない\n\n### 6.1 候補指標\n- raw: `shift_goal`（EXP-001 の主要指標）\n- d: `shift_goal − shift_start`（EXP-001 で G2 に追加した差分指標。ベースライン）\n- a1: 細胞ごとの null 平均を引く（同じ細胞を摂動した null 遺伝子の shift_goal の平均）。重なりが足りない細胞は a2 で代替\n- a2: 細胞長ビン（null 細胞の長さ 5 分位）ごとの null 平均 shift_goal を引く\n- b: null の細胞で shift_goal ~ shift_start + shift_alt を最小二乗で当て（run ごと）、残差の細胞平均\n- c: 長さビンごとの null の平均・SD で shift_goal を z 化\n- 各指標の null は、null 遺伝子自身の評価では leave-one-gene-out で推定\n- （計算時に追加した同系統の変種: a3 = log 長 + donor の回帰で null を引く、a4 = log 長 + 削除位置の回帰、d2/d4 = d に a2/a4 と同じ補正）\n\n### 6.2 方法妥当性の基準（対照のみ。run 1 tls_high が主、run 2 tls_low は再現確認）\n| # | 基準 | 合格ライン |\n|---|---|---|\n| C1 | 陽性 vs null | VCAM1・HAVCR1 がそれぞれ同 seed の null の上位 10%（分位 ≥ 0.90）に 3 seed 中 2 以上 |\n| C2 | 陽性 vs HK | 陽性 2 × HK 3 × 3 seed = 18 組のうち陽性 > HK が 15 組以上（≥ 83%） |\n| C3 | HK は null の中 | GAPDH・PPIA・ACTB の null 分位が 0.10〜0.90 の範囲に 3 seed 中 2 以上（3 遺伝子すべて） |\n| C4 | 安定性 | (i) seed 内で donor を 2 群に分けた split-half の遺伝子順位 Spearman（25 遺伝子, 20 回平均）≥ 0.7、(ii) seed 間で固定対照 5 遺伝子の順位 Spearman 平均 ≥ 0.7（参考, n = 5） |\n| C5 | 交絡 | 遺伝子×seed 単位の指標と平均細胞長・発現細胞数の Spearman |ρ| ≤ 0.3。細胞単位（遺伝子内）の長さとの Spearman 中央値 |ρ| ≤ 0.2 |\n| 付記 | null の中心 | null の負の割合を記録（補正後は 0.5 付近が期待値。合否には使わない） |\n\n- **選定規則**: C1〜C3 をすべて満たし、C4・C5 の合格数が最も多い指標を採用。同数なら C2 の陽性−HK 差（null SD 単位）が大きい方。C1〜C3 を満たす指標がなければ「コサインのみの補正では不十分」と結論し、ベクトル水準の補正（phase 0）に進む\n- ベクトル水準の指標（摂動変位 Δ から一般的な削除方向を除いて start→goal 方向へ射影）も phase 0（seed 0, 同じ細胞, 対照のみ）で C1〜C3・C4(i)・C5 により評価（1 seed なので C1/C3 は 1/1 を合格とする）\n\n### 6.3 結果（phase 0。`results/reanalysis/criteria.csv`, `phase0/results-phase0/vector/criteria.csv`）\n\n**(A) コサインのみの再解析（EXP-001 の cells.csv, 3 seed × 100 細胞/遺伝子, 対照 + null 20）**\n- a1（同一細胞の null 平均）は **実行不能**: run 1 で 3 つ以上の null 遺伝子に摂動された細胞は 1,671 細胞中 41、対照の行で null の相手が 3 つ以上あるのは 0.8〜1.2%（run 2 でも 29〜33%）\n- 主な数値（run 1 tls_high。分位は 3 seed 平均）:\n\n| 指標 | VCAM1 / HAVCR1 分位 | C2 陽性>HK | ACTB / GAPDH / PPIA 分位 | split-half ρ | 長さ ρ（遺伝子） | null 負の割合 | 合格 |\n|---|---|---|---|---|---|---|---|\n| raw | 0.87 / 0.88 | 8/18 | 0.62 / 0.97 / 0.95 | 0.34 | −0.53 | 1.00 | 0/5 |\n| d（ベースライン） | 0.93 / 0.97 | 5/18 | 0.87 / 1.00 / 1.00 | 0.51 | −0.56 | 0.93 | C1 |\n| **a2** | **0.70** / 0.98 | **13/18** | 0.23 / 0.73 / 0.75 | 0.38 | **0.09** | 0.42 | **C3, C5** |\n| c | 0.65 / 0.98 | 10/18 | 0.03 / 0.90 / 1.00 | 0.43 | 0.02 | 0.38 | C5 |\n| a3 | 0.42 / 0.87 | 13/18 | 0.27 / 0.58 / 0.73 | 0.26 | 0.12 | 0.43 | C3 |\n| a4 | 0.55 / 0.85 | 12/18 | 0.55 / 0.80 / 0.77 | 0.37 | −0.18 | 0.45 | C3 |\n| b | 0.77 / 0.93 | 3/18 | 0.95 / 1.00 / 0.98 | 0.48 | −0.49 | 0.50 | 0/5 |\n| d2 | 0.88 / 0.98 | 7/18 | 0.45 / 1.00 / 0.98 | 0.45 | −0.29 | 0.42 | C1, C5 |\n\n  run 2（tls_low）でも同じ傾向: a2 は C2 14/18・C3・C5 合格、C1 は VCAM1 0.77 で不合格。a4 は C2 15/18・C3 合格（C1 不合格）\n- **C1〜C3 をすべて満たす指標はなかった**（選定規則により「コサインのみの補正では不十分」→ ベクトル水準へ）\n\n**(B) ベクトル水準（phase 0, seed 0, 25 遺伝子 × 100 細胞, 同じ細胞）**\n- 取り出しは正確: ベクトルから計算した shift と perturber の値の最大差 3.1×10⁻⁷（mean|shift_goal| 3.9×10⁻⁴）。同じ細胞の元埋め込みは遺伝子間で一致（1 − cos ≤ 4×10⁻¹⁶, 387 細胞）\n- ドリフトの成り立ち（null 2,000 細胞）: null の平均 shift_goal −2.68×10⁻⁴ のうち **56%（−1.51×10⁻⁴）は Δ の半径成分（ê0 方向 = cos(e0,e1) − 1 ≈ −|Δ|²/2）**、つまり「どの向きに動いても元の位置の近くにある重心すべてから離れる」2 次の項。平均変位の大きさは個々の変位の 28%（0.0040 / 0.0141）、全体ドリフト方向の成分は変位の分散の 8.5% だけ\n- 指標（C1〜C3・C4(i)・C5, 1 seed）:\n\n| 指標 | VCAM1 / HAVCR1 | C2 陽性>HK | ACTB / GAPDH / PPIA | split-half ρ | 長さ ρ | null 負 | 合格 |\n|---|---|---|---|---|---|---|---|\n| V0: Δ·u（補正なし, u = start→goal） | 0.95 / 0.95 | 1/6 | 0.95 / 1.00 / 1.00 | 0.63 | −0.67 | 0.95 | C1 |\n| V1: 全体ドリフト方向を除去 | 0.65 / 0.95 | 1/6 | 0.90 / 1.00 / 1.00 | 0.43 | −0.45 | 0.50 | 0/5 |\n| V2: 平均ドリフトを減算 | 0.95 / 0.95 | 1/6 | 0.95 / 1.00 / 1.00 | 0.65 | −0.67 | 0.45 | C1 |\n| V3: 局所ドリフト（kNN 50）を減算 | 0.80 / 1.00 | 2/6 | 0.80 / 1.00 / 1.00 | 0.51 | −0.49 | 0.50 | 0/5 |\n| V4: ドリフト部分空間（上位 3 PC）を除去 | 0.50 / 0.95 | 2/6 | 0.00 / 1.00 / 0.95 | 0.45 | −0.37 | 0.50 | 0/5 |\n| （同じ細胞のコサイン指標）a2 | 0.95 / 0.95 | **6/6** | 0.10 / 0.65 / 0.65 | 0.43 | −0.07 | 0.45 | **C1, C2, C3, C5** |\n| d | 0.95 / 0.95 | 1/6 | 0.95 / 1.00 / 1.00 | 0.63 | −0.67 | 0.95 | C1 |\n\n- 事後（V0〜V4 を見た後に追加。選定には使わない）: V2L（長さビン別の平均ドリフトを減算）= d2 と同じ順位、接平面射影 T_u、向きだけの cos(Δ,u) — いずれも GAPDH/PPIA が null 最上位のまま（C2 2/6, C3 不合格）\n\n**(C) 解釈**\n1. ドリフト自体は差し引ける: null の負の割合は raw 1.00 → a2・b・V1〜V4 で 0.42〜0.50（中心化される）\n2. しかし **start→goal 軸（d, V 系）では、ドリフトを除いても GAPDH・PPIA が null の最上位に残る**。seed 0 で GAPDH の delete は 80%、PPIA は 71% の細胞で Δ が goal 側を向く（null 中央値 43%）。一様なドリフトでは説明できず、**HK の delete が埋め込み空間で start→goal 軸に沿った方向性の変化を持つ**ことが示唆される。HK は rank 符号化上も状態中立でない（入力内の相対位置 aPT − PT_healthy: GAPDH +0.14、PPIA −0.16、null 20 遺伝子の中央値 +0.03。1,500 細胞ずつ）\n3. ベクトル水準の補正は、軸への射影ではコサイン差分 d とほぼ同じ情報しか持たない（d は Δ·(ĝ − ŝ) の 1 次近似。V0 と d の結果は一致）。ベクトルは「ドリフトの成り立ち」の診断には有用だが、今回の基準では指標を改善しなかった\n4. HK を null 内に戻せたのは **goal 方向だけを見て細胞長ビンで null を差し引く a2 系**だけ（run 1・run 2・phase 0 の 3 データで C2・C3・C5 合格）。a2 の弱点は C1（VCAM1: 3 seed 平均 0.70 / 0.77、phase 0 では 0.95）と **C4（split-half ρ 0.06〜0.43）**\n5. 全指標共通の制約: 100 細胞/遺伝子では split-half ρ が 0.26〜0.65 にとどまり、null・対照の遺伝子間差の多くが細胞抽出のばらつきで決まっている（C4 は全指標で不合格）\n\n### 6.4 本番（§4.2）で確認する事前登録（本番データを見る前, 2026-09-26）\n- **主指標: a2**（長さ 5 分位ビンごとの null 平均 shift_goal を細胞ごとに引き、遺伝子で平均）。選定理由: C1〜C3 を 3 seed で満たす指標はなかったが、C2・C3・C5 を 3 データすべてで満たした唯一の指標で、残る不合格（C1 の VCAM1、C4）はいずれも細胞数不足で説明しうる。ベクトル指標は HK を分離できず採用しない\n- 副指標（比較のみ）: raw, d, d2, c, V2, V2L\n- 合否: §6.2 の C1〜C5 をそのまま適用（seed 3–5, 200 細胞/遺伝子）。**C1〜C3 を満たせば a2 を「採用可」、C4・C5 も満たせば「確定」**。C1〜C3 のどれかが不合格 → HYP-20260926-01 は棄却（この系・この埋め込みでは補正後も陽性対照の特異的信号を検出できない）→ 主要対象の再評価は行わず、陽性対照か goal の定義を見直す\n- split-half ρ の予測（Spearman-Brown, 50 細胞の半分で 0.43 → 200 細胞）: 0.75\n- 補足解析（合否に使わない）: HK の方向性（Δ が goal 側を向く細胞の割合）、半径成分の割合、細胞長ビン数 3/5/10 での感度\n\n## 7. 頑健性チェック\n- seed 3–5（遺伝子ごとの細胞抽出・null 20 遺伝子・重心の細胞が seed ごとに変わる）\n- split-half（donor 単位）と seed 間の順位一致（C4）\n- 長さビン数の感度（3 / 5 / 10）、leave-one-gene-out の null 推定\n- 精度: bf16（PI 標準）。EXP-001 の fp32 再計算で差分指標の bf16 誤差は |shift| の約 59% だった → a2 の判定が境界（分位 0.85〜0.95）の対照は fp32 で再計算して判定が変わらないか確認（最大 5 遺伝子×200 細胞×1 seed ≈ 0.25 h）\n\n## 8. 計算量見積もり（MPS 実測）\n**phase 0 の実測**（`phase0/results-phase0/timing.jsonl`）: 重心 280 s（1,405 細胞）、ISP 25 遺伝子 × 100 細胞 = 2,500 細胞×遺伝子で 1,709 s → **0.684 s/細胞×遺伝子（bf16, capture 込み。EXP-001 の 0.616 s より 11% 遅い）**、合計 34 min。埋め込みの保存は 25 遺伝子で 23 MB\n\n| run | 内容 | 細胞×遺伝子 | ISP | 重心 | 計 | G2 |\n|---|---|---|---|---|---|---|\n| 本番（§4.2） | 対照 25 遺伝子 × 200 細胞 × 3 seed（seed 3–5） | 15,000 | 2.85 h | 0.23 h | **約 3.1 h（dry-run 3.28 h）** | **必要**（2 h 超） |\n| 代替（G2 不要） | 対照 25 × 100 細胞 × seed 1, 2（EXP-001 と同じ細胞, capture） | 5,000 | 0.95 h | 0.16 h | 約 1.1 h | 不要 |\n| 主要対象の再評価 1（§4.3） | EXP-001 cells.csv に a2 を適用 | 0 | — | — | 数分（CPU） | 不要（ただし PI 承認後） |\n| 主要対象の再評価 2（§4.3） | 対象 5 × 200 × 3 seed | 3,000 | 0.57 h | 0（再利用） | 約 0.6 h | 不要（本番の合格と PI 承認後） |\n\n- 1 万細胞超・全遺伝子スクリーニングには該当しない（ユニーク細胞は最大 7,533）\n- **推奨は本番（3.1 h, G2 必要）**。代替案は安いが、100 細胞では split-half ρ ≈ 0.6 と予測され C4 を満たせない見込みが高く、判定が再び「不能」になりやすい\n\n## 9. 想定される失敗と対策\n| 失敗 | 対策 |\n|---|---|\n| a2 が本番でも C1（VCAM1）不合格 | 棄却として報告。陽性対照の妥当性（VCAM1 は aPT での検出率 62% だが PT_healthy でも 6%）や goal 定義の見直しを次の案にする |\n| HK が再び null 上位（C3 不合格） | HK の方向性（§6.3 C-2）を報告し、「HK は start→goal 軸で中立ではない」可能性を PI に提示。基準の変更（状態中立な遺伝子を陰性対照にする等）は PI の判断を仰ぐ（本実験の中では変えない） |\n| 200 細胞に届かない遺伝子（HAVCR1 は発現細胞 659） | donor ≤ 25 で 14 donor なら 200 は確保できる見込み。届かなければ実数を記録（min 100） |\n| MPS で途中停止 | 遺伝子単位で再開可能（emb/pert.npy まで揃った遺伝子は skip） |\n| datasets の cache が他実験の dataset に書かれる | 本実験は複製した tokenized を使う（§2） |\n\n## 10. 承認\n- G1（HYP-20260926-01 の採択）: **未**（PI）\n- G1（HYP-20260926-01 採択）: 済（PI, 2026-09-26）\n- G2: PI は案 A・案 B の両方を確認したい意向。**まず案 B（G2 不要, 約 1.1 h）を実行**（2026-09-26）。案 A（3.1 h）は B の結果を見てから着手の確認をとる\n  - 案 B の config: `optionB/config-seed{1,2}.yaml`（phase 0 の config から seed と null 遺伝子だけを変更。null は EXP-001 run 1 の seed 1/2 の 20 遺伝子）。結果は `optionB/results-B/`\n  - 陰性対照の定義（HK の扱い）は PI 未回答のため、事前登録どおり GAPDH/PPIA/ACTB を C2/C3 に含めて判定する。発現差のない遺伝子による陰性対照は探索的に併記する\n- PI に判断してほしい点: (1) HYP-20260926-01 の採択、(2) 本番（200 細胞 × seed 3–5, 3.1 h）か代替（100 細胞 × seed 1–2, 1.1 h）か、(3) HK の方向性が確認された場合に陰性対照の定義を見直すか（本実験の基準は変えない）\n\n### 案 A の前に確定した事項（2026-09-26、案 A の結果を見る前に登録）\n1. **陰性対照パネル（C3-panel）を追加**: CERS4, TATDN1, IFT25, VAPA, PHPT1, ANAPC16, EEF1D（role `negctrl_panel`）。選定は発現データのみで、ISP の結果は使っていない（`outputs/literature/2026-09-26-negative-controls.md`, 規則 R1–R6）\n   - 判定: 7 遺伝子中 5 以上が、3 seed 中 2 以上で null 分位 0.10–0.90 に入る\n   - HK（ACTB/GAPDH/PPIA）の C3 は PI の方針どおり**残す**（C2 の比較対象も HK のまま）\n2. **探索枠**: RPS13, RPL32（role `explore_rp`）。報告のみで合否判定には使わない（発現が start で高く、同等性を示せなかったため）\n3. 実行: 34 遺伝子 × 200 細胞 × seed 3/4/5、bf16、約 4.3 h（dry-run）。案 B（100 細胞 × seed 1/2）の完了後に逐次実行（MPS は 1 ジョブで飽和するため並列にしない）\n4. 事前の HK 発現差（参考, 発現データのみ）: GAPDH log2FC −0.98（q<0.001）、PPIA +0.35（q=0.017, 頻度補正後 +0.02）、ACTB +0.78\n\nApproved-by: PetadimensionLab (PI), 2026-09-26 — G1（HYP-20260926-01）・G2（案 A 約 4.3 h、陰性対照パネル・C3-panel を含む）\n## 11. コード変更（`scripts/geneformer/run_isp.py`, 既定 off・後方互換）\n- `capture.embeddings: true`: `pu.quant_cos_sims` をラップし（geneformer 本体は無変更）、CLS モードの元/摂動後の埋め込みを `genes/<ENSG>/emb/{orig,pert}.npy`（fp32, cells.csv と同じ細胞順）、状態重心を `run-*/state_emb_vectors.npz` に保存。細胞数が cells.csv と合わなければ停止\n- `controls.negative_sampler.method: explicit`（null を固定リストで指定）、`ref_genes`（controls_only 時の頻度参照。回さず null からも除く）\n- `perturbation.controls_only: true`（`genes_to_perturb: []` で対照だけを回す）\n- 確認: `make demo` 通過、EXP-20260925-001・EXP-20260926-001 の config の dry-run 通過、phase 0 で EXP-001 の値を完全再現\n- 解析: `analysis/reanalysis_cosine.py`（コサイン候補, 盲検）、`analysis/vector_phase0.py`（ベクトル候補, phase 0）。本番用にはこれを seed 3–5 へ一般化して使う\n"}, {"id": "experiments-EXP-20260926-002-results-eval-README-md", "label": "結果（本実行）", "path": "experiments/EXP-20260926-002/results/eval/README.md", "kind": "md", "bytes": 2083, "body": "# 案 A の結果（対照のみ, 200 細胞 × seed 3/4/5, 34 遺伝子, bf16, 3 h 56 min）\n\n評価: `analysis/evaluate_controls.py --results results`（criteria.csv, gene_seed_metrics.csv）。すべて事前登録の基準（plan.md §6, §10）。\n\n## 主指標 a2（長さビンごとの null 平均を引く）\n| 基準 | 結果 | 判定 |\n|---|---|---|\n| C1 陽性対照が null 上位 10% | VCAM1 分位 0.667 / HAVCR1 0.783（3 seed 平均） | Fail |\n| C2 陽性 > HK が 15/18 以上 | 10/18 | Fail |\n| C3 HK が null 分位 0.10–0.90 | ACTB 0.217 / GAPDH 0.80 / PPIA 0.867 | Pass |\n| C3-panel 7 遺伝子中 5 以上が範囲内 | 7/7 | Pass |\n| C4 split-half ρ ≥ 0.7 | 0.319（200 細胞でも低い） | Fail |\n| C5 長さ・発現頻度と無相関 | ρ −0.058 | Pass |\n\n→ 事前登録の基準では、**HYP-20260926-01（補正指標で陽性対照が null と HK の両方から分離する）は a2 で支持されない**（C1・C2・C4 が不合格）。他の指標も C1〜C3 を同時に満たすものはない。\n\n## 補足（事実）\n- 陰性対照パネル 7 遺伝子は、ほぼすべての指標で null 内に収まった（6/7〜7/7）。GAPDH/PPIA は補正なしの指標で null 最上位（0.92–1.00）\n- split-half ρ は 100 細胞（案 B, 0.38）から 200 細胞（案 A, 0.32）でも改善しない → 不安定さの主因は細胞数ではなく donor 間の違いと示唆される\n\n## 探索的（事前登録していない。事後の比較）\n| 指標 | 陽性 > パネル | 陽性の null 分位（平均） | RP（RPS13/RPL32）の null 分位 |\n|---|---|---|---|\n| raw | 33/42 | 0.86 | 0.85–1.00 |\n| d | 40/42 | 0.95 | 0.95–1.00 |\n| a2 | 36/42 | 0.73 | 0.65–0.80 |\n| V4 | 40/42 | 0.94 | 0.60–1.00 |\n陽性対照はパネル（中立な陰性対照）より上に来ることが多いが、HK と RP も同様に上位に来るため、陽性対照の特異性は示されていない。\n\n## 評価基準の厳しさ\n[criteria-strictness.md](criteria-strictness.md)（PI の問いへの回答, 2026-09-26）\n"}, {"id": "experiments-EXP-20260926-002-results-eval-criteria-strictness-md", "label": "判定基準の厳しさの検討", "path": "experiments/EXP-20260926-002/results/eval/criteria-strictness.md", "kind": "md", "bytes": 3452, "body": "# 評価基準は厳しすぎたか（HYP-20260926-01, EXP-20260926-002 案 A）\n\n- 作成: Labretary / 2026-09-26（PI の問い「評価基準が厳しすぎるかどうか、厳しすぎないという根拠があれば示して」への回答。G3 で refuted と判定）\n- 対象: 主指標 a2、案 A（対照のみ, 200 細胞 × seed 3/4/5, Pretrained, bf16）。数値は `criteria.csv`, `gene_seed_metrics.csv` から計算\n\n## 結論\n**厳しすぎたとは言えない。** HK に依存しない基準（C1 と C4）だけでも否定になる。\nただし C2（陽性 > HK）は、比較相手の HK が start と goal で発現差を持つため、比較相手の選び方として厳しすぎた可能性がある。C2 を外しても結論は変わらない。\n\n## 根拠\n### 1. C1（陽性対照が null 上位 10%, 3 seed 中 2 以上）は偶然では通りにくいが、効果のある遺伝子には通りやすい\n- 効果のない遺伝子が偶然通る確率: 1 遺伝子 **5.5%**、陽性 2 つとも **0.3%**（null 20 遺伝子 → 上位 10% = 21 中上位 3）\n- 実測の a2 分位（seed 3/4/5）: VCAM1 **0.70 / 0.60 / 0.70**、HAVCR1 **0.90 / 0.70 / 0.75**\n\n| C1 の閾値 | VCAM1 | HAVCR1 | 効果のない遺伝子の偶然合格率（1 遺伝子 / 2 遺伝子とも） |\n|---|---|---|---|\n| 0.90（事前登録） | ✗ | ✗ | 5.5% / 0.3% |\n| 0.80 | ✗ | ✗ | — |\n| 0.75 | ✗ | ✓ | — |\n| 0.70 | ✓ | ✓ | **25.9% / 6.7%** |\n\n→ 両方が通るのは閾値 0.70 まで緩めたときだけで、その場合は効果のない遺伝子でも 26% が偶然通り、判定の意味がほとんどなくなる\n\n### 2. C4（split-half ρ ≥ 0.7）はどの指標も満たさない\n- 18 通りの指標の最大は **0.685**（指標 b）、a2 は **0.32**\n- 細胞数を 100（案 B, 0.38）→ 200（案 A, 0.32）に倍にしても改善しない → 順位は donor の分け方で入れ替わる（不安定さの主因は細胞数ではなく donor 間の違い）\n\n### 3. C1 と C4 を同時に満たす指標は 0\n- どちらも HK を使わない基準\n\n### 4. C2（陽性 > HK, 18 組中 15 以上）について\n- 比較相手の HK 自体が start–goal 間で発現差を持つ（GAPDH log2FC −0.98, q < 0.001）→ 比較相手として厳しすぎた可能性\n- ただし結果は **10/18** で、陽性と HK に差がないときの期待値とほぼ同じ（差がなくても 10/18 以上になる確率 **0.41**。事前登録の 15/18 以上は 0.004）\n- 事後の比較（事前登録外）: 陽性 > 陰性対照パネル 7 遺伝子は a2 で 36/42。ただし HK と RP も同様に上位に来るため、陽性対照の特異性は示されていない\n\n## 否定の範囲\n否定されたのは「この設計（Pretrained、1 遺伝子 delete、CLS 埋め込み）で、提案した補正指標を使えば陽性対照を分離できる」という主張。VCAM1・HAVCR1 に生物学的な意味がないことを示したわけではない。\n\n## 追記（EXP-20260926-003, FT モデル）\n同じ基準を FT モデルに当てはめると C2（16/18）・C3・C3-panel（7/7）は合格し、C1 は HAVCR1 だけが不合格（0.45 / 0.75 / 0.75）。基準は FT モデルでは大部分が満たせる水準であり、Pretrained で満たせなかったのは基準の厳しさではなくモデル側（削除ドリフト）の問題だったことを支持する。\n"}, {"id": "experiments-EXP-20260926-002-optionB-results-B-eval-README-md", "label": "結果（予備実行）", "path": "experiments/EXP-20260926-002/optionB/results-B/eval/README.md", "kind": "md", "bytes": 1009, "body": "# 案 B の結果（対照のみ, 100 細胞 × seed 1/2 + phase 0 の seed 0）\n\n- 評価: `analysis/evaluate_controls.py --results phase0/results-phase0 optionB/results-B`（criteria.csv）\n- **再現性**: 案 B は EXP-001 run 1 と同じ細胞・同じ null・同じ seed のため、shift_goal は EXP-001 と 5,000/5,000 行で完全一致（最大差 0.0）。したがってコサイン系指標（raw, d, a2 など）の判定は EXP-001 の再解析と**同一**で、独立な追加証拠にはならない\n- 新しい情報はベクトル系指標（V0–V5）の 3 seed 評価のみ: どれも C2（5–7/18）と C3（GAPDH/PPIA が null 分位 0.97–1.00）を満たさない\n- a2（推奨指標）: C3・C5 合格、C1（VCAM1 分位 0.70）・C2（13/18 < 15）・C4（split-half ρ 0.377）不合格\n- seed 1 の null が `screen` と記録されていた（seed を別プロセスで回したため）。評価では negatives.json で戻した。run_isp.py の summarize も修正済み\n"}, {"id": "experiments-EXP-20260926-002-results-eval-criteria-csv", "label": "判定表", "path": "experiments/EXP-20260926-002/results/eval/criteria.csv", "kind": "csv", "bytes": 3978, "body": "label,metric,null_frac_negative,n_seeds,C1_seeds,C1_pct_mean,C1,C3_seeds,C3_pct_mean,C3,C2_wins,C2_margin_nullSD,C2,C4i_splithalf_rho,C4ii_seed_rho_fixed5,C4,C5_rho_len_gene,C5_rho_det_gene,C5_rho_len_cell_median,C5,n_pass_C1_C3,n_pass_all,C3_panel,C3_panel_n_ok\nraw shift_goal,m_raw,1.0,3,VCAM1:2 HAVCR1:0,VCAM1:0.933 HAVCR1:0.783,False,ACTB:3 GAPDH:1 PPIA:0,ACTB:0.783 GAPDH:0.917 PPIA:1.0,False,5/18,-0.21,False,0.474,0.867,False,-0.669,0.54,-0.236,False,0,0,True,6/7\nd: goal−start,m_d,0.97,3,VCAM1:3 HAVCR1:3,VCAM1:0.95 HAVCR1:0.95,True,ACTB:1 GAPDH:0 PPIA:0,ACTB:0.917 GAPDH:1.0 PPIA:1.0,False,4/18,-1.18,False,0.616,0.8,False,-0.56,0.486,-0.231,False,1,1,True,6/7\na2: −null(長さビン),m_a2,0.32,3,VCAM1:0 HAVCR1:1,VCAM1:0.667 HAVCR1:0.783,False,ACTB:3 GAPDH:3 PPIA:2,ACTB:0.217 GAPDH:0.8 PPIA:0.867,True,10/18,0.31,False,0.319,0.4,False,-0.058,0.002,-0.058,True,1,2,True,7/7\nc: z(長さビン),m_c,0.27,3,VCAM1:2 HAVCR1:2,VCAM1:0.833 HAVCR1:0.917,True,ACTB:0 GAPDH:0 PPIA:0,ACTB:0.033 GAPDH:0.983 PPIA:1.0,False,6/18,0.47,False,0.487,0.933,False,-0.057,0.038,-0.056,True,1,2,True,7/7\na3: −null(log長+donor),m_a3,0.35,3,VCAM1:0 HAVCR1:2,VCAM1:0.617 HAVCR1:0.8,False,ACTB:3 GAPDH:2 PPIA:2,ACTB:0.183 GAPDH:0.717 PPIA:0.867,True,10/18,0.43,False,0.231,0.4,False,-0.009,-0.011,0.293,False,1,1,True,7/7\na4: −null(log長+削除位置),m_a4,0.42,3,VCAM1:1 HAVCR1:1,VCAM1:0.817 HAVCR1:0.75,False,ACTB:2 GAPDH:1 PPIA:1,ACTB:0.633 GAPDH:0.833 PPIA:0.883,False,11/18,0.08,False,0.5,-0.267,False,-0.422,0.34,0.302,False,0,0,True,7/7\n\"b: 残差(start,alt)\",m_b,0.55,3,VCAM1:2 HAVCR1:2,VCAM1:0.867 HAVCR1:0.917,True,ACTB:1 GAPDH:0 PPIA:0,ACTB:0.9 GAPDH:1.0 PPIA:0.983,False,2/18,-2.29,False,0.685,0.6,False,-0.339,0.378,-0.039,False,1,1,True,7/7\nd2: d−null(長さビン) ,False,-0.415,0.387,-0.196,False,1,1,True,7/7\n"}]}, {"section": "実験 003 — 追加学習済みモデルでの摂動", "docs": [{"id": "experiments-EXP-20260926-003-plan-md", "label": "計画", "path": "experiments/EXP-20260926-003/plan.md", "kind": "md", "bytes": 26823, "body": "# EXP-20260926-003 実験計画 — fine-tuned Geneformer CellClassifier による in silico perturbation（方法検証, 対照先行）\n\n- 仮説: [HYP-20260926-02](../../hypotheses/HYP-20260926-02.md)（方法仮説, **Status: proposed。G1 未承認**）\n- 起点: PI 指示（2026-09-26）「A の後に、そもそもファインチューニングをしていないと思うので、ファインチューニングをしたトレインドのモデルを使ったインシリコパーターベーションの実験を試みてください」。追加指示（同日）: **fine-tuning だけをリモートの NVIDIA GPU（Tailscale 経由）で行い、ISP は Mac（MPS）**\n- 作成: Labretary（experiment-planner）/ 2026-09-26\n- 状態: **計画のみ**。phase 0（CPU だけの準備・検証）まで実施。GPU/MPS は未使用（EXP-20260926-002 案 A が MPS で実行中のため）\n- 事前登録の時点: 本計画の基準（§6）は EXP-002 案 A の結果を見る前（2026-09-26 15:50 頃, 案 A 実行中）に記入した\n\n## 1. 問い\n1. 腎 PT の障害軸で fine-tuning した CellClassifier の埋め込みでは、1 遺伝子 delete の「削除ドリフト」が Pretrained より小さくなるか\n2. その埋め込みで、陽性対照（VCAM1, HAVCR1）が HK・陰性対照パネル・ランダム null から、EXP-002 と同じ事前登録基準（主指標 a2 の C1〜C3, C3-panel）で分離するか\n3. 同じ細胞・同じ遺伝子・同じ goal 重心定義の Pretrained と比べて改善するか\n\n方法の検証であり、生物学的な仮説の検証ではない。主要対象（TP53/CDKN1A/LTBR）と参照（SPP1/LCN2）は、対照が合格し PI が承認するまで回さない（盲検, `controls_only: true`）。\n\n## 2. データ\n| 項目 | 値 |\n|---|---|\n| データセット | A2 KPMP v1.5 scRNA（Lake 2023, PMID 37468583）。EXP-001/002 と同じ入力（`work/input.h5ad` → EXP-001 への symlink, 読み取りのみ） |\n| tokenized | `work/tokenized.dataset` = EXP-001 の tokenized のデータ部分だけを APFS clone（sha256 `ba3a14c0…` 一致を確認）。他実験の dataset を直接指さない（guardrails） |\n| 細胞数（start / goal / alt） | 7,533（14 donor）/ 6,149（22 donor）/ 4,002（8 donor）。3 状態は donor が重ならない（計 44 donor） |\n| 状態ラベル列 | `isp_state`（**推定ラベル**。TLS 群は donor 単位 pseudo-bulk の TLS スコア三分位で、組織学的な TLS ではない） |\n| フィルタ | EXP-001 と同じ |\n| 分割（FT する場合） | **ドナー単位**（§2.2）。held-out donor の細胞はリモートへ送らない |\n\n### 2.1 分類課題の選択: 2 クラス（aPT_CKD vs PT_healthy）\n- **採用**: `aPT_CKD`（学習は TLS-low の CKD donor の aPT のみ）vs `PT_healthy` の 2 クラス。TLS 群は ISP の start/alt の定義にだけ使う\n- 3 クラス（TLS-high / TLS-low / 健常）を採らない理由:\n  1. TLS-high vs TLS-low は凍結埋め込みで分離が弱い（事前チェック AUC 0.627 ± 0.206, 重心間距離は start–goal の 1/12）\n  2. TLS 群は donor 単位のラベル（14 + 8 donor）なので、donor 分割で学習すると donor の個性を学ぶだけになりやすく、held-out で評価できる donor が数人しか残らない\n  3. ISP の読み出しは start→goal（aPT→健常）方向なので、その軸を学習させるのが目的に合う\n- 広い PT 障害軸（他データの追加）は、同じ前処理・同じ donor 規約のデータがないため今回は採らない\n- 循環性: goal 方向の移動を、start と goal を分けるよう学習したモデルで読むことになる（Theodoris 2023 の ISP も同じ構造）。対策は HYP-20260926-02 §「循環性」: (i) 埋め込みの移動（主）と分類確率の変化（副）を両方出す、(ii) 特異性は HK・パネル・null との比較で判定、(iii) 同じ細胞での Pretrained 比較、(iv) ISP の細胞は FT に一切使わない donor、(v) マーカー除去効果の探索枠（§4.5, PI 判断）\n\n### 2.2 donor 分割（事前固定。config-finetune.yaml `split`, CPU で集計した実数）\n処理バッチ（`Sample####-EO1/2/3` は性別・年齢が異なる別人だが同じバッチ）は同じ分割に置く。ISP の start 状態（TLS-high）は **14 donor 全員を held-out**。\n\n| 分割 | 用途 | aPT | 健常 PT | 細胞（上限適用後） |\n|---|---|---|---|---|\n| train | 学習 | TLS-low 6 donor（31-10000, 31-10013, 29-10010, 28-11515, 29-10406, 28-10051）、donor ≤ 500 → **1,565** | 8 donor（164-10, 165-9, 164-3, Sample1157-EO1/2/3, PRE018-1, PRE062-1）、donor ≤ 250 → **1,571** | **3,136 / 14 donor**（長さ中央値 1,132, 平均 1,395 トークン, 計 4.37 M トークン） |\n| eval | early stopping・モデル選択 | TLS-low 2 donor（27-10053, 29-10386）≤ 60 → 120 | 5 donor（PRE019, PRE055-1, Sample1158-EO1/2/3）≤ 60 → 254 | 374 / 7 donor |\n| test（held-out） | ゲート評価・ISP | TLS-high **14 donor 全員**（ゲート用は ≤ 100 → 1,271。ISP は全 7,533 細胞から抽出） | 9 donor（PRE038, 164-6, PRE027, Sample1162-EO1/2, PRE98sc, Sample1153-EO1/2/3）。ゲート用 ≤ 100 → 811、利用可能 3,106 細胞 | ゲート用 2,082 / 23 donor |\n\n- ISP の細胞数: 案 A と同じ規則（200 細胞/遺伝子, donor ≤ 25）で、start は全員 held-out なので**案 A と同一の細胞**になる（CPU で確認: VCAM1・HAVCR1・GAPDH・PHPT1 の seed 3 で cell_uid が 200/200 一致, 13〜14 donor）\n- goal 重心: held-out の健常 9 donor から 500 細胞（donor ≤ 60。8 donor × 60 + 31 = 511 細胞が利用可能）\n- alt（TLS-low）の 8 donor は全員 FT の train/eval に使われている → alt 方向のシフトは参考値（a2 は goal 方向だけを使う）\n- bundle（リモートへ送る唯一のディレクトリ `transfer/bundle/`, 19.2 MiB）: train/eval の細胞だけ。prepare が書いた後に読み直して、held-out donor・start 状態・test と同じ細胞が 1 つもないことを assert。manifest には held-out の件数だけを書き ID は書かない\n- 注意（交絡）: 健常 PT の細胞は短い（長さ中央値 ~1,000 トークン）、aPT は donor により 710〜2,540。分類器が細胞長を手がかりにする恐れ → ゲートで「クラス内の P と長さの Spearman」を報告（合否には使わない）、ISP では C5 で確認\n\n## 3. モデル\n- 事前学習: Geneformer-V2-316M（18 層, hidden 1152, vocab 20,275, max 4,096 トークン）\n- fine-tuning: `BertForSequenceClassification`（2 クラス, 0 = aPT_CKD, 1 = PT_healthy）、下位 6 層凍結（埋め込みは学習, Geneformer Classifier と同じ）、実効バッチ 16、lr 5e-5 linear・warmup 10%、weight decay 0.001、最大 3 epoch、20 optimizer step ごとに eval（eval_loss）、early stopping patience 4、最良 checkpoint を採用、gradient checkpointing、bf16（PI 標準）、seed 42\n- 実行場所: **リモート NVIDIA GPU**（remote/README.md）。VRAM に合わせて micro-batch × 勾配累積だけを変える profile（vram16: 2×8, vram24: 4×4, vram48: 8×2, vram80: 16×1）。bf16 非対応の GPU では停止（`compute.bf16_unsupported: error`。fp16/fp32 は PI 判断）\n- ISP: FT 済みモデル（`models/ft-main/final`, `model.type: CellClassifier`, `num_classes: 2`）、`emb_mode: cls`、emb_layer −1、MPS・bf16 forward + fp32 コサイン、`cache_model: true`、`nproc: 1`（guardrails）\n- 比較: Pretrained（EXP-002 案 A と同じ設定）\n\n## 4. Perturbation 設計\n### 4.1 phase 0（実施済み, CPU のみ）\n- donor 分割の検証と bundle 作成（`finetune_classifier.py --stage prepare`）、train の dry-run（既定・vram24・mps_fallback）\n- CPU smoke: 小さなランダム BERT で train → 途中停止 → checkpoint から再開 → probe → evaluate を通した。**torch 2.14 + transformers 4.46.3 では checkpoint からの再開が `torch.load(weights_only=True)` の UnpicklingError で止まる**ことを発見し修正（numpy の型だけを許可。guardrails に記録）\n- run_isp.py の CellClassifier 経路を CPU smoke（小さな FT モデル, 3 遺伝子 × 6 細胞, forward_batch_size 4）: 取り出した logits が直接計算と一致（最大差 5.6×10⁻⁹、元と摂動後の差 ~10⁻⁶ より十分小さい）、goal 重心は held-out donor だけ\n- `make demo` 通過、既存 config（EXP-20260925-001, EXP-20260926-001/002 と 002 の案 B・phase 0）の dry-run 通過\n\n### 4.2 phase 1: fine-tuning（リモート GPU, G1・G2 承認後）\n1. remote/README.md 手順 0〜4（環境・転送・sha256 照合・dry-run）\n2. probe（20 optimizer step）で s/step とピークメモリを実測 → profile を確定\n3. 本番（`run_remote.sh train <profile>`）。中断時は同じコマンドで再開\n4. 結果を `models/ft-main/` へ戻し、`final/SHA256SUMS` を照合\n- ISP（Mac）とは別の機械なので、G2 承認後なら EXP-002 案 A の実行中でも開始できる\n\n### 4.3 phase 2: ゲート評価（Mac MPS, §6.1）\n- `--stage evaluate`: held-out 2,082 細胞で FT の P(PT_healthy) と、凍結 Pretrained の CLS 埋め込み（emb_layer −1）＋標準化ロジスティック回帰（C = 1, train と同じ 3,136 細胞で学習）を比較\n- NO-GO なら phase 3 以降は行わない\n\n### 4.4 phase 3–4: 対照の ISP（ゲート GO 後）\n- **phase 3（FT）**: `config.yaml`。案 A と同一の設計: delete、対照のみ 34 遺伝子（陽性 2 + HK 3 + パネル 7 + RP 2 + 発現頻度マッチ null 20）× 200 細胞（donor ≤ 25）× seed 3/4/5。null は案 A と同じ規則・同じ seed → 同じ 20 遺伝子。`capture.embeddings`（CLS）と新しい `capture.classifier_logits`（分類ヘッドの logits）を保存\n- **phase 4（Pretrained の対応比較）**: 案 A は同じ細胞・同じ遺伝子で元/摂動後の CLS 埋め込みを保存している（capture on）→ goal 重心だけを held-out 健常 9 donor の細胞で作り直し（Pretrained の EmbExtractor, seed 3–5 × 500 細胞 ≈ 0.1 h MPS）、shift_goal を埋め込みから再計算（CPU。EXP-002 で埋め込みからの再計算と perturber の値の差は最大 3.1×10⁻⁷）。再計算スクリプトは phase 4 の前に作る\n  - 代替: 案 A が未完了・capture 欠落なら `config-pretrained-matched.yaml`（同じ設計を Pretrained で再実行, 4.3 h, 別途 G2）\n  - 感度分析: 案 A 本来の goal 重心（全 22 donor）での Pretrained の結果も並べる（重心の定義の影響）\n\n### 4.5 探索（任意・PI 判断。合否に使わない）\n- マーカー除去効果の確認: start で陽性対照と同程度に上昇する（aPT vs 健常の発現差と発現細胞数でマッチした）非ドライバー 10 遺伝子を FT と Pretrained の両方で回す（各 10 × 200 × 3 seed ≈ 1.1 h, 計 2.3 h）。陽性対照がこれらを超えなければ、C1 の合格は「分類器がマーカーを使っている」ことの反映にすぎない\n- emb_layer 0（最終層）での FT の対照（1 seed, 34 × 200 ≈ 1.3 h）。Geneformer は訓練目的に近い問いには最終層を推奨\n\n### 4.6 主要対象（対照合格・PI 承認後）\n- 5 遺伝子 × 200 細胞 × seed 3–5 を FT モデルで追加（≈ 0.6 h）。判定は EXP-002 §4.3 と同じ規則を a2 に適用\n\n## 5. コントロール\n- ポジティブ: VCAM1、HAVCR1（EXP-001/002 と同じ）\n- ネガティブ: 発現頻度マッチのランダム null 20 遺伝子（seed ごと, 案 A と同一）\n- ハウスキーピング: ACTB, GAPDH, PPIA（**C2・C3 に含める**, PI 方針）\n- 陰性対照パネル: CERS4, TATDN1, IFT25, VAPA, PHPT1, ANAPC16, EEF1D（C3-panel。選定は発現データのみ, `outputs/literature/2026-09-26-negative-controls.md`）\n- 探索枠: RPS13, RPL32（報告のみ）\n- モデルの対照: 同じ細胞・同じ遺伝子・同じ goal 重心の Pretrained（phase 4）\n- 分類器の対照: 凍結埋め込み＋ロジスティック回帰（ゲート）\n\n## 6. 評価指標と判定基準（事前登録, 2026-09-26, 案 A の結果を見る前）\n### 6.1 ゲート（phase 2）: FT モデルを ISP に使ってよいか\nheld-out 23 donor（TLS-high aPT 1,271 細胞 + 健常 811 細胞）で、閾値 0.5:\n| # | 基準 | 合格ライン |\n|---|---|---|\n| G-a | AUROC | FT ≥ ベースライン（ベースライン ≥ 0.99 なら FT ≥ ベースライン − 0.01） |\n| G-b | macro-F1 | 同上 |\n| G-c | donor 別の最小正解率（≥ 20 細胞の donor） | FT ≥ 0.80 |\n- G-a〜G-c をすべて満たせば GO。1 つでも不合格なら FT モデルでの ISP は行わない（HYP-20260926-02 は inconclusive）\n- ベースラインは天井（事前チェックで start vs goal の donor 分割 AUC 1.00）に近いと予想されるため、「上回る」ではなく非劣性（margin 0.01）で判定する。PI 指示の「ベースラインに勝つ」を厳密に適用すると天井では判定不能になるため（§10 で PI に確認）\n- 報告のみ: log-loss、donor ブートストラップ 95% CI（1,000 回）、クラス内の P と細胞長の Spearman、eval（TLS-low）での値\n- 学習が max_steps で打ち切られた場合は `training_summary.json` の `truncated_by_max_steps` とともに報告（../Geneformer の 31% epoch 打ち切りの教訓）\n\n### 6.2 ISP（phase 3–4）: EXP-002 §6.2 / §6.4 と同一\n- **主指標 a2**（長さ 5 分位ビン［null 細胞で境界］ごとの null 平均 shift_goal を細胞ごとに引き、遺伝子で平均。null 遺伝子自身は leave-one-gene-out）\n- C1: VCAM1・HAVCR1 がそれぞれ同 seed の null の上位 10%（分位 ≥ 0.90）に 3 seed 中 2 以上\n- C2: 陽性 2 × HK 3 × 3 seed = 18 組のうち陽性 > HK が 15 組以上\n- C3: ACTB・GAPDH・PPIA がすべて null 分位 0.10〜0.90 に 3 seed 中 2 以上\n- C3-panel: パネル 7 遺伝子中 5 以上が 3 seed 中 2 以上で null 分位 0.10〜0.90\n- C4（参考）: split-half（donor 2 群, 20 回）の遺伝子順位 Spearman ≥ 0.7、seed 間（固定対照）≥ 0.7\n- C5（参考）: 遺伝子×seed 単位の指標と平均細胞長・発現細胞数の |ρ| ≤ 0.3、細胞単位の長さとの |ρ| 中央値 ≤ 0.2\n- 判定: **C1・C2・C3・C3-panel をすべて満たせば HYP-20260926-02 の P1 を支持**。1 つでも不合格なら棄却（§HYP 反証条件）\n- 副指標（比較のみ）: raw, d, d2, c, V2, V2L（EXP-002 と同じ）、**dP_goal_a2** = 細胞ごとの ΔP(PT_healthy) = softmax(logits_pert)[1] − softmax(logits_orig)[1] に a2 と同じ長さビン補正。C1〜C3・C3-panel を同様に計算して報告\n- P2（ドリフト）: 補正前 shift_goal の null 遺伝子×seed の負の割合、null 平均 shift_goal / (1 − cos(c_start, c_goal)) を FT と Pretrained（phase 4, 同じ細胞・同じ goal 重心）で比較\n- P3: C2 の勝ち数 FT ≥ Pretrained\n- 解析コード: EXP-002 の `analysis/evaluate_controls.py`（`reanalysis_cosine.py` の a2 実装）を EXP-003 のパスに向けて使う。dP_goal_a2 の追加以外は変更しない（phase 3 の前にコードを固定し sha256 を記録）\n- 盲検: 主要対象・参照は回さない（`controls_only: true`）。解析スクリプトでも読み込み直後に除外（assert）\n\n## 7. 頑健性チェック\n- seed 3–5（案 A と同じ細胞・同じ null。細胞は同じなので、FT と Pretrained の差は細胞の抽出ではなくモデルの差）\n- split-half（donor 単位）と seed 間の順位一致（C4）\n- goal 重心の定義（held-out 9 donor vs 全 22 donor）の感度（Pretrained 側, phase 4）\n- 長さビン数 3 / 5 / 10 の感度\n- 精度: bf16（PI 標準）。a2 の判定が境界（分位 0.85〜0.95）の対照は fp32 で再計算（最大 5 遺伝子 × 200 細胞 × 1 seed ≈ 0.25 h, MPS）\n- 学習の再現性: 学習 seed・データ順序は固定だが GPU の非決定性は残る。env.json（GPU・driver・CUDA・各版・geneformer の .py digest）で記録\n\n## 8. 計算量見積もり\n**リモート GPU の時間も G2 の対象**（CLAUDE.md §3 の「GPU 2 時間超」）。\n\n### 8.1 fine-tuning（phase 1）\n学習 1 epoch = 3,136 細胞・4.37 M トークン。演算量の目安: 1 トークンあたり順伝播 ~0.69 GFLOP（非埋め込み 287 M パラメータ + 長さ ~1,400 の注意）、逆伝播（上位 12 層は重み勾配あり、埋め込みを学習するので下位 6 層も入力勾配が通る）~1.15、gradient checkpointing の再計算 ~0.69 → **~2.5 GFLOP/トークン、~11 PFLOP/epoch**。MPS の実測（../Geneformer: batch 2・2,767 トークンで ~10 s/step → 実効 ~1.4 TFLOPS）から逆算した MPS 1 epoch 2.2 h は dry-run の下限と一致。\n\n| 実行場所 | 仮定（実効性能） | 1 epoch | 最大 3 epoch + eval | 備考 |\n|---|---|---|---|---|\n| RTX 4090（24 GB, vram24） | bf16 165 TFLOPS の 10〜40% | 3〜18 min | **0.2〜0.9 h** | |\n| A100 / H100 級（vram48/80） | 312 / ~990 TFLOPS の 10〜40% | 1〜6 min | **0.1〜0.4 h** | |\n| 未知の GPU（aarch64 統合メモリ機など） | 30〜100 TFLOPS 相当の 10〜40% | 5〜60 min | 0.3〜3 h | probe で実測して確定 |\n| 環境構築・転送・probe・照合 | — | — | ~0.3 h（うち GPU ~0.1 h） | |\n| **MPS フォールバック（本構成）** | 実測 10 s/step | 2.2〜4.4 h | 6.6〜13 h | 非推奨 |\n| **MPS フォールバック（profile mps_fallback）** | 2,091 細胞、下位 12 層＋埋め込み凍結、1 epoch | — | **0.8〜1.6 h** | 逆伝播が上位 6 層だけになり ~45% 減。精度低下の恐れ |\n\n- 不確実性: GPU が未確定（Tailscale 上の候補機は 2026-09-26 時点でオフライン）。実効性能の幅（10〜40%）が最大の不確実性。**probe（20 step, 数分）の実測で本番の時間を確定してから開始**し、見積もりの 2 倍を超えたら中断して報告\n- 早期終了は eval_loss の改善が 80 step（~0.4 epoch）止まった時点。天井に近い課題なので 1 epoch 前後で止まる可能性が高い\n\n### 8.2 Mac（MPS）の時間\n| phase | 内容 | 計算 | 時間 |\n|---|---|---|---|\n| 2 | ゲート評価 | FT 予測 2,082 細胞 + Pretrained 埋め込み 5,218 細胞（~0.2 s/細胞） | ~0.5 h |\n| 3 | FT の対照 ISP | 34 遺伝子 × 200 × 3 seed = 20,400 細胞×遺伝子 × 0.684 s（案 A 実測, capture 込み）+ 重心 | **~4.3 h**（dry-run 4.30 h） |\n| 4 | Pretrained の goal 重心の再抽出 + 再計算 | 1,500 細胞 + CPU | ~0.1 h |\n| 4 代替 | Pretrained で再実行（案 A が使えない場合） | 20,400 | 4.3 h |\n| 4.5 任意 | DE マッチ探索（FT + Pretrained） | 2 × 6,000 | 2.3 h |\n| 4.5 任意 | emb_layer 0（1 seed） | 6,800 | 1.3 h |\n| 4.6 | 主要対象（対照合格・PI 承認後） | 3,000 | 0.6 h |\n\n### 8.3 合計（G2 の申請対象）\n- **必須: リモート GPU 0.1〜0.9 h（未知の GPU なら最大 ~3 h）+ Mac MPS 約 4.9 h（ゲート 0.5 + ISP 4.3 + 重心 0.1）= 約 5.0〜5.8 h**（GPU によっては最大 ~8 h）→ **G2 必要**（ISP 単独で 2 h 超）\n- リモートが使えず MPS フォールバックの場合: 0.8〜1.6 h + 4.9 h = 約 5.7〜6.5 h\n- 1 万細胞超・全遺伝子スクリーニングには該当しない（ユニーク細胞は ISP 最大 7,533、学習 3,136）\n- MPS は 1 ジョブで飽和するため Mac 側は逐次（EXP-002 案 A の完了後）。リモート FT は案 A と並行可\n\n## 9. 想定される失敗と対策\n| 失敗 | 対策 |\n|---|---|\n| ゲート不合格（FT がベースラインに劣る） | ISP は行わず inconclusive として報告。学習率・epoch の再検討は PI 判断（結果を見てからの調整は探索扱い） |\n| 打ち切り学習でベースライン以下（../Geneformer の 31% epoch の例） | max_steps は既定で使わない。打ち切った場合は truncated と明記 |\n| 分類器が細胞長を手がかりにする | ゲートでクラス内の P–長さ相関を報告、ISP で C5 と a2（長さビン補正）で確認 |\n| FT で alt（TLS-low）が学習データ | alt 方向は参考値。a2 は goal のみ |\n| 陽性対照の合格がマーカー除去効果 | §4.5 の DE マッチ探索（PI 判断）。結論の書き方を「分類器が依存する遺伝子」にとどめる |\n| リモートの接続断・OOM | step checkpoint（eval ごと）から同じコマンドで再開（CPU smoke で確認済み）。OOM は 1 段小さい profile（実効バッチ同じ） |\n| torch 2.14 の weights_only で再開不能 | 修正済み（numpy の型だけ許可） |\n| bf16 非対応 GPU | 停止して PI 判断（fp16 / fp32） |\n| torch 2.14.0 の wheel がリモートの arch/CUDA にない | 版を変えず報告し、逸脱として記録してから進める |\n| 転送の破損・取り違え | bundle・重み・返送モデルの sha256 を両側で照合（verify_sha256.py, run_remote.sh） |\n| held-out データの流出 | bundle は train/eval のみ（prepare で assert）。終了後にリモートの bundle と out を削除 |\n| 案 A が未完了・埋め込み欠落 | phase 4 は `config-pretrained-matched.yaml` の再実行（4.3 h, 別途 G2） |\n| MPS 使用後の fork 停止 | `nproc: 1`（guardrails） |\n\n## 10. 承認\n- G1（HYP-20260926-02 の採択）: **未**（PI）\n- G2: **済（PI, 2026-09-26「結果が出たら、ファインチューニングしたモデルで perturbation を行う」）**。ゲート GO を条件に phase 3（4.3 h）・phase 4（0.1 h）を実行。申請内容: リモート GPU の fine-tuning（probe 後に本番, 見積もり 0.1〜0.9 h・未知の GPU なら最大 ~3 h）＋ Mac のゲート評価 0.5 h・FT の対照 ISP 4.3 h・Pretrained 重心 0.1 h（計 約 5.0〜5.8 h）。phase 3（ISP）はゲート GO が条件\n- PI に判断してほしい点:\n  1. HYP-20260926-02 の採択（G1）と 2 クラス課題（aPT_CKD vs PT_healthy, TLS 群は ISP のみ）でよいか\n  2. ゲートの基準: ベースラインが天井（~1.0）の指標は「0.01 以内の非劣性」で GO としてよいか（厳密に「上回る」を求めると判定できない）\n  3. リモート GPU の機種・VRAM・OS（未確定）。torch 2.14.0 の wheel がない場合の扱い、bf16 非対応だった場合に fp16 か fp32 か\n  4. G2（上記の合計）。リモートが当面使えない場合に MPS フォールバック（縮小構成 0.8〜1.6 h）へ切り替えるか\n  5. 任意の探索（§4.5: DE マッチ 2.3 h、emb_layer 0 1.3 h）を加えるか\n\n### fine-tuning の実行記録（2026-09-26）\n- PI の実行指示（「実行して下さい」）に基づき、fine-tuning（リモート GPU, 見積もり ≤ 0.8 h）を実行。ゲート評価と ISP（Mac, 約 4.9 h）は G1（HYP-20260926-02）・G2 をゲート通過後に改めて確認する\n- 非劣性基準（0.01 以内）と任意の探索（なし）は Labretary 推奨どおり（PI 未回答のため既定値）\n- リモート: spark-cf5b（NVIDIA GB10, aarch64, 128 GB 統合メモリ, driver 595.58.03）。当初の coi-next1@100.94.57.17 は TCP 22 に到達できず断念\n- 環境の逸脱: リモートの既存 venv（~/workspace/Geneformer/.venv）を変更せずに使用 → torch 2.12.0+cu130 / transformers 4.57.6 / datasets 4.8.5 / accelerate 1.13.0（Mac: 2.14.0 / 4.46.3 / 4.0.0 / 1.15.0）。geneformer は Mac のパッチ済みパッケージを ~/labretary-ft/geneformer_pkg に置き PYTHONPATH で使用。モデル重みは Mac と sha256 一致\n- probe: 4.648 s/optimizer step（実効バッチ 16, vram80 = 16×1）、ピーク 12.15 GB / 121.7 GB、196 step/epoch → 1 epoch ≈ 0.25 h。本番開始 17:00（tmux）\n\n### 実行先の変更（2026-09-26, PI 方針「重い計算はリモートの DGX Spark 系」）\n- ゲート: **GO**（held-out 23 donor, 2,082 細胞。FT AUROC 1.0000 / macro-F1 0.9980 / 最小 donor 正解率 0.99、baseline AUROC 1.0000 / macro-F1 0.9930）\n- phase 3（FT の対照 ISP）は Mac ではなく spark-cf5b（CUDA, bf16）で実行。config は同一（LABRETARY_DEVICE=cuda で実行先だけ変更, device.json に記録）\n- **Pretrained の対応比較も同じ spark-cf5b で `config-pretrained-matched.yaml` を実行**（PI 承認 2026-09-26）。デバイスの違い（CUDA vs MPS）を比較から除くため。phase 4（Mac で案 A を再計算）はデバイス間の参考値として残す\n- 逸脱: リモートは datasets 4.8.5 のため、nproc ≤ 1 の map/filter を単一プロセスに強制（run_isp.py `single_process_datasets`）\n\nApproved-by: PetadimensionLab (PI), 2026-09-26 — G1（HYP-20260926-02）・G2（fine-tuning 実施済み、ゲート GO を条件に phase 3–4）\n\n## 11. コード変更\n- **新規 `scripts/geneformer/finetune_classifier.py`**（config-finetune.yaml 駆動）: stage `prepare`（donor 分割の検証・bundle 作成・sha256・漏洩 assert）/ `train`（CUDA・MPS・CPU、bf16 対応確認、profile、gradient checkpointing・勾配累積、step checkpoint から自動再開、config sha256 の一致確認、env.json・run_record.json・train_log.jsonl・training_summary.json・final/SHA256SUMS、`--probe`）/ `evaluate`（held-out でのゲート判定）/ `smoke`（CPU・ランダム小モデルで全経路）。geneformer は collator と token dictionary のファイルだけを直接読む（__init__ の重い依存を避け、リモートでは `--no-deps` で入れられる）\n- **`scripts/geneformer/run_isp.py`**（既定 off・後方互換）: `state_embs.include_donors`（重心を指定 donor だけで作る。ファイル名に条件のハッシュ）、`capture.classifier_logits`（CellClassifier の分類ヘッドの logits を元/摂動後で保存。`in_silico_perturber.get_embs` の呼び出し順で区別）、CellClassifier の `num_classes` と config.json のクラス数の照合\n- `remote/`: README.md（手順・VRAM 別の profile 表・rsync のひな形。ホスト名・資格情報はプレースホルダ）、run_remote.sh（照合 → probe/train → 返送前の照合）、verify_sha256.py（標準ライブラリのみ）\n- 確認: prepare・train dry-run・CPU smoke（train/再開/probe/evaluate）・run_isp の CellClassifier CPU smoke（logits 一致）・`make demo`・既存 config の dry-run\n"}, {"id": "experiments-EXP-20260926-003-results-ft-eval-README-md", "label": "結果（追加学習 対 事前学習）", "path": "experiments/EXP-20260926-003/results-ft/eval/README.md", "kind": "md", "bytes": 2808, "body": "# EXP-20260926-003 phase 3–4 の結果（FT モデル vs Pretrained, 同じ細胞・同じ遺伝子・同じ goal 重心・同じマシン）\n\n- 実行: spark-cf5b（NVIDIA GB10, CUDA, bf16 forward + fp32 コサイン）。FT 約 44 min、Pretrained（config-pretrained-matched）約 46 min\n- 対照のみ 34 遺伝子 × 200 細胞 × seed 3/4/5（EXP-002 案 A と同じ細胞・同じ null）。goal 重心は FT に使っていない健常 9 donor\n- 評価: EXP-002 `analysis/evaluate_controls.py`（criteria.csv）。判定規則は plan.md §6.2 / HYP-20260926-02（事前登録）\n\n## P1（主, a2）: C1・C2・C3・C3-panel をすべて満たせば支持\n| 基準 | FT | Pretrained（同一条件） |\n|---|---|---|\n| C1 陽性が null 上位 10%（3 seed 中 2） | VCAM1 1.00/1.00/0.95 ✓、**HAVCR1 0.45/0.75/0.75 ✗** → **Fail** | VCAM1 0.617 平均 / HAVCR1 0.80 → Fail |\n| C2 陽性 > HK（18 組中 15） | **16/18 ✓** | 10/18 ✗ |\n| C3 HK が null 分位 0.10–0.90 | ACTB 0.38 / GAPDH 0.65 / PPIA 0.20 ✓ | ACTB 0.17 / GAPDH 0.80 / PPIA 0.83 ✓ |\n| C3-panel（7 中 5 以上） | 7/7 ✓ | 7/7 ✓ |\n| C4（参考）split-half | 0.46 ✗ | 0.32 ✗ |\n| C5（参考）長さとの相関 | 0.11 ✓ | −0.03 ✓ |\n→ **P1 は事前登録の規則で棄却**（C1 の HAVCR1 が不合格）。fp32 再計算の対象（分位 0.85–0.95）は VCAM1 seed 5（0.95）のみで、VCAM1 は seed 3・4 で合格、HAVCR1 は境界外のため、判定は変わらない（再計算は未実施）\n\n## P2（副）: 削除ドリフト\n| | FT | Pretrained |\n|---|---|---|\n| null 遺伝子の補正前 shift_goal が負の割合（seed 3/4/5） | **0.10 / 0.15 / 0.15** | 1.00 / 1.00 / 1.00 |\n| null 平均 shift_goal ÷ (1 − cos(start, goal)) | **≈ 0.000** | −0.036 / −0.038 / −0.036 |\n→ **支持**: FT で削除ドリフトはほぼ消えた\n\n## P3（副）: C2 の勝ち数 FT ≥ Pretrained\na2 で 16 vs 10、補正前で 17 vs 6 → **支持**\n\n## 参考: 分類ヘッドの ΔP(PT_healthy)（a2 と同じ長さビン補正）\n- VCAM1 分位 0.75/0.90/0.60、HAVCR1 0.35/0.50/0.15、HK 0.0–0.8、パネル 6–7/7 が範囲内、null 平均 ΔP ≈ 0\n- 陽性対照は分類確率でも null から際立たない（埋め込み指標と一致）\n\n## 解釈（示唆）\n- fine-tuning は削除ドリフトと HK の偽陽性（Pretrained で GAPDH/PPIA が null 最上位）を解消した。方法上の大きな改善\n- それでも HAVCR1 の delete は健常方向への特異的な移動を示さず、VCAM1 だけが一貫して上位。VCAM1 は分類器が直接使うマーカーの可能性があり、C1 合格でも駆動因子の証拠にはならない（HYP §循環性）\n- split-half は 0.46 で、donor 間の違いによる不安定さは残る\n"}, {"id": "experiments-EXP-20260926-003-results-ft-eval-criteria-csv", "label": "判定表（追加学習）", "path": "experiments/EXP-20260926-003/results-ft/eval/criteria.csv", "kind": "csv", "bytes": 3980, "body": "label,metric,null_frac_negative,n_seeds,C1_seeds,C1_pct_mean,C1,C3_seeds,C3_pct_mean,C3,C2_wins,C2_margin_nullSD,C2,C4i_splithalf_rho,C4ii_seed_rho_fixed5,C4,C5_rho_len_gene,C5_rho_det_gene,C5_rho_len_cell_median,C5,n_pass_C1_C3,n_pass_all,C3_panel,C3_panel_n_ok\nraw shift_goal,m_raw,0.13,3,VCAM1:3 HAVCR1:0,VCAM1:0.983 HAVCR1:0.633,False,ACTB:2 GAPDH:3 PPIA:2,ACTB:0.217 GAPDH:0.533 PPIA:0.167,True,17/18,2.97,True,0.468,0.867,False,0.235,-0.276,0.104,True,2,3,True,7/7\nd: goal−start,m_d,0.1,3,VCAM1:3 HAVCR1:1,VCAM1:0.983 HAVCR1:0.783,False,ACTB:3 GAPDH:3 PPIA:2,ACTB:0.2 GAPDH:0.317 PPIA:0.167,True,18/18,2.81,True,0.48,0.933,False,0.409,-0.387,0.186,False,2,2,True,7/7\na2: −null(長さビン),m_a2,0.58,3,VCAM1:3 HAVCR1:0,VCAM1:0.983 HAVCR1:0.65,False,ACTB:3 GAPDH:3 PPIA:2,ACTB:0.383 GAPDH:0.65 PPIA:0.2,True,16/18,2.78,True,0.464,0.7,False,0.111,-0.167,0.003,True,2,3,True,7/7\nc: z(長さビン),m_c,0.57,3,VCAM1:3 HAVCR1:0,VCAM1:0.983 HAVCR1:0.617,False,ACTB:3 GAPDH:3 PPIA:2,ACTB:0.383 GAPDH:0.667 PPIA:0.217,True,16/
