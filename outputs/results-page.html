3,VCAM1:2 HAVCR1:3,VCAM1:0.917 HAVCR1:0.95,True,ACTB:2 GAPDH:0 PPIA:2,ACTB:0.15 GAPDH:1.0 PPIA:0.783,False,12/18,-0.47,False,0.603,0.933,False,-0.048,0.078,0.015,True,1,2,True,7/7\n[事後] V2L: 長さビン別の平均ドリフトを減算,V2L,0.42,3,VCAM1:2 HAVCR1:3,VCAM1:0.85 HAVCR1:0.933,True,ACTB:3 GAPDH:0 PPIA:0,ACTB:0.533 GAPDH:1.0 PPIA:0.967,False,5/18,-0.59,False,0.594,0.833,False,-0.194,0.192,-0.013,True,1,2,True,7/7\n[事後] T_u: 接平面射影,T_u,0.97,3,VCAM1:3 HAVCR1:3,VCAM1:0.967 HAVCR1:0.933,True,ACTB:1 GAPDH:0 PPIA:0,ACTB:0.917 GAPDH:1.0 PPIA:0.983,False,4/18,-0.95,False,0.618,0.733,False,-0.556,0.485,-0.239,False,1,1,True,7/7\n\"[事後] V5: cos(Δ,u)\",V5,0.8,3,VCAM1:3 HAVCR1:3,VCAM1:0.967 HAVCR1:0.967,True,ACTB:3 GAPDH:0 PPIA:0,ACTB:0.8 GAPDH:1.0 PPIA:0.967,False,7/18,-0.55,False,0.667,0.833,False,-0.384,0.342,-0.208,False,1,1,True,7/7\n"}]}, {"section": "実験 004 — 比較遺伝子と提供者単位の解析", "docs": [{"id": "experiments-EXP-20260926-004-plan-md", "label": "計画", "path": "experiments/EXP-20260926-004/plan.md", "kind": "md", "bytes": 21952, "body": "# EXP-20260926-004 実験計画 — FT モデルの ISP の妥当性確認: (a) DE マッチ比較遺伝子、(c) donor 単位の解析と held-out donor の拡張\n\n- 仮説: [HYP-20260926-03](../../hypotheses/HYP-20260926-03.md)（方法仮説, Status: proposed。PI は 2026-09-26 に (a)(b)(c)「全て実行」を指示。G1 の記録は Labretary）\n- 前提の実験: [EXP-20260926-003](../EXP-20260926-003/plan.md)（FT Geneformer V2-316M 2 クラス分類器、対照のみ ISP。C1 は HAVCR1 で不合格、VCAM1 は null 上位、split-half 0.46）\n- 作成: Labretary（experiment-planner）/ 2026-09-26\n- 担当範囲: (a) と (c)。(b) 陽性対照の見直しは別担当（本実験では扱わない）\n- **事前登録の時点**: §A（DE マッチ）は DE マッチ遺伝子の ISP を実行する前、§C（donor 単位）は donor 単位の指標を対照で計算する前（EXP-003 の細胞単位の結果は既知）に記入した。記入後の変更は §11 に日時と理由を残す\n- 盲検: 主要対象 TP53 / CDKN1A / LTBR と参照 SPP1 / LCN2 は回さない・解析しない（freq_matched の頻度参照としてのみ config に残る。EXP-003 と同じ）\n\n## 1. 問い\n- (a) FT モデルで VCAM1 の delete が null 上位 10% に入ったのは、「分類器が使う aPT マーカーを消した」だけで説明できるか。VCAM1 / HAVCR1 と同程度に aPT で上昇し（log2FC・発現細胞数・入力内の順位でマッチ）、傷害・修復の駆動因子として知られていない遺伝子（DE マッチ比較遺伝子）を消したときと比べて、VCAM1 は goal（健常 PT）方向へより大きく動くか\n- (c-1) EXP-003 の細胞単位の指標を donor 単位に集約すると、C1〜C3・C3-panel の判定と信頼性（split-half 0.46）はどう変わるか（GPU 不要）\n- (c-2) FT に使っていない CKD の TLS-mid donor（15 人）を start に加えて donor 数を 14 → 29 に増やすと、判定と donor 単位の信頼性は再現・改善するか\n\n方法の検証であり、生物学的な仮説の検証ではない。in silico の結果は「分類器・埋め込みの挙動」についての所見で、遺伝子の機能の実験的事実ではない。\n\n## 2. データ\n| 項目 | (a)・(c-1) | (c-2) 拡張 |\n|---|---|---|\n| データセット | A2 KPMP v1.5 scRNA（Lake 2023, PMID 37468583）。EXP-003 と同じ tokenized（`work/tokenized.dataset` = データ部分の APFS clone, sha256 `ba3a14c0…` 一致, `work/tokenized.SHA256SUMS`） | 同じ raw（`data/raw/kidney_tls/A2_KPMP_v1.5_scRNA_Lake2023.h5ad`, 読み取りのみ）から `prepare_h5ad.py` で新しい入力 `expanded/work/input.h5ad` を作り tokenize |\n| start | aPT_CKD_TLShigh 7,533 細胞 / 14 donor（全員 FT で held-out） | aPT ∧ CKD ∧ TLS ∈ {high, mid} = 14,631 細胞 / 29 donor（TLS-mid 15 donor 7,098 細胞は EXP-001 の入力から除かれ FT に未使用。§C.5 で漏洩なしを assert） |\n| goal | PT_healthy。重心は held-out 健常 9 donor（EXP-003 と同じ） | 同じ 9 donor |\n| alt | aPT_CKD_TLSlow（FT の train/eval → 参考値） | 同じ |\n| 状態ラベル | `isp_state`（推定。TLS 群は donor pseudo-bulk の TLS スコア三分位で組織学的な TLS ではない） | 同じ定義（TLS-mid も同じ表 `donor_A2.csv` の値をそのまま使う） |\n\n## 3. モデル\n- FT 済み Geneformer V2-316M CellClassifier（`experiments/EXP-20260926-003/models/ft-main/final`, 2 クラス 0 = aPT_CKD, 1 = PT_healthy）。emb_mode cls, emb_layer −1, bf16 forward + fp32 コサイン（PI 標準）\n- 実行: spark-cf5b（GB10, CUDA）。EXP-003 phase 3 と同じ機械（デバイス差を比較に持ち込まない）。`capture.embeddings`・`capture.classifier_logits` あり\n\n## A. (a) DE マッチ比較遺伝子（事前登録）\n### A.1 選定の考え方\n- 陽性対照 VCAM1・HAVCR1 は aPT のマーカーでもあり、start と goal を分けるよう学習した分類器が直接使っている可能性がある（EXP-003 plan §4.5 / HYP-20260926-02 §循環性）。「aPT で強く上昇している遺伝子なら何を消しても goal 方向へ動く」なら、VCAM1 の C1 合格は駆動因子の証拠にならない\n- そこで、VCAM1 / HAVCR1 と**発現の差・頻度・入力内の順位が同程度**で、**既知の駆動因子でない**遺伝子を比較群にする。選定は発現データのみ（ISP の結果は読まない）\n\n### A.2 選定規則（`analysis/de_matched_select.py`。統計は `outputs/literature/2026-09-26-negative-controls/genome_stats.csv`: EXP-001 input.h5ad の生カウントから donor pseudo-bulk で計算済み）\n| 規則 | 内容 |\n|---|---|\n| E1 | Geneformer V2 の辞書に収載 |\n| E2 | start（TLS-high aPT）vs goal（健常 PT）の donor pseudo-bulk log2FC ≥ 2 かつ Welch BH q < 0.05（上昇） |\n| E3 | start で Geneformer 入力に入る細胞 ≥ 440（HAVCR1 の 659 の 1/1.5）かつ 25 細胞以上で検出される start donor ≥ 8（200 細胞・donor ≤ 25 の抽出が可能） |\n| E4（自動除外） | negctrl_candidates.py の既知リスト（傷害・aPT マーカー、TLS・免疫、解離ストレス、性染色体、細胞周期、ストレス応答）＋本実験の追加カテゴリ（傷害・老化のメディエーター、補体・IFN・炎症、修復シグナル経路 HGF/MET・EGFR・Wnt・Notch・Hedgehog・TGF-β・YAP、ECM・線維化、酸化ストレス応答、低酸素）、盲検対象、陽性対照 |\n| E5（文献レビュー） | E4 を通った候補を距離順に文献知識で確認し、PT の傷害・修復・老化・TLS の駆動因子とする報告があれば除外。判断と不確実性を記録（下表） |\n| 距離 | d_r(g) = max(\\|Δlog2FC\\| / 1.0, \\|ln(細胞数比)\\| / ln 1.5, \\|Δ相対順位\\| / 0.10)、r = VCAM1, HAVCR1 |\n| 選び方 | r ごとに d の小さい順に E4・E5 を通る遺伝子を 5 つ → 計 10 遺伝子（VCAM1 帯 5 + HAVCR1 帯 5） |\n\n- プール: E1〜E3 を満たす 1,690 遺伝子中の上昇遺伝子（`de_matched/selection.json`）\n\n参照（陽性対照）:\n| 遺伝子 | log2FC | start の入力内細胞数（検出率） | 健常の検出率 | 入力内の相対順位 | donor ≥ 25 細胞 |\n|---|---|---|---|---|---|\n| VCAM1 | 5.26 | 4,674（0.62） | 0.062 | 0.36 | 13 |\n| HAVCR1 | 4.25 | 659（0.088） | 0.0005 | 0.25 | 10 |\n\n選定結果（`de_matched/selected.csv`）:\n| 帯 | 遺伝子 | d | log2FC | 細胞数（検出率） | 健常の検出率 | 相対順位 | donor ≥ 25 | 除外しなかった根拠（不確実性） |\n|---|---|---|---|---|---|---|---|---|\n| VCAM1 | PPFIBP1 | 0.98 | 4.28 | 3,761（0.50） | 0.052 | 0.42 | 13 | liprin-β1（接着斑の足場）。PT 傷害の駆動因子の報告を把握していない（中） |\n| VCAM1 | AKAP12 | 1.22 | 6.48 | 3,058（0.41） | 0.008 | 0.41 | 13 | gravin。傷害 PT で上昇する記載はありうるが因果の証拠は把握していない（**高**） |\n| VCAM1 | SELENOM | 1.24 | 4.02 | 3,561（0.48） | 0.068 | 0.48 | 13 | セレノプロテイン M。腎傷害での役割の報告なし（中） |\n| VCAM1 | DMKN | 1.27 | 6.12 | 2,790（0.37） | 0.004 | 0.36 | 13 | dermokine。腎での機能報告なし（中） |\n| VCAM1 | SCIN | 1.51 | 6.31 | 2,539（0.34） | 0.004 | 0.50 | 13 | scinderin。腎傷害での役割の報告なし（中） |\n| HAVCR1 | ANKRD2 | 0.21 | 4.46 | 640（0.085） | 0.000 | 0.24 | 8 | 筋の ankyrin repeat タンパク質。腎での機能報告なし。アンビエント・ダブレット由来の可能性（中） |\n| HAVCR1 | ARRDC4 | 0.37 | 3.88 | 664（0.089） | 0.004 | 0.28 | 11 | α-arrestin（糖代謝応答）。腎傷害の駆動因子の報告なし（中） |\n| HAVCR1 | IDUA | 0.57 | 3.68 | 591（0.079） | 0.002 | 0.23 | 11 | リソソーム酵素（低） |\n| HAVCR1 | SLITRK4 | 0.63 | 4.45 | 801（0.107） | 0.001 | 0.19 | 12 | 神経の接着分子（低） |\n| HAVCR1 | ADAMTS16 | 0.65 | 4.62 | 857（0.114） | 0.001 | 0.25 | 13 | 血圧関連座位。PT 傷害の駆動因子の報告なし（中） |\n\n除外した候補（距離順に現れたもの。`de_matched/candidates.csv`）:\n- E4 自動: ITGB8, CD24, CLU, TPM1（既知の aPT/傷害マーカー）、COL4A2, COL4A1（ECM・線維化）、TNFRSF12A（Fn14, 腎傷害・炎症のメディエーター）、PON2・NFE2L3（酸化ストレス応答）、WNT2B（Wnt 経路）\n- E5 文献: MACC1（MET の転写調節因子 → HGF/MET 修復経路, 経路単位で保守的に除外, 不確実性 高）、C1QTNF3（CTRP3。腎線維化・糖尿病性腎症モデルで保護的との報告がある — 記憶に基づき未検証, 高）、SCARA3（別名 CSR1 = cellular stress response 1, 酸化ストレスで誘導, 中）\n- 注意: 「駆動因子の報告を把握していない」は文献データベースの系統的検索ではなく知識に基づく判断（literature-scout による確認は未実施）。AKAP12 は特に不確実。帯内の距離は VCAM1 帯で 0.98〜1.51（VCAM1 ほど高頻度かつ強く上昇し、既知マーカーでない遺伝子は少ない）、HAVCR1 帯で 0.21〜0.65\n\n### A.3 問いと判定（事前登録）\n主指標は EXP-003 と同じ **a2**（長さ 5 分位ビンごとの null 平均 shift_goal を細胞ごとに引き、遺伝子×seed で平均。null は EXP-003 results-ft の同 seed の 20 遺伝子）。DE マッチ遺伝子は EXP-003 の null と統合して同じ補正をかける（null 細胞だけで補正を推定するので、DE 遺伝子を加えても null・陽性・HK の値は変わらない）。\n\n| # | 量 | 定義 |\n|---|---|---|\n| A-P（主） | VCAM1 の DE 内分位 | seed ごとに、DE マッチ 10 遺伝子のうち a2 が VCAM1 より小さい割合 |\n| A-S1 | 帯内比較 | VCAM1 > VCAM1 帯の 5 遺伝子すべて、HAVCR1 > HAVCR1 帯の 5 遺伝子すべて（seed ごと） |\n| A-S2 | DE マッチの C1 偽陽性率 | DE 遺伝子が C1 と同じ基準（null 分位 ≥ 0.90 が 3 seed 中 2 以上）を満たす数 / 10 |\n| A-S3 | DE マッチ全体のずれ | DE 遺伝子の null 分位の平均（seed ごと, 帰無では ≈ 0.5）。遺伝子単位（3 seed 平均）で 0.5 に対する Wilcoxon 符号順位（片側, 参考） |\n| A-R | 副指標 | A-P〜A-S3 を raw shift_goal と dP_goal_a2（ΔP(PT_healthy) = softmax(logits_pert)[1] − softmax(logits_orig)[1] に a2 と同じ長さビン補正）でも計算（判定には使わない。a2 と食い違えば報告） |\n\n判定（a2, 事前登録）:\n- **VCAM1 の DE 内分位 ≥ 0.90（DE 10 遺伝子中 9 以上を上回る）が 3 seed 中 2 以上** → 「VCAM1 の goal 方向の移動は、同程度に上昇する非ドライバー遺伝子の除去より大きい（マーカー除去だけでは説明できない）」。ただし駆動因子の証拠ではなく「分類器・埋め込みで VCAM1 が特に効く」ことの示唆にとどめる\n- 満たさない → 「**VCAM1 の C1 合格はマーカー除去と区別できない**」と解釈する（EXP-003 の C1 の VCAM1 合格を駆動因子の証拠として使わない）\n- 付記: A-S2 が 3/10 以上なら「aPT で上昇する非ドライバー遺伝子の除去でも C1 を満たしうる → 現在の C1 は駆動因子に特異的でない」と報告する。A-S3 の平均分位が 0.75 以上なら「上昇遺伝子の除去一般が goal 方向へ動かす（マーカー除去効果）」の示唆とする\n- HAVCR1（EXP-003 で C1 不合格）も同じ量を報告のみ\n\n### A.4 実行と統合の妥当性\n- `config-de.yaml`: EXP-003 `config.yaml` と同じ（モデル・細胞抽出・重心・seed 3/4/5・capture）で、摂動する遺伝子だけを変える: DE マッチ 10（role `de_matched`）＋一致確認用に VCAM1・GAPDH（全 seed）と EXP-003 seed 3 の null 1 遺伝子 ENSG00000112297（role `recheck_null`）。`negative_random_n: 0`（null は回さない）\n- 細胞は遺伝子と seed だけで決まる（`random.Random(f\"{seed}-{gene}\")`）ので、他の遺伝子を加えても変わらない。状態重心の細胞も seed と config の抽出条件だけで決まる\n- **統合の条件（事前登録）**: 再実行した VCAM1・GAPDH（3 seed）と null 1 遺伝子（seed 3）で、(i) 細胞（cell_uid の並び）が完全一致、(ii) 状態重心ベクトル（state_emb_vectors.npz）の最大差、(iii) 細胞ごと shift_goal の最大差 ≤ 1×10⁻⁶。満たさなければ統合せず、差の大きさを報告し、null・陽性・HK をこの run の中で回し直す案（約 0.6 h）を PI に出す\n- 見積もり: 13 遺伝子 × 200 細胞 × 3 seed = 7,800 細胞×遺伝子。EXP-003 の spark-cf5b 実測（20,400 / 44 min ≈ 0.13 s）から **約 17〜20 分**（G2 不要。PI 実行承認済み）\n\n## C. (c) donor 単位の解析（事前登録）\n### C.1 donor 単位の指標の定義（対照で計算する前に固定）\n入力は EXP-003 と同じ細胞単位の a2（`reanalysis_cosine.corrected` の m_a2, seed ごと）。raw・dP_goal_a2 も同じ手順で副次に計算する。\n| 名前 | 定義 |\n|---|---|\n| donor 平均 x(s,g,d) | seed s・遺伝子 g・donor d の細胞の a2 の平均。**細胞 3 未満の donor は除く** |\n| **DL-med（主）** | S(s,g) = median_d x(s,g,d)。null 分布は同 seed の null 遺伝子の S |\n| DL-mean（副） | S(s,g) = mean_d x(s,g,d)（donor を等重みにした平均） |\n| DL-sign（報告） | 遺伝子ごとに、x を seed で平均した donor 値 x̄(g,d) > 0 の donor 割合。null 遺伝子の同じ割合の分布での分位 |\n| DL-excess（報告） | 陽性対照ごとに y(g,d) = seed 平均の [x(s,g,d) − 同 seed・同 donor の null 遺伝子の x の平均]。y > 0 の donor 割合と Wilcoxon 符号順位（片側, donor が単位） |\n- 判定基準は EXP-003 と同じ閾値の C1・C2・C3・C3-panel を DL-med（主）と DL-mean で計算する\n- 信頼性:\n  - **donor split-half**: seed ごとに donor を 2 群にランダム分割（20 回, rng seed 0。EXP-002/003 の C4i と同じ手順）し、各半分で DL-med を計算して 34 遺伝子の Spearman ρ を平均。同じ分割で細胞単位の平均（EXP-003 の C4i 相当）も計算して並べる。Spearman–Brown 補正（2ρ/(1+ρ)）も報告\n  - **leave-one-donor-out（LODO）**: donor を 1 人ずつ除いて DL-med を再計算し、全 donor との Spearman ρ（seed ごと, 最小・中央値）と、除いたときに C1・C2・C3・C3-panel と VCAM1/HAVCR1 の C1 状態が変わる donor の数\n- 解釈（事前登録）: DL-med で C1〜C3・C3-panel の判定が細胞単位と同じなら「donor の重みづけは結論を変えない」。HAVCR1 が DL-med で C1 を満たしても HYP-20260926-02 の判定（細胞単位の事前登録）は変えず、感度分析として報告する。donor split-half ≥ 0.7 なら「donor 単位の指標は順位の再現性が十分」、< 0.7 なら「donor 間の違いによる不安定さが残る」\n- 比較: 同じ定義を EXP-003 results-pretrained-matched（Pretrained, 同じ細胞）にも適用\n- 実装: `analysis/donor_level.py`（CPU のみ）。EXP-003 の gene_seed_metrics.csv の m_a2 と、再実装の細胞単位の a2 が一致すること（最大差 ≤ 1×10⁻¹²）を先に確認する\n\n### C.2 (c-2) held-out donor の拡張（設計）\n- start = CKD の aPT のうち TLS-high（14 donor, 7,533 細胞）＋ TLS-mid（15 donor, 7,098 細胞）= 29 donor・14,631 細胞（ラベル `aPT_CKD_TLShighmid`）。goal・alt は EXP-003 と同じ定義。TLS-mid は EXP-001 の入力で除外され、FT の train/eval（split_manifest.json の 21 donor）に含まれない（prepare 後に assert）\n- 入力: `expanded/config-expanded.yaml` の `prepare`（EXP-001 と同じフィルタ・同じ donor 表。state_rules だけ変更）→ `expanded/work/input.h5ad` → tokenize（Mac CPU）\n- 細胞抽出: **遺伝子あたり最大 350 細胞・donor あたり最大 12 細胞**（29 × 12 = 348。donor 単位の平均に各 donor の細胞を確保するため donor 上限を 25 → 12 に下げ、総数を 200 → 350 に上げる）、最小 100\n- 遺伝子: EXP-003 と同じ対照 14（陽性 2・HK 3・パネル 7・RP 2）＋新しい start での発現頻度マッチ null 20（seed ごと。start が変わるので EXP-003 と別の null 遺伝子になる）\n  - **DE マッチ 10 遺伝子を加えるかの規則（結果を見る前に固定）**: (a) の実測時間＋拡張の見積もり（44 遺伝子）≤ 2.1 h なら加える（(a) の再現確認になる）。超えるなら 34 遺伝子のみ\n- 状態重心: EXP-003 と同じ抽出条件（状態ごと 500・donor ≤ 60、goal は held-out 健常 9 donor）。start の細胞が変わるので、抽出の乱数列の都合で goal 重心の細胞は EXP-003 と一部異なる（同じ 9 donor）\n- seed 3/4/5、delete、bf16、capture あり\n- 評価（事前登録）: 細胞単位（EXP-003 と同じ C1〜C5・C3-panel, evaluate_controls.py の関数）と donor 単位（§C.1 と同じ定義, 29 donor）。追加で (i) TLS-high 14 donor の donor 値の、EXP-003 と拡張 run の間の一致（固定対照 14 遺伝子の DL-med の Spearman, 参考）、(ii) donor split-half を 14 donor（TLS-high のみ）と 29 donor で比較。TLS-high と TLS-mid の比較は記述のみ（仮説検定をしない）\n- 見積もり: 34 遺伝子 × 約 340 細胞（HAVCR1・RP は少ない）× 3 seed ≈ 35,000 細胞×遺伝子 × 0.13 s ≈ **1.25 h**（44 遺伝子なら ≈ 1.6 h）＋重心 3 × 1,500 細胞 ≈ 0.05 h\n- (a) と合わせて **約 1.6〜2.0 h**（PI 指示の上限 ~2 h 以内）→ 実行する。(a) の実測で 2.1 h を超える見込みになったら DE 遺伝子を外し、それでも超えるなら準備だけして G2 に回す\n\n## 5. コントロール\n- ポジティブ: VCAM1、HAVCR1（EXP-003 と同じ。見直しは (b) の担当）\n- ネガティブ: 発現頻度マッチ null 20/seed、HK（ACTB, GAPDH, PPIA）、陰性対照パネル 7（C3-panel）、探索枠 RP 2\n- (a) の比較群: DE マッチ 10（陰性対照ではなく「マーカー除去」の対照）\n\n## 7. 頑健性チェック\n- seed 3/4/5（各 seed で細胞と null が変わる）\n- (a) の統合前の一致確認（A.4）。a2 と raw・dP の一致\n- (c) DL-med と DL-mean、LODO、Pretrained との比較、拡張 run での再現\n\n## 8. 計算量\n| 項目 | 場所 | 見積もり |\n|---|---|---|\n| (a) DE マッチ ISP | spark-cf5b | 0.3 h |\n| (c-1) donor 単位の再解析 | Mac CPU | 数分 |\n| (c-2) 入力作成・tokenize | Mac CPU | ~10 分 |\n| (c-2) 拡張 ISP | spark-cf5b | 1.25〜1.6 h |\n| 合計 GPU | | **1.6〜2.0 h**（G2 の目安 2 h 以下。PI は実行を承認済み） |\n- 1 万細胞超の条件: 拡張の start は 14,631 細胞あるが、ISP に使うのは遺伝子あたり ≤ 350 細胞（ユニーク細胞は最大 ~1 万程度）。全遺伝子スクリーニングではない\n\n## 9. 想定される失敗と対策\n| 失敗 | 対策 |\n|---|---|\n| 再実行で EXP-003 と一致しない（GPU の非決定性など） | 差の大きさを報告。1×10⁻⁶ を超えたら統合しない（A.4） |\n| DE マッチ遺伝子の抽出細胞が 100 未満 | run_isp が skip → 報告し、帯の次点は追加しない（事後の差し替えをしない） |\n| TLS-mid donor の混入が FT に漏れている | prepare 後に split_manifest の train/eval donor と照合し、重なれば停止 |\n| リモートの接続断 | 遺伝子単位で再開（run_isp の既存機能） |\n| リモートにヒト由来データが残る | 回収・件数確認後に `isp_remote.sh clean`（他の担当が同じホストを使っていないことを確認してから） |\n\n## 10. 承認\n- PI: 2026-09-26「(a) DE マッチ比較遺伝子 (b) 陽性対照の見直し (c) donor 単位解析 を全て実行」「FT モデル前提、リモート PC を積極的に」。GPU 合計 ≤ ~2 h の範囲で実行（超える場合は G2）\nApproved-by: PetadimensionLab (PI), 2026-09-26 — 実行指示（全て実行, GPU ≤ ~2 h）。G1（HYP-20260926-03）は Labretary が記録\n\n## 11. 変更履歴\n- 2026-09-26 初版（ISP 実行前）\n- 2026-09-26 20:07（(a) の ISP 完了後、(c-2) の ISP 実行前）: §C.2 の事前登録した規則に従い、(c-2) に DE マッチ 10 遺伝子を加える。根拠 = (a) の実測 0.31 h（ISP 935 s + 重心 176 s, 44 遺伝子×seed の実測 24.2 s/200 細胞 = 0.121 s/細胞×遺伝子）＋ (c-2) の見積もり 1.49 h（44 遺伝子 ≈ 42,000 細胞×遺伝子 + 重心 3 × 90 s）= 1.80 h ≤ 2.1 h。(a) の結果（§A の判定）は (c-2) の設計に影響させていない（遺伝子の選定・細胞数・seed・基準はすべて (a) の実行前に確定済み）\n- 2026-09-26 21:35（(c-2) の ISP 完了後、評価の実行前）: (c-2) の細胞単位の評価は `analysis/eval_expanded_cells.py` から EXP-002 `evaluate_controls.py` をそのまま呼ぶ（判定の定義・閾値・a2 の実装は変更しない）。差し替えたのは拡張 run 固有の 3 点のみ = C5 の発現細胞数を新しい start の detection に、a4/d4 の削除位置を本実験の tokenized に、ベクトル指標の start 重心名 `aPT_CKD_TLShigh` を `aPT_CKD_TLShighmid` に対応づけ。遺伝子集合の影響を分けるため 34 遺伝子（EXP-003 と同じ集合）と 44 遺伝子（DE マッチ込み）の両方を出す。コードとconfig の sha256 は結果を見る前に `logs/prereg-c2-eval.sha256` に記録\n"}, {"id": "experiments-EXP-20260926-004-de_matched-README-md", "label": "発現をそろえた比較遺伝子", "path": "experiments/EXP-20260926-004/de_matched/README.md", "kind": "md", "bytes": 4203, "body": "# (a) DE マッチ比較遺伝子の結果（FT モデル、EXP-003 phase 3 と同じ細胞・seed・重心）\n\n- 実行: spark-cf5b（GB10, CUDA, bf16 forward + fp32 コサイン）2026-09-26 19:47–20:06。13 遺伝子（DE マッチ 10 + 一致確認 3）× 200 細胞 × seed 3/4/5。ISP 935 s + 状態重心 176 s = **0.31 h**\n- 事前登録: [../plan.md](../plan.md) §A（ISP 実行前に記入、`../logs/prereg-a-c.sha256`）。遺伝子の選定は発現データのみ（`selected.csv`, `selection.json`）\n- 評価: `../analysis/de_eval.py` → `eval/{merge_check.json, decision.json, gene_seed.csv, de_null_pct.csv}`\n\n## 統合の妥当性（plan §A.4）\n再実行した VCAM1・GAPDH（3 seed）と EXP-003 seed 3 の null 遺伝子 1 つ（ENSG00000112297）で、細胞（cell_uid の並び）・状態重心ベクトル・細胞ごとの shift_goal / shift_start / ΔP の差は**すべて厳密に 0**（許容 1×10⁻⁶）。同じ機械・同じ config・同じ seed なら再現は完全 → EXP-003 の null・陽性・HK・パネルと統合して評価した。既存遺伝子の a2 は DE 遺伝子を加えても変わらない（補正は null 細胞だけで推定。最大差 < 1×10⁻¹²）\n\n## 主判定（a2, 事前登録 A-P）\n| seed | VCAM1 の DE マッチ 10 遺伝子内の分位 |\n|---|---|\n| 3 | 1.00（10/10 を上回る） |\n| 4 | 1.00 |\n| 5 | 1.00 |\n\n→ **3 seed すべてで ≥ 0.90 → 事前登録の判定は「VCAM1 の goal 方向への移動は、同程度に aPT で上昇する非ドライバー遺伝子の除去より大きい（マーカー除去だけでは説明できない）」**。raw shift_goal でも同じ（1.00/1.00/1.00）、ΔP(PT_healthy) でも 0.90/1.00/1.00\n- 帯内（A-S1）: VCAM1 > VCAM1 帯 5 遺伝子すべて = 3/3 seed。HAVCR1 > HAVCR1 帯 5 遺伝子すべて = 1/3 seed（HAVCR1 の DE 内分位 0.40/0.90/0.60）\n- 効果の大きさ（3 seed 平均の a2）: VCAM1 1.80×10⁻³、次点の DE 遺伝子 AKAP12 7.4×10⁻⁴・PPFIBP1 7.0×10⁻⁴、null の中央値 ≈ −4×10⁻⁵。VCAM1 は 2 番目の 2.4 倍\n\n## 付随する所見（同じく事前登録）\n- **A-S2: DE マッチ 10 遺伝子のうち 3 つ（AKAP12 3 seed、PPFIBP1 2 seed、ADAMTS16 2 seed）が C1 と同じ基準（null 上位 10% が 3 seed 中 2 以上）を満たす** → 現在の C1 は「駆動因子」に特異的ではない。aPT で上昇する非ドライバー遺伝子でも 30% が合格する（偶然合格率 10% の 3 倍）\n- A-S3: DE 10 遺伝子の null 分位の平均は seed ごとに 0.54 / 0.55 / 0.66（帰無 0.5）。遺伝子単位（3 seed 平均）の Wilcoxon 片側 p = 0.22 → 「上昇遺伝子の除去一般が goal 方向へ動く」という全体的な偏りは、この 10 遺伝子では有意ではない。ただし個々の値の幅は大きい（AKAP12 0.95・PPFIBP1 0.87・ADAMTS16 0.83 vs ANKRD2 0.07・ARRDC4 0.15）\n- ΔP(PT_healthy)（分類確率）では DE 10 遺伝子とも C1 基準を満たさず（0/10）、VCAM1 の分位も 0.75/0.90/0.60 と埋め込み指標より弱い\n\n## 解釈（示唆。in silico の所見であり実験的事実ではない）\n- VCAM1 の効果は「aPT マーカーを消したこと」だけでは説明できない大きさで、FT 分類器の埋め込みでこの遺伝子が特に強く使われていることが**示唆される**。ただし駆動因子であることの証拠ではない（分類器が VCAM1 を最も重みづけしている可能性と区別できない）\n- 一方で C1（null 上位 10%）という基準そのものは駆動因子に特異的でない（非ドライバー 3/10 が合格）。今後は「null との比較」に加えて「DE マッチ群との比較」を合否に入れるのが妥当\n- 限界: DE マッチ遺伝子の「非ドライバー」判断は知識に基づく判断で、系統的な文献検索ではない（AKAP12 は不確実性が高いと事前に記録。実際に最も大きく動いた DE 遺伝子でもある）。VCAM1 帯の距離は 0.98〜1.51 と完全一致ではなく、VCAM1 は帯内で最も発現細胞数が多い（4,674 vs 2,539〜3,761）\n"}, {"id": "experiments-EXP-20260926-004-donor_level-README-md", "label": "提供者単位の再解析", "path": "experiments/EXP-20260926-004/donor_level/README.md", "kind": "md", "bytes": 4262, "body": "# (c-1) donor 単位の再解析（EXP-003 の結果を CPU で再集計。GPU 不使用）\n\n- 事前登録: [../plan.md](../plan.md) §C.1（定義は対照で計算する前に固定）。実装 `../analysis/{common.py,donor_level.py}`\n- 対象: `experiments/EXP-20260926-003/results-ft`（FT）と `results-pretrained-matched`（Pretrained, 同じ細胞）。TLS-high aPT 14 donor（うち a2 の集計に使える donor は遺伝子×seed あたり中央値 13、最小 11。細胞 3 未満の donor は除く）\n- 妥当性の確認: 本スクリプトの a2 は EXP-003 の `gene_seed_metrics.csv` と最大差 9.6×10⁻¹⁷（= 一致）\n\n## 判定（主指標 a2, FT）\n| 集約 | C1（VCAM1 / HAVCR1 の null 分位, seed 3/4/5） | C2（陽性>HK） | C3（HK が 0.10–0.90） | C3-panel |\n|---|---|---|---|---|\n| 細胞平均（EXP-003 と同じ） | ✗ VCAM1 1.00/1.00/0.95、HAVCR1 0.45/0.75/0.75 | 16/18 ✓ | ✓ | 7/7 ✓ |\n| **DL-med（donor 中央値, 主）** | ✗ VCAM1 1.00/1.00/0.95、HAVCR1 0.10/0.85/0.70 | 14/18 ✗ | ✓ | 7/7 ✓ |\n| DL-mean（donor 等重み平均） | ✗ VCAM1 1.00/1.00/1.00、HAVCR1 0.25/0.65/0.85 | 16/18 ✓ | ✓ | 7/7 ✓ |\n\n- **結論は変わらない**: どの集約でも C1 は HAVCR1 で不合格（EXP-003 の P1 棄却は donor の重みづけによるものではない）。VCAM1 は donor 単位でも一貫して null 最上位\n- DL-med では C2 が 14/18（基準 15 未満）に下がる。内訳は HAVCR1 vs HK の組で、HAVCR1 の弱さが donor 中央値でより明確になったため\n- Pretrained（同じ細胞）: DL-med で C1 ✗（VCAM1 0.55/0.75/0.80、HAVCR1 0.95/0.85/0.75）、C2 13/18、C3 ✗（PPIA 0.95/0.95/0.60 が範囲外）、panel 7/7 → FT が HK の偽陽性を解消した所見は donor 単位でも保たれる\n\n## donor 単位の符号の一貫性（a2, FT, 13 donor）\n| 遺伝子 | 値が正の donor の割合 | null 遺伝子の同割合の分布での分位 | null 超過分（donor ごとに同 seed・同 donor の null 平均を引いた値）が正の donor | Wilcoxon（片側） |\n|---|---|---|---|---|\n| VCAM1 | **13/13 (1.00)** | 0.98 | 13/13、中央値 +1.6×10⁻³ | p = 1.2×10⁻⁴ |\n| HAVCR1 | 5/13 (0.385) | 0.30 | 7/13、中央値 +8.3×10⁻⁵ | p = 0.58 |\n| GAPDH | 0.667 | 0.88 | 8/12 | p = 0.17 |\n| ACTB / PPIA | 0.46 / 0.23 | 0.48 / 0.08 | 4/13 / 2/13 | — |\n（null 遺伝子の「正の donor 割合」の中央値 0.46）\n→ VCAM1 の効果は 13 donor すべてで同じ向き。HAVCR1 は donor 間で符号が割れる（**donor 間の不均一が HAVCR1 の不合格の一因**）\n\n## 信頼性\n| 指標 | 細胞平均 | DL-med | DL-mean |\n|---|---|---|---|\n| donor split-half の Spearman ρ（seed ごと 20 分割 × 3 seed の平均 ± SD, 34 遺伝子） | 0.464 ± 0.138 | 0.423 ± 0.131 | 0.442 ± 0.118 |\n| Spearman–Brown 補正（全 donor 相当） | 0.634 | 0.595 | 0.613 |\n| Pretrained の同じ値（ρ） | 0.320 | 0.272 | 0.216 |\n| seed 間の順位一致（固定対照 5 遺伝子, 参考 C4ii） | 0.70（FT）/ 0.40（Pretrained） | — | — |\n\n- **donor 単位に集約しても再現性は上がらない**（0.464 → 0.423）。split-half が低いのは donor の重みづけではなく、34 遺伝子の多く（null と陰性対照）が実質ゼロ効果で順位がノイズだからと**示唆される**（Spearman–Brown 補正後でも 0.6 前後で基準 0.7 未満）\n- leave-one-donor-out（DL-med, a2）: 全 donor との順位相関は ρ 最小 0.943・中央値 0.969。C1（VCAM1 3 seed 合格・HAVCR1 0 seed）と C3-panel はどの donor を除いても変わらない。C3 は 14 回中 3 回で反転（HK が範囲外に出る境界例）。C2 も 14/18 → 13〜14/18 の範囲で基準未満のまま\n→ **判定は特定の donor に依存していない**\n\n## 副指標\n- raw shift_goal: DL-med でも VCAM1 1.00/1.00/1.00、HAVCR1 0.10/0.85/0.65（a2 と同じ傾向）\n- ΔP(PT_healthy): DL-med で C3 不合格（ACTB 1.00/0.60/0.95、GAPDH 0.80/0.45/0.95）、null の負の割合 0.95 → 分類確率は delete で一様に下がる（埋め込みの削除ドリフトに相当する偏りが確率側に残る）。ΔP を主指標にはできない\n"}, {"id": "experiments-EXP-20260926-004-expanded-dl_all29_g34-log", "label": "提供者 29 人・34 遺伝子（評価ログ）", "path": "experiments/EXP-20260926-004/expanded/dl_all29_g34.log", "kind": "text", "bytes": 4036, "body": "== m_a2\n  cell     C1=False {'VCAM1': [1.0, 1.0, 1.0], 'HAVCR1': [0.9, 0.75, 0.5]} C2=16/18 C3=True {'ACTB': [0.25, 0.3, 0.4], 'GAPDH': [0.7, 0.95, 0.75], 'PPIA': [0.6, 0.6, 0.45]} panel=7/7 nullneg=0.383\n  dl_med   C1=False {'VCAM1': [1.0, 1.0, 0.95], 'HAVCR1': [0.75, 0.5, 0.6]} C2=13/18 C3=True {'ACTB': [0.25, 0.3, 0.4], 'GAPDH': [0.75, 1.0, 0.75], ' ss）\n\n- 仮説: [HYP-20260926-04](../../hypotheses/HYP-20260926-04.md)（方法仮説, Status: proposed）\n- 起点: PI 指示（2026-09-26）「次の一手 (a) DE マッチ比較遺伝子 (b) 陽性対照の見直し (c) donor 単位解析 を**全て実行**。FT モデル前提、リモート PC を積極利用」。本実験は **(b)** のみを担当する（(a)(c) は EXP-20260926-004、別エージェント）\n- 作成: Labretary（literature-scout + experiment-planner + simulation-engineer + validator）/ 2026-09-26\n- **事前登録の時点**: §5・§6 の陽性対照リスト・基準・マーカー度の定義は、本実験の ISP を 1 回も回す前（2026-09-26 20:0x, GPU 実行の開始前）に確定した。使った事前情報は文献（PMID 照合済み）と、トークン化済み入力の発現情報（`work/gene_annotation.json`, ISP 結果を含まない）だけ\n\n## 1. 問い\nEXP-20260926-003 phase 3 で、FT（aPT_CKD vs PT_healthy）CellClassifier の ISP は削除ドリフトを解消し HK・陰性対照パネルも null 内に収まったが、**C1 が不合格**だった（VCAM1 は null 分位 0.98 で合格、HAVCR1 は 0.45/0.75/0.75 で不合格）。VCAM1 は極端な aPT マーカー（start 62.1% vs goal 7.6% の細胞で検出、|Δ検出率| は背景 9,615 遺伝子中 99 パーセンタイル）で、合格が「分類器が使うマーカーを消しただけ」の可能性がある。\n\n1. 陽性対照を「PT で**遺伝学的操作の因果効果**が報告された遺伝子」に替えたとき、FT モデルの ISP（a2）はそれらを null から分離するか（delete 型・overexpress 型）\n2. 分離した遺伝子は、start/goal の発現差が小さい（＝分類器の自明なマーカーではない）ものを含むか\n\n## 2. データ・モデル（EXP-20260926-003 phase 3 と同一）\n| 項目 | 値 |\n|---|---|\n| データ | A2 KPMP v1.5 scRNA（Lake 2023, PMID 37468583）。`work/input.h5ad` → EXP-001 への symlink（読み取りのみ） |\n| tokenized | `work/tokenized.dataset` = EXP-001 tokenized のデータ部分の APFS clone。sha256 `ba3a14c06d57d8e6344d79329b6be9f2dad722e1e6290c675e0cc3545d312070`（EXP-001/003 と一致）。他実験の dataset を直接指さない（guardrails） |\n| モデル | `experiments/EXP-20260926-003/models/ft-main/final`（FT 済み BertForSequenceClassification, 2 クラス, 0=aPT_CKD / 1=PT_healthy）。読み取りのみ |\n| start | `aPT_CKD_TLShigh`（held-out 14 donor, 7,533 細胞）から 200 細胞/遺伝子・donor ≤ 25・seed 3/4/5 |\n| goal 重心 | `PT_healthy` の **held-out 9 donor** のみ（3,106 細胞から 500 細胞, donor ≤ 60）。FT に使っていない |\n| alt | `aPT_CKD_TLSlow`（参考。m_b 指標用） |\n| emb | `emb_mode: cls`, `emb_layer: -1`, bf16 forward + fp32 コサイン |\n\n- 実行可能性は事前に確認済み（`analysis/gene_annotation.py`）: 回す 23 の固定遺伝子すべてで seed 3/4/5 とも **200/200 細胞**、13〜14 donor\n\n## 3. 設計（2 つの run。1 run = 1 perturb_type）\n| run | config | perturb_type | 陽性対照 | 同梱 | null | 遺伝子数 |\n|---|---|---|---|---|---|---|\n| D | `config-delete.yaml` | delete | HIF1A, NOTCH1, EGFR, YAP1, KEAP1（5） | 旧陽性 VCAM1・HAVCR1（継続比較, 判定外）、HK 3、パネル 7 | 発現頻度マッチ 20（**delete 陽性 5 に頻度を合わせる**） | 37 |\n| O | `config-overexpress.yaml` | overexpress | HNF4A, PPARGC1A, PPARA, ESRRA, CPT1A, NFE2L2（6） | 方向対照 VCAM1・HAVCR1 の overexpress（C7, 参考）、HK 3、パネル 7 | 発現頻度マッチ 20（**overexpress 陽性 6 に頻度を合わせる**, run D とは別セット） | 38 |\n\n- null は run ごとに独立に抽出する（`negative_sampler.ref_genes` にその run の陽性対照を入れる）。EXP-003 の null は盲検対象 5 遺伝子に頻度を合わせていたので、本実験の null とは異なる遺伝子になる\n- **overexpress の定義**: Geneformer の overexpress は「その細胞の rank 列でその遺伝子を最上位へ移す」操作。細胞選抜は delete と同じく「その遺伝子を発現している細胞」に限るので、非発現細胞への導入ではない（限界として §9 に明記）\n- 盲検: `controls_only: true`。TP53/CDKN1A/LTBR/SPP1/LCN2 は回さず、解析でも読み込み直後に除外（assert）\n\n## 4. 陽性対照の選定（文献, PMID は PubMed で照合済み）\n[HYP-20260926-04](../../hypotheses/HYP-20260926-04.md) の表を参照（方向・種・証拠の強さ・PMID・不採用の理由を記載）。要点:\n\n- **delete 型**（削除が健常方向を予測）: HIF1A（18037992, 18667485）、NOTCH1（20978353）、EGFR（22095949, 27642633, 31676723）、YAP1（32843569, 32253273）、KEAP1（27789056, 19436334）\n- **overexpress 型**（過剰発現が健常方向を予測）: HNF4A（30046000, 32764140, 37488681, 39954965）、PPARGC1A（21881206, 30982966）、PPARA（23804447）、ESRRA（33301705）、CPT1A（33465052, 25419705）、NFE2L2（19436334, 27789056）\n- **不採用**: TGFBR2/SMAD3（文献で方向が対立: 23160515 vs 37270534, 28701516）、KLF15（34634362。start 検出 213 細胞で細胞数不足の恐れ）、SNAI1/TWIST1/FOXM1/CDKN2A（start 検出 2〜75 細胞で実行不可）、SOX9（欠損は修復を阻害＝方向が逆）\n\n## 5. マーカー度（駆動因子 vs マーカー除去の切り分け, 事前登録）\n`analysis/gene_annotation.py`（ISP 結果を使わない）で、遺伝子ごとに\n- `det_start` / `det_goal`: start（7,533 細胞）と goal（held-out 健常 3,106 細胞）で Geneformer 入力に含まれる細胞の割合\n- `ddet = f_start − f_goal`、`ddet_pct` = |ddet| の背景分布（どちらかの状態で 300 細胞以上検出される 9,615 遺伝子）での分位\n\n**`ddet_pct ≤ 0.80` を「マーカー度が低い」と定義する**（事前登録）。実測値（結果を見る前に確定）:\n\n| 分類 | 遺伝子（ddet_pct） |\n|---|---|\n| マーカー度 高（> 0.80） | VCAM1 0.99, NFE2L2 0.96, HIF1A 0.94, HNF4A 0.92, GAPDH 0.91, EGFR 0.86 |\n| マーカー度 低（≤ 0.80） | YAP1 0.77, HAVCR1 0.71, ESRRA 0.61, PPARA 0.60, CPT1A 0.41, PPARGC1A 0.29, NOTCH1 0.27, KEAP1 0.01, ACTB 0.26, PPIA 0.00, パネル 7 遺伝子 0.02〜0.79 |\n\n**KEAP1（delete, ddet_pct 0.01）と PPARGC1A / CPT1A（overexpress, 0.29 / 0.41）が、「マーカーではないが因果証拠がある」中心的な検証対象**である。これらが null 上位に来れば、分離はマーカーの除去／付加では説明できない。逆に合格が VCAM1・HIF1A・NFE2L2・HNF4A のような高分位の遺伝子だけなら、マーカー操作で説明できる。\n\n（注: (a) の「DE マッチ比較遺伝子」は別実験 EXP-20260926-004 の担当。本実験は自分が回す遺伝子の注釈にとどめ、マッチさせた比較遺伝子セットは作らない）\n\n## 6. 評価指標と判定基準（事前登録, 2026-09-26, ISP 実行前）\n- **主指標 a2**: EXP-20260926-002 §6.4 / EXP-003 §6.2 と同一定義（長さ 5 分位ビン［null 細胞で境界］ごとの null 平均 shift_goal を細胞ごとに引き、遺伝子で平均。null 遺伝子自身は leave-one-gene-out）\n- 併記: `m_raw`（補正なし shift_goal）、`dP_goal_raw` = 細胞ごとの ΔP(PT_healthy) = softmax(logits_pert)[1] − softmax(logits_orig)[1]、`dP_goal_a2` = それに a2 と同じ長さビン補正。副指標 m_d, m_d2, m_c, V2, V2L も EXP-003 と同じく出す\n- 分位は run ごと・seed ごとの 20 null 遺伝子に対する `null_pct`（EXP-002 の実装と同一）\n\n### 6.1 判定基準（run ごと）\n| # | 基準 | 合格ライン |\n|---|---|---|\n| **C1'** | 陽性対照のうち、null 上位 10%（分位 ≥ 0.90）に 3 seed 中 2 以上入る遺伝子の数 | run D: 5 中 **2 以上** / run O: 6 中 **2 以上** |\n| **C2'** | C1' に合格した各遺伝子が HK（ACTB/GAPDH/PPIA）を上回る組数（3 HK × 3 seed = 9 組） | すべての C1' 合格遺伝子で **7 組以上** |\n| **C3** | ACTB・GAPDH・PPIA が null 分位 0.10〜0.90 | 3 遺伝子とも 3 seed 中 2 以上 |\n| **C3-panel** | パネル 7 遺伝子 | 5 遺伝子以上が 3 seed 中 2 以上で 0.10〜0.90 |\n| **C6** | C1' 合格遺伝子のうち `ddet_pct ≤ 0.80` のものが 1 つ以上 | 1 つ以上 |\n| C7（参考, run O） | VCAM1・HAVCR1 の overexpress が null 分位 ≤ 0.50 | 3 seed 中 2 以上（報告のみ） |\n| C4（参考） | split-half（donor 2 群, 20 回）と seed 間の遺伝子順位 Spearman | ≥ 0.7（報告のみ） |\n| C5（参考） | 指標と細胞長・発現細胞数の相関 | 遺伝子単位 \\|ρ\\| ≤ 0.3、細胞単位 \\|ρ\\| 中央値 ≤ 0.2（報告のみ） |\n\n### 6.2 C1' の閾値の根拠（偶然合格率）\nnull 仮説（陽性対照が null と区別できない）では 1 seed で分位 ≥ 0.90 になる確率 ≈ 0.10、3 seed 中 2 以上は ≈ 3·0.1²·0.9 + 0.1³ = **0.028**。遺伝子間を独立とすると\n- run D（5 遺伝子）: P(2 遺伝子以上が合格) = 1 − 0.972⁵ − 5·0.028·0.972⁴ ≈ **0.0075**\n- run O（6 遺伝子）: 同様に ≈ **0.012**\n\nEXP-003 の C1（2 遺伝子**全部**が合格）は、陽性対照の 1 つでも外れると不合格になる厳しい基準だった（偶然合格率 0.028² ≈ 0.0008）。本実験は「文献の因果が in silico に写るとは限らない遺伝子を複数並べる」設計なので、**遺伝子ごとの全数一致ではなく「2 遺伝子以上」**を採る。有意水準は 1% 前後で EXP-003 とほぼ同等の厳しさを保つ。\n\n### 6.3 判定（事前登録）\n- **run D または run O のどちらかで C1' かつ C2' かつ C3 かつ C3-panel を満たす** → HYP-20260926-04 の該当予測（P1 / P2）を**支持**\n- さらに **C6** を満たす → 「分離はマーカーの除去／付加だけでは説明できない」ことが**示唆される**（断定しない）\n- 両 run とも C1' 不合格 → HYP-20260926-04 を**棄却**（陽性対照の見直しでは解決しない）\n- C3 または C3-panel が不合格の run → その run は**判定不能**（系が壊れている）\n\n## 7. 頑健性\n- seed 3/4/5（EXP-002 案 A・EXP-003 phase 3 と同じ細胞）\n- 精度: bf16（PI 標準）。分位 0.85〜0.95 の境界に来た遺伝子は fp32 で再計算して確認（最大 5 遺伝子 × 200 細胞 × 1 seed ≈ 0.04 h）\n- 長さビン数 3 / 5 / 10 の感度（解析のみ）\n- 同じマシン（spark-c083）で 2 run を逐次実行し、デバイス差を比較から除く\n\n## 8. 計算量見積もり（G2 の判断材料）\n| run | cell×gene | 実測レート | 時間 |\n|---|---|---|---|\n| D（delete, 37 遺伝子 × 200 × 3 seed） | 22,200 | 0.129 s（GB10, EXP-003 phase 3: 20,400 を 44 分） | **0.80 h** |\n| O（overexpress, 38 × 200 × 3） | 22,800 | 同上 | **0.82 h** |\n| 重心抽出・モデルロード・転送 | — | — | ~0.2 h |\n| **合計** | 45,000 | | **約 1.8 h**（GPU 2 h 以内 → CLAUDE.md §3 の G2 追加申請は不要。PI の「全て実行」に含まれる） |\n\n- 1 万細胞超のスクリーニングには該当しない（ユニーク細胞は start 7,533 のうち選抜分）\n- 2 h を超える見込みになった時点で中断し、PI に G2 として報告する\n\n## 9. 想定される失敗と限界\n| 事項 | 対策・扱い |\n|---|---|\n| overexpress は「発現細胞で rank を最上位へ」であり、非発現細胞への遺伝子導入ではない | 限界として明記。null も同じ操作なので比較は公平 |\n| overexpress では HK（ACTB/GAPDH/PPIA）が rank 中〜下位（rank_pct 0.55〜0.89）から最上位へ動く＝大きな摂動 | C3 が「範囲内」を求めるだけなので過大／過小どちらでも検出される。結果を見て解釈する |\n| 文献の因果効果が in silico に写らない（モデルが学んでいない） | C1' は「5〜6 中 2 以上」で部分的な写り込みを許す。全滅なら棄却 |\n| 合格が高マーカー度の遺伝子に偏る | C6 で区別。偏れば「マーカー除去で説明可能」と報告する |\n| 循環性（start/goal を分けた分類器で goal 方向を読む） | HYP §循環性。埋め込みと ΔP の 2 系統、HK・パネル・null との比較、held-out donor |\n| bf16 の量子化（guardrails） | 境界の遺伝子だけ fp32 で再計算 |\n| datasets 4.0/4.8 の fork（guardrails） | `nproc: 1`、run_isp.py の `single_process_datasets` |\n| リモートに人由来データの複製が残る | 終了後に `isp_remote.sh clean` |\n| 他エージェントが同じ run_isp.py を編集 | 本実験は run_isp.py を変更しない（既存機能のみ使用）。push 時に sha256 を照合 |\n\n## 10. 承認\n- G1（HYP-20260926-04 の採択）: PI の「全て実行」（2026-09-26）に基づき Labretary が記録。明示の採択は G3 で確認\n- G2: **不要**（GPU 約 1.8 h < 2 h、1 万細胞未満、全遺伝子スクリーニングでない）。超過が見込まれた時点で中断して申請する\n- G3: 未（結果と判定を PI に諮る）\n\n## 11. コード\n- `scripts/geneformer/run_isp.py` は**変更しない**（既存の perturb_type: overexpress / capture.classifier_logits / negative_sampler.ref_genes で足りる）\n- 新規 `analysis/gene_annotation.py`（実行可能性とマーカー度。ISP 前に実行, 出力 `work/gene_annotation.json`）\n- 新規 `analysis/evaluate_positives.py`（EXP-002 の `reanalysis_cosine.py` / `vector_phase0.py` / `evaluate_controls.py` をそのまま import し、陽性対照リストと C1'・C2'・C6・C7・ΔP 指標を追加。EXP-002 側のコードは変更しない）\n\n## 12. 事前登録の固定（結果を見る前）\n- 2026-09-26 20:0x に、config・解析コードの sha256 を `work/SHA256SUMS-preregistered.txt` に記録\n- 解析コードの検証: `analysis/evaluate_positives.py` を **EXP-20260926-003 phase 3 の結果**に適用し、EXP-003 の公表値を再現することを確認（a2 で VCAM1 null 分位 0.983 / HAVCR1 0.65、C3 ACTB 0.383・GAPDH 0.65・PPIA 0.20、C3-panel 7/7、null 負の割合 0.58、dP_a2 VCAM1 0.75）。出力は `work/check-exp003/`\n- overexpress 経路の smoke: `work/config-smoke-oe.yaml`（2 陽性 + 1 HK + 2 null + VCAM1、6 細胞、seed 3）を Mac MPS で実行し、cells.csv・CLS 埋め込み・分類ヘッド logits が正しく出ることを確認（出力 `work/work/smoke-oe/`）。`scripts/geneformer/run_isp.py` は未変更\n"}, {"id": "experiments-EXP-20260926-005-validation-md", "label": "検証", "path": "experiments/EXP-20260926-005/validation.md", "kind": "md", "bytes": 6816, "body": "# EXP-20260926-005 検証（validator）\n\n対象: `results-delete/`（run D）と `results-oe/`（run O）、判定は `*/eval/criteria.json`（事前登録 `plan.md` §6）。\n\n## 1. 事前登録の遵守\n| 項目 | 確認 | 結果 |\n|---|---|---|\n| config・解析コードが事前登録時から未変更 | `shasum -a 256 -c work/SHA256SUMS-preregistered.txt` | 4 ファイルとも OK |\n| 判定基準を結果を見た後に変えていない | `criteria.json` は config の `analysis.criteria` をそのまま読む。config は未変更 | OK |\n| 盲検（TP53/CDKN1A/LTBR/SPP1/LCN2） | `controls_only: true` で未実行、`load_run` が読み込み直後に除外して assert | OK |\n| 入力データの同一性 | tokenized の `data-*.arrow` sha256 = `ba3a14c0…`（EXP-001/003 と一致）、FT 重み `e1bc1fdf…` がローカル＝リモートで一致 | OK |\n| 実行環境 | 2 run とも同一ホスト spark-c083（CUDA, bf16）。`device.json`・`env-remote.json` に記録 | OK |\n| 事後に追加した解析 | `analysis/report_tables.py`（表の整形＋参考 C4/C5）、`analysis/explore_rank.py`（rank 交絡）、`dM_raw`（logit 差）。いずれも**事前登録の判定には使っていない**。README に「探索的（事前登録外）」と明示 | OK |\n| 成果物の実在 | `ls` で確認（run D 795 ファイル、run O 816 ファイル。いずれもリモート側と一致） | OK |\n\n## 2. 判定の再確認\n- **run D（delete）**: C1' 0/5 で不合格。C3・C3-panel は合格（系は壊れていない）ので、これは**有効な否定的結果**。\n- **run O（overexpress）**: C1' 3/6 は合格だが、**C3 が不合格**（GAPDH が 3 seed とも分位 0.95）。`plan.md` §6.3 の「C3 または C3-panel が不合格の run は判定不能」に従い、**run O は判定不能**。C1'・C6 が合格していることをもって P2・P3 を支持と書いてはいけない。\n- 上記より `plan.md` §6.3 の「両 run とも C1' 不合格 → 棄却」にも「どちらかが C1'+C2'+C3+C3-panel → 支持」にも当たらない。**HYP-20260926-04 は inconclusive（判定不能）**が事前登録に忠実な結論。\n\n## 3. 符号・向きの確認（guardrails: 比や分位を報告する前に向きを見る）\n- run O の null は補正前 m_raw が正（負の割合 0.02）＝ overexpress では**全遺伝子が goal 方向へ一様に動く**。a2（null 平均を引く）はこの一様分を除いており、分位上位 = 「一様分より goal 側」。run D の null 負の割合は 0.12（m_raw）で、EXP-001 で問題になった削除ドリフトは FT モデルでは解消している。\n- 方向対照（C7）は VCAM1・HAVCR1 とも 3 seed で分位 0.05〜0.10、a2 は負（−22.6e-4 / −16.4e-4）＝障害マーカーの過剰発現は goal から**遠ざかる**。向きとしては期待どおりだが、下記 §4 の rank 交絡でも同じ順序になるため、これ単独では特異性の証拠にならない。\n\n## 4. 最大の弱点 — run O の指標は「摂動の大きさ」を測っている疑い\n`eval/explore_rank.json`（探索的）:\n- 元のトークン位置（pos/length。大きいほど元は下位）と a2 の遺伝子単位 Spearman は run O で 0.65 / 0.47 / 0.32（seed 3/4/5）、**null 20 遺伝子だけでも seed 3 で 0.51（p=0.02）**。run D では −0.11 / −0.06 / −0.23 と無関係。\n- 固定 18 遺伝子では `rank_pct_start` と a2 の ρ = 0.71（p=0.001）。GAPDH（rank_pct 0.71）・EEF1D（0.72）が上位、元から高発現の PPIA（0.55）・ESRRA（0.24）・VCAM1（0.36）が下位。\n- つまり run O の分位は「元の順位が低い遺伝子を最上位に上げると埋め込みが大きく動く」という**操作の大きさの効果**で相当部分が説明できる。C3 不合格（GAPDH）はその症状であり、独立した不具合ではない。\n- **設計上の穴**: null は発現**頻度**でマッチさせたが、overexpress では効きしろ（元の rank）が効果量を決めるのに、そこはマッチしていない。次に overexpress で ISP をするときは **rank マッチ null**（または rank を共変量として補正した指標）が必要。\n\n## 5. 副指標 ΔP の信頼性\n- FT 分類器は start 細胞で飽和（P(PT_healthy) 中央値 0、99 パーセンタイル 1.2e-3）。さらに logits は bf16 格子（0.031 刻み）で、Δ(logit 差) が厳密に 0 の細胞が 53%。\n- そのため dP 系は seed 間一致が低く（run D 0.27 / run O 0.055）、run D では細胞単位の長さ相関が −0.82 という見かけの構造も出る。**事前登録では副指標だったが、実質的に情報を持たない**。結論には使わず、限界として明記した。guardrails に追記済み。\n\n## 6. 再現性・頑健性\n- run D: C4 split-half 0.37（参考ライン 0.7 未達）、seed 間（固定 17 遺伝子）0.70。効果が null SD の中に収まる遺伝子ばかりなので、順位が安定しないのは整合的。\n- run O: C4 split-half 0.871、seed 間 0.907 と高い。ただし §4 のとおり、安定して測れているのが生物学ではなく rank の可能性がある。\n- bf16 の確認（plan §7）: run D は分位 0.85〜0.95 の陽性が 0 のため fp32 再計算は不要。run O は 9 組（陽性 × seed）が境界域に入ったが、**run O 自体が C3 不合格で判定不能**のため、fp32 再計算をしても結論は変わらない（rank 交絡を解かない限り分位の解釈が定まらない）。再計算は次の実験で rank マッチ null を入れてから行うのが妥当。\n- 細胞数: run D は null 1 遺伝子（seed 4）が 179 細胞、他はすべて 200。run O は全 114 遺伝子×seed が 200。事前の実行可能性見積もり（plan §2）どおり。\n\n## 7. データ・安全性\n- `data/raw/` と EXP-001/003 の資産は読み取りのみ（tokenized は APFS clone を使用、他実験の dataset を直接指していない）。\n- リモート（spark-c083）の複製 3.6 GB は `isp_remote.sh clean` で削除し、`ls` で消失を確認。資格情報は記録していない。\n\n## 8. 検証の結論\n- run D の否定的結果は**有効**（系は正常で、文献ドライバー 5 遺伝子は null から分離しなかった）。\n- run O は事前登録どおり**判定不能**。C1' 合格は rank 交絡で説明できる可能性が高く、支持と書いてはならない。\n- したがって **HYP-20260926-04 は inconclusive**。「陽性対照を因果の確立した遺伝子に替えれば解決する」とは言えず、同時に「棄却」も断定できない（run O が判定不能のため）。\n"}, {"id": "experiments-EXP-20260926-005-results-delete-README-md", "label": "結果（削除型）", "path": "experiments/EXP-20260926-005/results-delete/README.md", "kind": "md", "bytes": 5119, "body": "# EXP-20260926-005 run D（delete）— 結果\n\n- config: `../config-delete.yaml`（事前登録 sha256 `7248299d…` と一致を確認, `../work/SHA256SUMS-preregistered.txt`）\n- 実行: spark-c083（GB10, CUDA, bf16 forward + fp32 コサイン。`device.json`）/ 2026-09-26 19:54:28 → 20:43:33（**0.82 h**, exit=0）。ログ `../logs/remote-config-delete_.log`、環境 `env-remote.json`\n- 回収: `isp_remote.sh pull` 後、ファイル数 ローカル 795 = リモート 794 + `env-remote.json`（2026-09-26 20:5x 確認）\n- 規模: 37 遺伝子 × 3 seed（3/4/5）= 111 遺伝子×seed、22,179 細胞（null 1 遺伝子が seed 4 で 179 細胞、他はすべて 200）。null は seed ごとに 20 遺伝子（delete 陽性 5 に発現頻度マッチ, 3 seed で計 60 遺伝子）\n- 盲検: TP53/CDKN1A/LTBR/SPP1/LCN2 は回しておらず、解析でも読み込み直後に除外（assert）\n\n## ファイル\n| パス | 内容 |\n|---|---|\n| `summary.csv`, `cells.csv`, `run-*-L-1/` | run_isp.py の出力（遺伝子ごとの CLS 埋め込み orig/pert・分類ヘッド logits・細胞表） |\n| `eval/criteria.json`, `eval/criteria.csv` | **事前登録の判定**（`analysi VCAM1 だけ 19.1〜23.5\n- 他の 7 指標（m_raw, m_d, m_d2, m_c, V2, V2L, dP_raw）でも C1' 合格遺伝子は 0（`eval/criteria.csv`）\n\n## 参考基準（報告のみ）\n| | a2 | dP_a2 |\n|---|---|---|\n| C4 split-half（donor 2 群 × 20 回 × 3 seed, 全 37 遺伝子）Spearman 平均 | 0.37 | 0.45 |\n| C4 seed 間（固定 17 遺伝子）Spearman 平均（3 組） | 0.70（0.68, 0.63, 0.78） | 0.27（0.02, 0.53, 0.26） |\n| C5 遺伝子単位 ρ(平均長さ) / ρ(細胞数) | −0.12 / −0.15 | −0.13 / −0.00 |\n| C5 細胞単位 ρ(長さ) の中央値 | 0.01 | **−0.82** |\n\n## 注意（分類器 logits の扱い）\n- start 細胞で P(PT_healthy) の中央値は 0（99 パーセンタイル 1.2e-3）で**分類器が飽和**している。|ΔP| の 99 パーセンタイルは 6e-5 で、遺伝子平均の ΔP は少数の細胞（|ΔP| > 0.01 は 0.3%）に支配される\n- さらに logits は **bf16 の forward から出るため 2^-5 = 0.031 刻みに量子化**されており（`logits_*.npy` は float32 だが値は bf16 格子）、Δ(logit 差) が厳密に 0 の細胞が 53%。ΔP 系の指標（dP_raw, dP_a2, 探索的 dM_raw）は情報量が小さく、C4 の seed 間一致 0.27、細胞単位の長さ相関 −0.82 もこの量子化・飽和の影響と考えられる。**ΔP 系は判定の補助にとどめ、主指標 a2 で判断する**\n"}, {"id": "experiments-EXP-20260926-005-results-oe-README-md", "label": "結果（過剰発現型）", "path": "experiments/EXP-20260926-005/results-oe/README.md", "kind": "md", "bytes": 5002, "body": "# EXP-20260926-005 run O（overexpress）— 結果\n\n## 実行の記録\n- config: `../config-overexpress.yaml`（事前登録 sha256 `3a55bbbb…` と一致を確認）\n- 実行: spark-c083（GB10, CUDA, bf16 forward + fp32 コサイン）/ 2026-09-26 20:54:07 → 21:44:39（0.84 h, exit=0）\n- 照合: run_isp.py・capture_env.sh・config の sha256 一致、tokenized のデータ部分（`data-*.arrow` = `ba3a14c0…`）一致、FT モデル重み `e1bc1fdf…` 一致\n- 回収後に `isp_remote.sh clean` を実行し、リモートの作業ディレクトリ（3.6 GB）が消えたことを確認\n- 規模: 38 遺伝子 × 3 seed（3/4/5）、22,800 細胞（全遺伝子×seed で 200 細胞）。null は seed ごとに 20 遺伝子（overexpress 陽性 6 に発現頻度マッチ、run D とは別セット）\n- 盲検: TP53/CDKN1A/LTBR/SPP1/LCN2 は実行せず、解析でも除外（assert）\n\n## 判定（主指標 a2, 事前登録 §6）\n| 基準 | 結果 | 判定 |\n|---|---|---|\n| C1'（陽性 6 中 2 以上が分位 ≥ 0.90 を 3 seed 中 2 以上） | **3/6**: NFE2L2 3 seed、HNF4A 2 seed、PPARA 2 seed | 合格 |\n| C2'（C1' 合格遺伝子が HK 9 組中 7 以上で上回る） | HNF4A 6/9、PPARA 7/9、NFE2L2 6/9 | **不合格** |\n| C3（HK が分位 0.10〜0.90） | ACTB 3/3、PPIA 2/3、**GAPDH 0/3**（0.95, 0.95, 0.95） | **不合格** |\n| C3-panel | 6/7（TATDN1 が 3 seed とも 0.05〜0.10 で下限外） | 合格 |\n| C6 | C1' 合格のうち PPARA（ddet_pct 0.60）が該当 | 合格 |\n| C7（参考） | VCAM1 3/3、HAVCR1 3/3 が分位 ≤ 0.50（実際は 0.05〜0.10） | 参考として一貫 |\n\n**事前登録 §6.3 により、C3 不合格の run は「判定不能」。** C1' と C6 を満たしていても、HK の GAPDH が陽性対照と同じく null 上位に来ているため、この run から P2・P3 の支持は主張できない。\n\n## seed ごとの null 分位（a2）と値（×1e-4, null 20 遺伝子の平均 ± SD）\n| 遺伝子 | 役割 | ddet_pct | 分位 s3 / s4 / s5 | a2 平均（×1e-4） |\n|---|---|---|---|---|\n| NFE2L2 | 陽性 | 0.96 | 0.90 / 0.90 / 0.95 | 16.2 |\n| PPARA | 陽性 | 0.60 | 0.95 / 0.85 / 0.95 | 14.8 |\n| HNF4A | 陽性 | 0.92 | 0.95 / 0.90 / 0.80 | 13.8 |\n| CPT1A | 陽性 | 0.41 | 0.60 / 0.85 / 0.80 | 8.9 |\n| PPARGC1A | 陽性 | 0.29 | 0.10 / 0.05 / 0.10 | −14.5 |\n| ESRRA | 陽性 | 0.61 | 0.10 / 0.10 / 0.10 | −13.4 |\n| GAPDH | HK | 0.91 | 0.95 / 0.95 / 0.95 | 19.0 |\n| ACTB | HK | 0.26 | 0.75 / 0.45 / 0.45 | 2.7 |\n| PPIA | HK | 0.00 | 0.10 / 0.10 / 0.05 | −14.8 |\n| EEF1D | パネル | 0.23 | 0.85 / 0.95 / 0.95 | 18.0 |\n| TATDN1 | パネル | 0.79 | 0.10 / 0.05 / 0.10 | −16.6 |\n| VCAM1 | 方向対照 | 0.99 | 0.05 / 0.05 / 0.05 | −22.6 |\n| HAVCR1 | 方向対照 | 0.71 | 0.10 / 0.05 / 0.05 | −16.4 |\n\n- null 20 遺伝子: a2 平均 ≈ 0（SD 1.1〜1.4e-3）。補正前 m_raw の null 平均は +2.7e-3 で、overexpress では全遺伝子が goal 方向へ一様に動く（負の割合 0.02）\n- 効果量は delete run の 10 倍程度（a2 の null SD: OE 1.1〜1.4e-3 vs delete 4.6〜5.3e-4）。overexpress（rank 最上位へ移動）は delete より大きな摂動\n\n## 参考基準\n| | a2 | dP_a2 |\n|---|---|---|\n| C4 split-half（donor 2 群 × 20 回 × 3 seed, 38 遺伝子） | 0.871 | 0.279 |\n| C4 seed 間（固定 18 遺伝子, 3 組） | 0.907（0.886, 0.911, 0.924） | 0.055 |\n| C5 遺伝子単位 ρ(平均長さ) | −0.081 | 0.059 |\n| C5 細胞単位 ρ(長さ) 中央値 | −0.02 | 0.167 |\n\n- a2 は C4・C5 とも参考ラインを満たす（delete run の split-half 0.37 より大幅に安定）。dP 系は run D と同じく分類器の飽和・bf16 量子化のため情報量が小さい（guardrails 参照）\n\n## 探索的（事前登録外）: 分位は「元の rank」で説明できる\n`analysis/explore_rank.py`（出力 `eval/explore_rank.json`）。摂動遺伝子の元のトークン位置（pos/length, 小さいほど元から高発現）と a2 の遺伝子単位 Spearman:\n\n| | seed 3 | seed 4 | seed 5 |\n|---|---|---|---|\n| run O 全 38 遺伝子 | 0.65 (p=1e-5) | 0.47 (p=0.003) | 0.32 (p=0.05) |\n| run O null 20 遺伝子のみ | 0.51 (p=0.02) | 0.23 | −0.06 |\n| run D 全 37 遺伝子 | −0.11 | −0.06 | −0.23 |\n\n固定 18 遺伝子では `rank_pct_start`（発現細胞での rank 位置の中央値, 大きいほど元は下位）と a2 の ρ = 0.71（p=0.001）。**元の順位が低い遺伝子ほど最上位へ移したときの a2 が大きい**＝摂動の大きさそのものを測っている可能性がある。GAPDH（rank_pct 0.71）・EEF1D（0.72）・ACTB（0.89）が上位に来る一方、元から上位の PPIA（0.55）・ESRRA（0.24）・VCAM1（0.36）が下位に沈むのはこれで説明できる。この交絡は run O の C3 不合格（GAPDH）と整合する。null は発現**頻度**でマッチさせたが、**rank ではマッチしていない**（事前登録の設計上の穴）\n"}, {"id": "experiments-EXP-20260926-005-results-delete-eval-criteria-csv", "label": "判定表（削除型）", "path": "experiments/EXP-20260926-005/results-delete/eval/criteria.csv", "kind": "csv", "bytes": 2338, "body": "metric,n_seeds,pos_seeds_ge_q90,pos_pct_mean,C1p_pass_genes,C1p,C2p_wins_of_9,C2p,C3_seeds,C3_pct_mean,C3,C3_panel_n_ok,C3_panel,C6_nonmarker_pass,C6,C7_seeds_low,extra_pct_mean,null_frac_negative\nm_a2,3,HIF1A:0 NOTCH1:0 EGFR:0 YAP1:0 KEAP1:0,HIF1A:0.6 NOTCH1:0.367 EGFR:0.35 YAP1:0.6 KEAP1:0.283,-,False,,False,\"{'ACTB': 3, 'GAPDH': 3, 'PPIA': 2}\",ACTB:0.233 GAPDH:0.583 PPIA:0.217,True,7/7,True,-,False,,VCAM1:0.983 HAVCR1:0.617,0.48\nm_raw,3,HIF1A:0 NOTCH1:0 EGFR:0 YAP1:0 KEAP1:0,HIF1A:0.6 NOTCH1:0.417 EGFR:0.3 YAP1:0.5 KEAP1:0.317,-,False,,False,\"{'ACTB': 2, 'GAPDH': 3, 'PPIA': 2}\",ACTB:0.133 GAPDH:0.483 PPIA:0.167,True,7/7,True,-,False,,VCAM1:0.983 HAVCR1:0.6,0.12\nm_d,3,HIF1A:0 NOTCH1:0 EGFR:0 YAP1:0 KEAP1:0,HIF1A:0.483 NOTCH1:0.35 EGFR:0.233 YAP1:0.4 KEAP1:0.55,-,False,,False,\"{'ACTB': 3, 'GAPDH': 3, 'PPIA': 2}\",ACTB:0.133 GAPDH:0.283 PPIA:0.133,True,6/7,True,-,False,,VCAM1:1.0 HAVCR1:0.683,0.07\nm_d2,3,HIF1A:0 NOTCH1:0 EGFR:0 YAP1:0 KEAP1:0,HIF1A:0.533 NOTCH1:0.283 EGFR:0.3 YAP1:0.433 KEAP1:0.433,-,False,,False,\"{'ACTB': 3, 'GAPDH': 3, 'PPIA': 2}\",ACTB:0.4 GAPDH:0.5 PPIA:0.2,True,6/7,True,-,False,,VCAM1:1.0 HAVCR1:0.717,0.43\nm_c,3,HIF1A:0 NOTCH1:0 EGFR:0 YAP1:0 KEAP1:0,HIF1A:0.583 NOTCH1:0.45 EGFR:0.367 YAP1:0.567 KEAP1:0.3,-,False,,False,\"{'ACTB': 3, 'GAPDH': 3, 'PPIA': 2}\",ACTB:0.25 GAPDH:0.617 PPIA:0.3,True,7/7,T AVCR1:0.617,0.5\ndP_raw,3,HNF4A:0 PPARGC1A:0 PPARA:2 ESRRA:0 CPT1A:0 NFE2L2:0,HNF4A:0.233 PPARGC1A:0.667 PPARA:0.667 ESRRA:0.733 CPT1A:0.6 NFE2L2:0.817,PPARA,False,PPARA:6,False,\"{'ACTB': 3, 'GAPDH': 2, 'PPIA': 3}\",ACTB:0.533 GAPDH:0.8 PPIA:0.517,True,7/7,True,PPARA,True,VCAM1:1 HAVCR1:2,VCAM1:0.683 HAVCR1:0.417,0.35\n"}]}, {"section": "仮説", "docs": [{"id": "hypotheses-HYP-20260925-01-md", "label": "HYP-20260925-01 老化軸と LTβR", "path": "hypotheses/HYP-20260925-01.md", "kind": "md", "bytes": 7073, "body": "# HYP-20260925-01: TLS-high の CKD 腎では、修復不全型の近位尿細管（aPT）が p53–p21 老化軸と LTβR に強く依存しており、これらを削除すると健常 PT 状態へ近づき、その効果は TLS-low 腎の aPT より大きい\n\n- Status: inconclusive\n- 起点: `outputs/literature/2026-09-25-tls-feasibility/feasibility.md` §2・§3.1（A2 で TLS スコアと aPT 比率が相関 ρ = 0.43、n = 74 donor。TLS-high の aPT で SPP1/LCN2/HAVCR1/TP53 の検出率が高い）、カタログ §2（腎の障害・修復不全 PT、細胞老化コア）、Yoshikawa 2023（TLT 周囲の Vcam1⁺ 障害 PT、PMID 37548710）\n- 新規性: 新規予測（TP53 / CDKN1A / LTBR の効果が TLS の状態によって変わること）。既知の再確認（VCAM1 / HAVCR1 の削除で aPT が健常側へ動くこと）を陽性対照として含む\n\n## 仮説\nヒト CKD 腎の近位尿細管（A2 KPMP scRNA）において、**TP53, CDKN1A（p53–p21 老化軸）と LTBR（TLS のリンパ球が出す LTα1β2 の受容体）** を delete すると、細胞状態が **aPT_CKD_TLShigh（start）** から **PT_healthy（goal）** へ近づく。その goal 方向シフトは、TLS-low の CKD 腎の aPT（alt）で同じ摂動をしたときより大きい。\n\n- データ: A2 `A2_KPMP_v1.5_scRNA_Lake2023.h5ad`（raw.X → X、n_counts を付けたコピーを `experiments/EXP-*/work/` に作る。data/raw は変更しない）\n- state_key: `isp_state`（**推定ラベル**。`author_cell_type` は著者のアノテーション、TLS 群は本解析で推定したもの）\n  - start = `aPT_CKD_TLShigh`: author_cell_type = aPT、disease = CKD、donor の TLS 群 = high → **7,533 細胞 / 14 donor**\n  - goal = `PT_healthy`: author_cell_type ∈ {PT-S1/S2, PT-S3}、disease = normal → **6,149 細胞 / 22 donor**\n  - alt = `aPT_CKD_TLSlow`: aPT、CKD、TLS 群 = low → **4,002 細胞 / 8 donor**\n- 摂動: `perturb_type: delete`、emb_mode `cls`（V2 の必須設定、guardrails 参照）\n  - 対象（新規予測）: TP53 (ENSG00000141510), CDKN1A (ENSG00000124762), LTBR (ENSG00000111321)\n  - 対象（データ駆動。TLS-high の aPT で検出率が高い障害マーカー。削除すれば健常側へ動くのは半ば自明なので、効果量の参照に使う）: SPP1 (ENSG00000118785), LCN2 (ENSG00000148346)\n  - start の CKD TLS-high aPT のうち各遺伝子を発現している細胞数: TP53 1,063、CDKN1A 572、LTBR 1,600、SPP1 5,730、LCN2 514、VCAM1 4,685、HAVCR1 660（delete は発現している細胞にしか効かないため、**遺伝子ごとに発現細胞から抽出**し、1 donor あたり 15 細胞以下にする）\n- 事前チェック（ISP の前に行う）: start / goal / alt の CLS 埋め込みでロジスティック回帰の 5-fold AUC を出す。start vs goal の AUC が 0.8 未満なら ISP は行わない。start vs alt の AUC が 0.6 未満なら 2 回目（alt 条件）は行わない\n- 限界: TLS-high / TLS-low は pseudo-bulk の組成から推定したもので、組織学的な TLS ではない。CKD 内に限定して疾患の交絡を減らしたが、CKD の重症度（eGFR）の差は残る。IL7R/LTB/CCL19 の aPT での陽性は ambient RNA の可能性がある\n\n## 予測（定量）\n- 主要: TP53, CDKN1A, LTBR のそれぞれで、goal_state_shift（PT_healthy 重心へのコサイン類似度の増加の細胞平均）が、発現量をマッチさせたランダム 20 遺伝子の null 分布の上位 5% に入る（経験的 p、対象 5 遺伝子で BH-FDR < 0.05）。3 seed（異なるサブサンプル）のうち 2 つ以上で成り立つこと\n- 文脈依存性（新規予測の中心。2 回目の実行）: 同じ遺伝子を aPT_CKD_TLSlow で削除したときのシフトとの比 shift(TLS-high) / shift(TLS-low) が 1.2 以上で、donor 単位のブートストラップ 95% CI が 1 を含まない\n- 参照: SPP1 / LCN2 のシフトは VCAM1 / HAVCR1 と同程度（null の上位 10% 以内）になると予想する\n\n## 反証条件\n- TP53, CDKN1A, LTBR のシフトが 3 seed すべてで null の 80 パーセンタイル以下、またはシフトの向きが逆（healthy から離れる）→ 主要予測は棄却\n- shift 比の 95% CI が 1 を含む → 「TLS の状態で変わる」という部分は棄却（遺伝子の効果が一般的なだけ、という結論になる）\n- 陽性対照（VCAM1, HAVCR1）が null の上位 10% に入らない → 棄却ではなく **inconclusive**。パイプライン・状態定義を見直す\n\n## コントロール\n- ポジティブ: VCAM1（修復不全 PT マーカー、Kirita 2020 PMID 32571916 / Yoshikawa 2023 PMID 37548710）、HAVCR1（KIM-1、障害 PT、Lake 2023 PMID 37468583）。どちらも delete で aPT → 健常へ動くことが期待される既知の再確認\n- ネガティブ: 発現頻度をマッチさせたランダム 20 遺伝子（start 細胞のうち 300 細胞以上で発現しているものから、seed ごとに抽出）。ハウスキーピングの ACTB, GAPDH, PPIA（delete による非特異的なシフトの大きさの参照）\n- 状態のコントロール: alt（TLS-low aPT）へのシフトも同時に記録する（goal ではなく「別の aPT 状態」へ動いただけではないことを確認）\n\n## 実験コスト概算\n- 1 回目（TLS-high のみ）: 100 細胞/遺伝子 × 30 遺伝子（対象 5 + 陽性 2 + ランダム 20 + HK 3）× 3 seed = 9,000 細胞・遺伝子\n  - 下限: 2 forward × 1,660 tok ÷ 7,200 tok/s ≈ 0.46 s → 1.15 h。上限: smoke fp32 の実測 ≈ 0.8 s → 2.0 h\n  - 状態重心（start / goal / alt 各 500 細胞）: 0.1〜0.15 h\n  - **合計 ≈ 1.3〜2.2 h（MPS）。2 h の境界にある** → smoke で bf16 の実測値を取り、2 h を超える見込みなら着手前に **G2 承認**をとる\n- 2 回目（alt: TLS-low aPT で同じ摂動）: さらに ≈ 1.2〜2.0 h。1 回目と合わせると 2 h を超えるので **G2 必須**\n- 細胞数はいずれも 1 万未満（start 抽出の上限 7,533）\n\n## 支持された場合の次の一手（wet 実験）\n- ヒト近位尿細管細胞（RPTEC/TERT1 または初代 PT 細胞）で、反復低用量シスプラチンまたは放射線照射（10 Gy）により修復不全・老化様の状態を誘導する。そこへ TP53 / CDKN1A / LTBR の siRNA を入れ、HAVCR1・VCAM1・SPP1（qPCR）、SA-β-gal、p21 蛋白（WB）を測る\n- LTα1β2 またはアゴニスト抗 LTβR 抗体で PT 細胞を刺激し、LTBR ノックダウンの有無で比較する。障害マーカーと CCL2/CXCL10/CCL19 の分泌（ELISA）、リンパ球の transwell 遊走を読む（TLS → 尿細管の方向のクロストーク）\n- in vivo: 高齢マウスの IRI 後 TLT モデル（Sato 2016 PMID 27699223、Yoshikawa 2023 PMID 37548710）で、LTβR-Ig（LT 経路の阻害）または senolytic（ABT-263）を投与し、TLT の面積と Vcam1⁺ PT の比率を定量する\n"}, {"id": "hypotheses-HYP-20260925-02-md", "label": "HYP-20260925-02 線維芽細胞", "path": "hypotheses/HYP-20260925-02.md", "kind": "md", "bytes": 6518, "body": "# HYP-20260925-02: 腎線維芽細胞で LTβR–非古典的 NF-κB 経路（LTBR/RELB/NFKB2）と p21 老化プログラムを活性化すると、TLS オーガナイザー様（CCL19/CCL21/CXCL13⁺）の状態へ近づく\n\n- Status: proposed\n- 起点: `outputs/literature/2026-09-25-tls-feasibility/feasibility.md` §3.2（A1 で CCL19/CCL21/CXCL13⁺ 線維芽細胞 777 細胞 / 65 donor、donor ごとの比率が TLS スコアと ρ = 0.59、n = 71、p < 10⁻⁶）、カタログ §2「腎 TLT 線維芽細胞」（Sato 2016 PMID 27699223、Arai 2021 PMID 33951198）\n- 新規性: 新規予測（ヒト腎線維芽細胞での LTBR/RELB/NFKB2・CDKN1A の効果）。ラベル定義遺伝子（CCL19/CXCL13）の過剰発現は健全性チェックとしての既知の再確認\n\n## 仮説\nヒト腎の線維芽細胞系（A1 KPMP snRNA: FIB, aFIB, dFIB, M-FIB, dM-FIB, MYOF, cycMYOF）において、**LTBR, RELB, NFKB2, CDKN1A** を overexpress すると、細胞状態が **FIB_neg_TLShigh（start）** から **FIB_org（goal）** へ近づく。\n\n- データ: A1 `A1_KPMP_v1.5_snRNA_Lake2023.h5ad`（線維芽細胞系 21,769 細胞のみを抽出したコピーを `experiments/EXP-*/work/` に作る。data/raw は変更しない）\n- state_key: `fib_tls_state`（**推定ラベル**。細胞種は著者の subclass.l2、TLS 状態は本解析の遺伝子検出による推定）\n  - goal = `FIB_org`: CCL19 / CCL21 / CXCL13 のいずれかが 1 カウント以上 → **777 細胞 / 65 donor**（AKI 349、CKD 218、normal 200）\n  - start = `FIB_neg_TLShigh`: 上記 3 遺伝子がすべて 0、TLS-high donor、disease ∈ {AKI, CKD} → **5,748 細胞 / 22 donor**\n  - alt = `FIB_neg_TLSlow`: 3 遺伝子がすべて 0、TLS-low donor → **3,768 細胞 / 25 donor**\n- 摂動: `perturb_type: overexpress`（発現していない細胞にも適用できる）、emb_mode `cls`\n  - 対象（新規予測）: LTBR (ENSG00000111321), RELB (ENSG00000104856), NFKB2 (ENSG00000077150), CDKN1A (ENSG00000124762)\n  - 対象（既知の再確認・健全性チェック）: CCL19 (ENSG00000172724), CXCL13 (ENSG00000156234) — goal ラベルを定義する遺伝子なので、これで動かなければ状態定義かパイプラインが壊れている\n- 事前チェック（ISP の前）: FIB_org と FIB_neg の CLS 埋め込みでロジスティック回帰の 5-fold AUC を計算する。**AUC < 0.65 なら ISP は行わない**（snRNA で 1 カウント検出しただけの推定ラベルであり、ノイズが大きすぎると判断する）。その場合は goal を Meylan 2022 Visium（カタログ B4）の TLS スポット由来シグネチャーで定義し直してから再検討する\n- 限界: goal は 1〜数カウントの検出に基づく推定ラベル。皮質 FIB と髄質 M-FIB が混ざる（感度分析として皮質のみでも実行）。TLS スコアに CCL19/CCL21/CXCL13 が含まれるため、TLS 群との相関は一部循環的。snRNA のため CDKN1A 検出率は FIB 1.0%・aFIB 2.9% と低い\n\n## 予測（定量）\n- LTBR, RELB, NFKB2 の overexpress で、FIB_org 重心への goal_state_shift が、発現量をマッチさせたランダム 20 遺伝子（同じく overexpress）の null の上位 5% に入る（対象 6 遺伝子で BH-FDR < 0.05）。3 seed のうち 2 つ以上で成立すること\n- CDKN1A は null の上位 10% に入る（LT 軸より弱いと予想する）\n- 順序の予測: shift(LTBR) ≥ shift(RELB) ≈ shift(NFKB2) > shift(CDKN1A) > null の中央値\n- 文脈: start を FIB_neg_TLSlow に替えても LTBR のシフトは有意に残る（TLS 環境がなくても LT 軸は効く、という予測。差が出れば環境依存性の証拠になる）\n\n## 反証条件\n- LTBR, RELB, NFKB2 のいずれも 3 seed すべてで null の 80 パーセンタイル以下、またはシフトの向きが逆 → 主要予測は棄却\n- CCL19 / CXCL13 の overexpress でも goal へ動かない → 棄却ではなく **inconclusive**（状態定義・パイプラインの問題）。事前チェックの AUC と合わせて判断する\n- ハウスキーピング 3 遺伝子の overexpress が対象遺伝子と同程度のシフトを出す → 非特異的なシフトとして **inconclusive**\n\n## コントロール\n- ポジティブ: CCL19（腎 TLT のオーガナイザー様線維芽細胞のマーカー、Sato 2016 PMID 27699223）、CXCL13（TLS コア、Sautès-Fridman 2019 PMID 31092904）。どちらも goal ラベルを定義する遺伝子なので、健全性チェックとして扱い、新規性の主張には使わない\n- ネガティブ: 発現頻度をマッチさせたランダム 20 遺伝子（start 細胞で 300 細胞以上に発現しているものから seed ごとに抽出）、ハウスキーピング ACTB, GAPDH, PPIA\n- 状態のコントロール: MYOF（筋線維芽細胞）重心へのシフトも記録し、「線維化の方向へ動いただけ」でないことを確認する\n\n## 実験コスト概算\n- 100 細胞/遺伝子 × 29 遺伝子（対象 6 + ランダム 20 + HK 3）× 3 seed = 8,700 細胞・遺伝子。線維芽細胞の中央値遺伝子数 ≈ 1,590\n- 下限: 2 × 1,590 ÷ 7,200 ≈ 0.44 s/回 → 1.1 h。上限（smoke fp32 実測 0.8 s/回）→ 1.9 h。状態重心（3 状態 × 500 細胞）0.1 h\n- **合計 ≈ 1.2〜2.0 h（MPS）、細胞数 1 万未満。境界なので smoke で bf16 の実測を取り、2 h を超える見込みなら G2 承認をとる**\n- alt を start にした 2 本目を回す場合はさらに +1.2〜2.0 h → その時点で **G2 必須**\n\n## 支持された場合の次の一手（wet 実験）\n- ヒト腎線維芽細胞（初代皮質線維芽細胞または HRPF）をアゴニスト抗 LTβR 抗体、または LTα1β2＋TNF で刺激し、CCL19・CCL21・CXCL13・PDPN・NGFR の発現（qPCR、ELISA）を測る。RELB / NFKB2 の siRNA で阻害されるかを確認する\n- 照射（10 Gy）または反復継代で老化させた線維芽細胞で、同じ LTβR 刺激への応答が増強するかを比べる（老化 → オーガナイザー化のしやすさ）\n- 刺激した線維芽細胞の上清でヒト B 細胞の遊走（transwell）を測り、CXCL13 中和で消えるかを確認する\n- in vivo: 高齢マウス IRI 後 TLT モデル（Yoshikawa 2023 PMID 37548710）で、線維芽細胞特異的な Ltbr 欠損（Pdgfrb-CreERT2）が TLT 形成を抑えるかを見る\n"}, {"id": "hypotheses-HYP-20260925-03-md", "label": "HYP-20260925-03 腫瘍内 B 細胞", "path": "hypotheses/HYP-20260925-03.md", "kind": "md", "bytes": 6658, "body": "# HYP-20260925-03: ccRCC の腫瘍内 B 細胞では、加齢関連 B 細胞（ABC）プログラム（TBX21/ITGAX/ZEB2）と p21 が形質細胞への分化を押し進めており、これらを活性化すると TLS 由来の腫瘍内形質細胞状態へ近づく\n\n- Status: proposed\n- 起点: `outputs/literature/2026-09-25-tls-feasibility/feasibility.md` §3.3（A3 の腫瘍・腫瘍境界に活性化 B 1,498 細胞、IgG 形質細胞 283、IgA 形質細胞 253。活性化 B の CDKN1A⁺ が 27〜31% と naive B の 2.5% より高い）、カタログ §2「TLS 形質細胞（RCC）」（Meylan 2022 PMID 35231421）、「加齢関連 B 細胞（ABC）」（Arazi 2019 PMID 31209404）\n- 新規性: 新規予測（ABC プログラムと CDKN1A が腫瘍内 B → 形質細胞の状態遷移を駆動するという予測）。既知の再確認（PRDM1/XBP1 による形質細胞分化）を陽性対照に置く\n\n## 仮説\nccRCC の腫瘍内 B 細胞（A3 Li 2022）において、**TBX21, ITGAX, ZEB2（ABC プログラム）と CDKN1A** を activate すると、細胞状態が **B_tumour（start）** から **PlasmaCell_tumour（goal）** へ近づく。\n\n- データ: A3 `A3_RCC_LiR2022.h5ad`（B 系列のみを抽出したコピーを experiments 側に作る）\n- state_key: `b_state`（細胞種は著者の `annotation`（アノテーション済み）。**「腫瘍内」「TLS-high」は推定ラベル**）\n  - start = `B_tumour`: annotation ∈ {Naïve_B.1/2, Non-switched-memory_B, Switched-memory_B, Activated_B-AREG, Activated_B-RHOB}、summaryDescription ∈ {Tumour, Tumour-normal} → **約 1,833 細胞 / 11 donor**（うち活性化 B 1,498、メモリー B 255、naive B 80）\n  - goal = `PlasmaCell_tumour`: Plasma-IgG ＋ Plasma-IgA、Tumour ＋ Tumour-normal → **536 細胞 / 11 donor**（IgG 283、IgA 253）\n  - alt = `B_blood`: 同じ donor の末梢血 B（Naïve_B.1 2,765、Non-switched-memory 1,130）→ **約 4,000 細胞**\n  - 感度分析: start を TLS-high サンプルの腫瘍内 B（780 細胞）に絞った場合も見る\n- 摂動: `perturb_type: activate`（`perturb_rank_shift` は Geneformer の既定に従う）、emb_mode `cls`\n  - 対象（新規予測）: TBX21 (ENSG00000073861), ITGAX (ENSG00000140678), ZEB2 (ENSG00000169554), CDKN1A (ENSG00000124762)\n  - 対象（TLS 側の入力）: CXCR5 (ENSG00000160683), CD40 (ENSG00000101017), TNFSF13B/BAFF (ENSG00000102524)\n- 事前チェック: start と goal の CLS 埋め込みで 5-fold AUC を出す（形質細胞は転写プロファイルが大きく違うので AUC > 0.95 を期待する）。goal の中央値遺伝子数は IgG 形質細胞で 417 と低く、重心が浅い深度に引っ張られる可能性があるため、**深度をマッチさせたサブサンプル**でも重心を作って感度分析する\n- 限界: **A3 には TLS の組織学的ラベルがない。**「腫瘍内形質細胞 = TLS 由来」は Meylan 2022 の知見に基づく仮定であって、このデータでは確かめられない。IGHG1/IGHA1 は Geneformer のトークン辞書にないため、クラススイッチそのものは摂動できない。10x 5' のデータであり、Geneformer の事前学習の分布とずれている\n\n## 予測（定量）\n- TBX21, ITGAX, ZEB2 のいずれか 2 つ以上で、PlasmaCell_tumour 重心への goal_state_shift が発現量マッチのランダム 20 遺伝子の null の上位 5% に入る（対象 7 遺伝子で BH-FDR < 0.05）。3 seed のうち 2 つ以上で成立すること\n- CDKN1A は null の上位 10% に入る（老化プログラムが分化を押す、という弱めの予測）\n- 効果量の順序: shift(PRDM1) > shift(TBX21) > null の中央値。ABC プログラムの効果は既知のマスター転写因子（PRDM1）より小さいと予想する\n- alt（血中 B）を start にすると、TBX21/ITGAX/ZEB2 のシフトは腫瘍内 B より小さい（腫瘍微小環境で準備が整っている、という予測）\n\n## 反証条件\n- TBX21, ITGAX, ZEB2 のいずれも 3 seed すべてで null の 80 パーセンタイル以下、または向きが逆 → 主要予測は棄却\n- 陽性対照（PRDM1, XBP1）が null の上位 10% に入らない → **inconclusive**（パイプライン・状態定義の問題）\n- start を血中 B にしたときのシフトの方が大きい → 「腫瘍微小環境での準備」の部分は棄却\n\n## コントロール\n- ポジティブ: PRDM1/BLIMP1 (ENSG00000057657), XBP1 (ENSG00000100219) — 形質細胞分化のマスター制御因子。RCC の TLS で形質細胞への分化が起きるという文脈は Meylan 2022 PMID 35231421。既知の再確認として扱う\n- ネガティブ: 発現頻度マッチのランダム 20 遺伝子（start で 200 細胞以上に発現しているものから seed ごとに抽出）、ハウスキーピング ACTB, GAPDH, PPIA\n- 状態のコントロール: メモリー B 重心へのシフトも記録し、「B 細胞の活性化一般」ではなく形質細胞方向であることを確認する\n\n## 実験コスト概算\n- 100 細胞/遺伝子 × 32 遺伝子（対象 7 + 陽性 2 + ランダム 20 + HK 3）× 3 seed = 9,600 細胞・遺伝子。B 細胞の中央値遺伝子数 ≈ 1,100\n- 下限: 2 × 1,100 ÷ 7,200 ≈ 0.31 s/回 → 0.82 h。上限（0.8 s/回）→ 2.1 h。状態重心（3 状態 × 500 細胞）0.1 h\n- **合計 ≈ 0.9〜2.2 h（MPS）、細胞数 1 万未満。bf16 の実測が下限に近ければ G2 不要。2 h を超える見込みなら G2 承認をとる**\n- 感度分析（TLS-high に絞った start、深度マッチ重心）を足す場合は +0.5〜1.0 h\n\n## 支持された場合の次の一手（wet 実験）\n- ccRCC 手術検体から CD19⁺ B 細胞を分離し、CD40L＋IL-21＋BAFF で刺激する系で、T-bet（TBX21）誘導条件（IFN-γ＋TLR9 リガンド）を加えたときの形質芽細胞（CD38⁺CD27⁺）への分化と IgG 分泌（ELISpot）を測る。TBX21 / ZEB2 のノックダウンで減るかを確認する\n- ccRCC 切片で ABC（CD11c⁺T-bet⁺ B）と TLS の位置関係を多重免疫染色で確認し、TLS 成熟度（CD21⁺ FDC ネットワークの有無）と p21 陽性 B の割合を比べる\n- Meylan 2022 の Visium データ（GSE175540、カタログ B4）で、TLS スポットの ABC シグネチャースコアと IgG 形質細胞シグネチャーの共局在を検証する（ドライラボでの追試）\n- 予後との対応: TCGA-KIRC のバルクで ABC スコアと TLS スコアの交互作用が全生存と関連するかを見る\n"}, {"id": "hypotheses-HYP-20260925-04-md", "label": "HYP-20260925-04 腫瘍内 T 細胞", "path": "hypotheses/HYP-20260925-04.md", "kind": "md", "bytes": 6179, "body": "# HYP-20260925-04: ccRCC の腫瘍内 CD8 T 細胞では、老化関連 T 細胞（SA-T）軸である CD153/CD30（TNFSF8/TNFRSF8）と p16 が、TLS を誘導する CXCL13⁺ 組織常在型の状態への移行を駆動する\n\n- Status: proposed\n- 起点: `outputs/literature/2026-09-25-tls-feasibility/feasibility.md` §0-6・§3.3（A3 では CXCL13 カウントの 72.5% が CD8⁺T_RM-CXCL13 由来。この状態は CDKN2A⁺ 20.8%、TNFSF8⁺ 17.7% と、他の CD8 状態（TNFSF8⁺ 3〜13%）より高い）、カタログ §2「老化関連 T 細胞（SA-T）」（Sato 2022 PMID 34813503: CD153/CD30 の阻害で腎 TLT が縮小する）、TLS コア（Sautès-Fridman 2019 PMID 31092904）\n- 新規性: 新規予測（腎 TLT で見つかった CD153/CD30 の SA-T 軸が、ccRCC の CXCL13⁺ CD8 状態にも当てはまるという種・文脈を越えた予測）。CXCL13 自体の摂動は goal ラベルの健全性チェック\n\n## 仮説\nccRCC の腫瘍内 CD8 T 細胞（A3 Li 2022）において、**TNFSF8 (CD153), TNFRSF8 (CD30), CDKN2A (p16)** を activate すると、細胞状態が **CD8_Tex_CXCL13neg（start）** から **CD8_RM_CXCL13（goal）** へ近づく。\n\n- データ: A3 `A3_RCC_LiR2022.h5ad`（CD8 T のみを抽出したコピーを experiments 側に作る）\n- state_key: `cd8_state`（細胞状態は著者の `annotation`。**CXCL13 陰性の判定と「腫瘍内」は推定ラベル**）\n  - goal = `CD8_RM_CXCL13`: annotation = CD8+T_RM-CXCL13、summaryDescription = Tumour → **2,059 細胞 / 11 donor**（CXCL13⁺ 99.3%）\n  - start = `CD8_Tex_CXCL13neg`: annotation ∈ {CD8+T_EX-CCL4L2, CD8+T_preEX-CXCR4, CD8+T_EX-IL10}、Tumour、CXCL13 が 0 カウント → **約 17,000 細胞 / 11 donor**（ここから seed ごとに抽出。1 donor あたり上限 15 細胞）\n  - alt = `CD8_EM`: CD8+T_EM（Tumour 15,968）→ 分化の一般的な方向と区別するための参照\n  - 再現用データ: A4 Krishna 2021 の CD8A⁺ Exhausted 17,893 細胞（CXCL13⁺ 50.5%）。**A4 は donor が 6 名しかない**ので、あくまで再現の確認に使う\n- 摂動: `perturb_type: activate`、emb_mode `cls`\n  - 対象（新規予測）: TNFSF8 (ENSG00000106952), TNFRSF8 (ENSG00000120949), CDKN2A (ENSG00000147889)\n  - 対象（比較）: PDCD1 (ENSG00000188389), CDKN1A (ENSG00000124762)\n- 事前チェック: start と goal の CLS 埋め込みで 5-fold AUC を出す。CXCL13 は goal を定義する遺伝子なので、CXCL13 を除いた特徴で状態が分かれるか（AUC > 0.75）を確認してから ISP に進む\n- 限界: **A3 に TLS の組織学的ラベルはない。**「CXCL13⁺ CD8 が TLS を誘導する」という部分はこのデータでは検証できず、文献に依存する。さらに本解析では、腫瘍サンプル単位の CXCL13⁺CD8 比率と B＋形質細胞比率の相関は有意でなかった（ρ = 0.31、n = 11、p = 0.36）ので、**この前提自体が弱い**。腫瘍内の PDCD1 は疲弊マーカーでもあり、老化 T 細胞（SA-T）と同一視できない。CDKN2A は start での検出率が 5〜20% と低く、activate による効果は発現量の低い細胞で不安定になりうる\n\n## 予測（定量）\n- TNFSF8, TNFRSF8 のいずれかで、CD8_RM_CXCL13 重心への goal_state_shift が発現量マッチのランダム 20 遺伝子の null の上位 5% に入る（対象 5 遺伝子で BH-FDR < 0.05）。3 seed のうち 2 つ以上で成立すること\n- CDKN2A の activate は null の上位 10% に入る\n- 特異性: 同じ遺伝子の alt（CD8_EM）重心へのシフトは goal 方向のシフトより小さい（比 ≥ 1.2）\n- 再現: A4 で同じ摂動をしたときのシフトの向きが A3 と一致する（効果量は問わない）\n\n## 反証条件\n- TNFSF8, TNFRSF8 がどちらも 3 seed すべてで null の 80 パーセンタイル以下、または向きが逆 → 主要予測は棄却\n- CXCL13 の activate（健全性チェック）で goal へ動かない → **inconclusive**（状態定義・パイプラインの問題）\n- goal 方向と alt 方向のシフトが同程度 → 「CXCL13⁺ 常在型への特異的な移行」の部分は棄却（疲弊・分化一般の効果）\n\n## コントロール\n- ポジティブ: CXCL13（goal を定義する TLS コア遺伝子、Sautès-Fridman 2019 PMID 31092904 / 腎 TLT は Sato 2016 PMID 27699223）。健全性チェックとして扱い、新規性の主張には使わない。PDCD1（疲弊 CD8 の確立したマーカーであり、SA-T セットにも含まれる。Sato 2022 PMID 34813503）\n- ネガティブ: 発現頻度マッチのランダム 20 遺伝子（start で 500 細胞以上に発現しているものから seed ごとに抽出）、ハウスキーピング ACTB, GAPDH, PPIA\n- 状態のコントロール: alt（CD8_EM）重心へのシフト\n\n## 実験コスト概算\n- 100 細胞/遺伝子 × 30 遺伝子（対象 5 + 陽性 2 + ランダム 20 + HK 3）× 3 seed = 9,000 細胞・遺伝子。CD8 T の中央値遺伝子数 ≈ 1,320\n- 下限: 2 × 1,320 ÷ 7,200 ≈ 0.37 s/回 → 0.92 h。上限（0.8 s/回）→ 2.0 h。状態重心（3 状態 × 500 細胞）0.1 h\n- **合計 ≈ 1.0〜2.1 h（MPS）、細胞数 1 万未満。2 h を超える見込みなら G2 承認をとる**\n- A4 での再現（同じ設計）はさらに +1.0〜2.0 h → 2 本を続けて回すなら **G2 必須**\n\n## 支持された場合の次の一手（wet 実験）\n- ccRCC 手術検体の TIL を分離し、CD153（CD30L）架橋または抗 CD30 アゴニストで刺激して、CXCL13 の産生（細胞内染色・ELISA）と組織常在マーカー（CD69, ITGAE）の誘導を測る\n- ccRCC 切片の多重免疫染色で、CD153⁺/CD30⁺ CD8 T と p16⁺ 細胞が TLS（CD20⁺ 濾胞）の近傍に位置するかを定量する\n- TIL 上清を使った B 細胞遊走アッセイを、抗 CXCL13 中和の有無で比較する\n- 高齢マウスの腎癌／IRI 後 TLT モデルで抗 CD153 抗体を投与し（Sato 2022 PMID 34813503 の方法）、TLS の数・面積と CXCL13⁺ CD8 の割合を測る\n"}, {"id": "hypotheses-HYP-20260926-01-md", "label": "HYP-20260926-01 補正指標", "path": "hypotheses/HYP-20260926-01.md", "kind": "md", "bytes": 3209, "body": "# HYP-20260926-01（方法仮説）: 1 遺伝子 delete の埋め込み変化から「削除による一様な効果（削除ドリフト）」を差し引いた指標では、陽性対照がランダム null とハウスキーピング遺伝子の両方から分離し、ハウスキーピング遺伝子は null の中に収まる\n\n- Status: refuted（G3: PI, 2026-09-26。案 A で主指標 a2 が C1・C2・C4 不合格）\n- 起点: EXP-20260926-001（HYP-20260925-01, G3 inconclusive）。全遺伝子の delete が goal/start/alt の 3 重心すべてから離れ（run 1 で 90/90 遺伝子×seed）、HK の GAPDH/PPIA が陽性対照 VCAM1/HAVCR1 と同じく null 上位に入った。PI 指示（2026-09-26）「次の実験は、まず、削除による一様な効果を差し引いた指標にしてください」\n- 新規性: 方法の検証（生物学的な新規予測ではない）\n\n## 仮説\nKPMP A2 の CKD aPT（aPT_CKD_TLShigh, start）→ PT_healthy（goal）において、Geneformer V2-316M の CLS 埋め込みで 1 遺伝子 delete をしたとき、摂動変位ベクトルから null 遺伝子の平均的な変位（削除ドリフト）を除いた成分を start→goal 軸へ射影した指標は、陽性対照（VCAM1, HAVCR1）をランダム null と HK（ACTB, GAPDH, PPIA）の両方から分離し、HK を null の内側に置く。\n\n## 予測（定量。EXP-20260926-002 plan.md §6.2 の C1〜C5 と同じ）\n- C1: VCAM1・HAVCR1 がそれぞれ null の上位 10% に 3 seed 中 2 以上\n- C2: 陽性 > HK が 18 組中 15 組以上\n- C3: ACTB・GAPDH・PPIA の null 分位が 0.10〜0.90 に 3 seed 中 2 以上\n- C4: split-half の遺伝子順位 Spearman ≥ 0.7、seed 間（固定対照）≥ 0.7\n- C5: 細胞長・発現細胞数との |ρ| ≤ 0.3（遺伝子単位）、細胞長との |ρ| ≤ 0.2（細胞単位, 中央値）\n\n## 反証条件\n- 採用候補の指標が 3 seed の本番（対照のみ）で C1〜C3 のいずれかを満たさない → 「この系・この埋め込みでは、ドリフト補正後も陽性対照の特異的な信号を検出できない」と結論し、HYP-20260925-01 の再解析は行わない（陽性対照か goal 状態の定義を見直す）\n\n## コントロール\n- ポジティブ: VCAM1（Kirita 2020 PMID 32571916 / Yoshikawa 2023 PMID 37548710）、HAVCR1（Lake 2023 PMID 37468583）\n- ネガティブ: 発現頻度マッチのランダム null（seed ごと 20 遺伝子）、HK の ACTB, GAPDH, PPIA（**合否判定に含める**）\n\n## 実験コスト概算\n- EXP-20260926-002 plan.md §8 を参照（対照のみ 25 遺伝子 × 200 細胞 × 3 seed の本番 約 3.1 h, MPS bf16 → G2 必要。代替 100 細胞 × 2 seed は約 1.1 h）\n\n## 支持された場合の次の一手\n- HYP-20260925-01 の主要対象（TP53/CDKN1A/LTBR）を、採用した指標（第一候補 a2: 細胞長ビン別の null 平均 shift_goal を差し引く）で再評価する。まず EXP-20260926-001 の cells.csv に適用（GPU 不要）、次に 200 細胞 × seed 3–5 で追加（約 0.6 h）。いずれも PI の承認後\n- in silico 方法論の改善であり、wet 実験の対象ではない\n"}, {"id": "hypotheses-HYP-20260926-02-md", "label": "HYP-20260926-02 追加学習モデル", "path": "hypotheses/HYP-20260926-02.md", "kind": "md", "bytes": 7021, "body": "# HYP-20260926-02（方法仮説）: 腎 PT の障害軸（aPT_CKD vs PT_healthy）で fine-tuning した Geneformer CellClassifier の埋め込みでは、削除ドリフトが小さくなり、陽性対照が HK・陰性対照パネル・ランダム null から事前登録基準（C1〜C3, C3-panel）で分離する\n\n- Status: refuted（G3: PI, 2026-09-26。P1 棄却: a2 で C1 の HAVCR1 不合格。P2（削除ドリフト減少）・P3（C2 勝ち数 16 vs 10）は支持）\n- 起点: PI 指示（2026-09-26）「A の後に、そもそもファインチューニングをしていないと思うので、ファインチューニングをしたトレインドのモデルを使ったインシリコパーターベーションの実験を試みてください」。これまでの ISP（EXP-20260925-001, EXP-20260926-001, -002）はすべて Geneformer V2-316M **Pretrained**（BertForMaskedLM）の CLS 埋め込み\n- 背景: Pretrained の CLS 埋め込みでは、1 遺伝子 delete がどの遺伝子でも goal/start/alt の全重心から離れる「削除ドリフト」があり（EXP-001 run 1 で 90/90）、陽性対照 VCAM1/HAVCR1 が HK（GAPDH/PPIA）と区別できなかった。ドリフトの 56% は変位の半径成分（どの向きに動いても元の近くの重心から離れる 2 次の項）で、start→goal 軸の変化は小さい（|shift| ~10⁻⁴, EXP-002 §6.3）。Geneformer 原著の ISP（Theodoris 2023, *Nature* 618:616, PMID 37258680）は疾患状態で fine-tuning した分類モデルで行っており、fine-tuning で埋め込み空間の start→goal 軸が引き伸ばされれば、遺伝子特異的な移動がドリフトに対して相対的に大きくなると期待される\n- 新規性: 方法の検証（生物学的な新規予測ではない）。実験計画: [EXP-20260926-003](../experiments/EXP-20260926-003/plan.md)\n\n## 仮説\nKPMP A2 scRNA の近位尿細管で、aPT_CKD（TLS-low の CKD donor の aPT）と PT_healthy を donor 単位で分けて 2 クラス分類に fine-tuning した Geneformer V2-316M（CellClassifier）の CLS 埋め込み（emb_layer −1）では、fine-tuning に使っていない donor の aPT_CKD_TLShigh 細胞（start）で 1 遺伝子 delete をしたとき、主指標 a2（EXP-20260926-002 §6.4 と同一定義）で陽性対照（VCAM1, HAVCR1）がランダム null・HK（ACTB, GAPDH, PPIA）・陰性対照パネル 7 遺伝子の全てから分離し、HK とパネルは null の内側に収まる。\n\n## 予測（定量。EXP-20260926-002 plan.md §6.2 / §6.4 と同じ基準・同じ細胞・同じ遺伝子）\n- 前提（ゲート, phase 2）: FT 分類器が held-out donor（TLS-high aPT 14 donor + 健常 9 donor）で、凍結 Pretrained 埋め込み＋ロジスティック回帰に対し AUROC・macro-F1 ともに劣らず（ベースライン ≥ 0.99 の指標は 0.01 の非劣性）、donor 別の最小正解率 ≥ 0.80\n- P1（主）: a2 で C1（VCAM1・HAVCR1 がそれぞれ null 上位 10% に 3 seed 中 2 以上）、C2（陽性 > HK が 18 組中 15 以上）、C3（ACTB・GAPDH・PPIA が null 分位 0.10〜0.90 に 3 seed 中 2 以上）、C3-panel（7 遺伝子中 5 以上が 3 seed 中 2 以上で 0.10〜0.90）をすべて満たす\n- P2（副）: 同じ細胞・同じ goal 重心定義の Pretrained（EXP-002 案 A の埋め込みから再計算）と比べ、補正前の shift_goal での削除ドリフトが小さい（null 遺伝子×seed の負の割合が小さく、null の平均 shift_goal を start–goal 重心間距離 1 − cos(c_start, c_goal) で割った値の絶対値が小さい）\n- P3（副）: C2 の勝ち数（陽性 > HK, 18 組中）が Pretrained 以上\n- 参考（合否に使わない）: C4（split-half・seed 間の順位 ≥ 0.7）・C5（細胞長・発現細胞数との |ρ| ≤ 0.3 / 0.2）、分類ヘッドの ΔP(PT_healthy)（a2 と同じ長さビン補正）での C1〜C3\n\n## 反証条件\n- ゲート通過後、FT モデルで a2 が C1・C2・C3・C3-panel のいずれかを満たさない → 「この系では fine-tuning しても、delete の対照が事前登録基準で分離しない」と結論（棄却）。主要対象（TP53/CDKN1A/LTBR, SPP1/LCN2）は評価しない\n- ゲート不通過 → 仮説は検証できない（inconclusive）。FT モデルでの ISP は行わない\n\n## 循環性（start と goal で学習した分類器で goal 方向の移動を読む）への対策\n- 読み出しを 2 つ出す: 埋め込みの移動（主, a2）と分類確率の変化（副, ΔP）。両者の一致・不一致を報告する\n- 特異性は「陽性対照がドリフトの大きさではなく HK・パネル・null より大きく動くか」で判定する（C2/C3/C3-panel）。分類器が単に「発現の多い遺伝子を消すと障害らしさが減る」ように学習していれば HK とパネルも動き、C3/C3-panel で不合格になる\n- 陽性対照 VCAM1/HAVCR1 は aPT のマーカーでもあり、分類器が直接使っている可能性がある（マーカー除去効果）。この場合の C1 合格は「駆動因子」の証拠ではない。探索枠として、陽性対照と同程度に aPT で上昇する非ドライバー遺伝子（DE マッチ null）を加える案を plan §4.5 に記載（PI 判断）\n- ISP の細胞は fine-tuning に一切使っていない donor（start の 14 donor は全員 held-out、goal 重心も held-out の健常 9 donor）\n\n## コントロール\n- ポジティブ: VCAM1（Kirita 2020 PMID 32571916）、HAVCR1（Lake 2023 PMID 37468583）\n- ネガティブ: 発現頻度マッチのランダム null 20 遺伝子（seed ごと, EXP-002 案 A と同じ遺伝子）、HK の ACTB/GAPDH/PPIA（C2/C3 に含める, PI 方針）、陰性対照パネル CERS4/TATDN1/IFT25/VAPA/PHPT1/ANAPC16/EEF1D（C3-panel）、探索枠 RPS13/RPL32（報告のみ）\n- モデルの対照: 同じ細胞・同じ遺伝子・同じ goal 重心定義の Pretrained\n\n## 実験コスト概算（EXP-20260926-003 plan.md §8）\n- fine-tuning: リモート NVIDIA GPU で約 0.1〜0.9 h（RTX 4090〜A100 級。GPU 未確定のため probe で実測。未知の GPU なら最大 ~3 h）。MPS フォールバックは縮小構成で 0.8〜1.6 h\n- ゲート評価（Mac MPS）約 0.5 h、FT モデルの対照 ISP（34 遺伝子 × 200 細胞 × 3 seed）約 4.3 h、Pretrained の goal 重心の再抽出 約 0.1 h\n- 合計 約 5.0〜5.8 h（G2 必要。リモート GPU の時間も含む）\n\n## 支持された場合の次の一手\n- PI の承認後、FT モデル・a2 で主要対象（TP53/CDKN1A/LTBR）と参照（SPP1/LCN2）を評価（5 遺伝子 × 200 細胞 × 3 seed ≈ 0.6 h）\n- HYP-20260925-01 の文脈依存性（TLS-high vs TLS-low）は、推定 TLS 群の分離が弱い（事前チェック AUC 0.627）ため FT でも優先しない\n- in silico の方法論の改善であり、wet 実験の対象ではない\n"}, {"id": "hypotheses-HYP-20260926-03-md", "label": "HYP-20260926-03 比較遺伝子・提供者単位", "path": "hypotheses/HYP-20260926-03.md", "kind": "md", "bytes": 2345, "body": "# HYP-20260926-03（方法仮説）: FT CellClassifier の ISP における VCAM1 の特異性と donor 単位の再現性\n\n- Status: partially_supported（G3: PI, 2026-09-27。比較遺伝子の予測 P-a は支持、提供者単位の一致 P-c1 は支持、提供者を増やした再現性の改善 P-c2 は不成立）\n- 起点: EXP-20260926-003 の結果（FT で削除ドリフトは消えたが C1 は HAVCR1 で不合格、VCAM1 のみ null 上位、split-half 0.46）\n- 実験計画: [EXP-20260926-004](../experiments/EXP-20260926-004/plan.md)（(a) DE マッチ比較、(c) donor 単位解析。(b) 陽性対照の見直しは別担当）\n- 新規性: 方法の検証であり、生物学的な予測ではない\n\n## 予測（事前登録は EXP-20260926-004 plan.md §A.3 / §C.1）\n- P-a: 主指標 a2 で、VCAM1 の値は DE マッチ比較 10 遺伝子（発現差・発現頻度・入力内順位がマッチした非ドライバー）の 90% 以上を上回る（3 seed 中 2 以上）\n- P-c1: donor 単位に集約した指標（DL-med）でも、C1・C2・C3・C3-panel の判定が細胞単位と一致する\n- P-c2: donor を 14 → 29（TLS-mid の CKD donor を追加、FT 未使用）に増やしても判定が再現し、donor split-half が改善する\n\n## 反証条件\n- P-a を満たさない → 「VCAM1 の C1 合格はマーカー除去効果と区別できない」（EXP-003 の C1 を駆動因子の証拠に使わない）\n- P-c1 が食い違う → 指標が donor の重みづけに依存する（細胞数の多い donor に引きずられる）\n- P-c2 で split-half が 0.7 未満のまま → donor 間の異質性が主因であり、donor 数を増やしても順位の再現性は確保できない\n\n## コントロール\n- 陽性 VCAM1 / HAVCR1、HK（ACTB/GAPDH/PPIA）、陰性対照パネル 7、発現頻度マッチ null 20/seed、探索枠 RP 2\n- (a) の比較群 DE マッチ 10（陰性対照ではなく「マーカー除去」の対照）\n\n## コスト\n- リモート GPU（spark-cf5b）: (a) 約 0.3 h、(c-2) 約 1.4 h。CPU 解析は数分\n\n## 限界\n- in silico の所見であり、遺伝子機能の実験的事実ではない。TLS 群は推定ラベル。DE マッチ遺伝子の「非ドライバー」判断は知識に基づく判断で、系統的な文献検索ではない\n"}, {"id": "hypotheses-HYP-20260926-04-md", "label": "HYP-20260926-04 陽性対照の見直し", "path": "hypotheses/HYP-20260926-04.md", "kind": "md", "bytes": 9543, "body": "# HYP-20260926-04（方法仮説）: 文献で因果が確立した PT 障害ドライバー／保護因子を陽性対照に採ると、FT-Geneformer の ISP（a2）はそれらを null から分離し、その分離は「分類器マーカーの除去／付加」だけでは説明できない\n\n- Status: inconclusive（G3: PI, 2026-09-27。削除型は有効な否定的結果、過剰発現型は摂動サイズの交絡により判定不能）\n- 起点: PI 指示（2026-09-26）「(b) 陽性対照の見直し」。FT モデル前提・リモート PC を積極利用\n- 背景: [EXP-20260926-003](../experiments/EXP-20260926-003/plan.md) phase 3 で、FT（aPT_CKD vs PT_healthy 2 クラス）CellClassifier の CLS 埋め込みは**削除ドリフトをほぼ解消**した（null 遺伝子の補正前 shift_goal が負の割合 1.00 → 0.10〜0.15）。HK（ACTB/GAPDH/PPIA）と陰性対照パネル 7 遺伝子はすべて null の内側、C2 は 16/18。しかし **C1 が不合格**: VCAM1 は null 分位 0.98 で一貫して上位だが、HAVCR1 は 0.45/0.75/0.75 で null に埋もれた。VCAM1 は start（aPT TLS-high）で 62.1%、goal（held-out 健常）で 7.6% の細胞に検出される極端なマーカー（|Δ検出率| は背景 9,615 遺伝子中 99 パーセンタイル）で、「分類器が直接使うマーカーを消した」だけの可能性がある\n- 問題の切り分け: 旧陽性対照 VCAM1/HAVCR1 は「aPT のマーカー」であって「aPT 状態を**駆動**する因子」ではない。ISP が読むべきなのは駆動因子の効果である。そこで陽性対照を「PT 細胞で遺伝学的操作の因果効果が報告されている遺伝子」に置き換える\n- 新規性: 方法の検証（生物学的な新規予測ではない）。実験計画: [EXP-20260926-005](../experiments/EXP-20260926-005/plan.md)\n\n## 仮説\nEXP-20260926-003 と同じ FT モデル・同じ start 細胞（held-out TLS-high aPT, 200 細胞/遺伝子, seed 3/4/5）・同じ goal 重心（held-out 健常 9 donor）で、\n\n- **P1（delete 型）**: マウス／ヒトで「PT（尿細管）特異的な欠損が障害・線維化を軽減する」ことが示されている 5 遺伝子（HIF1A, NOTCH1, EGFR, YAP1, KEAP1）を delete すると、主指標 a2 で **5 遺伝子中 2 以上**が同 seed の発現頻度マッチ null の上位 10%（分位 ≥ 0.90）に 3 seed 中 2 以上入る\n- **P2（overexpress 型）**: 「PT での発現低下が障害の原因で、回復・過剰発現が保護的」と示されている 6 遺伝子（HNF4A, PPARGC1A, PPARA, ESRRA, CPT1A, NFE2L2）を overexpress すると、同じく **6 遺伝子中 2 以上**が null 上位 10% に入る（overexpress 専用の発現頻度マッチ null を使う）\n- **P3（駆動 vs マーカー）**: P1・P2 で合格した遺伝子の少なくとも 1 つは、start と goal の検出率差 |Δdet| が背景分布の 80 パーセンタイル以下（＝分類器の自明なマーカーではない）\n- **P4（陰性対照の維持）**: HK 3 遺伝子は null 分位 0.10〜0.90（C3）、陰性対照パネル 7 遺伝子中 5 以上も同範囲（C3-panel）— EXP-003 と同じ\n\n## 反証条件\n- delete 型・overexpress 型のどちらでも C1'（合格遺伝子 ≥ 2）を満たさない → 「陽性対照を因果の確立した遺伝子に替えても、FT-Geneformer の ISP は既知のドライバーを null から分離しない」と結論（**棄却**）。この場合、EXP-003 の VCAM1 の合格は分類器マーカーの除去で説明され、この ISP 系は駆動因子の検出には使えない\n- C3 または C3-panel が不合格 → 系が壊れている（この run は判定不能）\n- P1/P2 は満たすが P3 が満たされない（合格がすべて |Δdet| 高分位の遺伝子）→ **部分的支持にとどめ、「マーカー除去では説明できない」とは主張しない**\n\n## 陽性対照の根拠（すべて PubMed で PMID・タイトルを照合済み, 2026-09-26）\n### delete 型（削除 → 健常方向を予測）\n| 遺伝子 | 方向の根拠 | 種 | 強さ | PMID |\n|---|---|---|---|---|\n| HIF1A | PT 特異的 Hif1a 欠損が線維化を抑制。逆に尿細管での HIF-1α 安定発現は間質線維化を促進 | マウス | 強（両方向の遺伝学的証拠） | 18037992, 18667485 |\n| NOTCH1 | 尿細管上皮の Notch 欠損で線維化が軽減、Notch1-ICD 発現で線維化。ヒト CKD でも Notch 活性化 | マウス＋ヒト組織 | 強 | 20978353 |\n| EGFR | EGFR キナーゼ低活性／尿細管 EGFR 遮断で TGF-β 依存の線維化が軽減。PT 由来 AREG–EGFR 軸が線維化を増幅 | マウス | 中〜強 | 22095949, 27642633, 31676723 |\n| YAP1 | PT での YAP 活性化が線維化を駆動（Mst1/2 欠損 → YAP → CKD）。尿細管 YAP 抑制で maladaptive repair 減少 | マウス | 中〜強 | 32843569, 32253273 |\n| KEAP1 | KEAP1 の抑制 → NRF2 活性化で虚血再灌流後の尿細管障害の進行を防ぐ。Nrf2 欠損は障害を悪化 | マウス | 中（腎では KD／全身系が主） | 27789056, 19436334 |\n\n### overexpress 型（過剰発現 → 健常方向を予測）\n| 遺伝子 | 方向の根拠 | 種 | 強さ | PMID |\n|---|---|---|---|---|\n| HNF4A | PT 同一性のマスター TF。欠損で PT 分化不全（Fanconi 表現型）、障害 PT で発現が失われる。ヒトオルガノイドでも PT 遺伝子制御ネットワークの中心 | マウス＋ヒト | 強 | 30046000, 32764140, 37488681, 39954965 |\n| PPARGC1A | 尿細管 PGC-1α の回復・過剰発現が AKI からの回復を促進、欠損で炎症・障害が悪化 | マウス | 強 | 21881206, 30982966 |\n| PPARA | PT 特異的 PPARα 過剰発現（トランスジェニック）が UUO の線維化・炎症を軽減 | マウス | 強（直接の過剰発現実験） | 23804447 |\n| ESRRA | 核内受容体 ESRRA が代謝と分化を結びつけて腎疾患から保護 | マウス＋ヒト | 強 | 33301705 |\n| CPT1A | 尿細管 Cpt1a 過剰発現が線維化を防ぐ（直接の過剰発現実験）。FAO の破綻が線維化の鍵 | マウス | 強（直接の過剰発現実験） | 33465052, 25419705 |\n| NFE2L2 | Nrf2 欠損で虚血・腎毒性 AKI が悪化、Nrf2 活性化で尿細管障害の進行を防ぐ | マウス | 中〜強 | 19436334, 27789056 |\n\n### 採用しなかった候補と理由\n- **TGFBR2 / SMAD3**: 方向が文献で対立する。PT 特異的 Tgfbr2 欠損は急性 PT 障害を軽減（PMID 23160515）一方、CKD では PT 内在性 TGF-β シグナルが**保護的**（PMID 37270534）、TGF-β／β-catenin の遮断は CKD を悪化（PMID 28701516）。方向が一意に決まらない対照は陽性対照にしない\n- **KLF15**（PMID 34634362, 欠損が障害を悪化＝過剰発現型の候補）: start 細胞での検出が 213 細胞のみで、200 細胞 × 3 seed を donor 上限 25 で満たせない恐れ\n- **SNAI1 / TWIST1 / FOXM1 / CDKN2A**: start 細胞での検出が 2〜75 細胞で実行不可能\n- **SOX9**: 欠損は修復を**阻害**する（保護的でない）ため方向が逆\n- **TP53, CDKN1A, LTBR, SPP1, LCN2**: 盲検の主要対象・参照のため除外（`controls_only: true` で回さない）\n\n## 循環性・交絡への対策（HYP-20260926-02 から継承）\n- 分類器は start/goal を分けるよう学習しているので、goal 方向の移動は循環的に見える。対策: (i) 埋め込みの移動（主, a2）と分類確率 ΔP(PT_healthy)（副）を両方出す、(ii) 特異性は HK・パネル・null との比較で判定、(iii) ISP の細胞は FT に一切使っていない donor、(iv) **マーカー度（|Δdet| の背景分位）を遺伝子ごとに事前登録して、合格が駆動因子かマーカー操作かを分ける（P3）**\n- ISP の細胞選抜は「その遺伝子を発現している細胞」に限る（delete も overexpress も同じ規則）。overexpress は「発現細胞で rank を最上位に移す」操作であり、非発現細胞への導入ではない\n\n## コントロール\n- ネガティブ: 発現頻度マッチのランダム null 20 遺伝子（seed ごと・run ごとに、その run の陽性対照の発現頻度に合わせて抽出）\n- ハウスキーピング: ACTB, GAPDH, PPIA（C3）\n- 陰性対照パネル: CERS4, TATDN1, IFT25, VAPA, PHPT1, ANAPC16, EEF1D（C3-panel）\n- 継続比較: 旧陽性対照 VCAM1, HAVCR1 を delete run に同梱（判定には使わない）\n- 方向対照: VCAM1, HAVCR1 の **overexpress**（障害マーカーを足しても健常方向へは動かないはず。C7, 参考）\n\n## 実験コスト概算\n- delete run 37 遺伝子 + overexpress run 38 遺伝子 = 75 遺伝子 × 200 細胞 × 3 seed = 45,000 cell×gene。GB10 実測 0.129 s/cell×gene → **約 1.6 h**（重心抽出・起動込みで ~1.8 h 見込み）。spark-c083 で逐次（1 ホスト 1 ジョブ）。CLAUDE.md §3 の GPU 2 h 以内に収める\n\n## 支持された場合の次の一手\n- 合格した駆動因子（特にマーカー度の低いもの）を基準に、主要対象 TP53/CDKN1A/LTBR の検出力を議論できる\n- 他エージェント担当の (a) DE マッチ比較遺伝子・(c) donor 単位解析と突き合わせ、「マーカー除去 vs 駆動因子」の分離を確定する\n- in silico の方法論の改善であり、wet 実験の対象ではない\n"}]}, {"section": "調査資料", "docs": [{"id": "outputs-literature-2026-09-25-kidney-TLS-datasets-md", "label": "データセット一覧", "path": "outputs/literature/2026-09-25-kidney-TLS-datasets.md", "kind": "md", "bytes": 28556, "body": "# 腎臓 TLS/TLT × 細胞老化 — 公開 scRNA/snRNA/空間データセット・カタログ\n\n- 作成日: 2026-09-25（literature-scout）\n- テーマ: 腎臓の三次リンパ組織（TLS/TLT）が腎臓病・腎癌で果たす役割を、Geneformer（human V2-316M）の in silico perturbation で解析し、細胞老化と結び付ける\n- 検証方法: CELLxGENE Discover Curation API（`/curation/v1/collections` と `/collections/{id}`）の JSON を取得し、細胞数・h5ad URL・ファイルサイズ（バイト値）・疾患・組織・アッセイ・発生段階・`raw_data_location` を機械的に確認した。GEO は NCBI E-utilities（esummary）と GEO FTP の suppl ディレクトリ一覧で確認。論文の書誌情報（PMID）は Europe PMC REST API で DOI から照合。DDBJ GEA はディレクトリ一覧で確認。**データ本体のダウンロードはしていない**（h5ad の obs 列名など、ファイルを開かないと分からない項目は「未確認」と明記した）。\n- サイズは API／FTP が返した値（1 GB = 10^9 byte で換算）。\n\n---\n\n## 0. サマリー表（優先度順）\n\n| # | 優先度 | データセット | 種 | アッセイ | 細胞数 | サイズ | 状態ラベル（TLS/老化関連） | アクセス |\n|---|---|---|---|---|---|---|---|---|\n| A1 | **A** | KPMP Human Kidney Atlas v1.5 snRNA（Lake 2023 系列） | Human | 10x 3' v3 sn | 304,989 | 3.03 GB | AKI / CKD / normal、年齢 14〜70 代、B・形質細胞・T・DC | Open（CELLxGENE, CC BY 4.0） |\n| A2 | **A** | KPMP Human Kidney Atlas v1.5 scRNA | Human | 10x 3' v3 sc | 225,177 | 1.82 GB | 同上 | Open |\n| A3 | **A** | Li R 2022 Cancer Cell — RCC 腫瘍内/境界/正常/末梢血 scRNA | Human | 10x 5' | 270,855 | 1.62 GB | ccRCC（nonpapillary RCC）/良性/オンコサイトーマ/normal、IgA・IgG 形質細胞、class-switched memory B | Open（処理済み）/ raw は EGA（controlled） |\n| A4 | **A** | Krishna 2021 Cancer Cell — ccRCC 多領域免疫 scRNA+TCR | Human | 10x 5' v2 | 167,283 | 1.18 GB | 腫瘍多領域/正常腎/リンパ節/末梢血、ICB 前後、B・Treg・naive T | Open |\n| A5 | **A** | Zhang 2021 PNAS — ccRCC＋正常腎 scRNA（GSE159115） | Human | 10x 3' v2 | 20,509 + 6,044 | 0.23 + 0.06 GB | ccRCC vs normal、B・形質細胞 | Open |\n| A6 | **A** | Reck 2025 Nat Commun — 尿管閉塞腎 snRNA（multiome の RNA 部分） | Human | 10x multiome | 46,957 | 0.26 GB | obstructive nephropathy vs normal、60〜84 歳、B・T | Open |\n| B1 | B | KPMP Human Kidney Atlas v2.0 snRNA（Lake 2025 bioRxiv） | Human | 10x 3' v3 + multiome | 1,388,643 | 13.82 GB | AKI/CKD/normal、223 donors、10 代〜90 代 | Open（大容量・プレプリント） |\n| B2 | B | KPMP Human Kidney Atlas v2.0 scRNA | Human | 10x 3' v3 | 348,984 | 4.39 GB | 同上、112 donors、細分化 T/B/DC | Open |\n| B3 | B | KPMP Mouse Kidney v2.0 snRNA（Lake 2025） | Mouse | 10x 3' v2 + multiome | 315,764 | 1.82 GB | AKI/normal、2〜20 か月齢、B・形質細胞 | Open |\n| B4 | B | Meylan 2022 Immunity — RCC Visium（GSE175540） | Human | Visium（空間） | 24 切片 | RAW.tar 1.12 GB | **スポット単位 TLS アノテーション CSV あり**、TLS+ / TLS− 腫瘍 | Open（GEO） |\n| B5 | B | Yoshikawa 2023 JASN — 高齢マウス IRI 後 TLT 腎 snRNA（E-GEAD-595） | Mouse | 10x 3' v3/v3.1 sn | 7,485（sham）+ 15,968（IRI×3） | processed.zip 907 MB | 高齢（12 か月）IRI 30 日（TLT+）vs sham | Open（DDBJ GEA） |\n| B6 | B | Tabula Muris Senis — Kidney（droplet） | Mouse | 10x 3' v2 | 21,647 | 0.34 GB | 1・3・18・20+ か月齢（加齢） | Open（CELLxGENE） |\n| B7 | B | Chen 2025 Nat Genet — マウス腎 生涯 multiome | Mouse | 10x multiome | 203,139 | 1.56 GB | 胎生〜21 か月齢、性差、形質細胞・T | Open（CELLxGENE） |\n| B8 | B | Wilson 2022 Nat Commun — 糖尿病性腎症 snRNA | Human | 10x 3' v3 / 5' v1 sn | 39,176 | 0.40 GB | T2DM（DKD）vs normal、50〜78 歳 | Open（CELLxGENE） |\n| B9 | B | Malone 2020 — 腎移植拒絶 scRNA（GSE145927） | Human | scRNA（詳細未確認） | 未確認 | RAW.tar 247 MB | 拒絶腎、ドナー/レシピエント キメリズム | Open（GEO） |\n| B10 | B | PICseq 腎移植拒絶（GSE189536） | Human | scRNA（相互作用細胞） | 未確認 | matrix 322 MB | 拒絶 vs 非拒絶（詳細未確認） | Open（GEO） |\n| B11 | B | Kirita 2020 PNAS — マウス IRI 時系列 snRNA（GSE139107） | Mouse | snRNA | 未確認 | dge.txt 計約 126 MB | 4h〜6 週（AKI→修復不全） | Open（GEO） |\n| C1 | C | Arazi 2019 Nat Immunol — ループス腎炎 AMP | Human | CEL-seq2 | — | — | LN vs control、age-associated B cells | **Controlled**（dbGaP phs001457.v1.p1 / ImmPort SDY997） |\n| C2 | C | Bi 2021 Cancer Cell — 進行 RCC ICB 前後 | Human | scRNA | — | — | ICB 曝露前後 | raw **Controlled**（dbGaP phs002065.v1.p1）、処理済みは Broad SCP1288 |\n| C3 | C | Braun 2021 Cancer Cell — ccRCC 病期別 | Human | scRNA+TCR | 164,722（論文記載） | — | 早期/局所進行/転移 | **アクセッション未確認** |\n| C4 | C | Obradovic 2021 Cell — ccRCC TME | Human | scRNA | — | — | TREM2+ マクロファージ、再発 | **アクセッション未確認** |\n| C5 | C | Stewart 2019 / Young 2018（成人正常腎・胎児腎） | Human | 10x 3' v2 | 40,268 など | 0.19〜0.23 GB | normal のみ（参照） | Open（CELLxGENE） |\n| C6 | C | McEvoy 2022（生体ドナー腎）、Muto 2021、Tabula Sapiens Kidney | Human | 10x 3' v3 等 | 27,675 / 19,985 / 11,376 | 0.48 / 0.16 / 0.45 GB | normal のみ（参照・年齢分布） | Open（CELLxGENE） |\n| C7 | C | 他の GEO ccRCC/IgAN/マウス加齢（§2 参照） | 混在 | — | — | 11 MB〜1.4 GB | 小規模・ラベル不十分 | Open |\n\n**優先度 A の合計: 約 8.20 GB**（3.03 + 1.82 + 1.62 + 1.18 + 0.23 + 0.06 + 0.26 GB）。\n注: KPMP v1.5 sn と sc は同一アトラスの別モダリティで、v1.0／v1.5／v2.0 は細胞が重複する（`is_primary_data=False` のものがある）。複数バージョンを混ぜて使ってはいけない。\n\n---\n\n## 1. データセット詳細\n\n### A1/A2. KPMP Human Kidney Atlas v1.5（snRNA / scRNA）\n- 論文: Lake BB et al., *Nature* 2023, \"An atlas of healthy and injured cell states and niches in the human kidney.\" PMID 37468583, DOI 10.1038/s41586-023-05769-3（v1.0 のコレクションは bcb61471-2a44-4d00-a0af-ff085512674c。v1.5 は別コレクション 0f528c8a-a25c-4840-8fa3-d156fa11086f で、API 上は DOI 未登録）\n- snRNA v1.5: dataset a12ccb9b-4fbe-457d-8590-ac78053259ef, 304,989 nuclei, 10x 3' v3, 3,034,341,738 byte\n  - URL: https://datasets.cellxgene.cziscience.com/02d5db96-d67e-45f2-b556-b6bd99753665.h5ad\n- scRNA v1.5: dataset dea717d4-7bc0-4e46-950f-fd7e1cc8df7d, 225,177 cells, 10x 3' v3, 1,821,593,028 byte\n  - URL: https://datasets.cellxgene.cziscience.com/08648660-9898-4644-a9a1-ff3a159a0041.h5ad\n- 組織: kidney / cortex / medulla / papilla。疾患: acute kidney injury, chronic kidney disease, normal。donor 数: sn 80、sc 77（API の donor_id）\n- 細胞型: B cell, plasma cell, T cell, cytotoxic T, Treg, cDC, pDC など（CL 語彙）。年齢は「14-year-old」〜「seventh decade」（10 年刻みのものがある）\n- 定義できる状態: **injured（AKI/CKD）vs healthy**。上皮の adaptive/maladaptive（failed-repair）状態を使えば、老化様の尿細管状態を start、健常状態を goal に設定できる。年齢（decade）で若年 vs 高齢の比較も可能。**TLS そのもののラベルはない**（B・形質細胞・T の存在比で代替指標を作ることはできる）\n- アクセス: Open。CELLxGENE Discover 掲載データは CC BY 4.0（データセットごとの表示は未確認）。KPMP の利用規約（謝辞表記）にも従う\n- Geneformer 準備度: `raw_data_location = raw.X`（生カウントあり、API で確認）。CELLxGENE スキーマ 7.1.0 では var のインデックスが Ensembl ID。`n_counts` は標準では含まれない → raw.X の行和から計算する必要がある\n- 関連性: TLS — CKD では間質の B・形質細胞・T 浸潤があり、腎 TLT が形成される背景となる。老化 — failed-repair PT は老化・SASP 様の状態であり、年齢レンジも広い\n- 優先度 A（最初に使う主データ）\n\n### A3. Li R 2022 Cancer Cell — RCC の腫瘍内・境界・正常組織\n- Li R, Ferdinand JR, Loudon KW et al., *Cancer Cell* 2022. PMID 36423636, DOI 10.1016/j.ccell.2022.11.001。CELLxGENE コレクション f7cecffa-00b4-4560-a29a-8ad626b8ee08（19 datasets）\n- scRNA: dataset 5af90777-6760-4003-9dba-8f945fec6fdf, 270,855 cells, \"10x 5' transcription profiling\", 1,624,330,103 byte, 12 donors\n  - URL: https://datasets.cellxgene.cziscience.com/8784de63-bec2-49ae-b147-8f16108cecce.h5ad\n- 疾患ラベル: nonpapillary renal cell carcinoma（ccRCC を含む）, kidney benign neoplasm, kidney oncocytoma, normal。論文では腫瘍コア・腫瘍-正常境界・周囲正常・末梢血をサンプリング（領域が obs 列にあるかは未確認）\n- 細胞型: IgA/IgG plasma cell, class switched memory B, naive B, Treg, 各種 T・DC（45 種）\n- 付随する Visium（同コレクション）: 腫瘍-正常境界 eaf0c852-1dff-47ab-8de2-a33a59969a40（27,912 spots, 95.7 MB）、腫瘍コア 318cb2a6-743a-4404-9515-413d5f64b9ff（10,924 spots, 53.5 MB）ほか\n- アクセス: 処理済み h5ad は Open。raw は EGA（EGAD00001008030, EGAD00001008781; **controlled**、コレクションのリンクで確認）\n- Geneformer 準備度: raw.X あり、Ensembl ID。n_counts は計算する\n- 関連性: TLS — 形質細胞の IgA/IgG 別アノテーションがあり、Meylan 2022 の TLS→形質細胞の流れを腫瘍/境界/正常の軸で検証できる。老化 — 高齢患者（50〜80 代）のみ。老化は二次的な軸になる\n- 優先度 A\n\n### A4. Krishna 2021 Cancer Cell — ccRCC 多領域の免疫景観\n- Krishna C et al., *Cancer Cell* 2021. PMID 33861994, DOI 10.1016/j.ccell.2021.03.007。CELLxGENE コレクション 3f50314f-bdc9-40c6-8e4a-b0901ebfbe4c\n- dataset bd65a70f-b274-4133-b9dd-0d1431b6af34, 167,283 cells, 10x 5' v2, 1,177,999,600 byte, 6 donors（ICB 未治療 2、治療後 4）\n  - URL: https://datasets.cellxgene.cziscience.com/6602fa5a-d663-4fe0-8dc3-90191c3a013b.h5ad\n- 論文記載の構成: 腫瘍多領域、リンパ節、正常腎、末梢血。paired TCR。raw は SRA PRJNA705464（公開、コレクションのリンクで確認）。HCA project 12f32054-8f18-4dae-8959-bfce7e3108e7\n- 細胞型: B cell, naive T, Treg, effector CD4, cDC など 18 種\n- 定義できる状態: 腫瘍 vs 正常 vs リンパ節（**二次リンパ組織を参照にできる**）、ICB 前後。TLS+/− のラベルはない\n- Geneformer 準備度: raw.X あり、Ensembl ID\n- 関連性: TLS — リンパ節の B/T 状態を「TLS 様状態」の goal として参照できる。老化 — 限定的（6 名、50〜69 歳）\n- 優先度 A\n\n### A5. Zhang 2021 PNAS — ccRCC・chRCC・正常腎\n- Zhang Y et al., *PNAS* 2021, \"Single-cell analyses of renal cell cancers reveal insights into tumor microenvironment, cell of origin, and therapy response.\" PMID 34099557, GEO GSE159115（14 samples、E-utilities で確認）\n- CELLxGENE コレクション 1df8c90d-d299-4b2e-a54d-a5a80f36e780\n  - ccRCC: be39785b-67cb-4177-be19-a40ee3747e45, 20,509 cells, 232,252,366 byte — https://datasets.cellxgene.cziscience.com/f77a9049-7cbe-477d-8d3f-b417bba03147.h5ad\n  - normal: f801b7a9-80a6-4d09-9161-71474deb58ae, 6,044 cells, 58,231,471 byte — https://datasets.cellxgene.cziscience.com/5f0b9675-aed8-4870-8ad8-7a3f38037486.h5ad\n  - chRCC: 4c6f9f26（2,576 cells, 0.04 GB）も同コレクションにある\n- 細胞型: B cell, plasma cell, T cell など。10x 3' v2、65〜76 歳\n- 関連性: 小さく軽いので、パイプラインの smoke テストや腫瘍 vs 正常の再現確認に向く\n- 優先度 A（小規模の検証用）\n\n### A6. Reck 2025 Nat Commun — 尿管閉塞によるヒト腎障害 snRNA\n- Reck M, Baird DP et al., *Nat Commun* 2025, \"Multiomic analysis of human kidney disease identifies a tractable inflammatory and pro-fibrotic tubular cell phenotype.\" PMID 40399382, DOI 10.1038/s41467-025-59997-4。CELLxGENE コレクション 307ce143-7cc8-4813-99b1-3797834149c9\n- dataset 867757c1-3b1a-49d9-a0cd-17767eb160cc, 46,957 nuclei, 10x multiome（RNA 部分）, 258,738,667 byte, 12 donors, 60〜84 歳\n  - URL: https://datasets.cellxgene.cziscience.com/0fe5eee4-380d-4bd9-8735-ada5e03021d9.h5ad\n- 疾患: obstructive nephropathy vs normal。B cell, T cell を含む\n- 関連性: TLS — 炎症・線維化を起こす尿細管表現型は、マウスの Vcam1+ PT（TLT 周囲に局在、Yoshikawa 2023）に相当しうる（相同性は未検証）。老化 — 全例高齢\n- Geneformer 準備度: raw.X あり\n- 優先度 A\n\n### B1/B2/B3. KPMP Atlas v2.0（Lake BB et al., bioRxiv 2025）\n- \"Cellular and Spatial Drivers of Unresolved Injury and Functional Decline in the Human Kidney\", DOI 10.1101/2025.09.26.678707（**査読前プレプリント**。Europe PMC で PMID なし）。コレクション 9c9d04c4-8899-417f-bb6f-6107dcadf14f。GitHub KPMP-Scientific/KPMP-Atlas-v2、KPMP DOI 10.48698/16dd-vj20\n- B1 snRNA human: 7ff0197b-d175-49bf-b4fa-150fe0995d93, 1,388,643 nuclei, 13,818,560,828 byte, 223 donors, 年齢は 14 歳〜「tenth decade」 — https://datasets.cellxgene.cziscience.com/06b8d9c2-0bde-48bd-88d9-730993fc95e2.h5ad\n- B2 scRNA human: 91f31e05-56d8-46fc-b408-d90c9228a81b, 348,984 cells, 4,392,345,855 byte, 112 donors — https://datasets.cellxgene.cziscience.com/255ce81a-eb4e-48ff-9f18-e50455ccb24d.h5ad\n- B3 snRNA mouse: 9ac3d74d-1d94-4ff9-abf9-fe5abe4bd2a6, 315,764 nuclei, 1,821,316,660 byte, 70 mice, 2〜20 か月齢, AKI/normal — https://datasets.cellxgene.cziscience.com/19aab2ef-654a-4047-8f60-3529c041851d.h5ad\n- 特長: 細胞型が細かい（human sn で 63 種。migratory DC、naive Treg、TEMRA、cycling T など）。**\"unresolved injury\"（修復不全）状態**が定義されている。年齢レンジが最も広く、ヒトの加齢解析に最適\n- 注意: 1.39M 細胞のトークン化・推論は §3 の「1 万細胞超」に当たる → サブサンプリング計画と PI 承認（G2）が必要\n- 優先度 B（本命の拡張データ。サイズとプレプリントであることから B とした）\n\n### B4. Meylan 2022 Immunity — RCC Visium（TLS アノテーション付き）\n- Meylan M, Petitprez F, Becht E e
